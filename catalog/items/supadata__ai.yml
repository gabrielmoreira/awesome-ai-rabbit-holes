insights:
  summary: >-
    Supadata is an API service that extracts transcripts, metadata, and structured data from web and social media videos
    (YouTube, TikTok, Instagram, etc.) for AI training and retrieval.
  why_it_matters: >-
    Developers can programmatically access video content and metadata as clean JSON, enabling AI workflows that depend
    on video-derived data without manual scraping.
  mental_damage: >-
    Now you can finally feed an LLM every TikTok trend, because nothing says 'production-ready' like a model trained on
    the entire 'Never Gonna Give You Up' corpus.
  tags:
    - api
    - transcription
    - social-media
    - data-extraction
    - rag
  confidence: high
curation:
  status: excluded
  reason: >-
    The product is a general-purpose API for video data extraction, not a developer-tooling product focused on coding
    workflows, agent orchestration, or AI-assisted development.
  evidence:
    - Scraped site context describes it as 'one stop-shop API for makers to read web and YouTube content, ready for AI training and retrieval'
    - Source-list context appears in awesome-mcp-servers as an Official Server, but MCP is presented as a compatibility feature, not the product identity
    - README emphasizes use cases like chatbots, content repurposing, and brand monitoring — end-user applications, not developer tooling workflows
