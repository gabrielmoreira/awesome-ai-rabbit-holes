insights:
  summary: Weave's evaluation framework for measuring LLM application performance using test datasets and scoring functions.
  why_it_matters: Provides developers a structured workflow to replace ad-hoc testing with repeatable, measurable evaluations for LLM applications.
  mental_damage: Finally, a way to quantify how often your LLM confidently hallucinates the capital of France as 'Berlin'.
  tags:
    - evaluation
    - llm-testing
    - observability
  confidence: high
curation:
  status: included
  reason: The core identity is an evaluation framework for measuring model/prompt behavior via datasets and scorers, matching the evals category's focus on assessing AI systems rather than being one.
  evidence:
    - Primary job is defining Evaluation objects with datasets and scoring functions to measure LLM application performance
    - Designed for developers building LLM applications who want to move beyond ad hoc testing into a structured, measurable workflow
    - Core workflow involves creating test examples, defining scoring functions, and running evaluations against models or functions
