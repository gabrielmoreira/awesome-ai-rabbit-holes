insights:
  summary: >-
    Weave's evaluation framework for measuring LLM application performance against curated test cases and scoring
    functions.
  why_it_matters: >-
    Enables developers to systematically improve LLM applications by moving beyond ad hoc testing into structured,
    measurable workflows with repeatable evaluations.
  mental_damage: >-
    Finally, a way to quantify the existential dread of wondering if your latest prompt tweak actually made things
    worse.
  tags:
    - evals
    - llm-observability
    - testing
  confidence: high
curation:
  status: included
  reason: >-
    The core identity is measuring and scoring agent/model behavior through evaluation runs, datasets, and scoring
    functions—not building agents or orchestrating them.
  evidence:
    - >-
      Describes Evaluation-driven LLM application development to systematically improve applications by measuring
      behavior using consistent, curated examples
    - Core workflow centers on Evaluation objects defining datasets, scoring functions, and models/functions to evaluate
    - Outputs are measurement results and comparative analysis, not code edits, apps, or agent coordination
