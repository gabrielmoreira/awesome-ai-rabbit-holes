insights:
  summary: Arena AI is a public leaderboard and chat platform for comparing and voting on AI models through real-world evaluation.
  why_it_matters: It lets developers benchmark and discover top-performing models via community-driven, task-based comparisons rather than relying solely on static leaderboards.
  mental_damage: Another vibe-based eval where you vote on which AI feels smarter today, because benchmark fatigue is real and vibes are all we have left.
  tags:
    - leaderboard
    - evals
    - model-comparison
  confidence: medium
curation:
  status: included
  reason: Arena AI fits the evals category as its core function is measuring and comparing model behavior through community voting and real-world task performance, not building or orchestrating AI systems.
  evidence:
    - Scraped site describes it as 'Chat, compare, vote for the world's best AI models' and 'Join the community shaping the public leaderboard for LLMs, image, and code models through real-world evaluation.'
    - Listed in awesome-LLM-resources under '体验 Usage' (Experience/Usage) with a focus on chatting, comparing, and voting on models.
    - Primary interface involves prompting models and comparing outputs via battle mode, aligning with human-in-the-loop evaluation.
