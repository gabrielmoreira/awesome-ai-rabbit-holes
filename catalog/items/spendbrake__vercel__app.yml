insights:
  summary: SpendBrake is a budget gate that uses Jev decision models to continue, downgrade, or stop agent runs based on spend vs. value.
  why_it_matters: It helps developers avoid runaway AI agent costs by automating budget enforcement via typed decision judgments.
  mental_damage: Finally, a tool that trusts a probability model more than your own judgment when your AI agent is burning through your credit card.
