  summary: A tool that automatically captures, stores, and searches AI coding conversations from IDEs and CLIs like Cursor, Copilot, Claude Code, and Codex.
  why_it_matters: It preserves the decision-making context and rationale behind code changes, allowing developers to search their history and onboard teammates faster.
  mental_damage: We have successfully solved the problem of losing context with our AI assistants by creating yet another subscription to manage the context of our context-generating assistants.
