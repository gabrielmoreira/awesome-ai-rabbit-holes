  reason: This is a first-party MCP server shipping domain-specific tools for crypto market data, fitting cleanly as a domain server in the MCP category.
  evidence:
    - Listed in awesome-mcp-servers under 'Official Servers' as the CoinGecko MCP Server for crypto price and market data.
    - Documentation states it exposes 76+ MCP tools including real-time prices, onchain DEX data, and historical performance to MCP-compatible clients like Claude and Cursor.
    - Provides hosted remote endpoints (keyless and authenticated) as well as a local npm package (@coingecko/coingecko-mcp) for self-hosted use.
