insights:
  summary: CoinGecko MCP Server is a Model Context Protocol server that provides real-time crypto price data, on-chain analytics, and market trends to AI agents.
  why_it_matters: Developers can give their AI agents live access to CoinGecko's cryptocurrency data without building custom API integrations.
  mental_damage: Yet another MCP server wrapping a public API, reminding us that 'AI agent' often just means 'LLM with a config file'.
  tags:
    - mcp
    - crypto
    - data
  confidence: high
curation:
  status: included
  reason: The product's primary identity is an MCP server exposing CoinGecko's financial data, making it a clear fit for the MCP Ecosystem category under finance/crypto.
  evidence:
    - MCP Server for Crypto Price & Market Data. MCP (Model Context Protocol) is an open standard that allows LLMs and AI agents to interact with external data sources.
    - Provides real-time market data, on-chain analytics, historical performance, and crypto categories via MCP endpoints.
    - Documentation focuses on MCP server configuration, connection methods (HTTP/SSE), and tool usage with Claude, ChatGPT, and other MCP clients.
