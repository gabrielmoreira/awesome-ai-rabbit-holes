insights:
  summary: TrustGate is a TypeSafe Jev-powered moderation gate that classifies content as publish, soft-hold, or block using typed decision-model judgments.
  why_it_matters: It gives indie media creators a programmable, probabilistic content filter that replaces brittle keyword rules with calibrated safety judgments.
  mental_damage: Another layer of AI-mediated censorship where your verdict depends on a model’s confidence in whether a park renovation budget is a scam.
  tags:
    - decision-model
    - content-moderation
    - jev
    - safety
  confidence: high
curation:
  status: included
  reason: TrustGate’s core identity is a Jev decision model that returns constrained probabilistic judgments for content moderation, not a coding agent or general AI tool.
  evidence:
    - Scraped site identifies it as 'Jev moderation gate' with typed questions like 'Benign news', 'Health claim', 'Scam', 'Threat' returning publish/hold/block decisions.
    - Source-list placement in awesome-jev under 'Demos & playgrounds' for Jev-built projects confirms its identity as a decision-model application.
    - No evidence of code editing, app generation, or agent orchestration; the tool’s sole function is classifying input via typed decision-model outputs.
