insights:
  summary: rlcd-modernbert-151m is a 151M-parameter non-autoregressive decision model for structured software workflows, providing calibrated semantic judgments in a single forward pass.
  why_it_matters: Enables developers to build reliable, calibrated decision systems (e.g., intent classification, routing, guardrails) without conversational generation overhead.
  mental_damage: Finally, a model that won’t hallucinate a JSON response when you just want a probability over whether the user lost their card.
  tags:
    - decision-model
    - non-autoregressive
    - calibrated
    - text-classification
    - jev
  confidence: high
curation:
  status: included
  reason: The product is a decision model that answers typed questions with probabilities (Choice, Score, Noul/Boolean) instead of generating text, fitting the core identity of decision-models; it is explicitly built as an open Jev-like model for structured workflows with calibrated judgments and abstention routing.
  evidence:
    - Model card describes it as an 'open-source, post-trained foundational decision model built for structured software workflows' providing 'calibrated semantic judgments (discrete choices, ordinal scores, and binary probabilities) in a single forward pass without conversational text generation'
    - It includes an explicit __insufficient_evidence__ abstention slot and is trained with Cross-Entropy + Brier Score loss for proper scoring calibration
    - Seen in source list awesome-jev under Benchmarks & research as part of the Jev ecosystem, and the model uses Jev-inspired architecture and RLCD
