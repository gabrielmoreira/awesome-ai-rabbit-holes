insights:
  summary: GitLab Duo Agent Platform is GitLab's enterprise AI agent system for automating software development lifecycle tasks using specialized agents and orchestrated workflows.
  why_it_matters: It enables developers to automate complex DevSecOps workflows like code reviews, security analysis, and CI/CD fixes through governed, context-aware AI agents within GitLab.
  mental_damage: Another enterprise AI platform promising to 'orchestrate agents' while developers just want their CI to stop flaking on Fridays.
  tags:
    - ai-agents
    - devsecops
    - gitlab
    - workflow-automation
  confidence: high
curation:
  status: included
  reason: GitLab Duo Agent Platform is included because it is a hosted enterprise control plane for coordinating multiple specialized AI agents across the software lifecycle, with workflow design, agent routing, and lifecycle management as its core identity.
  evidence:
    - Scraped site context describes it as enabling 'agentic orchestration' and 'multi-step automation' using flows to combine agents into guided sequences
    - "Source-list context from awesome-ai-agents places it under 'GitLab Duo' with description: 'Custom AI workflow automation across the software lifecycle. Specialized agents for planning, coding, security, and deployment with enterprise governance'"
    - README excerpt emphasizes 'flows guide agents through tasks end to end', 'event-driven execution', and 'enterprise-grade governance and control' as core features
