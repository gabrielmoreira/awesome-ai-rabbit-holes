insights:
  summary: Jev is a decision model that answers typed questions with probabilities instead of generating text, used for poker hand evaluations.
  why_it_matters: It demonstrates how decision models can be applied to narrow, verifiable domains like game theory for testing judgment reliability.
  mental_damage: Another AI tool that reduces human judgment to a probability distribution, making us wonder if we’ve outsourced even our gut feels to a model trained on solved poker hands.
  tags:
    - decision-model
    - game-theory
    - eval
  confidence: high
curation:
  status: included
  reason: Jev is a decision model that returns constrained probabilistic answers to typed questions, making it a canonical example of the decision-models category, especially as the original Jev (TypeSafe System One).
  evidence:
    - The product is Jev (TypeSafe System One), a model that answers typed questions with probabilities instead of generating text.
    - The README describes Jev as taking a state object and a question (e.g., which action to take) and returning a choice with probability, not text.
    - It is listed in the source list 'awesome-jev' under Related Practices / Discussions, indicating recognition in decision-model circles.
    - The core function is judgment under uncertainty via typed input and probabilistic output, not code generation, editing, or app building.
