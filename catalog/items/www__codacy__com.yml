    - ai-reviewer
    - security
    - pr-review
    - guardrails
  confidence: high
curation:
  status: included
  reason: Codacy is primarily a platform that augments the development workflow (Git, IDE, PRs) with automated quality, security, and AI policy enforcement rather than acting as a primary coding assistant.
  evidence:
    - Positioned in awesome-ai-coding-tools under 'Code Review and Refactoring' as a governance and review tool.
    - Core features include AI Reviewer for PRs, IDE extensions, and Git integrations for quality/security scanning.
    - Explicitly markets 'AI Guardrails' to make agents and IDEs follow defined quality and security standards.
