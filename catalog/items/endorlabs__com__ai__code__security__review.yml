insights:
  summary: Endor Labs provides AI-powered security review of pull requests, analyzing code changes for security risks using AI agents trained to think like developers, architects, and security engineers.
  why_it_matters: It helps developers catch real security issues in AI-generated and human-written code early in the PR process, reducing noise and speeding up remediation.
  mental_damage: Another layer of AI surveillance in your PRs, because even your security reviews now need an AI agent to tell you what you missed.
  tags:
    - security
    - ai-agents
    - pull-request
  confidence: high
curation:
  status: excluded
  reason: Endor Labs is an application security platform whose AI agents analyze code for security risks, but its primary identity is security scanning and AppSec workflows—not coding assistance, code generation, or direct code editing—so it does not fit the developer-facing AI tooling scope of this catalog.
  evidence:
    - "Scraped site context: 'Review AI-generated code with application security designed to catch real issues, reduce noise, and speed up remediation in pull requests.'"
    - "Source-list context: Listed in 'awesome-ai-coding-tools' under the Security section for reviewing AI-generated code with application security."
    - "README/product description: Focuses on scanning PRs for changes to authentication, cryptography, database schemas, payment logic, and other security architecture shifts—not on writing, editing, or reviewing code as a coding task."
