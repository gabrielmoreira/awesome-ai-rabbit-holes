  summary: >-
    Endor Labs offers AI-powered security review that analyzes pull requests for application security changes using AI
    agents trained as developer, architect, and security engineer personas.
  why_it_matters: >-
    It helps developers catch security risks in AI- and human-generated code that traditional scanners miss, especially
    around business logic and architecture changes.
  mental_damage: >-
