insights:
  summary: Reflag is a TypeScript feature flag service with SDKs for React, Vue, Next.js, and Node, designed to automate flag lifecycle and integrate with Linear and Slack.
  why_it_matters: It reduces the operational overhead of feature flags by automating cleanup and enabling agent-driven workflows, letting developers ship faster without manual flag hygiene.
  mental_damage: Another 'AI-ready' wrapper around a solved problem that makes you wonder if we're just renaming LaunchDarkly to feel like we're doing something novel.
  tags:
    - feature-flags
    - saas
    - typescript
    - mcp
  confidence: high
curation:
  status: excluded
  reason: Reflag is a feature flag SaaS platform with MCP compatibility, but its core identity is developer-facing feature management, not MCP infrastructure, coding agents, or any catalog-specific tooling layer.
  evidence:
    - Source-list context shows it appears in awesome-mcp-servers as an 'Official Server' for TypeScript feature management
    - README emphasizes SDKs for React/Vue/Next/Node, Linear/Slack integration, self-cleaning flags, and agent-created code flagging via MCP
    - No evidence of MCP being the product identity — it is used as a compatibility feature for agents to interact with flags, not as the core offering
