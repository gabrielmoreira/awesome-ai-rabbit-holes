insights:
  summary: A TypeScript-first feature flag platform with SDKs, local evaluation, and an MCP adapter that allows AI coding agents to create and manage feature flags via prompts.
  why_it_matters: It integrates feature flags directly into AI-assisted development workflows, enabling agents to safely roll out and self-clean flags while keeping developers in flow with Linear and Slack sync.
  mental_damage: We have finally automated the one thing developers are supposed to do manually just to prove we can still over-engineer a boolean.
  tags:
    - feature-flags
    - mcp
    - typescript
    - agent-ready
    - sdk
  confidence: medium
curation:
  status: included
  reason: Reflag is a feature management SaaS at its core, but it is included here because its MCP server is a first-class integration that lets coding agents manage flags via prompt, fitting the MCP Servers category.
  evidence:
    - Appears in awesome-mcp-servers under 'Official Servers' and 'Developer Tools' with MCP-linked descriptions.
    - Site excerpt highlights 'Agent-created code flagged with MCP' and 'Reflag agent handles flag cleanup' as core workflow hooks.
    - Primary product is feature management with SDKs for React, Vue, Next, Node, and strong MCP integration for Cursor and other agents.
