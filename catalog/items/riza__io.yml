insights:
  summary: A production-ready, isolated runtime API and SDKs for safely executing untrusted LLM-generated code in Python, TypeScript, and Go.
  why_it_matters: It lets developers safely delegate code execution to AI agents without risking their production environment, handling billions of executions monthly for AI-native companies.
  mental_damage: We have finally reached the point where we need a specialized firewall just to let the AI run the Python it insisted on writing.
  tags:
    - code-execution
    - sandbox
    - llm-infrastructure
    - sdk
  confidence: high
curation:
  status: included
  reason: The product is a code-first SDK and API (Python, TypeScript, Go) that developers import or call to execute code, fitting the framework/SDK building block pattern rather than an orchestration platform or extension.
  evidence:
    - "Primary page excerpt explicitly shows Python SDK usage: `import rizaio` and `riza.command.exec()`."
    - Positioned as 'AI-first infrastructure' providing secure code execution capabilities to other AI applications and agents.
    - Listed in awesome-mcp-servers, but Riza's core identity is the isolated runtime, with MCP being just one integration surface.
