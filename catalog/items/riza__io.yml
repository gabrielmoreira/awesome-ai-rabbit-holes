  summary: Riza is a production-ready isolated runtime that executes untrusted code generated by AI models via REST API or SDKs.
  why_it_matters: It lets developers safely run LLM-generated code in sandboxed environments without risking their systems or secrets.
  mental_damage: Finally, a way to let AI write and run code without praying it doesn’t rm -rf your production database.
