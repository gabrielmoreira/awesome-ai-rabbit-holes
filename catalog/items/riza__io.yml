  status: included
  reason: Riza is primarily a code-first SDK and API for embedding secure code execution into AI workflows, fitting the Frameworks & SDKs category.
  evidence:
    - Product identity is an isolated runtime for untrusted code with RESTful APIs and SDKs (Python, TypeScript, Go)
    - Core value is enabling LLMs to run code safely at scale, not acting as a coding assistant or IDE
    - Self-hostable and cloud options emphasize infrastructure over end-user tooling
