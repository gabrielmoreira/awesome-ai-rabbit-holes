insights:
  summary: Codiv is a hosted inference API for open System One decision models like OpenJev, Laya, and Verdict that return typed answers with calibrated probabilities.
  why_it_matters: Developers get fast, structured decisions from open Jev-compatible models without running infrastructure, useful for routing, triage, or validation tasks.
  mental_damage: Another API key to manage for a model that answers yes/no with 94% confidence, because we still can’t trust our own if-statements.
  tags:
    - decision-models
    - inference-api
    - typed-questions
  confidence: high
curation:
  status: included
  reason: Codiv’s core identity is hosting and exposing open Jev-like decision models via a Jev-compatible API, making it a cloud gateway for decision-model judgments, not a coding agent, framework, or MCP server.
  evidence:
    - Serves OpenJev 0.1, Laya 1.0, Verdict 1.4, and other open System One models through a Jev-compatible API
    - Answers typed questions (choice, score, noul) with full probability distributions and confidence scores
    - Listed in awesome-jev under 'Benchmarks & research' for inference on open System One models
