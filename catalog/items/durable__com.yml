insights:
  summary: Durable.com is an AI-powered platform that helps users create websites, manage customers, and run marketing for small businesses from a single dashboard.
  why_it_matters: It offers non-technical small business owners a way to launch and operate online without needing developers or multiple SaaS tools.
  mental_damage: Another 'AI business builder' promising to replace entire teams with a chatbot, while developers quietly rebuild the same thing in Next.js.
  tags:
    - website-builder
    - ai-marketing
    - crm
    - no-code
    - small-business
  confidence: high
curation:
  status: excluded
  reason: Durable is an end-user AI platform for non-technical business owners to build websites and manage operations, not a developer-facing tool for coding, agent workflows, or infrastructure.
  evidence:
    - Marketed as 'The complete AI business builder' for creating websites, managing customers, and growing businesses with AI
    - Target audience includes coaches, handymen, photographers, and other service professionals — not developers or engineering teams
    - Outputs are deployable websites and business tools via natural language, placing it in the app builder category, but its primary users are non-technical small business owners
