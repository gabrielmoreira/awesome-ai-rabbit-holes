curation:
  status: excluded
  reason: Durable is a consumer-facing small-business SaaS platform with no meaningful developer-tooling, coding-agent, or app-builder workflow for software developers.
  evidence:
    - Scraped site describes it as an 'AI business builder' for coaching, landscaping, and photography businesses, not developers.
    - Primary features are invoicing, CRM, SEO, and AI-generated logos/blogs, with no repo editing, IDE integration, or developer SDK.
    - Listed under 'App Builders' in awesome-ai-coding-tools, but the product builds brochure sites for small businesses rather than developer apps or tools.
