insights:
  summary: A TypeSafe AI cookbook demonstrating self-consistency scoring of nouls (probabilistic true/false judgments) for insurance claim triage using repeated LLM sampling.
  why_it_matters: Shows how to quantify model uncertainty in borderline decisions and route ambiguous cases to human review while preserving underlying probabilities.
  mental_damage: Another academic-style notebook that proves LLMs are inconsistent, wrapped in just enough code to feel useful before you realize you’ll never run it.
