insights:
  summary: TypeSafe AI's HTTP API endpoint for evaluating application state against typed questions using the Jev decision model to return structured probabilistic answers.
  why_it_matters: Enables developers to integrate structured, probabilistic decision-making into applications via a simple API for tasks like urgency detection, routing, or scoring.
  mental_damage: Another API wrapper that turns model judgment into yet another microservice you have to monitor, version, and pay for per token.
  tags:
    - api
    - decision-model
    - typesafe
  confidence: high
curation:
  status: included
  reason: The product is a hosted gateway exposing the Jev decision model via a typed-question API, making the decision model itself the core identity rather than a coding agent, framework, or MCP adapter.
  evidence:
    - The API evaluates state using typed questions (Noul, Choice, Score) and returns structured probabilistic answers via the Jev model.
    - Source lists categorize it under 'Official' and 'Start here' sections of awesome-jev as the 'Full HTTP API reference for the TypeSafe evaluation endpoint'.
    - The documentation centers on the evaluation endpoint POST https://api.typesafe.ai/v1/systemone with model 'jev-latest' and typed question schemas.
    - No evidence suggests it is primarily a coding agent, app builder, or MCP server; its value is in exposing decision-model judgments.
