insights:
  summary: JevGuide is an Android app that reads WeChat screenshots, uses the Jev decision model to analyze intent and relationship progress, and generates three candidate replies.
  why_it_matters: It demonstrates applying decision-model judgments to personal messaging workflows, showing how typed probabilities can guide real-time communication decisions.
  mental_damage: Another AI tool that promises to fix your texting anxiety by turning intimate conversations into a decision-tree optimization problem.
  tags:
    - android-app
    - decision-model
    - jev
    - wechat-integration
  confidence: medium
curation:
  status: included
  reason: The core product identity is the Jev decision model's judgment output—intent scoring, emotional analysis, and reply generation—making it a decision-model-driven app rather than a coding agent or extension.
  evidence:
    - The app's main functions are 判读 (intent/emotion/risk analysis via Jev), 攻略度 (relationship progress scoring), and 三条回复 (three generated replies based on model judgment).
    - It uses Jev for typed questions with probabilities (8 questions per request) and an OpenAI-compatible chat model for text generation, positioning Jev as the decision layer.
    - Listed in awesome-jev under 'Apps powered by Jev' and 'Browser & computer use', confirming its identity as a Jev-based application.
