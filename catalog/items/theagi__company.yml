insights:
  summary: >-
    A developer platform and SDK for building autonomous agents that interact with mobile and desktop applications via
    screen recognition and action.
  why_it_matters: >-
    It allows developers to build agents that can use any existing software without the need for custom API integrations
    for every individual service.
  mental_damage: >-
    We have successfully pivoted from 'AI will help me write code' to 'AI will handle my groceries,' which is a much
    more direct threat to our autonomy.
  tags:
    - action-agents
    - mobile-ai
    - agent-platform
    - computer-use
    - sdk
  confidence: high
