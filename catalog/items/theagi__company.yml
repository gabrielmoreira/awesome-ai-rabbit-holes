insights:
  summary: AGI-0 is a device-native AI agent that performs cross-app actions like booking rides, ordering groceries, or sending messages based on user prompts.
  why_it_matters: It demonstrates how on-device AI agents can automate personal workflows across mobile and desktop apps without requiring developer integrations.
  mental_damage: Finally, an AI that can order your gluten-free pasta while you pretend to be productive — until you realize it’s just another layer of automation between you and basic life tasks.
  tags:
    - ai-agent
    - device-native
    - cross-app
  confidence: high
curation:
  status: excluded
  reason: MultiOn’s AGI-0 is a general-purpose autonomous agent for personal task automation across apps, not a developer-facing tool for coding, workflow orchestration, or AI infrastructure, so it falls outside the catalog’s scope.
  evidence:
    - The tool performs actions like ordering food, booking rides, and sending messages across apps based on natural language prompts.
    - It is positioned as a private, fast, on-device AI for consumers to 'focus on your life, not your screen'.
    - No mention of code editing, software development, IDE integration, or developer workflows in the scraped site or source-list context.
