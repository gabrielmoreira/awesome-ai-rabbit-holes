insights:
  summary: Bruno is a Git-native, open-source API client for REST, GraphQL, gRPC and WebSocket that stores collections as plain-text files in a repository.
  why_it_matters: It enables version-controlled, offline API testing and collaboration using familiar Git workflows, reducing reliance on cloud-based platforms like Postman.
  mental_damage: Finally, an API client that treats your API definitions like code — because apparently, versioning JSON blobs in a binary blob was the problem all along.
  tags:
    - api-client
    - git-native
    - open-source
    - local-first
    - developer-tool
  confidence: high
curation:
  status: excluded
  reason: Bruno is a developer tool but not an AI-powered one; its core value is Git-native API testing, not AI agents, workflows, or LLM-enhanced development, so it falls outside the catalog’s AI-tooling scope despite superficial AI mentions in testimonials.
  evidence:
    - Bruno is described as a 'Git-native API client' and 'open-source, local, and built for developers' with no AI agent or LLM core functionality
    - Testimonials highlight Git integration, local storage, and offline use — not AI-assisted coding, prompting, or agent behavior
    - No evidence of AI-driven features like prompt-to-code, agent orchestration, or LLM-powered API test generation beyond a single testimonial mentioning Claude Code scanning routes (which is user-driven, not Bruno’s feature)
