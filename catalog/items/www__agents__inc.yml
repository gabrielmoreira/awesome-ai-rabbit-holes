  status: excluded
  reason: The platform is a vertical SaaS product for business analysts performing market research and monitoring, not a developer tool for writing, reviewing, or orchestrating code.
  evidence:
    - The site emphasizes 'No Coding Required' and targets business use cases like M&A targeting, supply chain sourcing, and regulatory monitoring.
    - Inclusion in 'awesome-ai-agents' is for generic autonomous agents, but the catalog scope requires developer-facing infrastructure or coding workflow tools.
