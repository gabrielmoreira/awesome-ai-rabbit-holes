insights:
  summary: Confidence is a TypeSafe AI metric that converts probability distributions into a 0-1 certainty score for typed question answers.
  why_it_matters: It lets developers gate automated actions on model certainty without manual probability math.
  mental_damage: Finally, a way to quantify the existential dread of 'I think?' into a clean threshold for routing to humans.
  tags:
    - decision-models
    - confidence-scoring
    - typed-questions
  confidence: high
curation:
  status: included
  reason: Confidence is a core feature of the Jev decision model (TypeSafe System One), not a standalone product, and belongs with decision-model tooling where the judgment itself is the identity.
  evidence:
    - Documentation defines confidence as a statistic derived from probability distributions for Choice, Score, and Noul answers in TypeSafe's decision model
    - Source lists place it under Jev-related content in sections like 'Model behavior and evaluation' and 'Official resources'
    - The product's entire purpose is explaining how to use this certainty metric to control system behavior based on model uncertainty
