insights:
  summary: >-
    English Compiler is a proof-of-concept CLI tool that compiles English-language Markdown specifications into
    functional code via chained AI prompts.
  why_it_matters: >-
    It demonstrates a speculative workflow where developers delegate full code generation to AI based solely on
    natural-language specs, skipping manual coding.
  mental_damage: >-
    It highlights the absurdity of trading readable, version-controlled code for brittle, slow, and opaque AI-generated
    output that requires re-prompting to fix.
  tags:
    - spec-driven
