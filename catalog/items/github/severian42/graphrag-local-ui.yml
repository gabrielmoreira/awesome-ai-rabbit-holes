insights:
  summary: A local-first GraphRAG suite combining a FastAPI backend with Gradio UIs for indexing, prompt tuning, querying, and visualizing knowledge graphs using local LLMs like Ollama.
  why_it_matters: Enables developers to experiment with Microsoft's GraphRAG patterns on self-hosted hardware without incurring cloud API costs or compromising data privacy.
  mental_damage: You can now visualize your local knowledge graph in 3D while spending forty-five minutes configuring an embedding proxy that you definitely won't remember how to restart next week.
