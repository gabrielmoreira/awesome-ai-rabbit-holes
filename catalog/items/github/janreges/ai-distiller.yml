insights:
  summary: AI Distiller is an open-source CLI tool that compresses large codebases by extracting only public APIs and structure, reducing code volume by 90–98% to fit into AI context windows.
  why_it_matters: It allows developers to feed essential project structure to AI coding assistants without hitting context limits or wasting tokens on implementation details.
  mental_damage: We have finally invented a tool to solve the problem of AI tools being too confused by the code we wrote with other AI tools.
