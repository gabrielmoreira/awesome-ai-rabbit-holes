insights:
  summary: AI Distiller is an open-source CLI and MCP server that extracts public APIs, types, and structure from large codebases, compressing code by 90–98% to fit into AI context windows.
  why_it_matters: It enables AI coding agents to understand entire project architectures without hitting context limits, reducing hallucinations and iterative debugging cycles.
  mental_damage: We have finally engineered a tool to solve the context window problem by throwing away the implementations, leaving the AI to confidently invent them with even greater efficiency.
