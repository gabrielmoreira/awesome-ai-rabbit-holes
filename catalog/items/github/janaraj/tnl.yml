insights:
  summary: TNL provides a structured, file-based Markdown schema for defining typed natural language contracts that AI coding agents propose, developers approve, and sessions persistently read.
  why_it_matters: It replaces ephemeral chat plans with persistent, enforceable feature contracts that bound agent edits to specific paths and require self-attestation against explicit MUST clauses.
  mental_damage: We have successfully formalized the process of arguing with a chatbot until it writes a YAML file that it will then mostly ignore.
  tags:
    - contracts
    - mcp
    - spec-driven
    - cli
    - context
  confidence: medium
curation:
  status: included
  reason: The project centers on a spec-first loop where a structured contract is the primary artifact that drives planning, implementation, and validation for coding agents.
  evidence:
    - Repo description defines it as 'Structured English contracts for AI coding agents — proposed by the agent, approved by you, saved on disk, read by every future session.'
    - README explicitly positions TNL as a persistent, machine-checkable contract with RFC 2119 behaviors that agents implement against and self-attest.
    - Supports spec-driven workflows via `tnl verify`, PreToolUse hooks, and MCP server integration rather than acting as a primary coding agent itself.
