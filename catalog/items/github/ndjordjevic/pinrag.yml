insights:
  summary: A local RAG server built with LangChain that exposes document indexing and citation-aware querying as an MCP server for Cursor, VS Code, and other AI assistants.
  why_it_matters: Developers can index scattered learning materials—PDFs, GitHub repos, YouTube videos, and Discord threads—into a single searchable index and query them directly from their AI editor with source citations.
  mental_damage: We have finally solved the problem of never reading the materials we hoard, by building a RAG stack so we can ignore them more efficiently with better citations.
