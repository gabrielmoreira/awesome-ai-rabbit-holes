insights:
  summary: A RAG system built with LangChain that exposes multi-format document indexing and citation-based querying as an MCP server for Cursor, VS Code, and other AI assistants.
  why_it_matters: It lets developers centralize scattered learning materials—PDFs, GitHub repos, YouTube videos, and Discord threads—into one queryable index that their coding assistant can cite directly inside the editor.
  mental_damage: We have successfully reached the point where the assistant needs its own assistant just to remember what you watched on YouTube yesterday.
  tags:
    - rag
