          agent's commands run on a remote host through the \`farhand\_remote\_shell\` MCP tool instead of \`shell\`.
          OpenCode's permission request for an MCP tool carries no arguments, so the plugin takes the command (and its
          \`cwd\`) from the \`execute.before\` hook, which OpenCode runs first.
