insights:
  summary: An open-source, self-hosted knowledge backend for AI agents that provides persistent memory via hybrid vector and keyword search, an MCP server, and connectors for S3, Azure Blob, and local files.
  why_it_matters: It gives developers a way to persist context and documents across AI sessions so agents can actually build on past research instead of starting from zero every time.
