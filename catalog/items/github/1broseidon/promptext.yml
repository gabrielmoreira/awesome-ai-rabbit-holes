insights:
  summary: A Go-based CLI tool that analyzes a codebase, ranks files by relevance, and packages them into token-efficient formats for pasting into LLM chats.
  why_it_matters: It automates the tedious and error-prone work of selecting and formatting code context, helping developers stay within token limits and reduce API costs.
  mental_damage: We have finally built a tool to manage the tragic reality that our context windows are too small for the sprawling monoliths we blindly feed to ChatGPT.
