insights:
  summary: A CLI tool that extracts and optimizes codebase context into token-efficient formats for LLMs.
  why_it_matters: It solves the tedious process of manually selecting relevant files and managing token budgets when feeding large repositories into AI assistants.
  mental_damage: Finally, a way to precisely calculate exactly how much money you're wasting on context windows before you hit 'end'.
  tags:
    - cli
    - context-management
    - token-optimization
    - codebase-analysis
    - golang
  confidence: high
