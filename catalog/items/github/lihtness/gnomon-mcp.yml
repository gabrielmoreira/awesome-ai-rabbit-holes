insights:
  summary: gnomon-mcp is an MCP server providing deterministic date, calendar, arithmetic, and unit conversion tools for AI agents via batch-enabled Python functions.
  why_it_matters: It eliminates LLM hallucinations in math and date reasoning by offloading computation to reliable, callable tools instead of prompting guesswork.
  mental_damage: Now your agent can finally stop confidently claiming February 30th is a real date, though you’ll still wonder why it needed an MCP server to learn that.
