insights:
  summary: A local-first CLI tool that compiles docs, code, and notes into a persistent knowledge graph and RAG knowledge base, designed to serve as durable memory for coding agents like Claude Code and Codex.
  why_it_matters: It gives developers a way to build a persistent, token-bounded context layer on disk that agents can query, reducing the friction of re-explaining codebases and domain knowledge across sessions.
  mental_damage: "Just what the modern developer needs: another offline wiki to maintain so their AI can finally remember why that one hack was introduced six months ago."
