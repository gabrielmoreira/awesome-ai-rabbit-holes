insights:
  summary: An MCP server that uses static analysis to tell AI agents exactly which lines of code will break during a dependency upgrade.
  why_it_matters: It replaces an LLM's hallucinated version of a library's API with ground-truth analysis of the actual installed package, preventing the "almost right" code that leads to endless debug loops.
  mental_damage: The realization that you've spent the last three hours fighting a hallucinated API that doesn't exist in the version you actually installed.
  tags:
