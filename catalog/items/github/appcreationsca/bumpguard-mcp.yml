insights:
  summary: An MCP server that uses static analysis to identify breaking dependency changes and verify AI-generated code against actually installed APIs.
  why_it_matters: It prevents AI agents from hallucinating outdated API calls or introducing breaking changes during dependency upgrades.
  mental_damage: Because nothing builds trust like an AI agent that finally stops trying to call functions that haven't existed since 2021.
