insights:
  summary: A self-hosted MCP server that indexes documentation from sources like MDX and OpenAPI specs into a Pinecone vector database to serve contextual knowledge to AI assistants via the Model Context Protocol.
  why_it_matters: Developers can scaffold a dedicated MCP endpoint that lets coding agents stop hallucinating API details by querying live, indexed project documentation instead of stale training data.
  mental_damage: We have successfully reached the point where we need to run a dedicated vector stack just to remind the AI that our API endpoint is called /users and not /get_user_list.
