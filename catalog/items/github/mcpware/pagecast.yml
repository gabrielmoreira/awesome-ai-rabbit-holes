insights:
  summary: An MCP server that uses Playwright and ffmpeg to record browser interactions as polished GIFs or videos with auto-zoom and cinematic effects for product demos.
  why_it_matters: It lets developers delegate README demo creation to their AI coding assistant, automatically generating updated screen captures when UIs change without manual screen recording or video editing.
  mental_damage: We have finally reached the point where the AI records its own demo of the app it just broke, so you can watch the failure in cinematic pan mode.
  tags:
    - mcp
    - browser-recording
    - demo-automation
    - playwright
    - screen-capture
  confidence: high
