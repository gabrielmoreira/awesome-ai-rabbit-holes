insights:
  summary: MCP server that injects hover labels onto web pages to enable AI assistants to reference UI elements by name via a reverse proxy.
  why_it_matters: Reduces miscommunication between developers and AI when describing UI changes by giving both a shared vocabulary for page elements.
  mental_damage: Finally, a way to stop playing charades with your AI over which button is 'the one on the left'.
