insights:
  summary: An MCP server that acts as a reverse proxy to inject hover annotations onto any web page, giving AI assistants human-readable names for UI elements.
  why_it_matters: It bridges the communication gap between developers and coding agents by providing a shared visual vocabulary for UI elements, turning vague 'that button' requests into precise, editable instructions.
  mental_damage: We have successfully built a proxy server just so our AI can finally understand which div we are pointing at, proving that the modern web stack is now too complex for the bots we built to automate it.
