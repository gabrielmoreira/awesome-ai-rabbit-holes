insights:
  summary: An MCP server that acts as a reverse proxy to inject hover-based UI element annotations into any web page, giving AI assistants structured DOM context without browser extensions.
  why_it_matters: It eliminates the 'that thing on the left' problem by giving both humans and AI a shared, human-readable vocabulary for UI elements during design and debugging workflows.
  mental_damage: We’ve built a proxy to label buttons so the AI can finally understand what we’re pointing at, because apparently the 2024 dream of 'just describe it' still needs a reverse proxy and a hover label to work.
  tags:
    - mcp
    - browser-automation
    - ui-annotation
    - devtools
  confidence: high
