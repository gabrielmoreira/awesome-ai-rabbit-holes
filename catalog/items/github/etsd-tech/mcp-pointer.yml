insights:
  summary: An MCP server and Chrome extension that lets developers Option+Click DOM elements in the browser and expose them as structured context to agentic coding tools like Claude Code and Cursor.
  why_it_matters: It gives coding agents precise, real-time visibility into frontend UI state without requiring manual DOM descriptions or screenshots.
  mental_damage: We have finally achieved the future where your AI can see the button you are literally pointing at, provided you install a Chrome extension, run a local WebSocket server, configure an MCP client, and remember to hold Option while clicking.
