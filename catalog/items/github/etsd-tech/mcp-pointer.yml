insights:
  summary: An MCP server and Chrome extension that allows users to select DOM elements in a browser and pass them as rich textual context to agentic coding tools.
  why_it_matters: It bridges the gap between what a developer sees in the browser and what an AI agent can interpret, providing deep CSS and HTML context via the Model Context Protocol.
  mental_damage: Finally, a way to make sure your AI agent knows exactly which nested div is causing that layout shift.
