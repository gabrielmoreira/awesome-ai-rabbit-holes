insights:
  summary: An MCP server paired with a Chrome extension that captures DOM elements via Option+Click and exposes them as context to agentic coding tools like Claude Code and Cursor.
  why_it_matters: It closes the loop between visual browser inspection and AI coding agents by letting the model see exactly which UI element a developer is pointing at.
  mental_damage: We have finally solved the hard problem of explaining to an AI which button we mean by clicking on it, which is definitely easier than just describing it in three paragraphs of prompt tokens.
  tags:
    - mcp
    - dom
    - chrome-extension
    - agentic-coding
  confidence: high
