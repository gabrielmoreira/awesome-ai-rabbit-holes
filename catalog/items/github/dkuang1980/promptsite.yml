insights:
  summary: PromptSite is a lightweight Python package for version controlling, tracking, and experimenting with LLM prompts using local files, Git, and simple decorators.
  why_it_matters: It gives developers a low-overhead way to iteratively debug prompts, track LLM runs, and manage variables without standing up a separate server or database.
