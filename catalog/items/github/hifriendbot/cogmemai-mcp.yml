insights:
  summary: CogmemAi is an MCP-compatible memory layer that gives coding assistants persistent, cross-session recall with autonomous capture and benchmark-topping long-term memory scores.
  why_it_matters: It offloads memory management to the infrastructure layer so your AI assistant remembers architectural decisions and prior attempts without being explicitly told to save.
  mental_damage: We've successfully automated the one thing developers are supposed to be good at—remembering why we made terrible decisions six hours ago.
  tags:
    - mcp
    - memory
    - context
    - persistent-recall
    - benchmark
  confidence: medium
curation:
  status: included
  reason: The core novelty is the memory and context system itself—autonomous capture, semantic retrieval, principle extraction, and compression—making it a fit for Prompt & Context Engineering rather than a host integration or general MCP server.
  evidence:
    - README states CogmemAi is 'a portable memory layer that gives any Ai system persistent recall across sessions' with autonomous capture at the infrastructure level (v3.15).
    - Topics include ai-memory, knowledge-graph, semantic-search, and mcp-server, with benchmark claims of 95.10% on LongMemEval and 91% on LoCoMo.
    - Active as of 2026-04-28 with recent version updates focused on memory intelligence rather than MCP protocol tooling alone.
