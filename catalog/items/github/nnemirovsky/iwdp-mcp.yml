insights:
  summary: An MCP server and CLI that exposes the iOS WebKit Inspector Protocol as tools so AI agents and IDEs can debug Safari on real iPhones.
  why_it_matters: It gives coding agents and MCP clients native access to real iOS Safari sessions, closing a long-standing gap where only desktop Chrome debugging was agent-accessible.
  mental_damage: We have finally automated the one remaining step of mobile debugging that still required a human with a lightning cable and a prayer.
