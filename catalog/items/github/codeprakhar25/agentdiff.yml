insights:
  summary: >-
    A git-native tool for AI code provenance that records and cryptographically signs which AI agent wrote specific
    lines of code.
  why_it_matters: >-
    It provides a durable, signed audit trail for AI-generated code, moving from probabilistic detection to verifiable
    authorship for governance and security.
  mental_damage: >-
    We have finally reached the era where we need cryptographic proof to determine which LLM is actually responsible for
    the bug in production.
