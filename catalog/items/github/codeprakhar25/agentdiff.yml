insights:
  summary: A git-native tool for AI code provenance that records and cryptographically signs which AI agent wrote specific lines of code.
  why_it_matters: It provides a durable, signed audit trail for AI-generated code, moving from probabilistic detection to verifiable authorship for governance and security.
  mental_damage: We have finally reached the era where we need cryptographic proof to determine which LLM is actually responsible for the bug in production.
  tags:
    - provenance
    - git
    - governance
    - sbom
    - security
  confidence: high
curation:
  status: included
  reason: The tool augments the existing git/IDE workflow by adding an attribution layer to other coding assistants rather than acting as an assistant itself.
  evidence:
    - README describes it as a 'source-line authorship layer' that 'hooks into every major AI coding agent'
    - Provides a CLI tool (agentdiff list) to query authorship evidence stored in git history
    - Explicitly contrasts itself against primary assistants, positioning itself as an additive provenance layer
