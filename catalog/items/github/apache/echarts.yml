insights:
  summary: Apache ECharts is a long-established, pure JavaScript charting and visualization library for building interactive browser-based charts.
  why_it_matters: It remains a foundational client-side dependency for developers who need highly customizable, production-grade data visualizations without adopting AI-first tooling.
  mental_damage: While everyone else is debating which LLM can hallucinate a dashboard fastest, you are still hand-tuning canvas renderers like it’s 2013.
  tags:
    - charts
    - data-visualization
    - javascript
    - browser
    - apache
  confidence: high
curation:
  status: excluded
  reason: Although it appears in an awesome-mcp-servers list, ECharts is a traditional data visualization library with no AI-specific developer-tooling identity, making it a classic false positive.
  evidence:
    - Repo description clearly defines it as a 'charting and data visualization library for browser', with no mention of AI.
    - README excerpt focuses entirely on npm installs, canvas rendering, and chart configuration, with zero AI, agent, or prompt references.
    - Appears in awesome-mcp-servers lists only as a linked library page, not as an actual MCP server implementation.
