insights:
  summary: Apache APISIX is a cloud-native API and AI gateway that proxies, load balances, and secures LLM traffic, with an `mcp-bridge` plugin to convert stdio-based MCP servers into HTTP SSE services.
  why_it_matters: It provides the infrastructure layer to manage, scale, and secure AI agent traffic and MCP server endpoints without reinventing gateway logic.
  mental_damage: You now have a production-grade distributed gateway dedicated to ensuring your MCP server bridge doesn't become the next single point of failure in an already fragile agent stack.
  tags:
    - api-gateway
    - ai-gateway
    - mcp
    - infrastructure
    - llm-proxy
  confidence: high
curation:
  status: excluded
  reason: APISIX is a general-purpose API and AI gateway; its core identity is infrastructure plumbing, and MCP support is only a plugin, making it a poor fit for a developer-tooling catalog focused on coding agents, extensions, and AI workflows.
  evidence:
    - Repo description defines it as 'The Cloud-Native API Gateway and AI Gateway', not a developer coding tool.
    - README positions MCP via the `mcp-bridge` plugin as a way to expose stdio MCP servers over HTTP SSE, not as the product's primary identity.
    - Source-list placement in awesome-mcp-servers is noted as a common false positive in the MCP category definition.
