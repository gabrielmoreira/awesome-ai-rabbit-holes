insights:
  summary: Apache APISIX is a cloud-native API gateway that also functions as an AI Gateway with plugin support for LLM load balancing, proxying, and MCP server bridging.
  why_it_matters: It provides developers with a scalable, plugin-driven way to manage AI traffic alongside traditional API routing, including MCP server compatibility via its mcp-bridge plugin.
  mental_damage: Now your API gateway can also be your AI gateway, because why have one abstraction layer when you can have two.
  tags:
    - api-gateway
    - ai-gateway
    - mcp-bridge
    - load-balancing
    - kubernetes
  confidence: high
curation:
  status: excluded
  reason: While it includes AI Gateway and MCP bridging capabilities, its primary identity is a cloud-native API gateway, not a developer-facing AI tool or MCP-first infrastructure.
  evidence:
    - Repo description identifies it as 'The Cloud-Native API Gateway and AI Gateway'
    - README emphasizes API gateway features (load balancing, upstream management) as core, with AI Gateway as a secondary use case
    - MCP support is via a plugin (mcp-bridge) rather than being the product's primary identity
