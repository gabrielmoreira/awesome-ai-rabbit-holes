insights:
  summary: A prompt-first starter kit for turning repeated AI coding agent mistakes into durable repository instructions and evaluation checks.
  why_it_matters: It shifts the effort from endless prompt tweaking to 'harnessing' the repository itself to provide better operational boundaries and feedback loops for agents.
  mental_damage: We've reached the era where we no longer write code, but instead engineer the environment that manages the AI that writes the code that we then spend an hour debugging.
  tags:
    - coding-agents
    - prompt-engineering
    - agent-ops
    - repository-harnessing
  confidence: high
