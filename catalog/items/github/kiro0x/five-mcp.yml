insights:
  summary: An MCP server that provides structured JSON persona constraints to prevent LLM persona drift.
  why_it_matters: It replaces imprecise natural language character descriptions with deterministic, recipe-based behavioral parameters for more reliable agents.
  mental_damage: Because asking an LLM to maintain a persona for more than ten minutes is apparently a fundamental failure of model reasoning.
