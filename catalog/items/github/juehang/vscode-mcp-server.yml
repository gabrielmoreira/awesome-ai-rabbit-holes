insights:
  summary: A VS Code extension that runs an MCP server to expose the editor's file system, symbol search, and editing capabilities to AI coding assistants like Claude.
  why_it_matters: It allows external coding agents to directly manipulate code within a live VS Code workspace using native editor features rather than just raw file system access.
  mental_damage: We have finally achieved the milestone where your IDE needs a plugin so that your AI can talk to the IDE you are already using to watch the AI edit the code.
