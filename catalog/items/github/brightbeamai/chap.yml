insights:
  summary: >-
    An open protocol and runtime for creating auditable, hash-linked logs of human-agent interactions such as approvals,
    overrides, and handoffs.
  why_it_matters: >-
    It allows developers to implement structured, non-repudiable human-in-the-loop governance and audit trails within
    agentic workflows.
  mental_damage: >-
    Because nothing provides more peace of mind than a cryptographically signed audit trail to explain exactly why your
    agent just performed a catastrophic action.
  tags:
    - mcp
    - human-in-the-loop
    - audit-trail
    - governance
    - protocol
  confidence: high
curation:
  status: included
  reason: >-
    CHAP is fundamentally a protocol that defines the 'shape' (the spec/contract) of human-agent coordination for the
    purposes of governance and auditability.
  evidence:
    - Repo description defines it as an MCP/A2A-compatible runtime for auditable human-agent work.
    - README emphasizes the use of hash-linked envelopes to provide a shared, structured shape for decisions.
    - Provided as code-first integration via PyPI and npm packages.
