insights:
  summary: An archived MCP server that provided LLM evaluation capabilities via the Atla API, exposing tools to score and critique model responses.
  why_it_matters: It allowed developers to plug standardized LLM evaluation directly into agent workflows via MCP before the underlying API was shut down.
  mental_damage: We finally standardized how to judge our models right before the judge itself retired, leaving us with one more lightweight protocol wrapper for a dead endpoint.
