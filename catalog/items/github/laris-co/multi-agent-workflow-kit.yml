insights:
  summary: A CLI toolkit that orchestrates parallel AI coding agents inside isolated git worktrees with shared tmux visibility for supervisor control.
  why_it_matters: It lets developers run multiple AI agents on separate branches simultaneously and manage them from a single terminal session instead of juggling multiple windows.
  mental_damage: Finally, a way to scale your context-switching anxiety from one chaotic AI assistant to three at once, neatly arranged in tmux panes.
