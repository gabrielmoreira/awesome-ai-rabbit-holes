insights:
  summary: Alcove is an MCP server that provides AI coding agents with on-demand access to private project documentation via hybrid search and code indexing.
  why_it_matters: It solves the context bloat problem by letting agents pull only the relevant docs they need, when they need them, rather than dumping everything into the context window.
  mental_damage: Finally, a way to stop your AI from re-reading your entire architecture doc every time it needs to remember how auth works.
