insights:
  summary: A set of Neo4j Labs Model Context Protocol (MCP) servers that let MCP clients talk to Neo4j via STDIO, SSE, or HTTP.
  why_it_matters: It gives developers a ready-made way to let assistants (Claude Desktop, VS Code, Cursor, Windsurf, Gemini CLI) query Neo4j with Cypher, persist “memory” as a knowledge graph, and even manage Aura instances from chat.
  mental_damage: Now your graph database has an agent interface, which is great until you realize you need a schema, an APOC plugin, transport flags, and a threat model just to ask “what’s in this graph?”
  tags:
    - mcp
    - neo4j
    - database
    - cypher
    - knowledge-graph
  confidence: high
