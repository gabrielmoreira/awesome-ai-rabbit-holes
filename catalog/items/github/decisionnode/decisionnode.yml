insights:
  summary: A CLI and local MCP server providing a shared, semantically queryable structured memory store for AI coding assistants like Claude Code, Cursor, and Windsurf.
  why_it_matters: It lets developers and their AI assistants persist, retrieve, and reason over architectural decisions and constraints across projects without stuffing everything into the context window.
  mental_damage: Finally, a way to make your AI remember why you did that thing you can’t remember doing.
  tags:
    - mcp
    - memory
    - semantic-search
    - developer-tools
    - context-engineering
  confidence: high
