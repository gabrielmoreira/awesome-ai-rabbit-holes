insights:
  summary: Letta (formerly MemGPT) is a platform and CLI tool for building stateful AI agents with persistent memory, available as a local terminal agent (Letta Code) or via an API/SDK for application integration.
  why_it_matters: It provides developers with a framework and CLI to run coding agents locally with advanced memory management, or embed stateful agents into applications using Python and TypeScript SDKs.
  mental_damage: We have successfully abstracted the concept of remembering things so that our agents can experience the same existential dread of context window limits that we do.
  tags:
    - agents
    - cli
    - framework
    - memory
    - sdk
    - stateful
  confidence: high
