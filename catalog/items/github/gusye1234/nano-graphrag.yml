insights:
  summary: A minimal, code-first Python library that implements GraphRAG with a ~1100 line core, supporting async insertion and query, multiple vector stores, and local models like Ollama.
  why_it_matters: It gives developers a readable, hackable RAG foundation they can actually fork and extend without wading through Microsoft's heavier reference implementation.
  mental_damage: Yet another 3,800-star excuse to spend a weekend replacing your perfectly fine vector search with a knowledge graph you’ll swear you understand until the next paper drops.
