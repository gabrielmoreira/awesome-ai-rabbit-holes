  summary: >-
    An MCP server that lets AI agents create, read, update, and delete Draw.io diagrams programmatically via tools like
    Mermaid import and multi-page management.
  why_it_matters: >-
    It allows coding agents to generate and maintain architectural diagrams and flowcharts automatically, bridging the
