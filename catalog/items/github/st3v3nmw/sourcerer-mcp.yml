insights:
  summary: An MCP server that builds a semantic search index of a Git repository using Tree-sitter and OpenAI embeddings to let AI agents find and retrieve specific code chunks without reading entire files.
  why_it_matters: It dramatically reduces token consumption and context-window clutter by allowing agents to conceptually jump to specific functions or classes instead of brute-forcing full file reads.
  mental_damage: We have successfully invented a RAG pipeline just so our AI assistants can pretend they read the codebase without actually burning through our API quotas.
  tags:
    - mcp
    - semantic-search
    - context-engineering
    - code-navigation
    - token-optimization
  confidence: high
