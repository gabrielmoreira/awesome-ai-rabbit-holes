insights:
  summary: Dolly is a family of instruction-tuned large language models, such as dolly-v2-12b, trained on the Databricks platform and licensed for commercial use.
  why_it_matters: It provides developers with an open, commercially permissive benchmark model and dataset (databricks-dolly-15k) for fine-tuning and experimenting with instruction-following behavior.
  mental_damage: We now have a commercially licensed model specifically noted for struggling with programming problems, proving that even open-source magic needs a debugger.
