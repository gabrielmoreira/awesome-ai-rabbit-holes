insights:
  summary: Databricks’ Dolly is an instruction-following large language model trained on the Databricks Machine Learning Platform and licensed for commercial use.
  why_it_matters: It provides developers with a permissively licensed, fine-tuned LLM for instruction-following tasks, including code-related use cases, without the restrictions of closed-source models.
  mental_damage: Finally, a model that can follow instructions—just don’t ask it to write a haiku about your codebase.
