insights:
  summary: A local-first Streamlit chatbot that clones GitHub repositories, embeds code with Sentence Transformers, and answers questions about the codebase using a local LLM via Retrieval Augmented Generation.
  why_it_matters: It lets developers run a private, offline Q&A interface over any GitHub repo without sending proprietary code to external APIs.
  mental_damage: Yet another reminder that while agents are learning to write entire repos, we are still building bespoke chat interfaces to simply ask them what the code we just cloned actually does.
  tags:
    - rag
    - local-llm
    - repo-chat
    - streamlit
    - langchain
  confidence: medium
