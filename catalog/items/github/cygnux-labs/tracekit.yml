        surrounding_text: "| [Tracekit](https://github.com/Cygnux-Labs/Tracekit) | Tamper-evident tracing and policy checks for AI agent tool calls: each call is checked before it runs and signed with its decision into a hash chain, with one `.tkb` file per run that verifies offline (Python and TypeScript verifiers). Hooks for Claude Code, Codex, Cursor and Gemini CLI; integrations for LangChain/LangGraph, the OpenAI Agents SDK, the Claude Agent SDK and MCP. | ![GitHub Badge](https://img.shields.io/github/stars/Cygnux-Labs/Tracekit.svg?style=flat-square) |"
