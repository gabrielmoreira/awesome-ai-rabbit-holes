        extracted_url: https://github.com/cygnux-labs/tracekit
        surrounding_text: "- **[Tracekit](https://github.com/Cygnux-Labs/Tracekit)** `⭐ 734` — Hooks for Claude Code, Codex CLI, Cursor and Gemini CLI that send each tool call to a local signer before it runs; the signer allows it, blocks it or holds it for your approval, and signs it into a hash-chained log that `tracekit verify` checks offline. `tracekit init --dev --v2` sets it up. Dev mode runs the signer as you; tamper resistance needs it under another user, in a container or on another host. Python, MIT."
