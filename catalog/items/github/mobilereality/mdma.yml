insights:
  summary: MDMA (Markdown Document with Mounted Applications) extends Markdown with interactive components like forms, approval gates, and webhooks, allowing LLMs to generate structured, actionable documents rendered via a React SDK.
  why_it_matters: It replaces fragile free-form text parsing with a predictable schema for LLM outputs, enabling developers to build interactive AI workflows and structured UIs without writing custom rendering logic for every use case.
  mental_damage: We've successfully evolved AI interactions from 'vibes-based text' to 'vibes-based forms', ensuring the model now hallucinates the exact structure of your intake questionnaire instead of just the answers.
  tags:
    - markdown
    - llm
    - interactive
    - mcp
    - react
  confidence: medium
