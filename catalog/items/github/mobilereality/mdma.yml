insights:
  summary: MDMA extends Markdown with interactive components like forms, approval gates, and webhooks so LLMs can generate actionable, schema-driven documents instead of plain text.
  why_it_matters: Developers can define structured MDMA specs that let AI assistants return validated, interactive UI components directly in Markdown, eliminating fragile text parsing and custom UI per use case.
  mental_damage: We have successfully evolved AI conversations from plain text to interactive Markdown forms, which is definitely not just rebuilding HTML forms with extra steps and a tokenizer.
  tags:
    - markdown
    - interactive-documents
    - llm-integration
    - react
    - mcp
  confidence: medium
curation:
  status: included
  reason: MDMA is a code-first SDK and spec system (parser, runtime, renderer, prompt pack) that developers import and script against to structure LLM output as interactive documents.
  evidence:
    - "README shows multiple npm packages: @mobile-reality/mdma-parser, mdma-runtime, mdma-renderer-react, mdma-prompt-pack, and mdma-cli."
    - Core concept is a spec-driven Markdown extension with typed components (form, button, approval-gate, webhook) rendered via a React library.
    - Topics include llm, agent-skills, claude-skill, mcp, and generative-ui, and it is listed in awesome-mcp-servers under Developer Tools.
