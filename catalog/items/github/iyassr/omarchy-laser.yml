        surrounding_text: "- [Laser (Omarchy focus mode)](https://github.com/iYassr/omarchy-laser) - `Open source` · `Free` · `BYOK`. AI focus mode for Omarchy / Hyprland on Linux: you declare a task, and Laser judges each screen against it with TypeSafe Jev (about half a second per check), escalating from a red dot to a nudge, a red screen edge and a haze over the distracting window; screenshots are OCR'd on device and only text (per privacy level) is sent. [Project guide](community/projects/apps/omarchy-laser.md)."
