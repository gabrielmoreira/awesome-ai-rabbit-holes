insights:
  summary: An MCP server that connects AI assistants to Storybook instances to extract component HTML, styles, metadata, and design tokens for design system analysis and refactoring.
  why_it_matters: It lets AI coding agents directly inspect and understand your live design system components, bridging the gap between UI documentation and AI-assisted frontend development.
  mental_damage: We have successfully abstracted the process of asking an AI to puppeteer a headless browser to scrape the HTML of a component we already wrote, just in case the AI forgot what a button looks like.
