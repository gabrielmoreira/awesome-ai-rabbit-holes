insights:
  summary: An MCP server that reads locally cached Copilot Money personal finance data from a Mac and exposes it to AI assistants like Claude Desktop and Cursor via 17 read-only tools.
  why_it_matters: It demonstrates how developers can build local-first MCP servers to safely bridge proprietary desktop app data with AI workflows without cloud sync or vendor APIs.
  mental_damage: We have successfully reached the point where we need a protocol server to ask an AI why we are poor, but at least the query runs with zero network requests.
