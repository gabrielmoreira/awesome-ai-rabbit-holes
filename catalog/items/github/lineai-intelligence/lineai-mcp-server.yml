insights:
  summary: An MCP server that exposes CodeLogic's software dependency graph and impact analysis to AI programming assistants.
  why_it_matters: It lets AI assistants query detailed code-to-database dependencies and impact paths before editing, reducing the risk of breaking changes in complex systems.
  mental_damage: Your AI assistant can now calculate the exact blast radius of a refactor across your monolith, provided you maintain a separate enterprise dependency graph just to keep it informed.
  tags:
    - ai-assistants
    - code-graph
    - dependency-analysis
    - impact-analysis
    - mcp
  confidence: high
