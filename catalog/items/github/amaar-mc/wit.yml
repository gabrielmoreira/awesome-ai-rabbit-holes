insights:
  summary: Agent coordination protocol that declares intents, locks symbols, and detects conflicts before code is written to prevent merge conflicts in shared codebases.
  why_it_matters: It prevents multi-agent coding collisions by letting AI assistants announce plans and reserve code symbols before editing, reducing merge conflicts in team or parallel-agent workflows.
  mental_damage: Finally, a way to stop your three Claude Code instances from silently rewriting the same function into a fight club.
  tags:
    - multi-agent
    - coordination
    - merge-conflicts
    - git-integration
    - claude-code
  confidence: high
