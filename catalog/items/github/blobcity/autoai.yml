insights:
  summary: A Python AutoML framework that performs model search, hyper-parameter tuning, and generates exportable Jupyter Notebook or Python code for regression and classification tasks on numerical data.
  why_it_matters: It automates the iterative cycle of model selection and generates production-ready training code, allowing developers to skip boilerplate ML plumbing and focus on data.
  mental_damage: Just when you thought you were safe from manual hyperparameter tuning, you now have to decide if you're the kind of developer who lets a framework `spill` their ML code for them.
