insights:
  summary: A local MCP server and CLI that adds persistent SQLite storage, full-text search, and contact resolution to signal-cli.
  why_it_matters: It transforms an ephemeral CLI tool into a queryable local knowledge base, allowing AI assistants to summarize, search, and act on private Signal communications locally.
  mental_damage: We have finally reached the stage where we need a database and an LLM just to remember what happened in the group chat from three weeks ago.
