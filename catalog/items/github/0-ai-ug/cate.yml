insights:
  summary: A spatial IDE that uses an infinite canvas to manage and visualize multiple concurrent coding agent sessions.
  why_it_matters: >-
    It allows developers to coordinate several agents working on different git branches or tasks simultaneously within a
    single, agent-aware workspace.
  mental_damage: >-
    Provides the spatial complexity needed to match the overwhelming number of AI agents you'll eventually try to run at
    once.
  tags:
    - spatial-ide
    - multi-agent
    - agent-orchestration
    - canvas
    - worktrees
  confidence: high
curation:
  status: included
  reason: >-
    It functions as an orchestration platform because its core purpose is managing the execution, visibility, and
    lifecycle of multiple concurrent agent processes.
  evidence:
    - README explicitly describes it as an 'infinite canvas IDE for parallel coding agents'
    - Features agent-aware terminals that monitor turn status and permission prompts for multiple CLIs
    - Supports managing multiple worktrees to keep parallel agent workstreams visually and logically separate
