insights:
  summary: Read-only MCP server that lets AI agents query PostgreSQL, MySQL, and SQLite through a single stdio connection, enforcing safety via database-level read-only transactions and query guards.
  why_it_matters: Developers can point Claude, Cursor, or any MCP client at multiple databases without deploying a separate server per engine or risking accidental writes.
  mental_damage: Promising 'zero query language to learn' for database access is liberating until you realize the agent still needs someone to understand the schema, the joins, and why that 'read-only' query is timing out after 2.3 million rows.
  tags:
    - mcp
    - database
    - sql
    - read-only
    - multi-engine
  confidence: medium
curation:
  status: included
  reason: The product is a purpose-built MCP server for multi-database querying; MCP is its entire identity rather than a compatibility layer or side feature.
  evidence:
