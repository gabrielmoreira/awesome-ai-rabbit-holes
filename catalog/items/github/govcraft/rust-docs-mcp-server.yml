insights:
  summary: An MCP server that fetches current Rust crate documentation, generates embeddings, and provides an LLM-powered query tool to prevent outdated code suggestions in AI assistants.
  why_it_matters: It gives coding assistants real-time access to evolving Rust APIs, reducing hallucinations and manual corrections when working with crates like serde, tokio, or reqwest.
  mental_damage: We have reached the point where we need specialized infrastructure just to stop our AI from confidently inventing 2023-era Rust APIs.
