insights:
  summary: An MCP server that converts natural language queries into valid GraphQL using a LangGraph agent, integrating with AI assistants like Claude Desktop and Cursor.
  why_it_matters: It allows developers to query GraphQL APIs conversationally through their AI assistant, removing the need to manually construct complex queries against a schema.
  mental_damage: We have successfully abstracted the act of learning a query language into the act of debugging an LLM's interpretation of a schema it barely understands.
