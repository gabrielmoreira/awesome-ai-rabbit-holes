insights:
  summary: An MCP server that exposes Metoro's Kubernetes observability data to LLMs like Claude Desktop, allowing developers to query cluster telemetry using natural language.
  why_it_matters: It lets developers bypass dashboard fatigue by querying eBPF-generated Kubernetes traces, metrics, and logs directly through their AI assistant.
  mental_damage: Instead of learning kubectl or reading docs, you can now debug a complex microservices outage by politely asking a chat window that might hallucinate the status of your pods.
