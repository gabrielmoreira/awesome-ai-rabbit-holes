insights:
  summary: An experimental MCP server that lets LLMs like Claude and Cursor list and inspect Nutanix Prism Central resources such as VMs, clusters, and hosts via the Model Context Protocol.
  why_it_matters: It enables developers and operators to query and analyze infrastructure state through natural language conversations in their existing MCP-compatible coding assistants.
  mental_damage: You can now ask an LLM to audit your hypervisor inventory, but only if you promise not to touch the delete button since this server is strictly read-only and experimental.
