insights:
  summary: OathScore is a real-time API monitoring and rating service for trading data sources, shipping an MCP server so AI agents can query world state, volatility, and data quality scores.
  why_it_matters: It lets trading agents programmatically check whether a market-data API is lying to them before making decisions, replacing vibes-based trust with uptime and accuracy metrics.
  mental_damage: We have finally built a credit bureau for APIs, because apparently even our data sources now need to be audited by the same agents they are trying to mislead.
