          ![stars](https://img.shields.io/github/stars/Nisaka520/JevBystander?style=flat-square&label=%E2%98%85) -
          Messaging: Android accessibility app that reads the visible WeChat chat window and answers one batched request
          of typed `Choice`, `Score` and `Boolean` questions to sort the peer's message into intent (10 options), an
          emotion distribution (9 options), urgency (0-3 `Score`) and a suggested reply posture (11 options), then shows
          exactly three toasts and takes no other action - no generated reply, no input injection, no screenshot or OCR,
          with a local alias-to-relation table passed as state so the same sentence is judged differently for a partner
          than for a colleague.
        confidence: high
