insights:
  summary: A Model Context Protocol server that exposes a TiDB (serverless) database as a tool for AI assistants like Claude Desktop.
  why_it_matters: It allows developers to let AI agents query and interact directly with their TiDB cloud instances via the standardized MCP interface.
  mental_damage: We have finally abstracted away the need to open a SQL client, replacing it with a protocol layer that requires its own JSON config file and a Python venv.
