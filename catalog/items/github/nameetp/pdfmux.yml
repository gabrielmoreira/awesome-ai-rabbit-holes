insights:
  summary: A self-healing PDF extraction CLI and Python library that routes pages through multiple backends and audits output quality, with optional LLM fallbacks and an MCP server for Claude Desktop.
  why_it_matters: It gives developers a single pipeline to get clean Markdown or JSON out of messy PDFs for RAG and LLM workflows, with confidence scoring and automatic re-extraction.
  mental_damage: Another essential piece of infrastructure for the modern stack where half your context window is fighting with a PDF that swore it had a reading order.
  tags:
    - pdf-extraction
    - rag
    - mcp
    - self-healing
    - cli
  confidence: high
curation:
  status: included
  reason: This is a code-first Python library and CLI that developers import and script against to normalize PDF inputs for AI workflows, fitting Frameworks & SDKs better than MCP or extensions.
  evidence:
    - "Repo description: 'PDF extraction that checks its own work... zero AI, zero GPU, zero cost.'"
    - README shows primary usage via `pip install pdfmux` and Python API (`pdfmux.extract_text`, `pdfmux.batch_extract`).
    - Topics and README include MCP, LangChain, and LlamaIndex integrations, but the core product is the extraction library and router.
