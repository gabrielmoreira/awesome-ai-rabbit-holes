insights:
  summary: Capsule is a WebAssembly-based runtime that sandboxes untrusted code execution for AI agents, providing resource limits, automatic retries, and lifecycle tracking via Python and TypeScript SDKs.
  why_it_matters: It gives developers a secure way to execute LLM-generated or user-submitted code in isolated Wasm sandboxes with configurable CPU, memory, and timeout constraints.
  mental_damage: Finally, a runtime that lets your agent confidently eval arbitrary code in production while technically being able to say 'it ran in a sandbox' when things catch fire.
  tags:
    - wasm
    - sandbox
    - code-execution
    - agent-infrastructure
  confidence: high
curation:
  status: included
  reason: The product is a code-first SDK and runtime (Python/TypeScript) that developers import and script against to sandbox agent tasks, making it a framework, not a control plane or primary coding assistant.
  evidence:
    - "Repo description: 'Secure runtime to sandbox AI agent tasks. Run untrusted code in isolated WebAssembly environments.'"
    - README shows SDK usage via @task decorators and task() wrappers in Python and TypeScript with a capsule run CLI.
