insights:
  summary: >-
    An MCP server providing a graph-based, local-first memory layer for AI agents to persist project context and
    decisions across sessions.
  why_it_matters: >-
    It enables AI assistants to retain long-term knowledge and reasoning history, preventing the loss of critical
    project context between individual conversations.
  mental_damage: >-
