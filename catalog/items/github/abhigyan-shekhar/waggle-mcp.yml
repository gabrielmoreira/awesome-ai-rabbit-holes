        surrounding_text: "- [Abhigyan-Shekhar/Waggle-mcp](https://github.com/Abhigyan-Shekhar/Waggle-mcp) [![Abhigyan-Shekhar/Waggle-mcp MCP server](https://glama.ai/mcp/servers/Abhigyan-Shekhar/Waggle-mcp/badges/score.svg)](https://glama.ai/mcp/servers/Abhigyan-Shekhar/Waggle-mcp) 🐍 🏠 🍎 🪟 🐧 - Persistent graph memory for AI agents. Drop a conversation turn in via `observe_conversation()` and facts are auto-extracted, stored as typed graph nodes with local semantic embeddings (no API key). Supports temporal queries (\"what did we decide last week?\"), conflict detection, and context priming. One-command setup with `waggle-mcp init`. SQLite locally, Neo4j in production."
