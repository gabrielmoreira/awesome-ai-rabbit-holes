insights:
  summary: Project-aware vector database for AI assistants with hybrid semantic and keyword search, built on Qdrant, offering MCP server, CLI, and daemon for code intelligence and retrieval.
  why_it_matters: Developers can integrate this into their workflows to give AI assistants project-scoped, hybrid search capabilities over code, docs, and behavioral rules without leaving their existing tools.
  mental_damage: Now your AI assistant can finally remember where you put that one regex from 2022, but only if you also remember to configure Qdrant.
