insights:
  summary: A project-scoped MCP server that provides hybrid semantic and keyword search over Qdrant vector collections, with automatic Git project detection and code intelligence features like Tree-sitter chunking and LSP integration.
  why_it_matters: It gives Claude Code and other MCP-compatible assistants persistent, project-aware memory and code-aware search without developers needing to stand up generic vector infra from scratch.
  mental_damage: Another essential bridge in the sprawling stack where your coding assistant now needs a dedicated daemon, a vector database, and a Rust CLI just to remember what you were doing five minutes ago.
  tags:
    - mcp
    - vector-search
    - memory
    - qdrant
    - context
  confidence: high
