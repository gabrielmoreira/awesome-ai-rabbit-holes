insights:
  summary: A Model Context Protocol server that connects AI assistants like Claude Code to a project-scoped Qdrant vector database for hybrid semantic and keyword search across local codebases.
  why_it_matters: It gives coding agents persistent, project-aware memory by indexing code with Tree-sitter chunking and LSP integration, allowing assistants to search and reason over a repository's context via MCP.
  mental_damage: We have successfully built a background daemon to monitor the files so the AI can finally remember what it was doing before the context window reset for the eighth time today.
