  summary: A CLI inspection tool and transparent proxy that enables hot-reloading and debugging for Model Context Protocol (MCP) server development.
  why_it_matters: It allows developers to test MCP servers without complex client setups and iterate on code without disconnecting their AI clients or losing session context.
