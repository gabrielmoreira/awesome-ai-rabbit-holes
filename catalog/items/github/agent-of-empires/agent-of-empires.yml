insights:
  summary: A session manager and orchestration harness for running multiple AI coding agents in parallel across different git worktrees and terminal sessions.
  why_it_matters: It allows developers to scale their coding agent usage by providing a centralized TUI or web interface to manage, monitor, and sandbox multiple persistent agent sessions.
  mental_damage: Because apparently, managing one autonomous agent is no longer enough chaos for a single developer to handle.
  tags:
    - agent-orchestration
    - tui
    - session-management
    - sandboxing
    - cli
  confidence: high
