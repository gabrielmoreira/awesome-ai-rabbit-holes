  status: included
  reason: It functions as a control plane and workbench for coordinating a fleet of multiple distinct AI agents rather than just augmenting a single one.
  evidence:
    - Supports multiple agents including Claude Code, Gemini CLI, and Copilot CLI
    - Provides a TUI and web dashboard to monitor agent status and manage parallel sessions
    - Uses tmux and Docker to isolate and persist multiple agent runs across different git branches
