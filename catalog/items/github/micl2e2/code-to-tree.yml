insights:
  summary: A runtime-free MCP server that converts source code into ASTs using tree-sitter, distributed as a standalone binary for integration with MCP clients like Claude Desktop.
  why_it_matters: It gives LLMs structured, accurate syntax trees across multiple languages without requiring language-specific runtimes, improving code analysis capabilities within MCP workflows.
  mental_damage: We have successfully abstracted the act of understanding code into a protocol handshake with a binary that builds its own syntax trees so the model doesn't have to hallucinate the difference between a pointer and a variable.
  tags:
