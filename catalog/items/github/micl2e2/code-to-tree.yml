insights:
  summary: A runtime-free MCP server that converts source code into abstract syntax trees (ASTs) using tree-sitter for multiple languages including C, C++, Rust, Ruby, Go, Java, and Python.
  why_it_matters: It gives coding agents a reliable way to parse code structure directly, rather than trusting an LLM to hallucinate its own syntax understanding.
  mental_damage: We have officially reached the point where we need a dedicated server just to help the AI remember what a parenthesis looks like.
