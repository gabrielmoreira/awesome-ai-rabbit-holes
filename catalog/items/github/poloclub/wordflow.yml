insights:
  summary: Wordflow is a browser-based social AI writing assistant that lets users store, run, and share prompts across external LLMs and local models like Llama 2 and Phi 2.
  why_it_matters: It offers developers a lightweight, local-first interface for experimenting with prompt engineering, model selection, and community prompt discovery without vendor lock-in.
  mental_damage: Yet another playground to distract yourself with prompt templating when you should probably just be fixing the failing CI pipeline.
  tags:
    - prompt-engineering
    - local-ai
    - writing-assistant
    - llm-ui
  confidence: high
curation:
  status: excluded
  reason: The product is positioned as a general-purpose AI writing and prompt engineering tool for end users, not a developer-facing coding assistant or infrastructure.
  evidence:
    - Repo description and README describe it as a 'social and customizable AI writing assistant', not a coding tool.
    - Features focus on writing prompts, temperature tuning, and sharing prompts with a community, with no code editing, repo work, or developer workflow integration.
    - Appears in awesome-local-ai under 'Inference UI', which aligns with a consumer chat/ui tool rather than developer tooling.
