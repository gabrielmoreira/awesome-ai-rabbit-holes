insights:
  summary: Dorothy is a desktop app that orchestrates multiple AI coding agents (Claude Code, Codex, Gemini, Grok, local) via a unified UI with Kanban task management and scheduling.
  why_it_matters: It lets developers run and coordinate several AI coding assistants in parallel, overcoming the single-agent limit of terminal-based tools.
  mental_damage: Finally, a GUI for when you want to watch six AIs argue over who gets to fix your bug while you pretend to work.
