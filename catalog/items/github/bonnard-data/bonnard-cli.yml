insights:
  summary: An open-source CLI for defining an agent-native semantic analytics layer that generates skills for Claude Code, Cursor, and Codex, and exposes governed metrics via an MCP server.
  why_it_matters: It lets developers define one set of metric definitions and automatically equip multiple coding agents with the context and access they need to query data warehouses reliably.
  mental_damage: You set out to solve metrics drift, and accidentally invented yet another layer of YAML schema that your agents can now argue about.
