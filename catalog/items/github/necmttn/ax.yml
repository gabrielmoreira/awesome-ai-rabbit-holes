insights:
  summary: A local-first observability and memory layer that uses a typed graph to record and learn from agent sessions.
  why_it_matters: It prevents AI coding agents from repeating the same mistakes by turning session transcripts into structured, reviewable learning loops.
  mental_damage: Now you can finally quantify exactly how many tokens you've wasted on an agent that forgets it failed the same command five minutes ago.
