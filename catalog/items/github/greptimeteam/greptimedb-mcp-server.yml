insights:
  summary: An MCP server that enables AI assistants to query and analyze GreptimeDB using SQL, TQL, and RANGE queries.
  why_it_matters: It lets developers integrate GreptimeDB's observability data (metrics, logs, traces) directly into AI workflows via MCP, with built-in security features like read-only enforcement and data masking.
  mental_damage: Now your AI can ask your database why your logs are on fire, and the database will answer in SQL.
