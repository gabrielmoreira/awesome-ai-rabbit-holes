insights:
  summary: A command pack for Cursor IDE that provides spec-driven development workflows via slash commands like /specify, /plan, and /execute-parallel to turn ideas into structured specs, tasks, and code.
  why_it_matters: It forces a spec-first discipline directly inside Cursor, giving developers a structured planning and execution loop instead of relying on improvisational prompting.
  mental_damage: Now you can feel properly guilty about skipping the /specify phase while your subagents politely spawn child subagents to document exactly how little architecture you actually did.
  tags:
    - cursor
    - sdd
    - spec-driven
    - slash-commands
    - task-orchestration
  confidence: high
