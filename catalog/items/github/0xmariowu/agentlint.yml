insights:
  summary: A linter designed to validate and score the 'harness' (context files like CLAUDE.md and AGENTS.md) used by AI coding agents.
  why_it_matters: It helps developers ensure that the instructions and context they provide to agents like Claude Code and Cursor are actually effective rather than just adding noise.
  mental_damage: Because apparently, we've reached the stage where we need to lint the instructions we give to the things that are supposed to be following them.
  tags:
    - ai-agent
    - linter
    - context-engineering
    - claude-code
    - developer-tools
  confidence: high
curation:
  status: included
  reason: The core novelty is a prompt/context-shaping system that scores, lints, and repairs the instruction files and repo constraints that control agent behavior, fitting Prompt & Context Engineering.
  evidence:
    - Repo description and README state it is 'the linter for your agent harness' with 51+ checks on CLAUDE.md, AGENTS.md, CI, and .gitignore.
    - README explicitly frames the product around 'harness engineering' — improving what goes into the model via context files and repo constraints.
    - Active as of 2026-05-06, with a dedicated site (agentlint.app) and guides on writing good CLAUDE.md and related context files.
