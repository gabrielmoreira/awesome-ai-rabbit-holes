insights:
  summary: An MCP server that provides AI assistants with structured access to shadcn/ui v4 component source code, blocks, and metadata across React, Svelte, Vue, and React Native.
  why_it_matters: It allows coding agents to retrieve accurate, framework-specific shadcn/ui implementations and installation details directly from the context protocol, reducing hallucinated imports and outdated component patterns.
  mental_damage: We have now successfully abstracted the act of copying and pasting UI components into a protocol layer, ensuring your AI can confidently misuse shadcn/ui in four frameworks simultaneously.
