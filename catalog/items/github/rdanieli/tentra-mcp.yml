        surrounding_text: "- [rdanieli/tentra-mcp](https://github.com/rdanieli/tentra-mcp) [![rdanieli/tentra-mcp MCP server](https://glama.ai/mcp/servers/rdanieli/tentra-mcp/badges/score.svg)](https://glama.ai/mcp/servers/rdanieli/tentra-mcp) 📇 ☁️ 🏠 🍎 🪟 🐧 - AI-native architecture platform for engineering teams. Describe a system in natural language (e.g. \"payment service with Stripe, Kafka, PostgreSQL\") → get an interactive typed diagram with 167 cloud components → export to 14 production frameworks (Java Spring Boot, Python FastAPI, Go chi, Rust Axum, .NET, Kotlin Ktor, Ruby Rails, Elixir Phoenix, Docker Compose, Terraform, Mermaid, ADR, and more). Drift detection (`sync_architecture`) scores saved diagrams against live code 0–100 with a structured diff. 9 quality-lint rules catch orphans, SPOFs, god services. Also includes a secondary persistent code-graph layer for AI coding agents (free offline via `npx tentra-mcp --local init`). Agent-as-LLM pattern — zero LLM cost on our side, zero API key on yours. 35 MCP tools. Works in Cursor, Claude Code, Codex, Windsurf."
