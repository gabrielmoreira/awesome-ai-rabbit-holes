insights:
  summary: An MCP server that provides AI agents with deterministic unit conversion capabilities using the GNU units database.
  why_it_matters: It solves the hallucination problem in LLM math by providing a reliable, offline, and dimension-aware tool for complex unit conversions.
  mental_damage: Because apparently, we can no longer trust an LLM to know how many feet are in an acre without a dedicated middleware layer.
