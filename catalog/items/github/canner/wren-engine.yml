insights:
  summary: An archived open-source semantic context engine for AI agents that models business definitions, metrics, and relationships to provide governed data context across 15+ data sources, built on Rust and Apache DataFusion.
  why_it_matters: It gives developers a way to stop feeding raw SQL tables to agents and instead model trusted business logic, metrics, and governance so data agents can reason over shared company context.
  mental_damage: Yet another reminder that your agents do not actually understand what 'net revenue' means, and fixing that now requires learning a semantic layer, MDL, and an archived engine merged into a larger repo.
