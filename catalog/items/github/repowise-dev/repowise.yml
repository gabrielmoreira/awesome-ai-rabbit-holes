insights:
  summary: An MCP-compatible CLI tool that indexes codebases into dependency graphs, git analytics, auto-generated docs, and architectural decisions to reduce token usage for AI agents.
  why_it_matters: It allows coding agents like Claude Code to answer 'why' questions about architecture and history without reading entire files, cutting costs and context window bloat.
  mental_damage: We have successfully optimized the part of the workflow where the AI reads our code, now we just need a tool to optimize the part where we pretend to understand why we wrote it that way three years ago.
  tags:
    - mcp
    - context-engineering
    - token-efficiency
    - codebase-intelligence
    - git-analytics
  confidence: high
curation:
  status: included
  reason: The core novelty is indexing, compressing, and retrieving institutional knowledge (graph, git history, decisions) to feed the right context to a model, which aligns with Prompt & Context Engineering.
  evidence:
    - Repo description defines it as 'Codebase intelligence... via MCP' with layers for graph, git, docs, and decisions.
    - README explicitly claims '27× fewer tokens per query' and '209× less than naive' via context retrieval strategies like get_context.
    - Exposes seven MCP tools primarily for retrieval and context-shaping rather than acting as the primary coding agent.
