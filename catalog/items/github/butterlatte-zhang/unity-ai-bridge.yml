insights:
  summary: An MCP server and Unity package that lets AI coding assistants remotely control the Unity Editor, providing 65 tools for scene management, profiling, and light probe configuration via file-based IPC.
  why_it_matters: It closes the gap between AI coding agents and game development workflows by giving assistants direct, tool-based access to the Unity Editor instead of just file system I/O.
  mental_damage: We have finally reached the point where the AI needs a dedicated bridge to micromanage your light probes because apparently watching paint dry in the Unity Editor wasn't tedious enough for a human.
