insights:
  summary: A file-based IPC bridge that enables AI IDEs to remotely control the Unity Editor with 65 tools across 15 categories.
  why_it_matters: It gives AI coding assistants full access to Unity Editor workflows (scene management, profiling, light probes, etc.) without requiring open ports or external dependencies.
  mental_damage: Finally, your AI can stop pretending to understand Unity scenes by reading JSON files and start actually manipulating them.
  tags:
    - unity
    - mcp-server
    - game-dev
    - editor-integration
    - ai-ide
  confidence: high
