insights:
  summary: An open-source, local-first proxy server and desktop app that federates hundreds of MCP servers behind a single endpoint with tool retrieval, token compression, and security quarantine.
  why_it_matters: It lets developers bypass strict tool-count limits in Cursor and OpenAI by dynamically discovering and loading only the relevant MCP tools, dramatically cutting token usage.
  mental_damage: We have successfully abstracted the problem of too many tools into a tool that manages your tools, because obviously the next logical step was a proxy for the proxies.
  tags:
    - mcp
    - proxy
    - context-window
    - security
    - local-first
  confidence: high
