insights:
  summary: An MCP server that lets AI agents search and retrieve agent instruction files from the AgentBase registry of system prompts, skills, and workflows.
  why_it_matters: Developers can equip MCP-compatible agents with runtime access to a shared library of domain-specific instructions, safety filters, and reusable workflows without hardcoding them.
