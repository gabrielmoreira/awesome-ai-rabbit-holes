insights:
  summary: A minimal Model Context Protocol server and client that lets Azure OpenAI or OpenAI models control a web browser via Playwright tools exposed through MCP.
  why_it_matters: Developers can wire LLMs into IDEs like VS Code or Claude Code and have them reliably navigate and interact with web pages through a standardized MCP interface.
  mental_damage: We have successfully reached the point where your AI needs its own browser, its own protocol, and a bridge, just to click a button on a login page.
