  summary: A minimal Model Context Protocol (MCP) server and client that enables web browser control via Playwright with Azure OpenAI and OpenAI integration.
  why_it_matters: It lets developers expose browser automation as MCP tools for AI assistants, bridging Playwright's capabilities with MCP-compatible clients like Claude Code or VS Code.
  mental_damage: Because nothing says 'modern development' like teaching your AI assistant to click buttons on your behalf.
