insights:
  summary: A zero-dependency, local-first MCP server written in Go that provides persistent, searchable memory and context management for AI coding agents like Claude Code.
  why_it_matters: It allows AI agents to maintain state across sessions by storing decisions and progress locally in a project's directory, eliminating the need to re-explain context after every restart.
  mental_damage: We have successfully solved the problem of AI amnesia by adding a single binary that requires its own init process, turning our `.gitignore` into a graveyard of memory files.
  tags:
    - mcp
    - memory
    - local-first
    - go
    - context
  confidence: high
