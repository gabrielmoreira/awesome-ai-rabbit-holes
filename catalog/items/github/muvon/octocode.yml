insights:
  summary: A Rust-based MCP server that builds a knowledge graph from a codebase using tree-sitter AST parsing to provide semantic search and structural context to AI agents.
  why_it_matters: It allows AI assistants like Claude and Cursor to navigate actual code dependencies and relationships rather than treating the repository as flat text chunks.
  mental_damage: We have successfully built a graph of why our code is broken, now we just need an agent smart enough to ignore the graph and commit the bug anyway.
