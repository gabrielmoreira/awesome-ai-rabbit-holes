insights:
  summary: A Rust-based MCP server that builds a knowledge graph and semantic search index of a codebase using tree-sitter AST parsing to give AI assistants structural context.
  why_it_matters: It replaces flat text chunking with navigable code relationships so agents can answer dependency and architecture questions instead of guessing by keyword similarity.
  mental_damage: We have successfully built a tool that lets your AI assistant pretend it understands your monorepo, which means you can now argue with it about import graphs instead of just arguing about syntax.
  tags:
    - mcp
    - semantic-search
    - knowledge-graph
    - rag
    - code-navigation
  confidence: high
