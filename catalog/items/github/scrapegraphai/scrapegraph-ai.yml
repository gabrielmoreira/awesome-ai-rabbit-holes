insights:
  summary: A Python library that uses LLMs and graph logic to build scraping pipelines for websites and local documents based on natural language extraction instructions.
  why_it_matters: It lets developers define what data to extract from complex web sources using plain English instead of maintaining brittle CSS selectors or XPath queries.
  mental_damage: We have successfully abstracted away the only part of web scraping that required actual skill, leaving us with 24,000 stars and no excuse for not harvesting the entire internet.
