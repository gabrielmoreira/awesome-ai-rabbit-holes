insights:
  summary: >-
    AgentTrace is a local-first terminal TUI and report generator that analyzes session logs from AI coding agents to
    track cost, tokens, time, tool failures, and performance.
  why_it_matters: >-
    It gives developers visibility into AI agent spend and latency so they can optimize usage and diagnose slow or
    expensive runs without relying on external observability.
  mental_damage: >-
    Finally, a tool to quantify the guilt of letting your AI coding agent loop on a typo for 47 minutes while burning
    through your token budget.
  tags:
    - observability
    - tui
    - ai-agents
    - cost-tracking
    - local-first
  confidence: high
