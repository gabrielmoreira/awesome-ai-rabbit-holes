insights:
  summary: AgentTrace is a local-first terminal TUI and report generator that analyzes session logs from AI coding agents to track cost, tokens, time, tool failures, and performance.
  why_it_matters: It gives developers visibility into AI agent spend and latency so they can optimize usage and diagnose slow or expensive runs without relying on external observability.
  mental_damage: Finally, a tool to quantify the guilt of letting your AI coding agent loop on a typo for 47 minutes while burning through your token budget.
  tags:
    - observability
    - tui
    - ai-agents
    - cost-tracking
    - local-first
  confidence: high
curation:
  status: included
  reason: AgentTrace is not a coding agent itself but a local observability tool that augments existing AI coding agents by analyzing their logs, making it an extension focused on host integration and workflow insight rather than primary coding assistance.
  evidence:
    - "Repo description: 'Local-first TUI for AI coding-agent session history: trace cost, tokens, time, tool failures, latency, health, diffs, reports, and CI gates across local agent logs.'"
    - "README: 'agenttrace reads the logs your agents already write and puts cost-heavy or slow sessions first' and supports logs from Claude Code, Codex CLI, Gemini CLI, Aider, Cursor, etc."
    - It does not edit code, plan changes, or run commands — it only analyzes existing agent session traces for cost, performance, and health metrics.
