insights:
  summary: A deterministic control plane for coordinating multi-agent software development via isolated Git worktrees and mechanical validation gates.
  why_it_matters: It replaces an agent's self-certified 'I am done' with verifiable execution facts and mechanical proof of completion before integration.
  mental_damage: Because we have officially reached the era where an LLM's verbal confirmation of success must be treated as a suspicious legal claim.
  tags:
    - multi-agent
    - control-plane
