insights:
  summary: An unofficial MCP server that exposes the Xendit payment API (invoices, disbursements, balances, transactions) to AI coding assistants like Claude Code and Cursor.
  why_it_matters: It lets developers manage payment operations across Southeast Asia directly through natural language prompts in their AI-assisted workflows.
  mental_damage: We have finally reached the point where an LLM can drain your production bank account in Indonesian if you forget to set XENDIT_ALLOW_LIVE=false.
