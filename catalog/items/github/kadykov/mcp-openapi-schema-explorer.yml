  summary: An MCP server that exposes OpenAPI and Swagger specifications through parameterized resource templates, allowing AI clients to query specific API details without loading entire specs into context windows.
  why_it_matters: Developers using AI coding assistants can now explore and understand large API specifications on-demand without blowing through token limits or context windows.
  mental_damage: We have finally built infrastructure to let AI efficiently read the same API docs that humans have been heroically ignoring since 2010.
