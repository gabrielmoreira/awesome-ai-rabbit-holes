insights:
  summary: A Model Context Protocol (MCP) server and QGIS plugin that allows LLMs like Claude to directly control QGIS for project management, layer manipulation, and code execution.
  why_it_matters: It turns QGIS into a programmable environment where geospatial workflows can be prototyped and executed through natural language prompts rather than manual GUI interaction.
  mental_damage: Finally, you can ask an LLM to execute arbitrary Python code in your GIS software, because the 'select by expression' dialog simply wasn't enough of a footgun.
  tags:
    - mcp
    - qgis
    - gis
    - geospatial
    - plugin
  confidence: high
