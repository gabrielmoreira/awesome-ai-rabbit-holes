  summary: An MCP server that enables Claude AI to interact with and control Jupyter Notebook (v6.x) via WebSocket-based integration.
  why_it_matters: Developers can now delegate notebook cell manipulation, execution, and output retrieval to Claude AI, turning Jupyter into an AI-assisted data analysis environment.
  mental_damage: Finally, a way to make Jupyter Notebook feel like it was designed for AI collaboration instead of just being a glorified Python scratchpad.
