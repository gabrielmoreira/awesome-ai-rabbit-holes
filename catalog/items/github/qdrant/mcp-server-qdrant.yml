insights:
  summary: An official MCP server implementation that exposes Qdrant vector search as a semantic memory store for LLM applications like Claude and Cursor.
  why_it_matters: It gives coding assistants a standardized way to persist and retrieve long-term semantic memories without bespoke vector-database glue code.
  mental_damage: You can now reliably offload your project context into a vector database, right next to your own rapidly degrading short-term memory.
  tags:
    - mcp
    - vector-search
    - semantic-memory
    - qdrant
    - context
  confidence: high
