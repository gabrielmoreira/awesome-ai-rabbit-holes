insights:
  summary: An MCP server that maps free-text clinical terminology to standardized OMOP Common Data Model concepts using LLMs and the OMOPHub vocabulary API.
  why_it_matters: It gives clinical developers a plug-and-play MCP interface to standardize medical terms directly inside their existing AI coding assistants.
  mental_damage: Now your LLM can bill your hospital for miscoding 'temperature temporal scanner' into an OMOP concept while you debug the MCP config file.
