insights:
  summary: An open-source orchestrator that chains multiple AI coding agents into supervised, multi-step workflows.
  why_it_matters: It allows developers to coordinate different models and assistants like Claude Code or Aider into a single, repeatable procedure with manual approval gates.
  mental_damage: Now you can manage a complex hierarchy of autonomous agents just to decide whether you actually trust the diff they produced.
