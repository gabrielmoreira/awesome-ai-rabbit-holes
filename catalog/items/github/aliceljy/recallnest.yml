insights:
  summary: Local-first shared memory layer for Claude Code, Codex, and Gemini CLI that uses hybrid retrieval (vector + BM25 + knowledge graph) and session continuity to preserve context across terminals.
  why_it_matters: It ends the context amnesia of switching between terminal agents by giving Claude Code, Codex, and Gemini CLI a single, self-hosted LanceDB memory store with automatic recall, decay, and cross-session continuity.
  mental_damage: It is somewhat sobering that we now need a LanceDB knowledge graph with configurable decay algorithms just so three different terminal agents can both remember that the user prefers dark mode.
  tags:
    - memory-layer
    - hybrid-retrieval
    - claude-code
    - local-first
    - knowledge-graph
  confidence: medium
curation:
  status: included
  reason: Its entire substance is a developer-facing memory and retrieval system for coding agents, with hybrid search, knowledge graphs, and session continuity as the core value rather than a thin integration wrapper.
  evidence:
    - Repo description and README position it as a 'Shared Memory Layer' with hybrid retrieval (vector + BM25 + KG) and LanceDB backing.
    - It integrates with Claude Code, Codex, and Gemini CLI via MCP, but the core product is the memory store, retrieval pipeline, and knowledge-graph UI.
    - 13 stars and created March 2026, but actively maintained through May 2026 with MIT license, benchmarked evaluation, and inclusion in awesome-mcp-servers under Knowledge & Memory.
