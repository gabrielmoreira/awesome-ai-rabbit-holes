insights:
  summary: A local-first memory layer that enables shared context across MCP-compatible AI clients using LanceDB.
  why_it_matters: >-
    It allows different coding agents and terminal tools to access a unified, persistent knowledge base, preventing
    context loss when switching between different AI sessions.
  mental_damage: >-
