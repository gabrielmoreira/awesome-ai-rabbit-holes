  why_it_matters: It allows agents to move beyond simple chat by giving them a full GUI, terminal, and browser with DOM annotation to interact with real software.
  mental_damage: There is nothing quite like the existential dread of watching an autonomous agent struggle to click a button in a virtual XFCE desktop.
