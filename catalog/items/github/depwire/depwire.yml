insights:
  summary: A deterministic dependency graph builder for AI-assisted refactoring that provides exact symbol-level code analysis across multiple languages.
  why_it_matters: It solves the blind spot of AI coding assistants by mapping exact dependencies before changes are made, preventing broken builds from uninformed edits.
  mental_damage: Finally, an AI tool that knows more about your codebase than you do—without hallucinating.
