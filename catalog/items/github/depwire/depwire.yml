insights:
  summary: Depwire builds a deterministic, tree-sitter-powered dependency graph across 12+ languages and exposes it via 17 MCP tools so coding assistants can simulate changes and assess blast radius before editing code.
  why_it_matters: It replaces probabilistic RAG guesses with compiler-grade symbol tracking, letting AI agents know exactly what will break before they delete that one innocent-looking utility file.
  mental_damage: We have finally built infrastructure to stop the AI from confidently deleting the one function that silently powers 30 downstream files, though we still haven't solved the part where we let it delete things in the first place.
  tags:
    - mcp
    - context-engineering
    - dependency-graph
    - cli
    - tree-sitter
  confidence: high
curation:
  status: included
  reason: The core novelty is a deterministic context and retrieval system that maps symbol-level dependencies to improve what AI assistants know about a codebase, served through MCP as a context layer rather than acting as the primary assistant.
  evidence:
    - Repo description explicitly calls it 'The missing context layer for AI-assisted refactoring'.
    - README states Depwire 'is the context and safety layer for AI-generated code' and serves pre-computed graph data via 17 MCP tools.
    - Built on tree-sitter for deterministic symbol-level parsing across 12 languages, not embeddings or probabilistic RAG.
