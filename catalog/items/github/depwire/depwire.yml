insights:
  summary: A local CLI and MCP server that builds deterministic, tree-sitter-powered dependency graphs to let AI coding assistants safely analyze blast radius and architectural impact before making changes.
  why_it_matters: It gives AI assistants compiler-level precision on symbol-level dependencies, preventing the classic 'delete one file, break thirty downstream consumers' scenario that plagues current AI refactoring workflows.
  mental_damage: We have finally solved the problem of AI confidently deleting code it doesn't understand by adding an infrastructure layer that understands the code it doesn't understand.
  tags:
    - mcp
    - dependency-graph
    - refactoring
    - context-engineering
    - cli
  confidence: high
curation:
  status: included
  reason: The product is primarily an MCP server (with 17 tools) and CLI that serves deterministic dependency graph context to AI assistants, making it a clear fit for the MCP category rather than a primary coding agent itself.
  evidence:
    - Repo description explicitly states it is 'The missing context layer for AI-assisted refactoring' and topics include 'mcp' and 'model-context-protocl'.
    - README states Depwire 'serves it to your AI through 17 MCP tools' and is listed in awesome-mcp-servers under Server Implementations.
    - Architecture diagram and README position it as infrastructure sitting 'between your AI and your codebase', not as the assistant itself.
