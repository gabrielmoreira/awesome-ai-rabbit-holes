insights:
  summary: A programming language purpose-built for AI agents where programs are JSON ASTs, validated by a type/effect system and Z3 contracts, then compiled to WASM via an MCP server interface.
  why_it_matters: It removes parsers and syntax ambiguity so agents can generate, verify, and safely execute code through structured error loops and sandboxing.
  mental_damage: We have finally achieved the future where the only person who can read the source code is the large language model that wrote it.
  tags:
    - ai-agents
    - programming-language
    - mcp
    - wasm
    - formal-verification
  confidence: high
curation:
  status: included
  reason: The project is a code-first language, compiler, and SDK that developers integrate and script against to let agents write verified, sandboxed programs, fitting Agent Frameworks rather than an orchestration platform or MCP tool.
  evidence:
    - Repo description explicitly calls it 'A programming language designed for AI agents' with JSON ASTs and WASM compilation.
    - README shows developers import browser bundles, run an npm MCP server, and invoke compiler phases as tools in their own agent stacks.
    - The product exposes a schema and compiler pipeline as building blocks rather than operating as a multi-agent control plane.
