insights:
  summary: A deterministic linter and MCP server for detecting AI-generated prose patterns and enforcing specific writing styles.
  why_it_matters: It allows developers to automate the detection of 'AI slop' in technical documentation and maintain a consistent human-like voice through CI and editor integrations.
  mental_damage: Because nothing says 'professionalism' like a deterministic linter telling you your paragraph length is too uniform.
  tags:
    - ai-tells
    - mcp
