insights:
  summary: An MCP server that wraps web-retrieved data in timestamped freshness envelopes to help AI agents distinguish current information from stale results.
  why_it_matters: It gives coding agents access to market, repo, and news data with embedded age and confidence signals, reducing the risk of acting on outdated information.
  mental_damage: We are now versioning reality itself so the agent stops confidently applying to jobs that closed two years ago.
