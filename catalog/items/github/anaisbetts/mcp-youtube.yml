insights:
  summary: A Model Context Protocol server that uses yt-dlp to download YouTube subtitles and feed them to AI assistants like Claude.
  why_it_matters: It allows developers to pipe video transcripts directly into their AI workflow without leaving the context window, enabling quick summarization or Q&A on video content.
  mental_damage: We have successfully automated the process of watching a video, meaning you can now procrastinate on learning by delegating the watching to a bot that summarizes the very thing you were supposed to watch.
