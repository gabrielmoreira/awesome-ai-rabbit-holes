insights:
  summary: An MCP server that uses yt-dlp to fetch YouTube subtitles for use in Model Context Protocol-compatible assistants.
  why_it_matters: It enables LLMs to ingest and reason over YouTube video content by providing subtitles as structured context.
  mental_damage: Because nothing says 'cutting-edge developer workflow' like piping subtitle streams into a chat box to avoid actually watching a video.
