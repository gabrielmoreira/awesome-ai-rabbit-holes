insights:
  summary: CLI and SaaS dashboard that scans live NoSQL databases to extract schema, security rules, and architecture into structured context files for AI coding agents.
  why_it_matters: Prevents AI agents from hallucinating database schemas and writing unsafe or expensive queries by feeding them ground-truth live context instead of stale docs.
  mental_damage: Because your AI agent now needs a dedicated CLI to generate a folder of markdown flashcards about your database schema, and apparently 'reading the docs' was too much to ask of a trillion-parameter model.
  tags:
    - database-context
    - schema-retrieval
    - ai-agents
    - mcp
    - nosql
  confidence: medium
curation:
  status: included
  reason: The core product is a retrieval and context-shaping layer for live database schemas; the MCP server and editor drops are secondary delivery mechanisms, not the primary identity.
  evidence:
    - README positions the tool as 'Ground Truth for AI Coding Agents' and centers on exporting a /lintbase-context/ folder with structured markdown (database-schema.md, security-rules.md, etc.) for AI context windows.
    - Repo description and CLI commands focus on scanning live Firestore/MongoDB instances and generating snapshots/drift checks, not on acting as an IDE extension or MCP-first product.
    - Appears in awesome-mcp-servers only for its adapter package (lintbase-mcp), but the main repo identity is a standalone CLI/SaaS context exporter.
