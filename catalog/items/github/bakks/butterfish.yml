insights:
  summary: Butterfish is a CLI shell wrapper that integrates OpenAI directly into bash and zsh, allowing developers to prompt the model using shell history as context.
  why_it_matters: It streamlines the developer workflow by removing the copy-paste loop between the terminal and a browser-based chat interface for debugging and command generation.
  mental_damage: We have officially reached the point where even our terminal emulators are gaslighting us with capital letters to get a word in edgewise.
