          that shows the blind spots of each prompt you submit: what the request would have needed to consider and shows
          no sign of. Jev decides, in one call per prompt, whether the prompt is worth a second look; only then does the
          agent's own headless mode read the project and return the items. Nothing blocks the prompt, nothing is added
          to the session.
        confidence: high
