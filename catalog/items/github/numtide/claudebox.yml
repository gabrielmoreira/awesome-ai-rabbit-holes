insights:
  summary: >-
    A lightweight sandbox wrapper for Claude Code that uses bubblewrap or sandbox-exec to isolate the agent from the
    host system while allowing selective access to credentials.
  why_it_matters: >-
    It lets developers run Claude Code with --dangerously-skip-permissions inside a controlled sandbox, reducing the
    risk of unwanted file system or environment surprises.
  mental_damage: >-
    We have reached the point where the safest way to use an AI coding agent is to nuke its home directory permissions
    and pray the sandbox holds.
