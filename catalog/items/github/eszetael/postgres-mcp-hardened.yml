        surrounding_text: "- [Eszetael/postgres-mcp-hardened](https://github.com/Eszetael/postgres-mcp-hardened) [![Eszetael/postgres-mcp-hardened MCP server](https://glama.ai/mcp/servers/Eszetael/postgres-mcp-hardened/badges/score.svg)](https://glama.ai/mcp/servers/Eszetael/postgres-mcp-hardened) 🦀 🏠 ☁️ 🍎 🪟 🐧 - Maintained Rust replacement for the archived `@modelcontextprotocol/server-postgres`. Writes are refused twice: sqlparser AST validation rejects mutating statements before execution, and the session runs `default_transaction_read_only` with a per-session `statement_timeout` — so the read-only transaction is the fallback, not the only defence. Single self-contained binary, stdio and Streamable HTTP, schema inspection, column redaction that survives renames and casts, an EXPLAIN cost guard, a hash-chained audit log with `--verify-audit`, optional OAuth 2.1 RS256, distroless image, signed releases for five platforms. MIT."
