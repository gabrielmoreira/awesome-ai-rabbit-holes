insights:
  summary: A secure, read-only PostgreSQL MCP server implemented in Rust that features defense-in-depth SQL validation and audit logging.
  why_it_matters: It provides a hardened way to expose database capabilities to AI agents without the risk of prompt-injected writes or unauthorized schema access.
  mental_damage: Because 'read-only' is just a suggestion until a sufficiently clever LLM finds a way to bypass your transaction isolation.
