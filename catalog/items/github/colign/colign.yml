insights:
  summary: An open-source platform for collaborative spec writing and team alignment before handing implementation to AI coding agents.
  why_it_matters: It targets the upstream bottleneck where teams fail to agree on what to build before AI generates code, making structured specs the controlling artifact.
  mental_damage: We automated code generation only to discover the real bottleneck was getting humans to agree on acceptance criteria, so now there is a kanban board for that.
  tags:
    - spec-driven-development
    - ai-collaboration
    - team-alignment
    - mcp
    - spec-writing
  confidence: medium
curation:
  status: included
  reason: The product is explicitly built around a spec-first workflow where structured proposals and project memory drive AI implementation, fitting the spec-driven-development category precisely.
  evidence:
