insights:
  summary: A zero-configuration MCP server that allows developers to delegate tasks from a primary IDE AI assistant to multiple specialized sub-agents like Codex, Claude, Cursor, and Gemini in parallel.
  why_it_matters: It enables a multi-model workflow directly inside the IDE, allowing developers to leverage the specific strengths of different AI models (e.g., Gemini's context window, Claude's reasoning) without manual context switching or copy-pasting.
  mental_damage: We have successfully built infrastructure to manage the cognitive load of managing the infrastructure that manages the AI assistants that are managing our code.
