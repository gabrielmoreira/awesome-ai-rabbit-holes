insights:
  summary: >-
    An MCP server that provides read-only access to Monzo banking accounts, balances, pots, and transaction history with
    OAuth handling and local SQLite caching for use with Claude Code and other MCP clients.
  why_it_matters: >-
    Developers can query their own financial data conversationally and run spending analysis through their coding
    assistant without handling raw bearer tokens or 90-day SCA limitations.
  mental_damage: >-
