insights:
  summary: An MCP server that connects Claude Code and other MCP clients to the Monzo banking API with OAuth, automatic token refresh, and a local SQLite transaction cache.
  why_it_matters: Developers can query accounts, balances, and perform spending analysis directly from their coding agent without leaving the IDE or manually handling Monzo's short-lived bearer tokens.
