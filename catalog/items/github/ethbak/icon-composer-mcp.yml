insights:
  summary: An MCP server and CLI tool for creating Apple-style.icon bundles and images with Liquid Glass effects.
  why_it_matters: It allows AI agents to programmatically generate and manipulate complex macOS/iOS icon assets that previously required manual work in Xcode or Icon Composer.
  mental_damage: Because apparently, your LLM's next logical step is mastering the nuances of specular highlights and translucency for Apple's iOS 26 icon spec.
