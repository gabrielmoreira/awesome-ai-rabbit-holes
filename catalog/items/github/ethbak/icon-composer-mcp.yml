insights:
  summary: An MCP server and CLI tool for programmatically creating and manipulating Apple .icon bundles with Liquid Glass rendering effects for iOS 26+ app icons.
  why_it_matters: It lets AI agents and developers automate Apple icon creation with proper Liquid Glass effects directly from the command line or through MCP-compatible editors like Cursor and Claude Code.
  mental_damage: We have successfully abstracted away the last remaining tactile joy of dragging glyphs into Xcode, replacing it with 12 MCP tools and a Node.js wrapper around a beta Apple cask.
  tags:
    - mcp
    - apple
    - icons
    - cli
    - liquid-glass
  confidence: high
