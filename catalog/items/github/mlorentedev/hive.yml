insights:
  summary: Hive is an MCP server that connects AI coding assistants to an Obsidian vault, enabling on-demand retrieval of project context and lessons learned instead of static context loading.
  why_it_matters: It solves the session-amnesia problem for AI assistants by letting them query a persistent knowledge base only when needed, drastically reducing token usage while retaining long-term project memory.
  mental_damage: We have officially reached the point where the AI needs its own second brain, managed in Markdown, just to remember what we were doing before the context window refreshed.
