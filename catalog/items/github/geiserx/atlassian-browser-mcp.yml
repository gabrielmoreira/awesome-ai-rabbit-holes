insights:
  summary: A Model Context Protocol server that wraps mcp-atlassian to enable Jira and Confluence access via Playwright browser-cookie authentication for SSO-protected Server and Data Center instances.
  why_it_matters: It allows developers to integrate AI coding assistants with on-premise Atlassian instances that sit behind corporate SSO walls where standard API tokens are unavailable.
  mental_damage: Solving the classic 'my AI can't read my Jira because Legal mandated Okta and SAML' problem by automating a browser session that you still have to manually log into.
  tags:
    - mcp
    - atlassian
    - sso
    - playwright
    - developer-tools
  confidence: high
