insights:
  summary: An MCP server that uses Playwright to provide browser-based SSO authentication for the mcp-atlassian toolset.
  why_it_matters: It enables AI agents to access Jira and Confluence instances protected by corporate SSO (Okta, SAML) where standard API tokens are unavailable.
  mental_damage: "Finally, a way to let your LLM solve the most complex engineering challenge of 2026: successfully navigating a corporate SSO redirect."
