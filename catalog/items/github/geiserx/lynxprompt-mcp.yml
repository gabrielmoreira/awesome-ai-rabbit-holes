insights:
  summary: An MCP server that exposes a LynxPrompt instance so LLMs can browse, search, and manage AI configuration blueprints like AGENTS.md and CLAUDE.md via JSON-RPC or stdio.
  why_it_matters: It lets coding agents directly read and update the prompt blueprints and rule hierarchies that shape their own behavior, turning config management into a programmable workflow.
  mental_damage: We have successfully reached the point where our agents now need dedicated servers just to argue with and reorganize their own instruction manuals.
