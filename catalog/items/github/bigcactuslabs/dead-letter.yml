insights:
  summary: >-
    dead-letter converts .eml email exports to Markdown with YAML front matter for local email archiving and LLM-ready
    ingestion.
  why_it_matters: >-
    It lets developers turn noisy email exports into clean, structured Markdown for use in RAG, knowledge bases, or
    agent workflows without raw MIME overhead.
  mental_damage: >-
