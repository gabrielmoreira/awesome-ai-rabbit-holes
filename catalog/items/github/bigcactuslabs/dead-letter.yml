insights:
  summary: A CLI tool and MCP server that converts.eml email exports into Markdown with YAML front matter.
  why_it_matters: It cleanses noisy, multipart MIME email data into structured Markdown, reducing token overhead and simplifying ingestion into RAG pipelines or LLM contexts.
  mental_damage: Because even our digital paper trails need to be distilled into token-efficient markdown before an LLM can make sense of our inbox chaos.
