insights:
  summary: A Model Context Protocol server that lets AI assistants execute KQL queries, inspect schemas, and analyze data inside Azure Data Explorer and Microsoft Fabric clusters.
  why_it_matters: Developers can give coding agents direct, structured access to ADX databases for data exploration and diagnostics without leaving their assistant workflow.
  mental_damage: Your AI assistant can now run arbitrary KQL queries against production telemetry, so you no longer have to pretend you know how to write them yourself.
