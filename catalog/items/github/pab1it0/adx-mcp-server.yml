  summary: A Model Context Protocol server that lets AI assistants query and explore Azure Data Explorer databases using KQL through standardized interfaces.
  why_it_matters: It gives coding agents and MCP clients direct, structured access to ADX clusters, turning data exploration and KQL troubleshooting into a conversational workflow instead of a context-switching marathon.
  mental_damage: We have successfully abstracted SQL-with-brackets so far away that you now need a protocol server just to ask an AI why your telemetry table is empty.
