insights:
  summary: >-
    An experimental multi-agent system that spins up multiple collaborating GPT-4 'expertGPTs' with individual short and
    long-term memory to complete tasks, built as a Python CLI project in 2023.
  why_it_matters: >-
    It offers an early reference implementation for developers curious about memory-backed multi-agent collaboration
    patterns using GPT-4 and vector stores like Pinecone or Milvus.
  mental_damage: >-
    Watching multiple expertGPTs politely defer to each other while burning through an API quota is the kind of
    autonomous teamwork demo that makes you grateful humans still write the PRs.
