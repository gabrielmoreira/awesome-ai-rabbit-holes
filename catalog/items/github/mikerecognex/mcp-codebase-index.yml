insights:
  summary: An MCP server that indexes codebases by parsing structural metadata (functions, classes, imports, dependency graphs) and exposes 17 query tools to AI clients for efficient code navigation with claimed 87% token reduction.
  why_it_matters: It lets coding agents like Claude Code navigate and understand large codebases through targeted queries instead of expensive full-file reads, with automatic incremental re-indexing via git diff detection.
  mental_damage: We have reached the point where we need a dedicated server to remind the AI that the function it wrote thirty seconds ago actually exists in the file it just indexed.
