insights:
  summary: A structural codebase indexer and MCP server that parses source files into metadata and exposes 17 query tools for functions, classes, imports, and dependency graphs with incremental re-indexing.
  why_it_matters: It lets MCP clients like Claude Code navigate large codebases through targeted structural queries instead of brute-forcing entire files, claiming up to 87% token reduction.
  mental_damage: We have successfully invented a tool to help our AI assistants pretend they understand the codebase without the existential cost of actually reading it.
  tags:
    - mcp
    - codebase-indexer
    - context-engineering
    - token-reduction
  confidence: high
