insights:
  summary: MCPR is an R package that runs an MCP server inside a live R session, allowing AI agents to execute code, create plots, and inspect workspace state interactively rather than through stateless Rscript calls.
  why_it_matters: It lets data-science workflows preserve session state across multi-step analysis, so agents can build on earlier computations without re-running entire scripts.
  mental_damage: Finally, your AI agent can share in the existential weight of a multi-hour R session instead of naively re-running your entire modeling pipeline because it forgot the workspace existed.
  tags:
    - r
    - mcp
    - data-science
    - stateful
    - interactive-sessions
  confidence: high
