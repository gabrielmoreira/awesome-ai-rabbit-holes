insights:
  summary: Cody is a local, terminal-based AI coding assistant that indexes your codebase using vector embeddings to support interactive Q&A and natural language querying.
  why_it_matters: It lets developers query and navigate a live, changing codebase using OpenAI models without leaving the terminal or setting up a full IDE plugin.
  mental_damage: Yet another local CLI assistant promising to finally make your repo searchable, provided you are comfortable pasting your OpenAI API key into a .env and ignoring your virtual environment by hand.
