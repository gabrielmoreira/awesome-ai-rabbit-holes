insights:
  summary: A high-performance code intelligence engine that indexes repositories into persistent knowledge graphs using Tree-Sitter AST analysis.
  why_it_matters: It drastically reduces token consumption and latency for AI agents by replacing linear file-by-file searches with millisecond-level structural queries.
  mental_damage: The relief of 120x fewer tokens is almost eclipsed by the anxiety of seeing the Linux kernel indexed in three minutes on your local machine.
