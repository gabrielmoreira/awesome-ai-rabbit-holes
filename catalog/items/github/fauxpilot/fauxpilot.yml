  status: included
  reason: It is a local serving stack designed to run on developer hardware, fitting the 'Local AI' category better than a 'Coding Agent' because it is the backend infrastructure, not the editor-side assistant.
  evidence:
    - Repo description explicitly states it is an 'open-source alternative to GitHub Copilot server'.
    - README specifies it uses NVIDIA Triton Inference Server and requires local NVIDIA GPUs with sufficient VRAM.
    - Client configuration supports OpenAI API and Copilot Plugin standards to connect local models to editors.
