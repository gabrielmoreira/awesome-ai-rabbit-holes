insights:
  summary: FauxPilot is a self-hosted inference server that runs local code generation models (like Salesforce CodeGen) behind an API compatible with GitHub Copilot clients.
  why_it_matters: It allows developers to run AI code completion locally using their own hardware, offering a privacy-focused alternative to cloud-hosted Copilot without sending code to external servers.
  mental_damage: Trade your proprietary SaaS subscription for the privilege of debugging Docker containers, CUDA versions, and VRAM constraints just to get the same autocomplete suggestions.
  tags:
    - local-ai
    - self-hosted
    - codegen
    - copilot-alternative
    - nvidia
  confidence: high
curation:
  status: included
  reason: It is a local serving stack designed to run on developer hardware, fitting the 'Local AI' category better than a 'Coding Agent' because it is the backend infrastructure, not the editor-side assistant.
  evidence:
    - Repo description explicitly states it is an 'open-source alternative to GitHub Copilot server'.
    - README specifies it uses NVIDIA Triton Inference Server and requires local NVIDIA GPUs with sufficient VRAM.
    - Client configuration supports OpenAI API and Copilot Plugin standards to connect local models to editors.
