insights:
  summary: AgentFlow is a modular, trainable agentic framework that optimizes a Planner, Executor, Verifier, and Generator with Flow-GRPO for long-horizon reasoning and tool use.
  why_it_matters: It gives developers a code-first way to build and train multi-agent systems that can reliably interleave reasoning with tool calls on long-horizon tasks.
  mental_damage: We have now reached the point where the agents need their own agents to learn how to use agents, and somewhere a Staff Engineer is writing a 40-page RFC to decide who owns the Planner.
