insights:
  summary: AgentFlow is a trainable, modular agentic framework with Planner, Executor, Verifier, and Generator modules optimized via Flow-GRPO for tool-augmented reasoning.
  why_it_matters: It improves long-horizon, sparse-reward agent tasks by training agent modules in-the-flow rather than relying on monolithic LLMs to interleave reasoning and tool use.
  mental_damage: Another framework promising to fix agent unreliability by adding more modules and a novel optimizer, as if complexity were the missing ingredient.
  tags:
    - agent-framework
    - multi-agent
    - reinforcement-learning
  confidence: medium
curation:
  status: included
  reason: AgentFlow is a code-first framework for building agentic systems with specialized modules and a custom training algorithm, fitting the Frameworks & SDKs category as developers import and script against it rather than operate it as a control plane.
  evidence:
    - README describes AgentFlow as a 'trainable, tool-integrated agentic framework' with four specialized modules (Planner, Executor, Verifier, Generator)
    - Uses Flow-GRPO to optimize the planner agent in-the-flow for long-horizon reasoning and tool use
    - Positioned as an alternative to monolithic approaches like Search-R1, emphasizing modularity and trainability
