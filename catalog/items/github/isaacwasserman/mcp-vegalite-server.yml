  summary: An MCP server that enables LLMs to create and visualize data using Vega-Lite syntax.
  why_it_matters: Developers can offload data visualization tasks to an LLM via MCP, generating charts directly from structured data without manual Vega-Lite coding.
  mental_damage: Now your LLM can argue about chart aesthetics instead of you.
