insights:
  summary: A Model Context Protocol (MCP) server that allows LLMs like Claude to visualize data by generating Vega-Lite specifications and returning them as text or PNG images.
  why_it_matters: It gives coding agents a dedicated tool for data visualization, removing the need to manually write and debug charting code within the repo.
  mental_damage: Another micro-server to manage so your AI can spend tokens generating a bar chart instead of you spending minutes doing it in Excel.
