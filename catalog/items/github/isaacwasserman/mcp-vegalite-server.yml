insights:
  summary: A Model Context Protocol server that enables LLMs to visualize data by generating Vega-Lite specifications and returning them as JSON or base64-encoded PNG images.
  why_it_matters: It allows developers to plug data visualization capabilities into MCP-compatible clients like Claude Desktop, letting AI assistants turn raw data into charts without custom integration work.
  mental_damage: We have successfully abstracted the job of making a bar chart into configuring a middleman server so an LLM can hallucinate a JSON spec that another tool will render.
  tags:
