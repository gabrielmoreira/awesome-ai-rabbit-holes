insights:
  summary: An MCP server that exposes your Fulcra Context data to MCP-compatible AI clients via the Fulcra API.
  why_it_matters: Developers using Fulcra Context can wire their stored context directly into Claude for Desktop and other MCP hosts without building custom integrations.
  mental_damage: You now have three layers of indirection—context store, MCP server, and client adapter—to remind yourself that your AI still can't remember what you did yesterday.
