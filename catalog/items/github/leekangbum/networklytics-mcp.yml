insights:
  summary: An MCP server that lets Claude Desktop and Cursor query YouTube comment network analysis results from NetworkLytics via API tools like get_shared_analysis and get_analysis_by_id.
  why_it_matters: It saves developers from manually exporting NetworkLytics dashboards by letting an MCP-compatible assistant fetch video network graphs, sentiment stats, and influencer rankings directly inside the coding workflow.
  mental_damage: We have finally reached the point where an AI agent can interrogate the social dynamics of YouTube comments, sparing you the traumatic experience of reading them yourself.
  tags:
    - mcp
    - youtube
    - network-analysis
    - api-integration
  confidence: high
