insights:
  summary: Microcharts is a React library providing 106 tiny, zero-dependency SVG chart components optimized for LLM-generated text and inline use.
  why_it_matters: It enables developers to embed accessible, self-describing charts directly in AI-generated replies, UIs, or documents without runtime bloat.
  mental_damage: Another SVG chart lib that makes you question whether your KPI cards need a 200-line Sparkline just to feel AI-native.
  tags:
    - react
    - charts
    - svg
    - llm
    - accessible
  confidence: high
curation:
  status: included
  reason: Microcharts is a code-first React SDK for embedding domain-specific chart components, making it a framework/SDK rather than an assistant, extension, or app builder.
  evidence:
    - "Repo description: 'Word-sized charts for React, made for LLMs and humans — 106 chart types, zero runtime dependencies'"
    - "README: 'Every chart imports from its own subpath... you only ship what you use' and 'Import the stylesheet once at the root of your app'"
    - Primary use is importing and scripting against the library as reusable UI components in React code
