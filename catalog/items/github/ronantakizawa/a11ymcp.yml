insights:
  summary: An MCP server that connects LLMs to web accessibility testing APIs via axe-core and Puppeteer to analyze URLs and HTML snippets for WCAG compliance.
  why_it_matters: It lets coding agents automatically detect and fix accessibility regressions directly within the editor or CLI workflow instead of treating a11y as a manual gate.
  mental_damage: Your AI agent can now lecture you about missing ARIA labels while still struggling to center a div.
  tags:
    - mcp
    - accessibility
    - a11y
