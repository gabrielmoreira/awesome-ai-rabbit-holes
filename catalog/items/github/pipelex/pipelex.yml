insights:
  summary: A declarative DSL and CLI for defining typed, reusable AI procedures (methods) that handle model routing, structured outputs, and pipeline orchestration across 60+ models.
  why_it_matters: It lets teams codify AI workflows into version-controlled .mthds files, making prompt logic composable, repeatable, and portable across different coding agents.
  mental_damage: "Just what we needed: yet another layer of abstraction where your prompts get their own file extension and a dedicated syntax before the model even sees them."
