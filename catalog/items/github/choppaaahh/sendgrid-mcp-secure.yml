insights:
  summary: >-
    A security-hardened MCP server for the SendGrid API that implements two-phase sending, recipient allowlisting, and
    audit logging.
  why_it_matters: >-
    It provides a way to give AI agents transactional email capabilities while structurally preventing common exploits
    like silent BCC exfiltration or prompt-injected recipient manipulation.
  mental_damage: >-
    Because we have reached the stage of the AI era where we need specialized security protocols just to ensure our LLM
    doesn't BCC a hacker on every email.
