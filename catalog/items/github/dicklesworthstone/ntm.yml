insights:
  summary: NTM is a Go-based TUI tool that orchestrates multiple AI coding agents across tmux panes with session labeling, work triage, safety approvals, and robot surfaces.
  why_it_matters: It turns tmux into a local control plane for running and coordinating parallel AI agents, reducing the friction of managing multi-agent workflows manually.
  mental_damage: Finally, a way to feel like you're conducting an AI orchestra while actually just trying to stop three agents from editing the same file at once.
