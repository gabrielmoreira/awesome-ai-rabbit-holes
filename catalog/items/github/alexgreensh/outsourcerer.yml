insights:
  summary: >-
    A CLI tool that orchestrates multiple AI coding agents and models by delegating tasks to specialized or cheaper
    engines while preserving the user's environment.
  why_it_matters: >-
    It allows developers to maximize their AI subscriptions by routing repetitive or low-complexity tasks to cheaper
    models without losing their custom tools or MCP configurations.
  mental_damage: >-
    You can now quantitatively track exactly how much money you're wasting by asking frontier models to perform simple
    grep operations.
  tags:
    - orchestration
    - multi-agent
    - cli
    - token-optimization
  confidence: high
