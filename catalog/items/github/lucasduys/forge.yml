insights:
  summary: A native Claude Code plugin that turns one-line ideas into reviewed, tested, committed code via a five-phase autonomous loop with on-disk state recovery.
  why_it_matters: It removes the developer from the fragile prompt-and-review loop by autonomously handling spec generation, task planning, TDD execution in git worktrees, and verification against acceptance criteria.
  mental_damage: You can finally stop heroically babysitting a context window like a project manager, only to be replaced by a plugin that does the babysitting for you.
