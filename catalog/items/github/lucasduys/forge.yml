insights:
  summary: A native Claude Code plugin that runs a five-phase autonomous loop to turn a one-line idea into tested, reviewed, and committed code inside a repository.
  why_it_matters: It offloads the state-management and context-tracking burden from the developer to a disk-persisted pipeline that handles spec generation, TDD execution in git worktrees, and verification.
  mental_damage: You can finally stop acting as the human context-window babysitter and just show up in the morning to review diffs like a proper 2019-era manager.
