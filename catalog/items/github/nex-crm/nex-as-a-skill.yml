insights:
  summary: A CLI and skill-pack system that connects AI coding agents across platforms into a shared knowledge graph with integrations for email, Slack, and CRM tools.
  why_it_matters: It lets developers carry context, memories, and project knowledge across Claude Code, Cursor, Windsurf, and other agents without re-explaining or re-pasting information.
  mental_damage: You have finally solved the problem of your AI agents having no long-term memory, only to realize they now remember every half-baked idea and deprecated API decision you hoped they would forget.
