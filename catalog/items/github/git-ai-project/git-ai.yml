insights:
  summary: A Git extension that automatically tracks and attributes AI-generated code lines to the specific agent, model, and session used to create them.
  why_it_matters: It restores provenance and accountability to repositories polluted by agent-generated code, allowing developers to audit *why* a line was written, not just *who* committed it.
  mental_damage: Finally, you can run git blame not to find the human who ruined the build, but to discover which specific hallucination-prone model you need to yell at in the logs.
  tags:
    - ai-attribution
    - blame
    - cli
    - code-tracking
    - devops
    - git
  confidence: high
curation:
  status: included
  reason: It is a developer-facing extension that integrates with existing coding agents and Git workflows to add a memory and attribution layer, rather than being a primary coding assistant itself.
  evidence:
    - Repo description states it is 'A Git extension for tracking the AI-generated code in your repos'.
    - README demonstrates augmented git workflows like 'git-ai blame' to show model and session IDs for code lines.
    - Supports augmenting major agents (Claude, Cursor, Copilot, etc.) rather than acting as a standalone IDE agent.
    - README demonstrates `git-ai blame` showing specific agents like 'claude [session_id]' per line of code.
    - Supports integration with major coding agents including Claude Code, Cursor, Copilot, and Windsurf (README table).
