insights:
  summary: A Git extension that automatically tracks and attributes AI-generated code to the specific model, agent, and session that produced it.
  why_it_matters: It restores provenance and accountability to repositories where AI agents now write the majority of the codebase, making `git blame` useful again.
  mental_damage: You can now prove exactly which hallucinating model committed that regex that somehow passed code review, just in time for the audit.
  tags:
    - git
    - ai-attribution
    - cli
    - devops
  confidence: high
