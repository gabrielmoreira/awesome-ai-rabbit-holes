insights:
  summary: A Git extension that tracks AI-generated code lines and attributes them to specific models, agents, and sessions within standard Git workflows.
  why_it_matters: It provides much-needed attribution and provenance for AI-written code, helping developers understand the intent and context behind contributions from tools like Claude Code and Cursor.
  mental_damage: Finally, a tool to document exactly which LLM hallucinated that critical auth bypass, ensuring the blame is mathematically distributed across the entire ecosystem.
