insights:
  summary: An open-source Git extension that tracks and attributes AI-generated code to specific agents, models, and sessions.
  why_it_matters: It provides a way to audit AI contributions by linking specific lines of code back to the original model and the session transcript that produced them.
  mental_damage: Finally, you can pinpoint exactly which LLM hallucinated that critical logic error in your pull request.
  tags:
    - git-extension
    - ai-attribution
    - auditability
    - developer-productivity
  confidence: high
