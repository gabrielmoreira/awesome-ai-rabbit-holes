insights:
  summary: A Python adapter library that converts MCP server tools into native tools for LangChain, CrewAI, Smolagents, and other agentic frameworks.
  why_it_matters: It lets developers instantly bridge over 650 existing MCP servers into their preferred agent framework without writing custom integration code.
  mental_damage: Another layer of glue so your agent can invoke a tool that invokes a protocol that invokes a server, proving that modern AI orchestration is mostly baking adapters upon adapters.
  tags:
    - mcp
    - framework
    - adapter
    - python
    - integration
  confidence: high
curation:
  status: included
  reason: The project is a code-first library developers import to adapt MCP tools into agent frameworks, fitting the Frameworks & SDKs category rather than orchestration or extensions.
  evidence:
    - Repo description explicitly states it unlocks MCP servers tools in agentic frameworks via adapters.
    - README shows code-first usage with import statements and adapter classes (e.g., SmolAgentsAdapter, LangChain adapter).
    - Supports multiple frameworks (Smolagents, LangChain, CrewAI, google-genai) as importable SDK adapters.
