insights:
  summary: MKP is a Go-based Model Context Protocol (MCP) server that allows LLM applications to list, get, and apply Kubernetes resources directly via the Kubernetes API.
  why_it_matters: It enables AI coding agents and LLM-powered tools to manage live Kubernetes clusters without relying on kubectl or Helm, streamlining infra operations through natural language.
  mental_damage: Now your AI agent can crash your production cluster with the same casual confidence it uses to rename a variable.
