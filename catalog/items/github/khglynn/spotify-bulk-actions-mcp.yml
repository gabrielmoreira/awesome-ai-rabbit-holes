insights:
  summary: An MCP server that enables bulk Spotify operations (playlist creation, library exports, CSV imports) with confidence scoring and human-in-the-loop review for uncertain matches.
  why_it_matters: It lets developers build AI workflows that manage large Spotify libraries and automate podcast playlist creation without manually handling rate limits or fuzzy matching logic.
