curation:
  status: included
  reason: acrawl primarily functions as an MCP server that exposes browser and DevTools capabilities to other AI assistants like Claude Code or Cursor, making it an integration layer rather than a standalone coding assistant.
  evidence:
    - "MCP client and server are highlighted as core features: 'MCP client and server. Extend the agent with custom tools via MCP servers. Or flip it: `acrawl mcp` exposes 38 browser and DevTools tools plus `run_goal` to Claude Code, Cursor, VS Code, Zed, and 13 other clients.'"
    - It augments other assistants by giving them access to browser automation, network inspection, console analysis, and performance profiling — host capabilities, not code editing.
    - "The README emphasizes acting as a tool provider for other agents: 'acrawl mcp exposes 38 browser and DevTools tools plus `run_goal`' to external clients, positioning it as a service layer."
