insights:
  summary: A Python CLI and testing framework that snapshots AI agent tool calls and outputs to catch behavior regressions across model or provider updates in CI.
  why_it_matters: It gives developers a regression gate for agent behavior, distinguishing provider drift from real system regressions when normal tests still pass.
  mental_damage: We have finally built Playwright for hallucinations, so you can watch your agent quietly change its mind in CI while your status badge stays green.
  tags:
    - agent-testing
    - regression-gate
    - ci
    - eval
  confidence: high
