insights:
  summary: Open-source regression testing tool for AI agents that snapshots behavior, diffs tool calls, and catches regressions in CI.
  why_it_matters: It gives developers a way to detect silent regressions in agent behavior (e.g., tool choice changes, output drift) before they reach users, with deterministic replay and CI integration.
  mental_damage: Finally, a way to know if your agent broke because you changed it or because the model provider changed it under you.
  tags:
    - agent-testing
    - regression-detection
    - ci-integration
    - evals
    - python
  confidence: high
