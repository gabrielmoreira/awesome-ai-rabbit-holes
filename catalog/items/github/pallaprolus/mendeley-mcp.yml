insights:
  summary: An MCP server that connects a Mendeley reference library to LLM clients like Claude Desktop and Cursor for searching, retrieving, and managing academic papers.
  why_it_matters: It allows developers and researchers to query their personal academic libraries and the global Mendeley catalog directly from their AI coding environments without leaving the workflow.
  mental_damage: We have successfully automated the process of doom-scrolling through academic papers so you can now do it with a chatbot instead of a browser tab.
