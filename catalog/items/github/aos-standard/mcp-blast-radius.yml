insights:
  summary: >-
    A static analysis tool and CI gate that extracts the capability surface of MCP servers and verifies them against
    declared manifests.
  why_it_matters: >-
    It enables developers to prevent MCP servers from silently gaining unauthorized access to files, network, or
    subprocesses through manifest divergence.
  mental_damage: >-
    Because trusting a third-party MCP server with your local filesystem is a leap of faith we'd all prefer to automate
    away.
