insights:
  summary: A static analysis tool and CI gate designed to audit MCP servers for unauthorized file system, network, or subprocess access.
  why_it_matters: It allows developers to verify that third-party MCP servers adhere to their declared permission manifests before they are integrated into an agent's workflow.
  mental_damage: Because trusting an agent to run untrusted code is fun, until you realize it's also scanning your entire home directory.
