insights:
  summary: A small Node.js MCP server that provides timezone-aware date, time, and DST conversion tools for AI assistants like Claude Desktop.
  why_it_matters: It fixes the common failure mode where LLMs confidently hallucinate the current date or botch timezone math during meeting scheduling and travel planning.
  mental_damage: We have reached the point where we need a dedicated protocol server just to teach the assistant what time it is, as if time itself were a context window limitation.
  tags:
    - mcp
    - timezone
    - nodejs
    - claude-desktop
  confidence: high
