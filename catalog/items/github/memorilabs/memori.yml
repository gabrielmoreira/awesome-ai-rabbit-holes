insights:
  summary: Memori is an LLM-agnostic memory infrastructure layer that persists agent execution history and conversation state into structured, queryable memory for production systems.
  why_it_matters: It offers Python and TypeScript SDKs to automatically capture and recall agent state, reducing prompt size by ~95% compared to full-context prompting while maintaining high benchmark accuracy.
  mental_damage: Because nothing says 'production-ready agent' like adding a dedicated memory layer to remember what your stateless LLM forgot it was doing five minutes ago.
  tags:
    - memory
    - agent-infrastructure
    - context-management
    - sdk
  confidence: high
curation:
  status: included
  reason: The core novelty is a memory and context-shaping system that persists and retrieves agent state to reduce context footprint, fitting Prompt & Context Engineering.
  evidence:
    - Repo description explicitly calls it 'agent-native memory infrastructure' and 'structured, persistent state'.
    - README emphasizes 'Memory from what agents do' and reports reducing context footprint to 4.97% of full-context while outperforming Zep, LangMem, and Mem0 on LoCoMo.
    - It provides Python and TypeScript SDKs (pip install memori, npm install @memorilabs/memori) and a cloud API, positioning it as a developer-facing context layer.
