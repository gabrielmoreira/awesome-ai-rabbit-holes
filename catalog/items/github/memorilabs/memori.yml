insights:
  summary: Memori is agent-native memory infrastructure that turns agent execution and conversation into structured, persistent state for production systems.
  why_it_matters: It gives developers a way to retain long-term context across agent interactions without bloating prompts, reducing token usage while preserving reasoning quality.
  mental_damage: Another layer of infrastructure to bolt onto your agent stack, promising memory that 'just works' while you debug why it forgot your user's name again.
  tags:
    - memory
    - agent-infrastructure
    - context-engineering
  confidence: high
curation:
  status: included
  reason: Memori's core is a memory and context-shaping layer that improves what goes into the model via structured persistence and retrieval, making it a fit for Prompt & Context Engineering rather than a coding agent or orchestration platform.
  evidence:
    - "Repo description: 'Memori is agent-native memory infrastructure. A LLM-agnostic layer that turns agent execution and conversation into structured, persistent state for production systems.'"
    - "README: 'Memory from what agents do, not just what they say.' and 'Memori recalls that your favorite color is blue.' showing automatic persistence and recall."
    - Benchmarks show 81.95% accuracy on LoCoMo with 67% prompt size reduction vs. Zep, proving its context compression and retrieval value.
