    - README describes it as a 'unified workspace' and 'platform superproject' for delegating entire projects.
    - Provides orchestration of multiple models (Claude, GPT, Gemini) and agents (Anton, Hermes).
    - Includes data connectivity to BigQuery, Postgres, and Notion as part of a central workbench.
    - "included: MindsHub acts as an operated workbench and control plane for coordinating multiple models, data sources, and agents to perform end-to-end workflows."
