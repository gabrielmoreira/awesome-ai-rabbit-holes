    - "included: MindsHub acts as an operated workbench and control plane for managing multiple agents, model routing, and shared workflows."
    - README describes it as a 'unified workspace' and 'platform superproject'
    - Features a model router and secure data connections to systems like BigQuery, Postgres, and HubSpot
    - Offers a web and desktop interface for managing agentic workflows and artifacts
