  summary: A semantic query engine that enables hybrid vector and keyword search across 200+ data sources using standard SQL.
  why_it_matters: It allows developers to build RAG pipelines and provide context to agents by querying live data sources via SQL without needing complex ETL processes.
  mental_damage: Because managing RAG complexity is apparently best solved by pretending your entire enterprise data stack is just one giant, federated SQL table.
