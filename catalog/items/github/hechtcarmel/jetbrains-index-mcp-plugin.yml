insights:
  summary: A JetBrains IDE plugin that exposes an MCP server to give AI coding assistants access to IntelliJ's code indexing and refactoring tools.
  why_it_matters: It lets AI assistants like Claude or Cursor leverage the IDE's semantic understanding, cross-project references, and safe refactoring operations instead of relying on text-only analysis.
  mental_damage: Now your AI assistant can rename a Java method across 200 files while you watch, helplessly aware that you could have broken it all with a single keystroke.
  tags:
    - jetbrains
    - mcp
    - ide-integration
    - refactoring
    - code-indexing
  confidence: high
