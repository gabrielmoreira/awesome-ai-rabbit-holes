insights:
  summary: A local DOM picker for comparing temporary UI variants generated by AI coding agents in a running application.
  why_it_matters: It allows developers to visually select preferred UI directions in the browser, which the agent then implements by cleaning up the losing variants.
  mental_damage: Because staring at a terminal diff is a terrible way to decide if a hero section feels 'modern enough.'
