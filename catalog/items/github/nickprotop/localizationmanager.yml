insights:
  summary: A CLI tool, TUI editor, and VS Code extension for managing localization files across .NET, mobile, and web formats, with optional integration for local LLMs and translation providers.
  why_it_matters: It lets .NET and cross-platform developers automate translation workflows, scan for missing keys, and plug in local LLMs or translation APIs without leaving the terminal or editor.
  mental_damage: We have finally reached the point where even managing translated strings qualifies as an AI-augmented workflow, just in case you were worried your tooling stack wasn't complex enough.
  tags:
