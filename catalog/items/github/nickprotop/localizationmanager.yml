insights:
  summary: A CLI and TUI tool for managing .NET and multi-format localization files with validation, import/export, and optional AI-powered translation via Ollama and other providers.
  why_it_matters: It replaces manual XML/JSON editing and Windows-only tooling with a cross-platform workflow that can automate translation using local LLMs.
  mental_damage: We have successfully reached the point where even managing string tables requires an AI strategy, a cloud dashboard, and a VS Code extension.
  tags:
    - localization
    - cli
    - dotnet
    - i18n
    - ollama
  confidence: high
curation:
  status: excluded
  reason: This is general developer infrastructure for localization resource management, not an AI-native tool, agent, or workflow primarily aimed at AI-assisted coding.
  evidence:
    - Repo description and README define it as a CLI/TUI editor for .resx, JSON, XLIFF, and other localization formats.
    - AI translation is one of many providers (Lingva, MyMemory, Ollama, paid APIs) and not the core product identity.
    - Listed in Awesome-LLMOps under LLMOps, but its primary job is resource file management, not LLM ops or coding assistance.
