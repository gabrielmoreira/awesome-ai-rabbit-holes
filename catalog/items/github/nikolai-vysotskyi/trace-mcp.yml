insights:
  summary: An MCP server that builds a framework-aware graph of a codebase or markdown vault once and serves it to AI agents, replacing repeated file reads and dependency traversal with graph queries.
  why_it_matters: It cuts token usage by 40–50% and eliminates redundant context re-inflations, allowing coding agents to reason from precomputed structure instead of brute-forcing repo exploration.
  mental_damage: We have finally built a tool to stop our agents from pretending they have short-term memory loss and re-reading the same file forty times in a single session.
  tags:
    - mcp
    - context-engineering
    - token-optimization
    - code-intelligence
  confidence: high
