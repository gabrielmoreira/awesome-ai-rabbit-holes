insights:
  summary: A Python framework for structuring interactions with local LLMs via llama.cpp, adding guided sampling for function calling and structured output.
  why_it_matters: It lets developers build local agentic workflows with small models that weren't fine-tuned for tool use, bridging the gap between raw inference and usable agents.
  mental_damage: Another framework for making local 7B models pretend they know how to use tools, just in time for the author to tell you to migrate to their new framework.
  tags:
