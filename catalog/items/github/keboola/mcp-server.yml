insights:
  summary: An open-source MCP server that exposes Keboola data platform features—including storage, SQL transformations, and job triggers—as callable tools for AI assistants like Claude and Cursor.
  why_it_matters: It allows developers to query tables, run transformations, and manage data pipelines directly from their AI coding environment without writing glue code.
  mental_damage: Another day, another layer of abstraction where your data platform now needs an OAuth handshake just so your chatbot can trigger a SQL job that used to take one CLI command.
  tags:
    - mcp
    - data-platform
    - keboola
    - integration
  confidence: high
