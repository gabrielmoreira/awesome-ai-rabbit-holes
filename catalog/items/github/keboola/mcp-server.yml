insights:
  summary: An open-source MCP server that exposes Keboola data platform features—like storage, SQL transformations, job triggers, and flows—as callable tools for AI assistants such as Claude, Cursor, and VS Code.
  why_it_matters: It lets developers query data, build SQL transformations with natural language, and manage ETL pipelines directly from their AI coding environment without writing glue code.
  mental_damage: Your AI assistant can now trigger production data jobs and deploy Streamlit apps, which is either the ultimate developer productivity flex or a one-way ticket to your next incident postmortem.
  tags:
    - mcp
    - data-platform
    - etl
    - keboola
    - ai-integration
  confidence: high
