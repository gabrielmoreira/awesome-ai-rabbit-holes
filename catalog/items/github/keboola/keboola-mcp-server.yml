insights:
  summary: An open-source MCP server that exposes Keboola data platform features—such as storage, SQL transformations, jobs, and flows—as callable tools for AI agents and MCP clients like Cursor, Claude, and VS Code.
  why_it_matters: It lets developers query tables, trigger jobs, and manage data pipelines conversationally inside their existing AI coding tools instead of switching to the Keboola UI.
  mental_damage: We have successfully abstracted the data platform so far away that your AI agent now needs its own data platform integration to ask another AI to run your SQL.
  tags:
    - mcp
    - data-platform
    - keboola
    - ai-integration
  confidence: high
