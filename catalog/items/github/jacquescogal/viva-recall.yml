        extracted_url: https://github.com/jacquescogal/viva-recall
        surrounding_text: "- [Viva Recall (flashcards you answer in your own words, marked by Jev, with an appeal agent you can argue with)](https://github.com/jacquescogal/viva-recall) - `Source available` · `Free source build` · `BYOK`. A desktop flashcard app for open-ended recall. You write a question and the answer you expect, an LLM turns that answer into small yes/no checks, and at review time Jev answers every check in one request; plain code turns the probabilities into a verdict and FSRS schedules the next review. If you dispute a mark, an appeal agent can fix the checks, but only if your previously settled answers still pass. [Project guide](community/projects/apps/viva-recall.md)."
        confidence: high
