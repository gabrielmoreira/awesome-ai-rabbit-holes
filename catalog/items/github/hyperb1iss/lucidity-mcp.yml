insights:
  summary: An MCP server that analyzes git changes across 10 quality dimensions to help AI coding assistants review code for complexity, security, and other issues before commits.
  why_it_matters: It gives AI assistants structured, prompt-based quality checks so they can catch hallucinated components, security gaps, and unintended deletions instead of blindly approving vibe-coded changes.
  mental_damage: Another layer of infrastructure so your AI can tell you that the AI-generated code it just wrote is, in fact, riddled with problems.
  tags:
    - mcp
