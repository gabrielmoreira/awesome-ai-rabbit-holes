insights:
  summary: A Model Context Protocol (MCP) server that analyzes git changes to detect code quality issues, security vulnerabilities, and complexity for AI coding assistants.
  why_it_matters: It provides the structured context and specific tooling necessary for AI assistants to perform meaningful pre-commit code reviews rather than just hallucinating syntax.
  mental_damage: Finally, an automated way to catch the 'nightmare hellscape' your AI assistant codes while you aren't looking, provided you remember to ask it before you commit.
