insights:
  summary: BMTools is an open-source Python framework for extending language models with external tools, serving as an academic-oriented platform for building, sharing, and using tool plugins similar to ChatGPT-Plugins.
  why_it_matters: It provides developers with the building blocks to teach LLMs how to use APIs and tools, bridging the gap between raw model capabilities and actionable external integrations.
  mental_damage: Yet another 'build your own agent toolkit' repo that politely suggests you migrate to their newer project, XAgent, leaving you to wonder if your dependencies have an expiration date.
  tags:
    - tool-use
    - framework
    - plugins
    - llm-infrastructure
  confidence: medium
curation:
  status: included
  reason: The project is primarily a code-first toolkit and SDK for developers to build and load tool plugins for language models, fitting the definition of a framework over an orchestration platform.
  evidence:
    - Repo description explicitly states 'Tool Learning for Big Models, Open-Source Solutions of ChatGPT-Plugins'.
    - README highlights building plugins via Python functions and loading tools programmatically (load_single_tools, MTQuestionAnswerer).
    - README notes 'For new features... please go to XAgent', indicating this is legacy library code rather than an active platform.
