insights:
  summary: Alpa is an archived system for automatically parallelizing and serving large-scale neural networks across distributed clusters using JAX and XLA.
  why_it_matters: It automates complex distributed training and model serving with minimal code changes, though its core algorithms have been upstreamed into XLA.
  mental_damage: We spent years celebrating the breakthrough of auto-parallelization, only to neatly archive it and pretend the distributed training crisis is someone else's XLA problem now.
