insights:
  summary: A fork of LLaMA-Factory that adds Sequence Parallelism (zigzag-ring and DeepSpeed Ulysses) to extend the effective context length for full-parameter SFT and DPO training.
  why_it_matters: It allows ML engineers to train 72B models on 128k contexts using only 8 A800s without relying on heavy external optimizations.
  mental_damage: We have finally solved the problem of training models to read 128,000 tokens, which means your commit history is now fair game for the next fine-tune.
  tags:
    - llm-training
    - fine-tuning
    - sequence-parallelism
    - long-context
    - deepspeed
  confidence: high
