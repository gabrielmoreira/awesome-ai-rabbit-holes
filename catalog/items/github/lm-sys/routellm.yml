insights:
  summary: A Python framework and OpenAI-compatible server for serving and evaluating LLM routers that route queries between strong and weak models to optimize cost and quality.
  why_it_matters: It lets developers drop in a routing layer that automatically sends simple queries to cheaper models while preserving response quality, cutting LLM API costs by up to 85% without major code changes.
  mental_damage: You can now add a sophisticated routing layer to your stack so you can spend more engineering hours optimizing a cost-saving knob than the actual API bill you are trying to reduce.
  tags:
    - llm-routing
    - cost-optimization
    - openai-compatible
    - model-inference
    - benchmarking
  confidence: high
curation:
  status: included
  reason: This is a code-first framework and SDK used by developers to build routing logic and evaluate model performance, fitting cleanly as a provider/model abstraction library rather than a coding assistant or control plane.
  evidence:
