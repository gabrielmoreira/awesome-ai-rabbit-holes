insights:
  summary: A research tool and codebase for detecting and removing benchmark-contaminated rephrased samples from LLM training datasets.
  why_it_matters: It gives model trainers and evaluators a concrete way to measure and clean training data so benchmark scores reflect actual capability instead of memorization.
  mental_damage: We have arrived at a point where we need specialized tooling to figure out whether our models are simply reciting rephrased homework instead of learning anything useful.
  tags:
    - benchmarks
    - evaluation
    - llm
    - research
    - training-data
  confidence: high
