insights:
  summary: Minima is an open-source, on-premises RAG stack that runs as configurable Docker containers and exposes local document search via ChatGPT Custom GPTs, Anthropic Claude (MCP), or a fully local Ollama setup.
  why_it_matters: It lets developers run private, local document-grounded AI workflows without sending internal data to external APIs, with pluggable LLM backends and MCP support for Claude Desktop.
  mental_damage: Now you can host your own vector-backed paranoia fortress and still obsess over whether the reranker is secretly telephoning home.
