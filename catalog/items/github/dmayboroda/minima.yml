insights:
  summary: Minima is an open-source, on-premises RAG (Retrieval-Augmented Generation) system that runs as configurable Docker containers, allowing developers to query local documents using local LLMs, ChatGPT, or Claude via MCP integration.
  why_it_matters: It offers a self-contained, privacy-first infrastructure for indexing and querying local codebases or documentation using your choice of local models or external APIs.
  mental_damage: Yet another 'run it locally with Docker' RAG setup that forces you to choose between debugging docker-compose errors or just pasting the file into ChatGPT like a civilized animal.
