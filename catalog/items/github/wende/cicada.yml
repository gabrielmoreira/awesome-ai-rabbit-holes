  summary: CICADA is an MCP server that provides context-compacted code intelligence for AI coding assistants via AST-level indexing and semantic search.
  why_it_matters: It reduces token waste and improves assistant accuracy by delivering structured code context instead of raw file dumps.
  mental_damage: Finally, a tool that admits your AI assistant is context-starved and sells you a diet plan for its meals.
