insights:
  summary: An MCP server and hook system for Claude Code that automatically captures session context, decisions, and error-fix pairs to eliminate re-explanation on new sessions.
  why_it_matters: It removes the recurring overhead of re-explaining project state, conventions, and past decisions every time a Claude Code session starts.
  mental_damage: We have now built persistent memory so you can feel productive across sessions, right before the model forgets what a Next.js App Router is two prompts later.
  tags:
    - claude-code
    - context-continuity
    - mcp
    - session-memory
  confidence: medium
