insights:
  summary: An MCP server that detects potential risks in Solana meme tokens by analyzing token data from the Solsniffer API.
  why_it_matters: It helps AI agents and developers assess the safety of Solana tokens before interacting with them, reducing exposure to rug pulls and unsafe projects.
  mental_damage: Because nothing says 'trust me' like a meme token with a 55/100 risk score and a private wallet owning half the supply.
