  summary: A Model Context Protocol server that exposes Dune Analytics query execution and results fetching to AI agents via two tools returning CSV-formatted data.
  why_it_matters: It lets AI agents directly query on-chain data without developers wiring up Dune API calls by hand.
  mental_damage: You now have an agent that can run a crypto query you wrote six months ago and forgot, which somehow feels like both a superpower and a liability.
