insights:
  summary: A CLI tool for benchmarking the throughput and tokens-per-second performance of local LLMs running via Ollama.
  why_it_matters: It allows developers to quantitatively measure the hardware performance and inference speed of local models across different RAM configurations.
  mental_damage: Nothing personal like watching your precious GPU cycles turn into a measurable sequence of tokens-per-second.
