insights:
  summary: An MCP server that provides read-only and write access to Zuul CI builds, jobs, logs, and pipeline status so developers can debug failures through LLM conversations instead of clicking through CI web UIs.
  why_it_matters: It lets developers ask natural-language questions about CI failures and get structured root-cause answers with log context, flaky-job detection, and live pipeline awareness without manually parsing Zuul logs.
  mental_damage: We have successfully reached the point where debugging a failed gate job requires an MCP server, thirty-seven tools, and a polite conversation with Claude instead of the traditional method of screaming at a 6,000-line log file.
  tags:
    - mcp
    - ci-cd
