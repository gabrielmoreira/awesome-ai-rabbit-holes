insights:
  summary: An MCP server for Zuul CI that enables debugging build failures, searching logs, managing pipelines, and monitoring jobs from MCP-compatible clients like Claude or Cursor.
  why_it_matters: Developers can query Zuul CI build statuses, logs, and failures directly from their AI assistant without navigating web UIs.
  mental_damage: Finally, a way to ask your AI assistant why the CI failed instead of scrolling through 20,000 lines of Ansible output.
