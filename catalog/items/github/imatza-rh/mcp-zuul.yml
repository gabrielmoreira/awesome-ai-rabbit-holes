insights:
  summary: An MCP server for Zuul CI that exposes 37 tools, prompt templates, and resources to let LLMs read builds, logs, jobs, and pipeline status directly from Zuul.
  why_it_matters: It lets developers debug CI failures and inspect pipeline state by asking natural-language questions instead of clicking through Zuul web UIs or grepping raw logs.
  mental_damage: Finally, an MCP server so your coding agent can explain why your gate job failed while you continue pretending the build system is someone else's problem.
