insights:
  summary: An MCP server that provides persistent memory and semantic search for AI coding assistants by indexing git history and session lessons.
  why_it_matters: It automates the process of re-establishing context, preventing developers from having to re-explain architecture or past bug fixes to their AI every session.
  mental_damage: Because the ultimate solution to AI amnesia is to build a permanent, searchable database of every single mistake you've ever made in a codebase.
