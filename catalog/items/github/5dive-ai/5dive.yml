insights:
  summary: 5dive is a self-hosted runtime for running multiple AI coding agents on a server, letting them collaborate via a shared task queue and org chart, with human escalation over Telegram.
  why_it_matters: It enables developers to run a team of autonomous agents on their own infrastructure, reducing context-switching by letting agents handle routine work and only pinging humans for decisions.
  mental_damage: Finally, a way to feel guilty about delegating your job to AI while still being the bottleneck.
  tags:
    - self-hosted
    - multi-agent
    - agent-orchestration
    - cli
    - telegram
  confidence: high
