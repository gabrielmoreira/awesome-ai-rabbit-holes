  status: included
  reason: It serves as a workflow extension that brings 5dive's agent management capabilities into MCP-compatible hosts.
  evidence:
    - Exposes 5dive CLI tools (tasks, agents, digest) via stdio MCP
    - Acts as a thin adapter for the existing 5dive binary
    - Enables tasking and fleet inspection within Claude Desktop, Cursor, and Cline
