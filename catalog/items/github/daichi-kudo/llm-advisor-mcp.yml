insights:
  summary: An MCP server that provides real-time LLM/VLM pricing, benchmark scores, and recommendations by aggregating data from SWE-bench, LM Arena, OpenCompass, and OpenRouter.
  why_it_matters: It lets coding assistants answer current model-selection questions with live data instead of outdated training cutoffs, reducing the need to manually check pricing and benchmarks across multiple sites.
  mental_damage: We now have an AI that queries an MCP server so it can advise us on which AI to use, because apparently even our model choices need their own model-assisted decision loop.
