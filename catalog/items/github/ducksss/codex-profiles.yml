insights:
  summary: A Bash wrapper that manages isolated CODEX_HOME profiles to separate auth tokens, settings, and state for multiple Codex accounts.
  why_it_matters: Prevents identity leakage and config collisions when switching between work, personal, and client accounts without manually copying auth.json files.
  mental_damage: The inevitable realization that we've reached the 'managing multiple AI personas' phase of our career, essentially treating LLM accounts like separate browser profiles for our professional identities.
  tags:
    - cli
    - bash
    - account-switching
    - codex
    - macos
  confidence: high
curation:
  status: included
  reason: The tool is a utility that augments the workflow of an existing coding agent (Codex) rather than being an assistant itself.
  evidence:
    - README describes it as a 'small command that keeps each account's Codex state separate'
    - It acts as a wrapper for the CODEX_HOME environment variable
    - The core value is workflow management (account switching) for another tool
