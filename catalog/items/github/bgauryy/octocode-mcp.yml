insights:
  summary: An MCP server and CLI that provides semantic code search, LSP intelligence, and agent skills for researching and understanding codebases across GitHub, GitLab, and local repos.
  why_it_matters: It gives coding agents deep context—LSP navigation, usage patterns, and multi-phase research sessions—so they can stop hallucinating and start referencing real implementations.
  mental_damage: Another layer of infrastructure to help your AI pretend it did the reading, while you spend an afternoon configuring OAuth scopes and wondering if the context window is the map or the trap.
