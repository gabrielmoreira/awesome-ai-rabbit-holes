insights:
  summary: An MCP server that connects AI assistants to semantic code search across GitHub, GitLab, and local repositories using LSP intelligence for real-time context generation.
  why_it_matters: Turns any coding assistant into a staff engineer that can research implementation patterns, explore dependency graphs, and cite real code across public and private repos without leaving the chat.
  mental_damage: Your AI assistant can now suffer through legacy codebase archaeology and panic-scroll through ten-thousand-line files just like you do, except it processes the trauma in milliseconds instead of decades.
  tags:
    - ast
    - code-intelligence
    - code-search
    - context-generation
    - lsp
    - mcp
    - semantic-research
  confidence: high
