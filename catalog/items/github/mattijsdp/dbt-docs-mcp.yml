insights:
  summary: An MCP server that exposes dbt project metadata, graph information, and column-level lineage from artifacts like manifest.json and catalog.json to AI coding assistants.
  why_it_matters: It allows coding agents to understand complex data model dependencies and SQL lineage directly within their context, reducing the need to manually explain dbt projects.
  mental_damage: We have successfully abstracted the job of reading JSON files into a protocol, so your AI can now pretend it understands your data warehouse without actually running the models.
  tags:
    - mcp
    - dbt
    - data-platform
    - lineage
    - metadata
  confidence: high
