insights:
  summary: An MCP server that exposes dbt project metadata, graph information, and column-level lineage from manifest and catalog artifacts to AI clients.
  why_it_matters: It allows developers to query complex dbt model lineage, dependencies, and SQL code directly through AI assistants like Claude or Cursor without leaving their editor.
  mental_damage: You can now ask an LLM to trace your column lineage through a five-layer dbt spaghetti graph, which is slightly more dignified than crying into the manifest.json yourself.
  tags:
    - mcp
    - dbt
    - data-lineage
    - metadata
  confidence: high
