    - autonomous
    - open-source
  confidence: high
curation:
  status: included
  reason: The project is a code-first library and runtime for building autonomous agents, intended to be imported and scripted against rather than operated as a primary coding assistant or control plane.
  evidence:
    - README describes it as a 'simple implementation' where users configure LLM APIs in a config.toml file and install via pip/uv.
    - Created by members of the MetaGPT team, positioning it as a library-style framework in the agent ecosystem.
    - Included in 'awesome-llm-agents' under the 'Frameworks' section, reinforcing its identity as a developer building block.
