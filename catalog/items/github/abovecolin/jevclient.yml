insights:
  summary: Async Python client for TypeSafe Jev that sends typed questions and receives probabilities/choices without parsing prose.
  why_it_matters: Enables type-safe integration of Jev decision models into Python workflows for probabilistic decision-making.
  mental_damage: Yet another SDK to learn just to avoid the misery of extracting structured data from a model that refuses to output JSON.
  tags:
    - jev
    - decision-model
    - python-client
  confidence: medium
