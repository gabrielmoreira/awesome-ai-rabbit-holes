insights:
  summary: An MCP server that provides LLM assistants with accurate astronomical catalog data and observing session planning for 13,000+ deep-sky objects.
  why_it_matters: It prevents astronomy-related hallucinations in LLM workflows by replacing made-up magnitudes and coordinates with deterministic, local math and a bundled OpenNGC dataset.
  mental_damage: We have finally solved the crisis of AI assistants confidently inventing stars, leaving developers free to worry about everything else hallucinating instead.
  tags:
    - mcp
    - astronomy
    - llm-tooling
    - local-data
  confidence: high
