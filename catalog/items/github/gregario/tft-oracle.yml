insights:
  summary: A Model Context Protocol server that provides accurate, up-to-date Teamfight Tactics champion, trait, item, and augment data to LLMs to prevent hallucinations about the game.
  why_it_matters: It allows developers and players to build or use AI assistants that can reason about TFT strategy without inventing game mechanics or item recipes.
  mental_damage: We have successfully built infrastructure to ensure that large language models stop lying about which virtual items combine to make a hypothetical magic spear.
