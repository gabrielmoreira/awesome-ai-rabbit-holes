insights:
  summary: MetaGPT is an open-source multi-agent framework that assigns software-team roles (PM, architect, engineers) to LLMs to generate software artifacts and code from a natural-language requirement.
  why_it_matters: It offers a “one prompt → structured plan/docs/APIs/repo” workflow that can help developers prototype or scaffold projects by orchestrating multiple specialized agent roles instead of a single chat session.
  mental_damage: It normalizes the idea that your “team” now includes a product manager bot that can block your PR because the SOP says so.
  tags:
    - multi-agent
    - agent-orchestration
    - coding-agent
    - python
    - llm-framework
  confidence: high
