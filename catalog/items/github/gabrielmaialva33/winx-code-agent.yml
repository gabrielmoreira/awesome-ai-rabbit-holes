curation:
  status: included
  reason: The project's primary identity is an MCP server designed to provide tools to other agents, rather than being a standalone coding assistant.
  evidence:
    - README explicitly describes it as a 'pecialized Model Context Protocol (MCP) server'
    - Provides tools like BashCommand and FileWriteOrEdit for host agents
    - Core value proposition is performance optimization for MCP-based toolsets
