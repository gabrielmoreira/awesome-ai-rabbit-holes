insights:
  summary: A terminal-native CLI for managing tasks, notes, habits, schedules, and relationships, backed by PostgreSQL and designed for both human use and agent automation.
  why_it_matters: It provides a stable, grammar-predictable command surface that lets coding agents like Claude Code or Cursor manage personal productivity workflows directly from the terminal.
  mental_damage: "We have finally achieved the platonic ideal of late-stage developer life: installing a PostgreSQL-backed CLI to manage our habits because we can no longer trust ourselves, our calendars, or our agents to remember what we intended to do."
  tags:
    - cli
