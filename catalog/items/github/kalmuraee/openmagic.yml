insights:
  summary: OpenMagic is an AI coding toolbar that injects into any web app via a reverse proxy, allowing developers to select elements, describe changes, review diffs, and edit source code directly.
  why_it_matters: It enables in-context, visual editing of web apps without IDE plugins or framework-specific tooling, streamlining UI/UX tweaks and code modifications.
  mental_damage: Finally, a way to edit your app while pretending you’re just browsing it.
  tags:
    - ai-coding
    - web-development
    - visual-editor
    - reverse-proxy
    - diff-review
  confidence: high
curation:
  status: included
  reason: OpenMagic acts as a primary coding assistant that directly reads, plans, and edits code in a developer's repo via a visual interface, fitting the core definition of a coding agent.
  evidence:
    - Repo description explicitly states it is an 'AI coding toolbar' for editing real source code
    - "README details workflow: select element, describe change, review diff, approve edits"
    - Operates as a standalone assistant (not an extension for another tool) with its own reverse proxy and file I/O
