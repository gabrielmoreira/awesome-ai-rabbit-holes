insights:
  summary: OpenMagic is a local Node.js reverse proxy that injects a floating AI coding toolbar into any running web app, allowing developers to select elements, capture context, and apply AI-generated code patches via their own LLM API keys.
  why_it_matters: It lets frontend developers modify components and styles directly from the browser preview with real-time diffs and HMR, without needing an IDE plugin or account.
  mental_damage: Finally, a way to let a language model edit your hot-reloading frontend from a floating toolbar, because apparently we needed to recreate the browser dev tools experience with an API key and a leap of faith.
  tags:
    - ai-toolbar
    - reverse-proxy
    - frontend
    - local-first
    - hot-reload
  confidence: medium
curation:
  status: included
  reason: The product acts as a primary coding assistant that directly reads code, captures UI context, plans changes, and edits files through a browser-based interface, fitting the coding-agents category over an extension.
