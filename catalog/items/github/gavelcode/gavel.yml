insights:
  summary: A code quality gate for Bazel monorepos that uses Bazel aspects to perform build-graph-aware linting, coverage, and architecture analysis.
  why_it_matters: It allows developers to enforce strict quality standards on only the affected parts of a monorepo and exposes those checks directly to coding agents via MCP.
  mental_damage: Because the ultimate developer experience is having your AI agent act as a highly pedantic, build-graph-aware code reviewer.
  tags:
    - bazel
    - monorepo
    - mcp
    - code-quality
    - linting
  confidence: high
curation:
  status: included
  reason: It functions as an augmentation tool that provides specialized quality-gate capabilities (linting, coverage, and architecture) to coding agents through an MCP server.
  evidence:
    - Exposes tools like `judge`, `lint_file`, and `coverage` via an MCP server to augment agents like Claude Code or Cursor
    - Uses Bazel aspects to ensure analysis is build-graph-aware and only targets changed files
    - Enforces quality gates via a versioned `gavel.yaml` configuration
