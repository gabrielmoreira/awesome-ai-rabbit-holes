insights:
  summary: A Model Context Protocol server that wraps the gget bioinformatics library, exposing gene search, sequence analysis, and protein structure prediction tools to AI assistants.
  why_it_matters: It allows developers and researchers to query complex genomics databases and run bioinformatics workflows using natural language through MCP-compatible AI agents.
  mental_damage: We have successfully abstracted away the last remnants of biological inquiry, so you can now misconfigure a cancer pathway analysis while arguing with an LLM about token limits.
