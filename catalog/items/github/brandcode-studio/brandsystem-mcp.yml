insights:
  summary: An MCP server that extracts brand guidelines from websites, PDFs, and Figma to create a portable `.brand` runtime for AI tools.
  why_it_matters: It solves the 'correct but generic' AI output problem by giving coding assistants direct access to structured brand context (colors, fonts, voice rules, anti-patterns) without manual prompt engineering.
  mental_damage: Finally, a way to stop your AI from generating yet another startup that looks like it was designed by a committee of midjourney prompts.
  tags:
