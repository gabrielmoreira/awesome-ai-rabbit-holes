insights:
  summary: A tool that converts Git repositories or local directories into prompt-ready text digests with file structure, size stats, and token counts.
  why_it_matters: It gives developers a quick way to package entire codebases into a format that LLMs can actually ingest without manual copying or context overflow.
  mental_damage: We have officially reached the point where preparing your code for the AI takes almost as much tooling as writing the code itself.
