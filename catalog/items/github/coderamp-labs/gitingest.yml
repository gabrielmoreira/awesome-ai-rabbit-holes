insights:
  summary: A tool that converts Git repositories into prompt-friendly text digests, accessible via CLI, Python package, browser extension, or by swapping 'hub' for 'ingest' in GitHub URLs.
  why_it_matters: It handles the tedious work of packaging a codebase's structure and content into a format optimized for LLM context windows.
  mental_damage: Because apparently the modern developer workflow now requires a dedicated middleware layer just to feed your own code into the AI that's supposed to understand it.
