insights:
  summary: A Kubernetes MCP server that exposes cluster operations—listing resources, reading logs, and applying manifests—as standardized tools for AI agents and LLM-powered workflows.
  why_it_matters: It lets coding agents and MCP-compatible assistants directly inspect and mutate Kubernetes clusters without developers wiring custom kubectl glue themselves.
  mental_damage: We have successfully abstracted kubectl into a protocol so that an LLM can now YAML-apply your production cluster after confidently hallucinating a missing bracket.
