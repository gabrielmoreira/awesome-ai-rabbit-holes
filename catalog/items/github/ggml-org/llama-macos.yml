insights:
  summary: A macOS menu bar application for running local LLMs via a background server.
  why_it_matters: It provides a zero-config way to host an OpenAI-compatible API locally, enabling developers to plug local models into VS Code, Zed, and CLI agents without managing manual server setups.
  mental_damage: The joy of discovering that your 'lightweight' menu bar app is actually just a very polite wrapper for the 12GB of RAM your local model is currently eating.
  tags:
    - inference-server
    - llama-cpp
    - local-llm
    - macos
    - openai-api
    - openai-compatible
    - self-hosted
  confidence: high
