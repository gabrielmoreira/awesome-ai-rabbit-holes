  summary: A lightweight macOS menu bar app that runs local LLMs via llama.cpp and exposes them through a standard OpenAI-compatible API server.
  why_it_matters: It gives developers a zero-config, native way to run and manage local models that slot directly into editors, CLI tools, and coding agents they already use.
  mental_damage: Yet another cozy local-LLM launcher so you can pretend your Mac is a private GPT factory while your fan spins like a jet engine.
