insights:
  summary: A macOS menu bar application for running local LLMs via a local OpenAI-compatible server.
  why_it_matters: It provides a zero-config bridge to run models locally on Mac hardware, allowing any OpenAI-compatible client like VS Code or Claude Code to use local inference.
  mental_damage: Now you have no excuse for your privacy concerns, since the only thing leaving your machine is your un-quantized, highly-specific debugging queries.
  tags:
    - macos
    - local-llm
    - llama-cpp
    - openai-compatible
    - inference-server
  confidence: high
