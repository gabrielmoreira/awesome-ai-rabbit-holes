  confidence: high
curation:
  status: included
  reason: The product is an operated control plane and runtime platform for governing and coordinating multiple agents across frameworks, not a code-first library or single coding assistant.
  evidence:
    - Repo description explicitly calls it 'The open agent control plane' for governing autonomous AI agents with policy enforcement and audit trails.
    - README details a full stack platform (API gateway, scheduler, safety kernel, workflow engine, dashboard, NATS, Redis) deployed via Docker, operated as a control surface.
    - While it lists MCP compatibility and is included in awesome-llm-agents frameworks, its primary identity is a multi-agent governance platform, not a framework or MCP tool.
