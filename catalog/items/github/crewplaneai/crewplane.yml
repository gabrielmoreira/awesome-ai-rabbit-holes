insights:
  summary: A workflow engine that orchestrates coding-agent CLIs (Claude Code, Codex, Copilot CLI, etc.) via Markdown-defined stages, with resumable, reviewable handoffs stored on disk.
  why_it_matters: It turns ad-hoc multi-agent coding sessions into reproducible, auditable workflows where failures don’t force full replays.
  mental_damage: Finally, a way to stop pretending your terminal scrollback is a reliable audit trail.
  tags:
    - agent-orchestration
    - workflow-engine
    - multi-agent
    - cli
    - resumable
  confidence: high
