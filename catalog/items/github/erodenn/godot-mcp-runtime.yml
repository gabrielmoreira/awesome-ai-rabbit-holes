insights:
  summary: A TypeScript MCP server that gives AI assistants runtime control over Godot 4.x games via input simulation, screenshots, UI discovery, and live GDScript execution without requiring project modifications.
  why_it_matters: It closes the agent feedback loop for game development by letting AI verify its own changes in a running engine rather than relying solely on static file edits.
  mental_damage: We have finally reached the point where the AI can play the game it just broke, staring at the crash screen so you don't have to.
