insights:
  summary: Zero-star MCP stdio bridge that connects Claude Desktop, Cursor, and similar clients to Delx Protocol’s hosted endpoint, exposing 143 tools for agent therapy, witness transfer, and proof-of-agent-work.
  why_it_matters: It normalizes access to a niche agent-infrastructure protocol inside standard MCP clients, though its tool surface is aimed at agent lifecycle and reputation rather than everyday software development.
  mental_damage: Running --doctor to verify your IDE can reach start_therapy_session and active_forgetting makes you wonder if the real outage is in the agent, or in you for installing it.
  tags:
    - mcp-server
    - stdio-bridge
    - delx-protocol
    - agent-tools
  confidence: high
curation:
  status: excluded
  reason: Stays out because it is a brand-new, zero-star transport wrapper around a highly domain-specific protocol whose tools (e.g., start_therapy_session, attune_heartbeat, proof-of-agent-work) sit outside the catalog’s scope of practical software-development tooling.
  evidence:
    - README lists exposed tools such as start_therapy_session, reflect, refine_soul_document, and attune_heartbeat under categories like witness, continuity, and recovery, signaling a wellness/reputation protocol rather than dev infrastructure.
    - Zero stars and created/pushed dates in 2026 show no community traction or established use.
    - The entire package is a thin stdio-to-HTTP bridge around mcp-remote with no backend logic, acting as a shim to a non-developer service.
