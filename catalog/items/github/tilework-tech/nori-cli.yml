insights:
  summary: A local terminal-native CLI that provides a unified TUI for running and switching between multiple AI coding agents like Claude Code, OpenAI Codex, and Gemini CLI via the Agent Client Protocol.
  why_it_matters: It lets developers use their existing authenticated sessions across different AI providers without being locked into a single vendor's CLI or workflow.
  mental_damage: We have successfully reached the point where we need a meta-CLI just to manage the CLI agents we installed to avoid using an IDE with an agent.
