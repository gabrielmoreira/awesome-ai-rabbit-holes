insights:
  summary: A curated, health-monitored web directory for discovering and rating paid APIs that accept Bitcoin Lightning (L402), USDC on Base (x402), or Stripe/Tempo (MPP) payments for the agent economy.
  why_it_matters: It provides the missing discovery layer for developers building autonomous agents that need to find and pay for external API services programmatically.
  mental_damage: We have successfully built a Yelp for APIs that require a Bitcoin Lightning wallet, ensuring that the agent economy will be the first economy to crash while running on testnet nostalgia.
