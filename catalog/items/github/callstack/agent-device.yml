insights:
  summary: A CLI that allows AI agents to inspect and interact with mobile and desktop applications through snapshots, accessibility trees, and command execution.
  why_it_matters: It closes the loop for coding agents by giving them a way to verify their changes on real devices or emulators rather than just guessing based on the codebase.
  mental_damage: Now your AI agent can hallucinate a UI interaction and then provide you with a screenshot of the exact moment it failed to find the button.
  tags:
    - mobile-automation
    - computer-use
    - mcp
    - e2e-testing
    - android-ios
  confidence: high
curation:
  status: included
  reason: The tool is designed as a capability layer that augments other assistants (like Cursor or Claude Code) with device access, rather than being a standalone coding assistant.
  evidence:
    - "README states 'Set up your agent: run the CLI from Cursor, Codex, Claude Code, Windsurf, or another agent terminal.'"
    - Core value is providing 'live app verification' as a layer in the agentic development loop.
    - Includes MCP support as a way to integrate with existing agent shells.
