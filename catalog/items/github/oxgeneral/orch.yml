  summary: A CLI tool that orchestrates multiple AI coding agents (like Claude Code and Codex) to work in parallel on a single project from the terminal.
  why_it_matters: It allows developers to delegate complex, multi-step coding goals to a coordinated team of agents that autonomously decompose tasks, implement code, run tests, and submit pull requests.
  mental_damage: "Finally, a tool to manage the three AI agents you hired so you can go back to your real job: managing the tool that manages the agents."
