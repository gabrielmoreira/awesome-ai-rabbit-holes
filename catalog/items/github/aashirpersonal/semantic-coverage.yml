insights:
  summary: A tool that visualizes user queries and document embeddings to identify knowledge gaps, blind spots, and hallucination triggers in RAG vector stores.
  why_it_matters: It applies a code-coverage-style mindset to RAG pipelines, helping developers find missing documentation and data drift before users hit empty retrieval results.
  mental_damage: We’ve successfully invented test coverage for vector databases, so you can now feel guilty about unseen semantic blind spots instead of just wondering why the bot is hallucinating.
