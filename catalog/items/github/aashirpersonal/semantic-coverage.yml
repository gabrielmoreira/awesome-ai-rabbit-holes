insights:
  summary: A developer tool that visualizes and detects knowledge gaps, hallucination triggers, and data drift in RAG vector stores by clustering user queries and documents in a shared latent space.
  why_it_matters: It gives RAG engineers a 'code coverage' style dashboard to find blind spots where their vector database fails to support user intent.
  mental_damage: Yet another dashboard to remind you that your vector store is mostly hallucinating in clusters you didn't even know existed.
  tags:
    - rag
    - observability
    - eval
    - vector-db
  confidence: medium
