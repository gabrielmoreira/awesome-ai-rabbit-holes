insights:
  summary: A self-hosted Docker service that provides a knowledge and governance layer for AI coding agents by vectorizing documentation and exposing it via an MCP server for persistent memory and automated documentation.
  why_it_matters: It allows AI assistants to retain architectural decisions and bug fixes across sessions by automatically capturing knowledge from git commits and documentation into a searchable, local vector store.
  mental_damage: We have successfully built infrastructure to ensure our AI agents never forget the technical debt we keep introducing.
  tags:
    - mcp
    - memory
    - self-hosted
    - rag
    - knowledge-management
  confidence: medium
