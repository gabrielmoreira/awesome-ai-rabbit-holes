insights:
  summary: A semantic memory MCP server that provides persistent storage, RAG capabilities, and automatic relationship discovery for Claude and other MCP clients using DuckDB and Voyage AI embeddings.
  why_it_matters: Gives MCP-based coding assistants persistent, searchable memory with semantic backlinks, reducing the need to re-explain context across sessions.
  mental_damage: We have now built a notebook for the assistant so it can remember what we forgot we told it, while the underlying implementation is proudly 'vibe-coded' by an AI having a good time.
