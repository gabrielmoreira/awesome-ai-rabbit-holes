insights:
  summary: A local MCP server that captures an AI agent's reasoning live as code changes are made, storing structured change events with justifications in a local SQLite database for later audit.
  why_it_matters: It solves the 'why did the AI add this' mystery by creating a persistent audit trail of agent reasoning that survives long after the coding session and context window vanish.
  mental_damage: We have successfully built git blame for hallucinations, so you can now scientifically document exactly when your agent decided to migrate the database at 2 AM for reasons it already forgot.
  tags:
    - mcp
    - memory
    - codebase-audit
    - agent-trace
    - sqlite
  confidence: medium
