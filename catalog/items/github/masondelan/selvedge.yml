insights:
  summary: A local MCP server that captures AI agent reasoning live as code changes are made, storing the 'why' behind modifications in a local SQLite database for later auditing.
  why_it_matters: It solves the problem of context evaporation in AI-generated codebases by providing a 'git blame' for agent reasoning, allowing developers to trace decisions back to the specific prompt or intent.
  mental_damage: We have successfully built a tool to remember why the AI did the thing, effectively outsourcing our code provenance to a SQLite file because we can no longer be bothered to write commit messages that survive contact with a bot.
  tags:
    - mcp
    - memory
    - agent-trace
    - git-blame
    - sqlite
  confidence: high
