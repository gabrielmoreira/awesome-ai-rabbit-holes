        surrounding_text: "- [vatnode/vatnode-mcp](https://github.com/vatnode/vatnode-mcp) [![vatnode/vatnode-mcp MCP server](https://glama.ai/mcp/servers/vatnode/vatnode-mcp/badges/score.svg)](https://glama.ai/mcp/servers/vatnode/vatnode-mcp) 📇 ☁️ - Official MCP server for **EU VAT validation** via the EU Commission's VIES service + offline VAT rates for 45 European countries. Five tools: `validate_vat_number` (live VIES with company name, address, registration date, and optional consultation number for audit), `get_country_vat_rates`, `list_eu_vat_rates`, `check_vat_format`, `list_supported_countries`. Four of five tools work offline without an API key (data bundled via `eu-vat-rates-data`). Open source MIT, every release signed with npm provenance via GitHub Actions OIDC. Install: `npx -y vatnode-mcp`."
