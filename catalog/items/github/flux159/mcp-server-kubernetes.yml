insights:
  summary: An MCP server that connects to a Kubernetes cluster and enables AI coding assistants to manage resources via kubectl and Helm.
  why_it_matters: It allows developers to delegate cluster operations like listing pods or deploying charts directly through their AI assistant rather than switching to a terminal.
  mental_damage: You can now ask a language model to debug your production cluster, shaving precious seconds off the time it takes to accidentally delete a namespace.
