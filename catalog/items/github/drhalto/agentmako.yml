insights:
  summary: A local-first MCP server that indexes codebases into a SQLite store to provide coding agents with structured context packets, code facts, and diagnostics.
  why_it_matters: It stops agents from brute-forcing their way through a repo with raw grep by feeding them pre-indexed symbols, routes, and schema facts before they touch a single file.
  mental_damage: We have officially reached the point where our AI assistants need their own dedicated knowledge graph just to remember which files they were supposed to be editing.
