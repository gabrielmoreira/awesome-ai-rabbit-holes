insights:
  summary: An MCP server that executes code securely inside Docker containers for AI agents and coding assistants that support the Model Context Protocol.
  why_it_matters: It gives MCP-compatible coding agents a sandboxed execution environment, allowing them to run and verify generated code without touching the host system.
  mental_damage: We have successfully abstracted the act of running code so many times that we now need a protocol server to ask a container to run the code that the AI just hallucinated.
