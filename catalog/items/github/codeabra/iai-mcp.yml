insights:
  summary: A local, MCP-compatible memory system that provides long-term context and verbatim recall for AI coding assistants.
  why_it_matters: It automates the injection of relevant past session context into new conversations, eliminating the need to manually remind assistants of project details.
  mental_damage: You can no longer blame your assistant's short-term memory loss for the fact that it keeps hallucinating your variable names.
  tags:
    - mcp
