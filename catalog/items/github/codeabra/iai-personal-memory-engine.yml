insights:
  summary: A local memory server that provides long-term, verbatim conversation recall for Claude and other MCP-compatible assistants.
  why_it_matters: It removes the need to manually remind assistants of previous context by automatically capturing and injecting relevant historical conversation slices into new sessions.
  mental_damage: The relief of not having to say 'remember that thing from three days ago' is slightly offset by the anxiety of a local database recording every single prompt you've ever sent.
  tags:
    - claude-code
    - context-engineering
    - local-ai
    - long-term-memory
    - mcp
    - memory
    - retrieval
  confidence: high
curation:
  status: included
  reason: The tool's core novelty is a memory and retrieval system designed to shape the context provided to an LLM.
  evidence:
    - Claims verbatim recall >= 99% via a local LanceDB and embedding-based architecture
    - Uses capture and recall hooks to automate context injection at session start
    - Primary identity is a 'memory system' rather than a generic MCP implementation
    - README describes it as a 'local memory layer' that captures session turns and serves a 'small slice of relevant memory'
    - Focuses on technical metrics like 'verbatim recall' and 'p95 latency'
    - Provides an automated pipeline for embed -> dedup -> encrypted insert
