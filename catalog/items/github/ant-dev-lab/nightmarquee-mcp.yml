          🎖️ 📇 ☁️ 🍎 🪟 🐧 - Art-directed website prompts as slash commands: hero sections, landing pages, SaaS,
          portfolio, e-commerce and 3D/WebGL scenes. Every build is registered as a real MCP prompt, so it lands in the
          command palette instead of waiting for the model to think of it, and is written natively for the tool you are
          in (Lovable, Bolt, Cursor or Claude). Each one has a live demo you can scroll before spending a token. Free
          prompts need no account; sign in from the session to unlock the rest. Install via NPM: `npx -y nightmarquee`
