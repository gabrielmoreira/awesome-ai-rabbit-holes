        surrounding_text: "- [dbhq-uk/heliograph](https://github.com/dbhq-uk/heliograph) [![dbhq-uk/heliograph MCP server](https://glama.ai/mcp/servers/dbhq-uk/heliograph/badges/score.svg)](https://glama.ai/mcp/servers/dbhq-uk/heliograph) 🏎️ 🏠 🍎 🪟 🐧 - Run commands on a machine you cannot SSH into. Publishes a step to a transport the far side already reaches (git, file share, S3-compatible storage, relay or a carried file); the whole run comes back as a log with every line timestamped in UTC, whether it passed or failed. For air-gapped, bastion-only and change-controlled estates: no tunnel, no proxy, nothing held open. The gates live on the far side, so a tool call can ask but cannot authorise. `heliograph mcp`."
