insights:
  summary: A tool for executing auditable, remote commands on machines without direct SSH access via specialized transport protocols.
  why_it_matters: It enables AI agents and developers to perform investigations and tasks in air-gapped or highly restricted environments where traditional login access is prohibited.
  mental_damage: Because even your AI agent shouldn't be blocked by the same security policies that keep you out of production.
  tags:
    - remote-execution
    - mcp
    - ai-agents
    - devops
    - air-gapped
  confidence: high
curation:
  status: included
  reason: It acts as a capability extension that augments existing AI agents with the ability to interact with remote, restricted machines.
  evidence:
    - README identifies it as a way to run code on machines you cannot log into
    - Explicitly provides 'agent skills' for Claude Code, Codex, and Cursor
    - Uses MCP to allow agents to bridge the gap to remote environments
