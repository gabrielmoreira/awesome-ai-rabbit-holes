  summary: Lighteval is an all-in-one toolkit for evaluating LLMs across multiple backends, supporting 1000+ tasks and custom metrics.
  why_it_matters: Developers can rigorously benchmark and debug model performance with detailed, sample-by-sample results across diverse domains and languages.
