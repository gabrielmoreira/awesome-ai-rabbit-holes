insights:
  summary: A minimal library from Hugging Face for building and running LLM agents that execute actions as code rather than JSON tool calls.
  why_it_matters: Developers can spin up code-writing agents with a few lines of Python, hook into any LLM provider, and pull reusable tools directly from the Hugging Face Hub.
  mental_damage: Another day, another 'barebones' framework proving that the fastest way to ship an agent is to wrap a while-loop in a library and call it production-ready.
