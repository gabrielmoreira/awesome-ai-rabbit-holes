  status: included
  reason: LeRobot is a code-first SDK and library for implementing robotic policies rather than a managed orchestration workbench.
  evidence:
    - Python-native interface with pip-installable library
    - Standardized LeRobotDataset format for scalable training
    - Unified Robot class for hardware-agnostic control
