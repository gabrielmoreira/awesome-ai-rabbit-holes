insights:
  summary: AGENTS.md is an open format specification for creating dedicated markdown files that provide context, instructions, and rules to guide AI coding agents within a project.
  why_it_matters: It offers a standardized, predictable way to teach coding agents about your repo's environment, testing, and PR conventions without relying on ad-hoc prompt injection.
  mental_damage: We have officially progressed from writing code to writing README files for the robots that write our code, and somehow this feels like progress.
