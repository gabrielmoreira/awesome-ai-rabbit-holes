insights:
  summary: An MCP server that captures C# exceptions and build errors in Godot Engine, enriches them with Roslyn-powered source context, and exposes the telemetry to AI assistants.
  why_it_matters: It collapses eight turns of AI debugging into one by giving the assistant the actual method body, caller chain, and scene state instead of a naked stack trace.
  mental_damage: We have successfully built a tool to make the AI stop asking us to open the files we were already looking at.
