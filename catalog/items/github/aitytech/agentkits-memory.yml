  summary: A persistent, local memory system for AI coding assistants implemented as an MCP server.
  why_it_matters: It allows coding assistants like Claude Code and Cursor to retain context, decisions, and patterns across different coding sessions.
  mental_damage: Because apparently, we've reached a point where our primary struggle is that our AI partners have the long-term memory of a goldfish.
