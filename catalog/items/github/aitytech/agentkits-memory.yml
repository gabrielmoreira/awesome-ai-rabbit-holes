insights:
  summary: A local MCP-based memory server that persists coding decisions, errors, and context across sessions for AI assistants like Claude Code, Cursor, and Cline using SQLite.
  why_it_matters: It addresses the 'amnesiac assistant' problem by injecting relevant past decisions and patterns into new sessions, reducing the need to re-explain codebase context.
  mental_damage: We have finally solved the problem of AI assistants forgetting our bad decisions by building a local database specifically designed to remember them forever.
