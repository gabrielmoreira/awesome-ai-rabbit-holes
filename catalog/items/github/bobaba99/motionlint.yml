insights:
  summary: A CLI and MCP server that performs deterministic motion audits and vision-LLM design reviews for web animations.
  why_it_matters: It bridges the 'vision gap' for AI coding agents, allowing them to validate the actual visual motion and UX of a running app rather than just reading the CSS.
  mental_damage: Because nothing says 'modern development' like having an LLM audit your easing curves to ensure your loading spinners aren't accidentally causing existential dread.
  tags:
    - motion-design
    - mcp
    - qa-automation
    - ui-testing
    - claude-code
  confidence: high
curation:
  status: included
  reason: The tool functions as a capability provider that augments coding assistants like Claude Code and Cursor with specialized visual/motion QA workflows.
  evidence:
    - Acts as an MCP server to feed visual design findings back into the coding agent loop
    - Provides deterministic animation measurement via Playwright
    - Solves the problem of AI agents being 'blind' to what the user actually sees
