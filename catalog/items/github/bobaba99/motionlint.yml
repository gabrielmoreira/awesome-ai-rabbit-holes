insights:
  summary: >-
    MotionLint is a CLI tool that performs deterministic motion audits and vision-LLM design reviews of web animations
    via Playwright and MCP integration.
  why_it_matters: >-
    It closes the gap between AI coding agents and visual output by measuring actual animation behavior and feeding
    ranked findings back into the developer workflow.
  mental_damage: Finally, a way to make your AI pair programmer feel guilty about that 600ms modal it swore was 'subtle'.
  tags:
    - animation
    - linting
    - mcp
    - claude-code
    - developer-tools
  confidence: high
curation:
  status: included
  reason: >-
    MotionLint primarily functions as an MCP server and CLI tool that extends Claude Code and Cursor with animation
    audit and vision-LLM review capabilities, making it an add-on rather than a standalone coding agent.
  evidence:
    - Runs as an MCP server inside Claude Code and Cursor per README
    - Provides deterministic motion audit and vision-LLM design review as additive features to coding agents
    - Primary identity is enhancing existing agents with motion analysis, not autonomous coding
