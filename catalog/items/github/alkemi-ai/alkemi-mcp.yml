insights:
  summary: A STDIO Model Context Protocol server that connects MCP clients to Alkemi Data, allowing plain-English queries against databases like Snowflake and BigQuery via stored metadata and query generation.
  why_it_matters: It lets teams expose shared database access to AI agents without duplicating schema knowledge or prompt engineering across every client and user.
  mental_damage: We have successfully abstracted the database so heavily that you now need a bearer token, a product ID, and an MCP wrapper just to ask a question you used to answer with `SELECT *`.
