insights:
  summary: A session-scoped knowledge graph engine that compresses long AI chat histories into compact, typed context summaries automatically ingested by Copilot, Claude Code, and Cursor.
  why_it_matters: It slashes token burn by distilling 40k-token sessions into ~350-token graphs, letting developers maintain coherent long-running conversations with coding assistants without hitting context limits or paying to resend full history every turn.
  mental_damage: You already paid to generate the 40k tokens, and now you need a second AI to summarize them so the first AI can afford to keep talking to you.
  tags:
    - context-compression
    - knowledge-graph
    - memory
    - cli
    - mcp-server
  confidence: medium
curation:
  status: included
  reason: The product's entire identity is a graph-based memory and compression layer for AI context, not a host integration or MCP-first toolkit, making Prompt & Context Engineering the clear home.
  evidence:
    - README defines the product as a 'Session-scoped knowledge graph engine for AI chat context compression' with a core workflow of compressing 40k+ tokens into ~300–800 token graphs.
    - Value lives in the distillation algorithm and memory graph, while delivery to assistants is a passive file-write to copilot-instructions.md or CLAUDE.md.
    - MCP server is explicitly optional and secondary ('No MCP server required for the core workflow'), ruling out MCP Servers & Tooling as the primary category.
