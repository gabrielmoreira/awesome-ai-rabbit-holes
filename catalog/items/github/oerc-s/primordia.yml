  reason: The product's MCP server exposing settlement, netting, and balance-sheet tools to Claude, Cursor, and Windsurf is a first-class artifact alongside its SDK and runtime, making it a domain-specific MCP server rather than a generic fintech platform.
  evidence:
    - README explicitly publishes `npx @primordia1/mcp-server` with MCP config and lists tools like `verify_receipt` and `net_receipts`.
