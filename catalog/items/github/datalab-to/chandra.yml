insights:
  summary: Chandra OCR 2 is an open-weight document intelligence model that converts images and PDFs into structured HTML, Markdown, or JSON while preserving complex layouts, tables, and handwriting.
  why_it_matters: Developers building RAG pipelines, document processors, or data-ingestion layers can self-host or API-call a state-of-the-art OCR that outperforms common benchmarks across 90+ languages.
  mental_damage: Another essential piece of the modern stack that forces you to admit your 'AI-ready' data pipeline was mostly wishful thinking and regex.
