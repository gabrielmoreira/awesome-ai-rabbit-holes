insights:
  summary: An MCP server that wraps the Claude Code CLI as a subprocess to expose its querying, search, and structured output capabilities to MCP-compatible clients like Gemini CLI, Codex, Cursor, and VSurf.
  why_it_matters: It allows developers to plug Claude's coding and reasoning capabilities into other AI agents and editors that lack shell access or need structured JSON output with cost tracking.
  mental_damage: We have finally reached the point of writing middleware to let our AI assistants ask other AI assistants for help, because apparently collaboration is easier than picking one tool.
