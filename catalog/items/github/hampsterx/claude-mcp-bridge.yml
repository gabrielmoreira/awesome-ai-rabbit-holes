insights:
  summary: An MCP server that wraps the Claude Code CLI as a subprocess to expose its coding and web search capabilities to other MCP clients like Gemini CLI, Codex, Cursor, and VS Code.
  why_it_matters: It lets developers use Claude Code's reasoning and web search tools directly inside non-Anthropic environments like Gemini CLI or Cursor without shell access.
  mental_damage: We have now reached the point where we need a dedicated bridge to let our AI agents impersonate each other inside tools that already claim to be AI-powered.
