insights:
  summary: sagecli is a bash-based Unix-native control plane for orchestrating AI coding agent CLIs like Claude Code, Gemini CLI, and Codex.
  why_it_matters: It lets developers swap between or run multiple AI coding agents in parallel without lock-in, using only bash, jq, and tmux.
  mental_damage: Finally, a tool that treats AI agents like Unix processes — now we just need to remember which one we blamed for the broken build.
