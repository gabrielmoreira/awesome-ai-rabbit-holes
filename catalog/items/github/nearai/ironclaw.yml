  summary: >-
    IronClaw is an open-source, Rust-based personal AI agent OS that runs locally with WASM sandboxing, persistent
    memory, and multi-channel interfaces for secure task automation.
  why_it_matters: >-
    It offers developers a self-hosted alternative to cloud-bound assistants with strong security guarantees, dynamic
