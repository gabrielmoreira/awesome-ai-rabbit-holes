insights:
  summary: Voyager is a research-oriented, LLM-powered embodied agent that uses GPT-4 to continuously learn, write code, and play Minecraft without human intervention.
  why_it_matters: It demonstrates a practical implementation of an automatic curriculum and growing skill library using code generation as an action space for lifelong learning agents.
  mental_damage: Finally, a framework that writes its own code to play a block game, proving that even our agents are now contributing to the 'unfinished side-project' ecosystem.
