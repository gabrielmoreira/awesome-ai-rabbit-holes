insights:
  summary: A terminal UI for browsing, searching, and converting conversation sessions between different AI coding agents like Claude Code, Codex, and Gemini CLI.
  why_it_matters: It solves the fragmentation of AI agent history by allowing developers to switch between different agents without losing the conversational context of a session.
  mental_damage: Because having your productivity trapped in a proprietary dot-directory was clearly the only thing missing from your workflow.
