insights:
  summary: Figwright is a bidirectional MCP server and Figma plugin that enables AI agents to read and write Figma designs while generating framework-aware code.
  why_it_matters: It lets developers use Claude Code, Cursor, or any MCP client to directly implement and edit designs in Figma without requiring a paid Dev Mode seat.
  mental_damage: Finally, a way to make your AI assistant feel useful while it redraws your button for the twelfth time because it still doesn’t understand your design system.
  tags:
    - mcp
    - figma
    - design-to-code
    - bidirectional
    - codegen
  confidence: high
curation:
  status: included
  reason: Figwright primarily augments MCP clients like Claude Code and Cursor with bidirectional Figma access, making it an extension rather than a standalone coding agent or app builder.
