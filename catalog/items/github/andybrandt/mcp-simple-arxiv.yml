insights:
  summary: An MCP server that exposes arXiv search, paper metadata, and full-text PDF-to-Markdown retrieval to LLM clients.
  why_it_matters: It plugs academic literature directly into the coding-assistant workflow, letting developers search and read papers without leaving their agent chat.
  mental_damage: We have now protocolized the final link between 'I should read the paper' and 'Claude, just tell me if it's worth my weekend.'
