insights:
  summary: An MCP server that analyzes dependency lockfile diffs and Dependabot PRs to produce ranked upgrade plans with semver classification, breaking changes, CVE fixes, and migration links.
  why_it_matters: It lets coding assistants reason about dependency risk automatically instead of forcing developers to manually cross-reference release notes and security advisories.
  mental_damage: Your AI assistant can now tell you exactly how badly that transitive npm package will ruin your weekend, sparing you the spiritual journey of reading GitHub release notes.
