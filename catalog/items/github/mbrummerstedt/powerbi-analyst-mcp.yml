insights:
  summary: A local MCP server that connects LLMs like Claude to Power BI semantic models, allowing AI agents to run DAX queries and analyze data directly.
  why_it_matters: It allows developers and analysts to delegate complex, multi-step data exploration to an agent that can query large datasets and synthesize findings without manual DAX translation.
  mental_damage: Finally, a way to let an LLM hallucinate insights about your margin decline after crashing its context window with 73,000 rows of CSV data.
