  summary: A local server that captures browser tab screenshots via a companion extension and serves them to MCP-capable LLM clients.
  why_it_matters: It provides a privacy-preserving, local bridge for AI agents to 'see' the developer's current browser state without routing sensitive data through a third-party proxy.
  mental_damage: We've reached the era where the only way to give an AI vision is to maintain a dedicated background daemon that stacks WebP files on your local disk.
