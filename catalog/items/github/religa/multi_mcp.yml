insights:
  summary: An MCP server that connects to Claude Code or OpenCode to orchestrate multiple AI models (OpenAI, Anthropic, Google) for parallel code review, security analysis, and multi-agent consensus.
  why_it_matters: It lets developers automatically cross-check code quality and security findings across different LLMs in parallel, directly inside their existing coding assistant workflow.
  mental_damage: Because nothing says 'confident in my code quality' like needing three different LLMs to argue with each other before you merge a PR.
