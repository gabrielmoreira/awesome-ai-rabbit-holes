insights:
  summary: A terminal UI that connects existing AI coding assistants to task trackers and runs them autonomously through a prioritized task list.
  why_it_matters: It lets developers define a PRD or task list and then delegate execution to their preferred CLI agent (Claude Code, Cursor CLI, Gemini CLI, etc.) while providing real-time visibility and session persistence.
  mental_damage: We have successfully reached the point where we need a dedicated terminal UI to coordinate the agents that are already coordinating our code, effectively turning software development into middleware management.
  tags:
    - terminal-ui
    - task-orchestration
    - autonomous-loop
    - cli-agents
  confidence: high
curation:
  status: included
  reason: The product is a TUI workbench that coordinates multiple external coding agents through task lists and autonomous loops, rather than being a coding assistant itself.
  evidence:
