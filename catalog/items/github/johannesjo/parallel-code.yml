insights:
  summary: A desktop workbench that dispatches Claude Code, Codex, and Gemini CLI in parallel across isolated git worktrees, with a GUI for diff review and merge management.
  why_it_matters: It lets developers run multiple AI coding agents on separate features simultaneously and review each branch's diffs in one place, reducing sequential wait times and branch conflicts.
  mental_damage: You can now race ten agents against each other and still end up reviewing code written by whichever one hallucinated the least.
