insights:
  summary: A desktop orchestration tool for running Claude Code, Codex, Gemini, and Copilot CLI in parallel, each isolated in its own git worktree for concurrent task execution and diff review.
  why_it_matters: It lets developers dispatch multiple AI agents on separate features simultaneously while keeping changes isolated, auditable, and mergeable from a single keyboard-driven interface.
  mental_damage: You now have ten agents, ten branches, and a renewed sense that your job is less 'writing code' and more 'managing a small, very confident workforce of context-window tenants.'
