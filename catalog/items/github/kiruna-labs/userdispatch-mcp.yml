insights:
  summary: UserDispatch is a feedback widget and hosted MCP server that allows AI coding agents to read user submissions, triage issues, reply to users, and draft PRs automatically.
  why_it_matters: It closes the loop between end-user feedback and AI-assisted development workflows by giving coding agents structured access to real user input across major editors and IDEs.
  mental_damage: Your users report bugs, and your AI agent politely closes them with a PR and a generic reply, while you wonder if you’re still the developer or just the guy who configured the widget.
