insights:
  summary: A CodeMirror extension that implements the Model Context Protocol to enable resource mention autocomplete and visual decorations within the editor.
  why_it_matters: It allows developers to integrate MCP resource mentions and prompt commands directly into custom CodeMirror-based editors or notebooks.
  mental_damage: Now you can sprinkle `@resource` mentions into your local notebook editor while wondering if you're building software or just decorating text.
