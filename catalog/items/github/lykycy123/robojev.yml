        surrounding_text: >-
          - [**RoboJEV**](https://github.com/lykycy123/RoboJEV) — RoboJEV is a small, inspectable robotics laboratory.
          JEV receives \*\*structured simulator state, not images\*\*, selects an immediate intent, then selects X/Y/Z
          directions and a gripper command. A Cartesian controller executes the action using real MuJoCo contacts. Each
          task has independent physical success checks; model answers cannot declare success.
