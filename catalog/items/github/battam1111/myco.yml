insights:
  summary: Myco is a living cognitive substrate and MCP server that converts raw notes, code, and documentation into a self-maintaining filesystem graph with 20 agent-driven verbs for ingestion, digestion, and evolution.
  why_it_matters: It lets agents maintain their own long-term memory and project context as editable markdown and YAML, avoiding framework migrations and zero-state conversation restarts.
  mental_damage: You now have a self-evolving mycelium graph that ingests everything you write and, true to its design, can rewrite its own rules when it decides your workflow is no longer worthy of its current shape.
  tags:
    - agent-memory
    - mcp
    - context-engineering
    - knowledge-graph
  confidence: high
curation:
  status: included
  reason: The core novelty is a memory and context-shaping system that lives as an agent-editable filesystem graph, which fits Prompt & Context Engineering even though it ships an MCP server interface.
  evidence:
    - README states it is 'a living cognitive substrate' focused on ingestion, digestion, and self-evolution of knowledge, not a primary coding assistant.
    - Exposes an MCP server for agent access, but MCP is an interface, not the core product identity, which is memory and context management.
    - Provides 20 agent-driven verbs (hunger, eat, assimilate, immune, fruit, molt) for managing a knowledge graph of notes, code, and decisions.
