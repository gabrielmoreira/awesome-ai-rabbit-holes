insights:
  summary: Myco is a self-evolving knowledge subgraph and memory layer that runs as a CLI and MCP server, allowing AI agents to ingest, digest, and restructure their own long-term context on the filesystem.
  why_it_matters: It gives coding agents a persistent, auto-maintaining memory graph so developers can stop rewriting context and stop migrating frameworks every few months.
  mental_damage: "You have finally automated the one thing that was still human: the crushing existential dread of maintaining your own notes."
  tags:
