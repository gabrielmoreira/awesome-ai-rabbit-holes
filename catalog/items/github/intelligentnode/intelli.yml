insights:
  summary: A Python framework for building multi-model chatbots and agent workflows with unified provider access, sequential/graph flows, and MCP support.
  why_it_matters: Developers can swap between OpenAI, Anthropic, Gemini, and local models with minimal code changes while composing multi-step agent flows.
  mental_damage: Another unified abstraction layer promising seamless provider switching, just in case the ten other unified abstraction layers didn't quite unify hard enough.
  tags:
    - python
    - multi-model
    - agent-flows
    - mcp
    - framework
  confidence: medium
curation:
  status: included
  reason: The project is a code-first Python SDK for building chatbots and agent workflows, used by importing classes and scripting flows rather than operating a control plane.
  evidence:
    - README shows imports like `from intelli.flow import Agent, Task, SequenceFlow` and `pip install intelli`, confirming a code-first SDK.
    - Description states it is 'A framework for creating chatbots and AI agent workflows' with multi-provider access.
    - Includes MCP support via `pip install 'intelli[mcp]'`, but MCP is an integration feature rather than the product identity.
