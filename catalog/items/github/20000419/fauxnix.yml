        surrounding_text: "- [20000419/fauxnix](https://github.com/20000419/fauxnix) [![20000419/fauxnix MCP server](https://glama.ai/mcp/servers/20000419/fauxnix/badges/score.svg)](https://glama.ai/mcp/servers/20000419/fauxnix) 📇 🏠 🪟 - bash for AI agents on Windows via deterministic bash→PowerShell translation — no WSL, VM, or bash toolchain. MCP `bash` tool with GNU-style output, bash-style errors, coreutils exit codes, session-persisted cwd/env across calls, and per-file UTF-8/GBK sniffing (GBK files grep correctly, unlike Git Bash). Unsupported bash constructs fail loudly with the construct named; native commands (git/node/npm) pass through with argv quoting. `npm install -g fauxnix-cli`; verified with Claude Code, Codex, OpenCode, Kimi Code and Qwen Code."
