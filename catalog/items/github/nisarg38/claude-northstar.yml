insights:
  summary: A goal-oriented development framework for CLI agents like Claude Code that allows developers to share a project vision and milestones, enabling the agent to work autonomously across planning, implementation, and review.
  why_it_matters: It shifts the developer workflow from micromanaging individual tasks to defining high-level goals, letting the agent handle milestone planning, execution, and QA loops independently.
  mental_damage: We have finally solved the problem of having to type 'what's next?' by installing a framework that requires us to meticulously document our dreams in a north-star.md file instead.
