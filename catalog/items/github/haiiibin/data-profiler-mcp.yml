insights:
  summary: An MCP server that provides schema, statistics, and data quality profiling for tabular files such as CSV, Parquet, Excel, and JSON.
  why_it_matters: It allows LLM agents to automatically inspect and understand datasets without requiring developers to manually paste dataframe summaries into the chat.
  mental_damage: Because we've reached a point where we need an agent to tell us if a CSV has null values.
