insights:
  summary: A deterministic GitHub repository analyzer that produces structured JSON covering tech stack, dependencies, architecture, health, and security signals, exposed as a Python library, CLI, REST API, and MCP server.
  why_it_matters: Developers and AI agents can programmatically ingest consistent repo metadata to power health checks, dependency audits, and context-aware coding workflows without relying on probabilistic LLM outputs.
  mental_damage: We have finally built a tool that perfectly summarizes a repository’s health without hallucinating, which frees up even more of our day to argue about whether we should feed its output into an LLM anyway.
