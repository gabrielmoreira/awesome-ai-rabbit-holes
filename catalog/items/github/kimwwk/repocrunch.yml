insights:
  summary: A deterministic Python tool that analyzes public GitHub repositories and outputs structured JSON covering tech stack, health, and security signals, with optional MCP server mode.
  why_it_matters: It gives coding agents and developer workflows clean, machine-readable repo context without the cost, latency, or unpredictability of LLM-based analysis.
  mental_damage: We have finally achieved the futuristic milestone of using Python scripts to do what a competent junior could do in thirty seconds, just so our agents can argue with JSON instead of people.
