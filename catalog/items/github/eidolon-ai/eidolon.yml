    - agents
    - sdk
    - python
    - services
    - modular
  confidence: medium
curation:
  status: included
  reason: The project is primarily a code-first SDK and server used by developers to script and run agentic services, fitting the Frameworks & SDKs identity rather than a standalone coding assistant or orchestration platform.
  evidence:
    - Repo description explicitly calls it a 'pluggable Agent SDK and enterprise ready, deployment server for Agentic applications'.
