insights:
  summary: Deterministic slop detector for AI-generated prose that flags filler phrases via a rule-based CLI and optional MCP server.
  why_it_matters: Developers who gate AI-drafted docs and changelogs in CI get a repeatable, model-free score and exit code instead of vague 'this sounds AI' feedback.
  mental_damage: Finally, a linter for the vague corporate adverbs your AI insists on sprinkling through every pull request description.
