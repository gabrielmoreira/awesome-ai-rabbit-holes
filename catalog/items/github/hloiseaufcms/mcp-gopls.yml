insights:
  summary: An MCP server that exposes Go's gopls language server features—including navigation, diagnostics, testing, and coverage—to AI assistants via the Model Context Protocol.
  why_it_matters: It gives coding agents deep, structured access to Go tooling so they can refactor, test, and navigate Go codebases with proper LSP precision instead of guessing.
  mental_damage: We now need an MCP server to let the AI use the language server that was already there to help the human who is increasingly just reviewing the AI's LSP-powered guesswork.
