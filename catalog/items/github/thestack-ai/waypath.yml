insights:
  summary: A local-first CLI and MCP server that gives coding agents like Claude Code and Codex persistent, graph-aware memory backed by a single SQLite database with promotion and review governance.
  why_it_matters: It lets developers maintain a canonical, reviewable memory layer across sessions without relying on cloud services or vector blobs that silently hallucinate.
  mental_damage: We have ascended from prompting assistants to carefully reviewing and promoting the memories of our assistants so they do not forget the architectural crimes we committed last Tuesday.
  tags:
    - memory
    - mcp
    - local-first
    - cli
    - context
  confidence: medium
