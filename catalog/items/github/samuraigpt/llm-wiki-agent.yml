insights:
  summary: A reusable skill pack that turns Claude Code, Codex, Gemini CLI, or OpenCode into a self-building personal wiki by ingesting documents and maintaining interlinked markdown pages with knowledge graphs.
  why_it_matters: It packages a complete RAG-style knowledge management workflow as portable slash commands and agent configs, letting developers reuse a structured memory system across multiple coding agents without building it themselves.
  mental_damage: We have reached the point where the agent needs its own agent to remember what the agent did with the documents you fed the agent so you do not have to write notes like a Victorian clerk.
  tags:
    - knowledge-base
    - claude-code
    - skills
    - wiki
    - rag
  confidence: high
