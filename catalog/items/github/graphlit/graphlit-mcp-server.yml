insights:
  summary: An MCP server that connects MCP clients to the Graphlit platform for knowledge ingestion, retrieval, and RAG workflows.
  why_it_matters: Developers can ingest and search across diverse data sources (Slack, GitHub, Notion, etc.) directly from MCP-compatible clients like Cursor or Windsurf.
  mental_damage: Now your AI assistant can crawl your entire digital life, but good luck explaining why it cited that one Slack thread from 2022.
