insights:
  summary: An MCP server that connects AI clients like Cursor and Claude Code to the Graphlit platform for ingesting, searching, and retrieving knowledge from a wide range of developer tools and documents.
  why_it_matters: It allows developers to pipe data from Slack, GitHub, Jira, and cloud storage directly into their coding assistant's context as a RAG-ready knowledge base without custom glue code.
  mental_damage: We have reached the point where we need a dedicated protocol server just to manage the sprawling chaos of our own productivity tool subscriptions so the AI can hallucinate with more accurate source material.
  tags:
