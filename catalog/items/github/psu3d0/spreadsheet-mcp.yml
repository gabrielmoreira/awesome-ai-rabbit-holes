insights:
  summary: A Rust-based MCP server, CLI, and SDK that gives LLM agents a token-efficient, stateful way to read, analyze, and safely mutate Excel workbooks without UI automation.
  why_it_matters: It replaces brittle screenshot-based spreadsheet workflows with deterministic JSON contracts, dry-run edits, recalc loops, and diff proofs tailored for agent tool use.
  mental_damage: We have finally built a safe, event-sourced way for agents to mutate your financial models, which is definitely the most comforting possible use of recursive LLM loops.
