insights:
  summary: A Model Context Protocol server built with Deno and TypeScript that provides AI agents with real-time access to Terragrunt documentation and GitHub issues.
  why_it_matters: It solves the poor IDE support for Terragrunt by feeding LLMs accurate, up-to-date documentation and issue context instead of relying on hallucination-prone training data.
  mental_damage: We have successfully abstracted infrastructure definitions to the point where we now need a dedicated protocol server just to ask an AI what a configuration block does.
