insights:
  summary: OpenChat is an archived chatbot console for creating and managing multiple customized GPT-based chatbots with support for ingesting codebases, PDFs, and websites as data sources.
  why_it_matters: It offered developers a way to spin up specialized chatbots using their own codebase or documentation as context, and embed them into internal tools or websites.
  mental_damage: Another valiant attempt to centralize our LLM workflows that now sits frozen in time, proving even chatbot consoles have a half-life shorter than a GPT-4 context window.
