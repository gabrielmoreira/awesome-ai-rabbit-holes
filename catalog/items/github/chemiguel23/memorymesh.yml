  summary: A local knowledge graph server that implements the Model Context Protocol (MCP) to provide structured, schema-driven memory persistence for AI models and agents.
  why_it_matters: It allows developers to give their local AI agents a persistent, structured long-term memory that can be strictly defined via schemas, moving beyond flat chat history.
