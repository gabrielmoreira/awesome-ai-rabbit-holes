insights:
  summary: A code intelligence backend that builds a queryable knowledge base from your codebase via CLI, HTTP API, and MCP server to support impact analysis, architecture mapping, and semantic navigation for AI assistants.
  why_it_matters: It gives AI coding tools precise blast-radius analysis, ownership lookup, and dead-code detection so they stop guessing with grep and hallucinating impact.
  mental_damage: We've built a system to map every line of code and every decision just so the LLM can confidently tell us which three files to break next.
