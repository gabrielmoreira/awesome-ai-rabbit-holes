insights:
  summary: Model Search is an archived Google framework that implements AutoML algorithms to automatically search for optimal neural network architectures for classification problems.
  why_it_matters: It allows researchers to automate the exploration of DNN architectures, ensembles, and distilled models without manually tuning layers and structures.
  mental_damage: We automated the architecture search so you can spend your newfound free time debating whether AutoML is just a fancy way of admitting we don't know why our models work either.
