  summary: An open-source, code-first Python framework for building, evaluating, and deploying modular multi-agent systems with support for tools, MCP integration, and deployment to Vertex AI or Cloud Run.
  why_it_matters: Developers can define agent logic, tools, and orchestration entirely in Python while retaining the flexibility to target Gemini, other LLMs, and scalable deployment pipelines.
  mental_damage: The good news is you can finally orchestrate a hierarchy of agents to argue about your requirements before deploying them to the cloud.
