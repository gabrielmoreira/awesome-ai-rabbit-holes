  summary: Open source vulnerability database and triage service for open source projects and dependencies.
  why_it_matters: Developers can scan dependencies, lockfiles, SBOMs, or git repos against a comprehensive vulnerability database to identify known security issues.
  mental_damage: Finally, a way to turn your dependency graph into a vulnerability graph—because nothing says 'modern development' like a new CVE every time you run `npm install`.
