insights:
  summary: LiteLLM is an open-source AI gateway that provides a unified OpenAI-compatible API to call 100+ LLM providers with cost tracking, guardrails, and load balancing.
  why_it_matters: It eliminates vendor lock-in and integration friction when switching between LLMs, letting developers write provider-agnostic code.
  mental_damage: The quiet dread of realizing you’ve built your entire LLM abstraction layer on top of someone else’s LLM abstraction layer.
  tags:
    - llm-gateway
    - openai-compatible
    - ai-proxy
  confidence: high
