insights:
  summary: LiteLLM is a Python SDK and self-hostable proxy (AI gateway) that provides an OpenAI-compatible interface to call 100+ LLM providers with centralized logging, cost tracking, and routing features.
  why_it_matters: It lets developers standardize LLM integrations across vendors (auth, request/response shape, errors) and add production controls like spend tracking, guardrails, and load balancing without rewriting app code per provider.
  mental_damage: Nothing says “simple abstraction” like needing an AI gateway so you can swap twelve “OpenAI-compatible” APIs that are each compatible in their own special way.
  tags:
    - llm-gateway
    - openai-compatible
    - proxy-server
    - llmops
    - cost-tracking
  confidence: high
