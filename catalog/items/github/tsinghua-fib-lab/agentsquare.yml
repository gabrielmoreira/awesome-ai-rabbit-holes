insights:
  summary: Research codebase that implements AgentSquare, an automatic search method for composing and optimizing modular LLM agent designs across academic benchmarks.
  why_it_matters: It systematizes agent architecture into swappable planning, reasoning, and memory modules, then searches the combinatorial space to find stronger configurations for reproducible agent meta-design.
  mental_damage: Your handcrafted reasoning chain is now just a hyperparameter in someone else's modular grid search, and the leaderboard doesn't care about your prompt aesthetic.
