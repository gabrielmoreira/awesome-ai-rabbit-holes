insights:
  summary: An MCP server and background daemon that analyzes codebases to rank files by importance, map dependencies, and extract symbols, exposing this context to AI assistants via the Model Context Protocol.
  why_it_matters: It gives coding agents structured, real-time awareness of code structure and call graphs so they can answer "what does this file do?" without brute-forcing the entire repo context window.
  mental_damage: We have finally built infrastructure so your AI can pretend to understand your codebase without actually reading it, which is, coincidentally, also how most onboarding docs work.
  tags:
    - mcp
    - codebase-analysis
    - context-engineering
    - file-importance
    - dependency-mapping
  confidence: high
