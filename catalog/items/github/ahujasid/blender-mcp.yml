insights:
  summary: A Model Context Protocol server and Blender addon that lets Claude and other MCP-compatible assistants create, modify, and inspect 3D scenes inside Blender via socket-based commands.
  why_it_matters: It turns a standard 3D tool into a programmable surface for AI assistants, letting developers script and iterate on Blender scenes through natural language instead of manual Python.
  mental_damage: You now have a direct path to debugging UV maps via Claude Desktop, because apparently the natural next step after AI wrote your backend is letting it rebuild your rendering pipeline.
