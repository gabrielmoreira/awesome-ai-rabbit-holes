insights:
  summary: An MCP server and Blender addon that connects Claude and other MCP-compatible assistants to Blender for prompt-assisted 3D modeling, scene manipulation, and Python code execution.
  why_it_matters: Developers working with 3D pipelines can control Blender scenes, assets, and materials directly from their AI assistant inside Claude, Cursor, or VS Code.
  mental_damage: "We have finally achieved the platonic ideal of modern developer life: installing a socket server, an addon, a package manager, and editing a JSON config just to politely ask an AI to move a cube."
