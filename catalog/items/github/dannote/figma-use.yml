insights:
  summary: A CLI tool that gives AI agents full read/write access to Figma via terminal commands or JSX, enabling layout creation, styling, and export without official plugin limitations.
  why_it_matters: It closes the edit gap left by Figma's official MCP plugin, letting agents programmatically manipulate designs using compact CLI calls or familiar React-like JSX.
  mental_damage: We have successfully reached the point where LLMs are writing React components that compile into Figma layers so we don't have to open the design tool we pay for.
  tags:
    - figma
    - cli
    - ai-agents
    - design-automation
  confidence: high
