  summary: An MCP server that fetches up-to-date README documentation for npm packages directly from GitHub repositories or bundled package tarballs for use in IDEs like Cursor.
  why_it_matters: It replaces outdated IDE suggestions with the latest package documentation, reducing errors caused by deprecated APIs and improving the development experience.
  mental_damage: Because nothing says 'modern development' quite like needing a dedicated protocol server to ask an AI what the README for lodash actually says today.
