insights:
  summary: A TypeScript MCP server that provides AI assistants with direct access to Austria's official legal database (RIS) to search federal laws, state laws, and court decisions.
  why_it_matters: It allows developers building legal-tech workflows or working in Austrian jurisdictions to ground their AI assistants in authoritative, real-time government legal data without custom API wrappers.
  mental_damage: You can now ask an LLM about tenancy rights in Salzburg and get a hallucination-free answer, provided you've already configured a local Node server to talk to the government.
  tags:
    - mcp
    - legal-tech
    - typescript
    - austria
    - local-server
  confidence: high
