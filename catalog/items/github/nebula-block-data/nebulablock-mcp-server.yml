  summary: An official MCP server that exposes the full NebulaBlock API as tools using the fastmcp library for use in MCP-compatible clients.
  why_it_matters: Developers using MCP clients like VS Code can integrate NebulaBlock's cloud platform capabilities directly into their AI-assisted workflows without custom glue code.
  mental_damage: We now have a protocol to talk to a server that talks to an API, proving that no layer of indirection is too absurd when MCP is involved.
