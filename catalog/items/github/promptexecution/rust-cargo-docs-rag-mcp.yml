insights:
  summary: An MCP server that provides LLMs with tools to look up Rust crate documentation using RAG over rustdocs and rust-analyzer data.
  why_it_matters: It gives coding agents precise, real-time access to Rust API documentation so they stop hallucinating crate interfaces and method signatures.
  mental_damage: We have reached the point where the documentation for a systems programming language must be re-indexed by a vector database so that an LLM can pretend it knows how to use it.
