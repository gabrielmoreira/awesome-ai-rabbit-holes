insights:
  summary: An MCP server that exposes Just command runner recipes to AI assistants, allowing them to discover, inspect, and execute project tasks via the Model Context Protocol.
  why_it_matters: It lets agents run build and automation tasks through a structured Justfile interface instead of fumbling through bash, preserving context and reducing the risk of hallucinated shell commands.
  mental_damage: We have successfully abstracted the abstraction so that the LLM doesn't have to read the file that was designed so humans wouldn't have to read the shell script.
