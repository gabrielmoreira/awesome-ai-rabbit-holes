insights:
  summary: >-
    XRAY MCP is a Model Context Protocol server that provides AI assistants with structural code intelligence, including
    project mapping, symbol search, and impact analysis powered by ast-grep.
  why_it_matters: >-
    It solves the 'I can't see your code structure' problem for coding agents by allowing them to perform structural
    analysis and impact assessment directly within a repository.
  mental_damage: >-
    We have reached the point where our AI tools need their own dedicated plugins just to figure out which functions
    will break when they inevitably rewrite the authentication logic.
