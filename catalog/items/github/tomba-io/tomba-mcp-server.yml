  summary: A Model Context Protocol server that exposes Tomba.io's email discovery, verification, and enrichment APIs as tools, resources, and prompts for LLM clients.
  why_it_matters: Developers can wire domain search, email verification, lead enrichment, and company research directly into Claude Desktop or other MCP-compatible assistants instead of writing API glue code.
