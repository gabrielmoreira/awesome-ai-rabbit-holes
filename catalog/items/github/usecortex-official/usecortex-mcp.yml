insights:
  summary: An MCP server that connects AI coding agents to the UseCortex SaaS, enabling persistent, encrypted knowledge storage and retrieval across MCP-compatible tools.
  why_it_matters: It allows coding agents to maintain a shared, structured memory of architectural decisions and standards outside their limited context windows, reducing repetitive re-explanation across sessions and tools.
  mental_damage: We have successfully solved the problem of AI forgetting things by introducing yet another account, another API key, and another encrypted silo to manage.
