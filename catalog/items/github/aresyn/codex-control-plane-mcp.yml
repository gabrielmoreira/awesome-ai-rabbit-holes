insights:
  summary: >-
    A durable MCP server that provides an asynchronous control plane for managing long-running Codex Desktop automation
    tasks.
  why_it_matters: >-
    It solves the problem of MCP clients timing out or losing state during multi-hour coding tasks by providing a
    persistent, pollable interface for workflows and approvals.
  mental_damage: >-
    Because apparently, we can't trust a single LLM call to last longer than a standard HTTP timeout without a dedicated
    SQLite-backed state machine.
