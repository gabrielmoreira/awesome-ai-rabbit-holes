insights:
  summary: A durable MCP control plane that enables MCP clients to drive long-running Codex Desktop tasks asynchronously.
  why_it_matters: It prevents MCP timeouts and duplicate prompt errors by providing a persistent state layer for complex, multi-hour agentic workflows with polling and approval loops.
  mental_damage: The realization that our AI agents now require their own dedicated control planes and database leases just to survive a long-running task without crashing.
