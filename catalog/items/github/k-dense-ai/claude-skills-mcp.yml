insights:
  summary: An MCP server that provides semantic search and progressive retrieval for Claude Agent Skills, allowing any MCP-compatible AI assistant to discover and use curated skill packs.
  why_it_matters: It bridges the gap between Anthropic's Agent Skills framework and the wider AI ecosystem, letting developers use specialized skills in tools like Cursor, Codex, and Gemini without waiting for native support.
  mental_damage: We built an entire bridge to deliver skills to our assistants, only for the assistants to learn how to walk across the river themselves a few months later.
