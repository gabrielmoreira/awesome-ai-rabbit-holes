insights:
  summary: A collection of 135 reusable agent skills for scientific and research workflows, compatible with AI coding assistants like Claude Code, Cursor, and Codex via the open Agent Skills standard.
  why_it_matters: Developers building scientific tooling can plug in domain-specific skills that upgrade their coding agent into a specialized research assistant without writing custom workflows from scratch.
  mental_damage: We have now reached the point where we are packaging specialized knowledge into 'skills' so our AI agents can pretend to have a PhD while we still struggle to center a div.
