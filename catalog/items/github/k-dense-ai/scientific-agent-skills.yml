insights:
  summary: A collection of 135 reusable scientific and research skill definitions compatible with the open Agent Skills standard for use in AI coding agents like Claude Code, Cursor, and Codex.
  why_it_matters: It allows developers to extend their AI agents with curated, domain-specific workflows for complex scientific computing tasks without hand-crafting prompts.
  mental_damage: Now you can finally stop pretending you know how to process LC-MS/MS data and just offload the impostor syndrome to a specialized agent skill pack.
