        surrounding_text: "- [dwgx/SmartCLI](https://github.com/dwgx/SmartCLI) [![dwgx/SmartCLI MCP server](https://glama.ai/mcp/servers/dwgx/SmartCLI/badges/score.svg)](https://glama.ai/mcp/servers/dwgx/SmartCLI) 🐍 🏠 🍎 🪟 🐧 - Drive full-screen terminal programs (vim, htop, lazygit) by reading the screen, not the byte stream: a live cell grid exposes which row is reverse-video selected, cursor position and alt-screen state, so waits are screen-state predicates instead of sleeps. The emulation is differentially tested against real tmux and GNU screen (cell-by-cell grid diffs plus a generative VT fuzz), which caught 12 emulation bugs including missing alternate-screen support. pip install smartcli-toolkit then smartcli-mcp, or uvx --from smartcli-toolkit smartcli-mcp."
