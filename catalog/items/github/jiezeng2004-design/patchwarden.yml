insights:
  summary: A local-first MCP bridge that provides a safety and verification layer for AI coding agents through workspace confinement and command allowlisting.
  why_it_matters: It prevents AI agents from executing arbitrary shell commands or accessing sensitive files by enforcing a strict plan-verify-execute loop within a sandboxed workspace.
  mental_damage: Because nothing says 'peace of mind' like adding a middleman to your agent's workflow just to make sure it doesn't delete your entire home directory.
  tags:
    - mcp
    - ai-security
    - coding-agents
    - local-first
    - verification
  confidence: high
curation:
  status: included
  reason: The tool's core identity is a governance and verification layer that uses structured tasks to drive the execution loop between a model and a local agent.
  evidence:
    - README claims it is a 'afety and verification layer' using a 'plan -> task -> verify' workflow
    - Explicitly prevents arbitrary shell execution in favor of restricted, allowlisted commands
    - Focuses on auditable task evidence and scope-violation detection
