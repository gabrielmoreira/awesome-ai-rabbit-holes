insights:
  summary: A Python MCP server that exposes Kestra workflow orchestration capabilities (executions, flows, files, KV stores) as tools for AI agents in Cursor, Claude Desktop, and VS Code.
  why_it_matters: It lets developers control Kestra workflows directly from their AI coding assistant instead of switching contexts to the orchestration UI or CLI.
  mental_damage: You can now ask your AI agent to backfill flows and manage KV stores, because apparently the natural endpoint of developer tooling is orchestrating your orchestrator through a chat window.
