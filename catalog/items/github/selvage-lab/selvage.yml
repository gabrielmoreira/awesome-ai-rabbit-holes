insights:
  summary: A CLI tool that uses LLMs to analyze Git diffs for code quality, bug detection, and security vulnerabilities, with optional MCP and Claude Code plugin modes.
  why_it_matters: It automates code reviews directly from the terminal or inside editors like Cursor and Claude Code, aiming to catch issues before a human ever looks at the PR.
  mental_damage: Because nothing says 'confident in my code' like outsourcing your dignity to a CLI tool that summarizes your diffs while you pray the LLM doesn't hallucinate a critical vulnerability in your linter config.
  tags:
    - code-review
    - cli
    - mcp
    - git
    - ai-qa
  confidence: medium
curation:
  status: included
  reason: The tool primarily augments coding assistants and Git workflows with automated review capabilities rather than acting as a standalone coding agent that plans and edits code across a repo.
  evidence:
    - README states it is a 'CLI tool that helps AI analyze Git diffs' and includes a Claude Code plugin with a '/review' skill.
    - Features 'MCP Mode Support' for registration in Cursor and Claude Code to request reviews via natural language.
    - Core workflow is reviewing staged, unstaged, or commit-based changes, not autonomous repo planning or file editing.
