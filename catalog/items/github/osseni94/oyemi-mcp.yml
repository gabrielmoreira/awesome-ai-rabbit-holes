insights:
  summary: An MCP server that exposes the Oyemi semantic lexicon to AI agents, providing deterministic word-to-code mapping, valence analysis, and synonym lookups.
  why_it_matters: It allows coding agents to ground their understanding of text sentiment and semantic relationships in a fixed lexicon rather than probabilistic guessing.
  mental_damage: We have successfully abstracted natural language into a 14-digit code so the model doesn't have to experience the emotional burden of reading your commit messages.
