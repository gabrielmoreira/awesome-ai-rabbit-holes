          ![stars](https://img.shields.io/github/stars/AstonyCat/jev-tab-grouper?style=flat-square&label=%E2%98%85) -
          Browser tooling: Chrome MV3 extension that groups every tab in the window into named, colored Chrome tab
          groups from one parallel Jev call — one `Choice` question per tab against user-editable group criteria — with
          unclassified tabs falling to a fixed fallback bucket, manual groups untouched, and the pre-grouping tab order
          restored on ungroup; an optional LLM engine with self-invented group names is included for comparison runs.
        confidence: high
