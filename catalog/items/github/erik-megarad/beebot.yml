    - task-execution
    - autopack
  confidence: high
curation:
  status: excluded
  reason: Exclude because the project is effectively abandoned; the author explicitly paused development in late 2023 citing LLM limitations, and the repository has seen no meaningful updates since October 2023.
  evidence:
