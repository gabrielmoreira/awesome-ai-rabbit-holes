        surrounding_text: "- [cq27-dev/rag-rat](https://github.com/cq27-dev/rag-rat) [![cq27-dev/rag-rat MCP server](https://glama.ai/mcp/servers/cq27-dev/rag-rat/badges/score.svg)](https://glama.ai/mcp/servers/cq27-dev/rag-rat) 🦀 🏠 🍎 🪟 🐧 - Local repo-intelligence index and MCP server for coding agents — \"what a repository knows about itself.\" Hybrid BM25 + vector semantic search, a tree-sitter code graph (callers/callees/imports across Rust, TS/TSX, Kotlin, C/C++, Python) with an optional compiler-grade SCIP oracle, queryable git/GitHub history, and typed, source-anchored repo memories (Invariant, Decision, Risk, …) that persist across sessions. Every result carries provenance — confidence labels and coverage warnings. Keeps source read-only; a background watcher keeps queries fresh. PreToolUse hooks augment `grep` and flag near-duplicate code as you write it. `cargo install rag-rat`"
