insights:
  summary: >-
    A local repository intelligence index and MCP server that provides semantic search, graph navigation, and
    source-anchored memory for coding agents.
  why_it_matters: >-
    It provides coding agents with high-fidelity context—including git history and codebase invariants—to prevent
    hallucinated implementations and duplicate code.
  mental_damage: >-
