insights:
  summary: A GitHub Action and CLI tool that scans repositories for over 120 patterns indicative of AI-generated code and reports a normalized 'Synthetic Code Score' per 1,000 lines of code.
  why_it_matters: It provides engineering teams with a quantitative metric to assess the presence of low-quality or 'slop' AI code in their codebase and enforce thresholds via CI.
  mental_damage: We have finally reached the point where we need automated tools to tell us if our automated tools are doing a bad job.
