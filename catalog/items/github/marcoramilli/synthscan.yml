insights:
  summary: SynthScan is a GitHub Action and local scanner that detects AI-generated code patterns in a repository using a configurable set of rules and reports a normalized 'Synthetic Code Score'.
  why_it_matters: It gives teams a quantifiable heuristic to audit their codebase for AI-generated boilerplate and stylistic patterns that often accompany synthetic code.
  mental_damage: We have finally reached the point where we need automated tools to determine if our codebase was written by the very tools we just mandated everyone use.
