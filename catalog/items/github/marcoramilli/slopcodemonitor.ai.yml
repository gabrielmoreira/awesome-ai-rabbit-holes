insights:
  summary: A daily-updated dashboard that scans trending GitHub repositories using the SynthScan fingerprint engine to detect and score AI-generated 'slop' code patterns.
  why_it_matters: It gives maintainers and code reviewers a quantitative signal to distinguish human-authored logic from repetitive, AI-generated boilerplate in popular open-source projects.
  mental_damage: We now need automated tools to tell us which code was written by the same hallucinating autocomplete we just finished installing.
  tags:
    - code-review
    - ai-detection
    - quality-analysis
    - dashboard
  confidence: medium
curation:
  status: included
  reason: The core job is measuring and scoring codebases for AI-generation patterns via a Synth Score, fitting the evals category's focus on measuring and scoring model/prompt/agent output behavior.
  evidence:
    - README states it 'automatically scans... looking for telltale signs of AI-generated code' and computes a 'Synth Score (0–10)'.
    - Listed in awesome-ai-coding-tools under 'Code Review and Refactoring' as 'AI Code Slop Monitor'.
    - It is a daily-updated dashboard and report generator rather than an interactive coding assistant.
