insights:
  summary: An archived MCP server that enabled Claude and other MCP-compatible clients to interact with Audiense Insights for marketing audience analysis.
  why_it_matters: It provided developers with a way to integrate Audiense's audience analytics into AI workflows via MCP, though it has since been deprecated.
  mental_damage: Nothing says 'stable ecosystem' like a 5-month-old repo already archived and pointing users to a proprietary remote model.
  tags:
    - mcp
    - audience-analytics
    - deprecated
    - marketing-tools
  confidence: high
