insights:
  summary: An MCP server that reads public web pages through Lyrenth and returns cleaned, token-efficient Markdown documents to any MCP client.
  why_it_matters: It gives agents a standardized way to ingest web content without drowning in raw HTML tokens, complete with cross-caller caching and canonical publisher versions.
  mental_damage: Your agent can finally read the web without choking on HTML, provided you enjoy piping an npx process through JSON config and managing yet another freemium API key.
