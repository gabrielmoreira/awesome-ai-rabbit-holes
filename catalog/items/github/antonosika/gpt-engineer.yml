insights:
  summary: An archived CLI tool that generates and iterates on codebases from natural language prompts and supports benchmarking custom coding agents.
  why_it_matters: It served as an early, influential playground for prompt-to-code generation and the precursor to the hosted gptengineer.app.
  mental_damage: The OG code generation CLI is now archived, leaving you to either maintain a fork of history or admit that you mostly just wanted to watch the AI write code while you sipped coffee.
  tags:
