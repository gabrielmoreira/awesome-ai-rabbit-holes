insights:
  summary: An MCP server that provides Claude Code and Cursor with real-time framework documentation, type signatures, code examples, and dependency analysis for any npm package.
  why_it_matters: It eliminates context-switching by letting developers query API behavior, diagnose errors, and generate migration guides directly inside their AI-assisted coding environment using live documentation.
  mental_damage: We have successfully engineered a system where the AI needs an MCP server to remember what useEffect does so you don't have to, which is either a productivity breakthrough or the herald of our collective cognitive obsolescence.
