insights:
  summary: A native macOS markdown preview application that includes an MCP server, allowing Claude Code to render and preview markdown content live in a dedicated Swift/SwiftUI window.
  why_it_matters: It enables coding agents to visualize generated documentation, READMEs, and Mermaid diagrams in real-time without leaving the workflow or relying on Electron-heavy browsers.
  mental_damage: We have successfully built a native bridge just so the AI can watch its own markdown render, because apparently even the bots need a preview pane to feel productive.
