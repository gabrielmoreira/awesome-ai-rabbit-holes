insights:
  summary: An AI searching assistant that provides semantic search and context retrieval across local codebases and Notion workspaces.
  why_it_matters: It reduces context switching by allowing developers to query their codebase and project documentation through a single semantic interface.
  mental_damage: Because nothing says 'I've lost my grip on the architecture' like needing an LLM to tell you where you wrote that one specific function three months ago.
