insights:
  summary: An MCP server bridge that allows Claude and Cursor to rename files automatically based on their content using the Distill macOS app.
  why_it_matters: It enables AI agents to manage file organization and naming conventions semantically, reducing the manual overhead of cleaning up messy directories.
  mental_damage: Because delegating your file organization to an agent is the first step toward accepting your inevitable digital chaos.
  tags:
    - mcp
    - macos
    - file-management
    - claude
    - cursor
  confidence: high
curation:
  status: included
  reason: It serves as an integration layer that augments MCP-compatible assistants with file-renaming capabilities via a bridge to the Distill app.
  evidence:
    - The repository is explicitly described as a 'stdio→HTTP bridge' for the Distill macOS app
    - It exposes specific tools like `rename_files` and `suggest_names` to MCP clients
    - The actual AI processing and file analysis are handled by the Distill app, not the bridge itself
