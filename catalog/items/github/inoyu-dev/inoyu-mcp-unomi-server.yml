insights:
  summary: An MCP server that connects Claude to Apache Unomi to enable profile lookup, property management, consent handling, and session tracking via the Model Context Protocol.
  why_it_matters: It lets developers experiment with bringing customer data platform context into Claude Desktop without building a custom Unomi integration from scratch.
  mental_damage: We have successfully built an integration so Claude can ask your consent status in the same afternoon you realize your CDP is underutilized and your AI tooling is overintegrated.
  tags:
    - mcp
    - customer-data-platform
    - unomi
    - claude-desktop
  confidence: medium
