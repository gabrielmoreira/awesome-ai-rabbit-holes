insights:
  summary: A deterministic CLI orchestrator that splits development goals across 30+ AI coding agents in parallel, using git worktree isolation and an HMAC audit trail.
  why_it_matters: Developers can delegate full features to a swarm of isolated agents and return only when tested, merged code is ready, without wiring multiple CLIs by hand.
  mental_damage: You’ve successfully automated yourself out of the coding loop, yet somehow you’re still on call when the swarm’s four-agent JWT implementation quietly disagrees with your auth spec.
  tags:
    - multi-agent
    - cli
    - orchestration
    - git-worktree
    - mcp
  confidence: high
