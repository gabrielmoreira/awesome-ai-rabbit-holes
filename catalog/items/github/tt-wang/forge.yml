insights:
  summary: A Claude Code plugin that wraps the assistant in a plan-execute-validate loop with parallel worktrees, intelligent retry, and cross-session memory.
  why_it_matters: It turns open-ended prompting into a structured, resumable delivery workflow for multi-file features, with built-in validation and parallel execution so developers spend less time manually coordinating Claude Code.
  mental_damage: Adding a project manager, QA loop, and institutional memory to a terminal chatbot is a sobering reminder of how quickly 'AI replaces developers' became 'developers babysit AI through Jira-like workstreams'.
  tags:
    - claude-code
    - plugin
    - workflow
    - orchestration
    - validation
  confidence: medium
curation:
  status: included
  reason: It belongs as an extension because its entire identity is a workflow layer installed into Claude Code; it does not stand alone as the primary coding assistant.
  evidence:
    - Repo description and README frame it as a Claude Code plugin installed via `claude plugin install`
    - README states 'You still use Claude Code. Forge just adds structure around the hard parts.' showing it augments rather than replaces the host
    - Core features are plan, parallel execution, validate, and retry workflows that augment the underlying assistant's existing capabilities
