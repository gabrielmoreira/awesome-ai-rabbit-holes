insights:
  summary: A Claude Code plugin that gives Claude persistent memory across sessions by mining lessons from completed transcripts, storing them as markdown in an Obsidian vault, and retrieving relevant context via SQLite FTS5.
  why_it_matters: Saves developers from re-explaining project context every new Claude Code session by automatically building a queriable, self-evolving memory layer that lives entirely on their own machine.
  mental_damage: Now your AI assistant needs a notes app to remember what you told it yesterday, and somehow that notes app is also a SQLite database inside another notes app.
  tags:
    - claude-code
    - memory
    - obsidian
    - local-first
    - context-retrieval
  confidence: medium
