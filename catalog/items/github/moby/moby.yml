  confidence: high
curation:
  status: excluded
  reason: Moby is general container infrastructure with no AI-specific developer tooling features, and its presence in an LLMOps list appears to be a categorization error rather than a valid fit for this AI-tooling catalog.
  evidence:
    - Repo description defines it as a 'collaborative project for the container ecosystem', with no mention of AI, models, or coding agents.
    - README states it provides 'container build tools, a container registry, orchestration tools, a runtime' aimed at engineers building container systems.
    - Listed in Awesome-LLMOps under 'IDEs and Workspaces', which is a clear mismatch with the project's actual identity as container plumbing.
