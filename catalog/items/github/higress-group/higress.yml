insights:
  summary: AI-native API gateway built on Envoy and Istio that supports MCP server hosting and unified management of LLM and MCP APIs.
  why_it_matters: Developers can use it to expose, manage, and scale AI model APIs and MCP servers with cloud-native reliability and plugin extensibility.
  mental_damage: Now you can turn any OpenAPI spec into an MCP server and pretend your legacy APIs were always part of the agent ecosystem.
