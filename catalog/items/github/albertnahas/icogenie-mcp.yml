insights:
  summary: An MCP server that lets AI agents like Claude generate, regenerate, and download production-ready SVG icons via the IcoGenie API.
  why_it_matters: It gives coding agents a structured tool to create and refine UI icons programmatically without leaving the chat or switching to a design tool.
  mental_damage: We have successfully abstracted icon design into a credit-metered MCP tool, so your agent can now burn tokens debating the perfect outline weight instead of you.
