insights:
  summary: An MCP server that exposes French land-registry search tools—commune lookup and cadastral parcel search—through the TRINV API for Claude, Gemini, and other AI assistants.
  why_it_matters: It matters only to developers building French property or notary workflows; it is not a broadly reusable developer-tooling primitive.
  mental_damage: Proof that every obscure government API now gets its own MCP server, so your Claude Desktop can help you buy a vineyard in Provence instead of fixing your broken build.
