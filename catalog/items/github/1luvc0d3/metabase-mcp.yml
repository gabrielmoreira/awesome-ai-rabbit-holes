insights:
  summary: An MCP server that connects Claude to Metabase instances to enable natural language querying, SQL generation, and dashboard management, including write operations and batch execution.
  why_it_matters: It allows developers to manage and query Metabase data via Claude using natural language, bridging the gap left by the official read-only MCP server for older versions or write-heavy workflows.
  mental_damage: We have successfully reached the point where we need a third-party MCP server to convince our AI to create dashboards that it also generated the SQL for.
