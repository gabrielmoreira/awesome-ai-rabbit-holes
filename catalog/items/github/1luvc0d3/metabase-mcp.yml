insights:
  summary: An MCP server for Metabase that enables Claude to perform read/write operations, natural language queries, and AI-generated insights on Metabase instances older than v0.60.
  why_it_matters: Developers can let Claude create dashboards, run SQL, and analyze data trends directly in Metabase without waiting for or upgrading to the official v0.60+ release.
  mental_damage: The ecosystem now requires a third-party MCP server to replicate features the official maintainer deliberately left out of their own protocol integration.
