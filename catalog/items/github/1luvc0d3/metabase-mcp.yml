insights:
  summary: A headless MCP server that connects AI agents to Metabase via API-key authentication.
  why_it_matters: It enables autonomous agents and CI pipelines to perform data analysis and dashboard management in environments where OAuth browser flows are impossible.
  mental_damage: Because apparently, having a dashboard is not enough; now you need an agent that can perform batch SQL operations on your behalf while you sleep.
