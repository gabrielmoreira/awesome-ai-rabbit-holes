insights:
  summary: A VSCode extension that runs an MCP server to expose VSCode's semantic language features, like find references and rename, to MCP-compatible AI coding assistants.
  why_it_matters: It allows AI agents in tools like Cursor and Cline to perform precise, language-aware code navigation and refactoring by tapping directly into the editor's language server.
  mental_damage: We have reached the point where our AI assistants need a specialized plugin just to understand that renaming a variable should probably not break the entire codebase.
  tags:
