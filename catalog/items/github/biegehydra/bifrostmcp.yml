insights:
  summary: A VSCode extension that runs a local MCP server, exposing semantic language features like find references and rename to MCP-compatible AI coding assistants.
  why_it_matters: It lets AI agents understand your actual codebase semantics via the language server, rather than blindly guessing symbol relationships in a vacuum.
  mental_damage: We have officially reached the stage where we need a protocol server just to teach the AI that renaming a variable should probably not break the entire codebase.
