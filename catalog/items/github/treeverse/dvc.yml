  evidence:
    - README frames DVC as 'Data Version Control' and 'Git for data', targeting ML model-training workflows with no connection to coding agents, LLM context, or app generation.
    - Its core features—versioning data blobs, building data pipelines, and comparing traditional ML experiments—do not map cleanly to any available category such as coding-agents, ai-frameworks, evals, or context-engineering.
    - Listed in Awesome-LLMOps under Data > Data Management and created in 2017, it belongs to the pre-LLM MLOps ecosystem rather than the current wave of AI developer tooling this catalog tracks.
