insights:
  summary: Taprun is a local-first browser automation MCP server that captures a logged-in browser task once, compiles it into a deterministic .plan.json program, and replays it forever at zero LLM token cost.
  why_it_matters: It eliminates recurring AI costs and silent failures in browser automation by trading one-time AI compilation for deterministic, inspectable, credential-safe replay.
  mental_damage: Finally, a scraper that doesn’t lie to you — until the site changes and you realize you now maintain a JSON-based DSL for web automation instead of just yelling at Playwright.
  tags:
    - browser-automation
    - mcp
    - local-first
    - deterministic
    - cli
  confidence: high
curation:
  status: included
  reason: The core product is a developer tool that compiles sites into replayable .plan.json programs, which is a code-first automation framework and CLI, not a primary coding assistant or thin extension.
