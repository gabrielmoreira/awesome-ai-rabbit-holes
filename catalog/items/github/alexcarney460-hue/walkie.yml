        surrounding_text: "- **[Sqwakie](https://github.com/alexcarney460-hue/walkie)** `⭐ 1` — Walkie-talkie for a team's coding agents across machines: Claude Code and Codex agents `post`, `ask` and `reply` to each other through the `walkie` CLI or MCP tools, with a live Mission Control dashboard of every machine and agent, kanban project boards whose cards agents can start, review and finish, and seats that start agents on a teammate's opted-in machine. Peer-to-peer over iroh (or a Tailscale tailnet) with no Sqwakie server in the middle. macOS (Apple Silicon) and Linux. Source-available (FSL-1.1-ALv2); free for small teams."
