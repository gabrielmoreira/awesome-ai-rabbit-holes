insights:
  summary: A tool that boots an isolated Lima VM for each GitHub project to provide a sandboxed environment for AI agents like Claude Code.
  why_it_matters: It solves the security and environment configuration problem by providing a pre-provisioned, disposable sandbox that prevents agents from accessing your host filesystem or keys.
  mental_damage: Now you can let an agent with 'auto' permission run destructive commands without fearing for your actual local environment.
  tags:
    - sandboxing
    - lima
    - claude-code
