insights:
  summary: A Python framework for orchestrating subagents using Claude Opus, GPT, or local LLMs to break down and execute tasks.
  why_it_matters: It lets developers delegate complex, multi-step objectives to a hierarchy of specialized agents, automating task decomposition, execution, and refinement.
  mental_damage: Now you can argue with a team of AI subagents about whether your task is actually done.
  tags:
    - multi-agent
    - orchestration
    - python
    - task-decomposition
    - llm
  confidence: high
curation:
  status: included
  reason: The core product is a runtime framework for coordinating multiple agents (orchestrator, sub-agents, refiner) to solve complex tasks, fitting the multi-agent orchestration category.
  evidence:
    - Repo description explicitly calls it a framework for orchestrating subagents
    - README details a workflow where Opus breaks down tasks, Haiku executes them, and Opus refines results
    - Supports multiple model providers (Anthropic, OpenAI, Gemini, Groq, Ollama, LMStudio) via LiteLLM
