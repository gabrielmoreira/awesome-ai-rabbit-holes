insights:
  summary: A fully local MCP server that enables semantic and keyword search across Claude Code and OpenAI Codex CLI conversation histories.
  why_it_matters: Developers can instantly retrieve past discussions, decisions, and debugging sessions across all projects and agents without relying on cloud APIs or manual indexing.
  mental_damage: Finally, a way to remember what you told the AI to do last week—because apparently, neither of you have that kind of memory.
