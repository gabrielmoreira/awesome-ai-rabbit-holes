  summary: A local MCP server that indexes and semantically searches across Claude Code and OpenAI Codex CLI conversation histories using hybrid vector and keyword search.
  why_it_matters: It lets developers retrieve forgotten architecture decisions, debugging sessions, and design discussions from months of AI coding history without relying on cloud APIs.
  mental_damage: We have finally built a search engine for the thousands of unread AI conversations we prompted ourselves into, because even our own context now requires context retrieval.
