  summary: A local MCP server that indexes and provides hybrid semantic plus keyword search across Claude Code and OpenAI Codex CLI conversation histories.
  why_it_matters: It lets developers retrieve past architecture decisions, debugging sessions, and design discussions from their AI coding assistants instead of re-learning them every session.
  mental_damage: Because obviously the next logical step in the AI-assisted workflow is building a search engine for the conversations we are having with the AI so we don't have to admit we forgot what the AI told us yesterday.
