insights:
  summary: Neotoma is a local-first, deterministic state layer for AI agents that stores versioned, replayable records across sessions and tools via MCP.
  why_it_matters: It solves the cross-session memory problem by giving agents a shared, auditable entity graph instead of forcing developers to re-prompt context every time they switch tools.
  mental_damage: You now have to maintain a deterministic memory ledger for your agents, because apparently the irony of needing perfect recall to manage your forgetful AI helpers is just the next layer of the stack.
  tags:
    - agent-memory
    - mcp
    - deterministic-state
    - local-first
  confidence: high
curation:
  status: included
  reason: The core novelty is a memory and context system that enforces deterministic state evolution and cross-agent recall, which aligns with Prompt & Context Engineering.
  evidence:
