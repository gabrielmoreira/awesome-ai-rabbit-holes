insights:
  summary: Neotoma is a local-first, deterministic state layer and MCP server that stores versioned, replayable entity records for AI agents to maintain consistent memory across tools like Claude, Cursor, and ChatGPT.
  why_it_matters: It solves the 'human sync layer' problem by giving agents a shared, auditable memory graph with full provenance, eliminating conflicting facts and lost context across sessions.
  mental_damage: We have successfully reached the point where we need a dedicated event-sourced database just to keep our AI assistants from forgetting who we are between tabs.
