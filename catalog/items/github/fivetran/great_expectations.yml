insights:
  summary: A data quality tool for defining and validating expectations for your data using expressive unit tests.
  why_it_matters: It provides a standardized way for data teams to prevent pipeline debt by automating data validation and documentation.
  mental_damage: The comforting illusion that your data is actually doing what you think it's doing until a single null value destroys your entire dashboard.
