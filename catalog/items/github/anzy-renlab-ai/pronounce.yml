insights:
  summary: >-
    Pronounce is a developer pronunciation dictionary with a CLI, VS Code extension, GitHub Action, MCP server, and
    agent skill for hearing how to say tech terms like kubectl and nginx.
  why_it_matters: >-
    It saves developers from embarrassing mispronunciations in standups by providing authoritative, sourced audio
    pronunciations of 1,900+ developer terms.
  mental_damage: Now you have to worry not just about writing correct code, but also saying its name right in front of your peers.
