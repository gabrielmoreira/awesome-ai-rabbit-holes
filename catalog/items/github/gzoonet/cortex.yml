insights:
  summary: Local-first knowledge graph for developers that watches project files, builds a knowledge graph with LLMs, and allows natural language queries across projects.
  why_it_matters: It helps developers retrieve scattered decisions, patterns, and context across multiple projects without manually searching through files.
  mental_damage: Now you can finally remember why you chose that caching strategy six months ago—assuming the LLM doesn’t hallucinate the answer.
