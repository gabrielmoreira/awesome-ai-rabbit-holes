insights:
  summary: A local-first CLI and dashboard that watches project files, builds a knowledge graph using LLMs, and lets developers query across multiple repos with natural language.
  why_it_matters: It gives developers a way to resurface scattered architecture decisions, patterns, and constraints across projects without manually digging through old READMEs and source files.
  mental_damage: Now you can query three months of architectural indecision in natural language and get citations proving you contradicted yourself before the code even compiled.
  tags:
    - knowledge-graph
    - local-first
    - mcp
    - llm
    - developer-tools
  confidence: medium
