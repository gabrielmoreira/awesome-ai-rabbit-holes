insights:
  summary: A local-first CLI and dashboard that watches project files, uses LLMs to extract entities and relationships into a knowledge graph, and allows natural language queries across multiple projects with source citations.
  why_it_matters: Developers working across multiple repos can query architectural decisions, patterns, and past context without hunting through hundreds of scattered files.
  mental_damage: You now have a tool to remember every architectural decision you made three months ago, which removes your last valid excuse for re-solving the same problem in a different repo.
  tags:
    - knowledge-graph
    - local-first
    - context-retrieval
    - llm
  confidence: medium
