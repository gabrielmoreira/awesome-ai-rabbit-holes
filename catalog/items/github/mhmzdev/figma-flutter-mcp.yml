insights:
  summary: An MCP server that extracts Figma design data and provides Flutter-specific implementation guidance to coding agents like Cursor.
  why_it_matters: It bridges the gap between design files and code by giving AI agents structured access to layout, styling, and component data specifically mapped to Flutter widgets.
  mental_damage: We have successfully abstracted the job of reading a Figma file into 'ask the robot to ask the plugin to ask the API,' ensuring you can now ignore design tokens without ever leaving your IDE.
