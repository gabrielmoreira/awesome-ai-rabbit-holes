insights:
  summary: An MCP server that extracts Figma design data, components, and screen metadata to help coding agents generate Flutter implementations.
  why_it_matters: It bridges the gap between Figma design files and Flutter development by giving AI coding agents structured design context instead of raw screenshots.
  mental_damage: We have successfully abstracted away the pain of hand-writing Flutter UI by adding a specialized MCP server that requires its own API key, configuration JSON, and a live Cursor window to interpret the design tokens we used to copy-paste.
