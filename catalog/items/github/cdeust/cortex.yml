insights:
  summary: A persistent memory engine for Claude Code that uses computational neuroscience principles and PostgreSQL with pgvector to remember code context, decisions, and architecture across sessions.
  why_it_matters: It solves the core pain of Claude Code forgetting past sessions by reconstructing relevant context through 26 biological memory mechanisms and a knowledge graph of code symbols.
  mental_damage: We are now importing 41 neuroscience papers and a Hopfield network into PostgreSQL just so our AI assistant can remember we chose event sourcing three days ago.
  tags:
    - claude-code
    - memory
    - mcp
    - context-engineering
    - neuroscience
  confidence: high
