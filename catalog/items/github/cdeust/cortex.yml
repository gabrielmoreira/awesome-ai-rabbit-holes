insights:
  summary: A persistent memory system for Claude Code backed by PostgreSQL and pgvector, incorporating neuroscience papers and biological mechanisms to improve long-term context retrieval.
  why_it_matters: It gives Claude Code a biologically-inspired long-term memory layer with strong benchmark results, reducing the friction of context loss across long coding sessions.
  mental_damage: We are now importing neuroscience papers and running ablation campaigns just to convince our coding assistant to remember what we were doing ten minutes ago.
