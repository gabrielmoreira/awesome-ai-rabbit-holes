insights:
  summary: A Model Context Protocol (MCP) server that allows AI assistants like Claude Desktop to query Bluesky profiles, timelines, and search posts via the Bluesky API.
  why_it_matters: It connects standard MCP clients to the Bluesky social graph, allowing developers to integrate social feed interactions directly into their local AI workflows.
  mental_damage: We have successfully abstracted social media doom-scrolling into a protocol server so your coding agent can now waste time on Bluesky for you.
