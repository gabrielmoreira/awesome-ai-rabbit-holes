insights:
  summary: An open-source orchestration framework that runs multiple AI coding CLI agents in isolated tmux sessions and coordinates them using a supervisor–worker pattern over MCP.
  why_it_matters: It lets developers combine and parallelize the strengths of different CLI coding agents (Claude Code, Codex, Q CLI, etc.) in a single local workflow with human-in-the-loop steering.
  mental_damage: Finally, you can run a supervisor agent to manage your worker agents so you can supervise the supervision of the tools that were supposed to stop you from supervising code in the first place.
  tags:
    - agent-orchestration
    - cli
    - tmux
    - mcp
    - multi-agent
  confidence: high
