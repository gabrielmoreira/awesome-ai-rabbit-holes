insights:
  summary: An automated machine learning toolkit that acts as a drop-in replacement for scikit-learn estimators to automate algorithm selection and hyperparameter tuning.
  why_it_matters: It allows data scientists to automate the tedious manual loop of model selection and hyperparameter optimization within the familiar scikit-learn API.
  mental_damage: It promises to fully automate the 'art' of ML modeling, neatly solving the pipeline while you still struggle to explain to stakeholders why the data is garbage in the first place.
