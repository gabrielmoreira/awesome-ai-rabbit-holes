insights:
  summary: A 24-tool MCP server for Claude Code that intercepts prompts to catch ambiguity, scores prompt quality, searches session history with vector search, and estimates token costs.
  why_it_matters: It directly attacks the 30-40% token waste caused by vague prompts, wrong-direction corrections, and unbounded session context in Claude Code workflows.
  mental_damage: We have officially reached the point where we need a dedicated tool to audit the quality of the prompts we feed the tool that is supposed to save us time.
  tags:
    - mcp
    - claude-code
    - prompt-quality
    - token-optimization
    - context-engineering
  confidence: high
