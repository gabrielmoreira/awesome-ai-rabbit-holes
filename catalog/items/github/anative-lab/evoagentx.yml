insights:
  summary: An open-source framework for building, evaluating, and evolving modular, self-optimizing multi-agent systems.
  why_it_matters: It enables developers to move beyond static prompt chains by using automated feedback loops to evolve agent workflows dynamically.
  mental_damage: Now you have to manage not just your code, but the evolving logic of the agents you've hired to write it.
  tags:
    - agent-framework
    - multi-agent
    - self-evolving
    - workflow-automation
  confidence: high
curation:
  status: included
  reason: It is a code-first framework for building and orchestrating agentic workflows rather than a standalone assistant or workbench.
  evidence:
    - README describes it as an 'open-source framework' for building and evaluating agents
    - Focuses on providing building blocks like memory modules and tool integration
    - Includes support for multiple LLM providers via LiteLLM/OpenRouter
