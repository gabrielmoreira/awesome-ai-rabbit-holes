insights:
  summary: An MCP server and CLI tool that indexes local codebases into a graph database to provide structural context to AI assistants.
  why_it_matters: It gives coding agents a queryable map of call-chains and code relationships, reducing the context-window guessing games that happen on large repositories.
  mental_damage: We have successfully reached the point where the AI needs a graph database just to pretend it read the codebase you cloned this morning.
