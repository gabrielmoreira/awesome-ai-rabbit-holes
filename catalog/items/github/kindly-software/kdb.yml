  summary: Kindly Debugger (kdb) is a time-travel debugging tool for AI workflows, exposed as an MCP server.
  why_it_matters: It lets developers attach AI assistants to running processes, step forward/backward through execution, and diagnose crashes or logic errors with hardware-level breakpoints and stack traces.
  mental_damage: Finally, a way to make your AI assistant blame the past instead of the present.
