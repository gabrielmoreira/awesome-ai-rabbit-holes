insights:
  summary: A dependency guardrail and tool curation platform for AI coding agents that validates packages, catches hallucinations, and provides compatibility data across 6,500+ developer tools via an MCP server, CLI, and web interface.
  why_it_matters: It prevents AI agents from confidently installing hallucinated or typosquatted packages by validating dependencies and mapping real-world compatibility before code is generated.
  mental_damage: We now need a dedicated guardrail service to stop our autonomous agents from hallucinating npm packages, which is the exact kind of meticulously engineered chaos that makes you question if we are the ones being trained.
  tags:
    - mcp
    - dependencies
    - ai-safety
    - cli
    - guardrails
  confidence: medium
curation:
  status: included
  reason: IndieStack's primary product identity is an MCP server (23 tools, 3 resources, 5 prompts) that acts as a domain-specific validation and lookup layer for AI agents, rather than being a standalone coding agent or generic extension.
  evidence:
