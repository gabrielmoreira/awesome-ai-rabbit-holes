insights:
  summary: A session-token-based MCP server that gives AI agents like Claude Code and Cursor direct Slack access without OAuth apps or admin approval.
  why_it_matters: It lets developers triage unreads, search threads, and send replies from their editor by bridging Slack through browser session tokens instead of broken official OAuth flows.
  mental_damage: We have finally reached the point where the most reliable way to check Slack is to decrypt your browser session and hand it to a coding agent.
  tags:
    - mcp
    - slack
    - session-token
    - agent-integration
    - cli
  confidence: high
