insights:
  summary: An MCP server that exposes Tilt resources, logs, and controls to LLMs, allowing AI assistants to debug and monitor Kubernetes workloads via the Tilt dev environment.
  why_it_matters: It lets developers delegate the tedious feedback loop of building, deploying, and checking logs to an LLM without burning tokens explaining how their Kubernetes environment works.
  mental_damage: We have successfully abstracted away the act of reading our own logs, meaning we can now introduce latency and hallucinations into the one part of the stack that used to be deterministic.
