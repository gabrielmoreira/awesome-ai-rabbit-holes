insights:
  summary: A fully local MCP server that indexes documents and code into a hybrid search stack (BM25, embeddings, reranking) so Claude Code can query them via 12 MCP tools without cloud APIs or external servers.
  why_it_matters: Developers can point Claude Code at large private knowledge bases and repos with zero cloud dependencies, getting fast, code-aware retrieval inside their existing coding workflow.
  mental_damage: Yet another opportunity to discover that your meticulously curated local docs still can’t compete with the model’s tendency to hallucinate a confident answer from thin air.
