insights:
  summary: An MCP server that exposes GPTZero's AI text detection API for use with MCP-compatible clients like Claude Desktop.
  why_it_matters: Lets developers check for AI-generated text directly from their coding assistant workflow without leaving the chat interface.
  mental_damage: Because nothing says 'I trust my AI pair programmer' like running its output through another AI to see if it’s lying.
