insights:
  summary: An MCP server that allows AI models and clients to generate Apache ECharts visualizations locally and export them to PNG, SVG, or JSON formats.
  why_it_matters: It gives coding agents and MCP-compatible IDEs the ability to render data visualizations on the fly without relying on external SaaS charting APIs.
  mental_damage: We have successfully modularized the stack so that an AI can now hallucinate a pie chart with the same confidence it hallucinates your backend logic.
