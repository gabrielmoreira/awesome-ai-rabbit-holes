insights:
  summary: macOS Electron app that turns Claude Code and Codex sessions into ambient audio radio stations, surfacing progress, blockers, and attention requests in real time.
  why_it_matters: It lets developers monitor multiple active terminal agents via audio narration and a dashboard instead of jumping between transcript windows.
  mental_damage: We have built an ambient audio layer to monitor the tools we built to automate the work we no longer want to read about.
