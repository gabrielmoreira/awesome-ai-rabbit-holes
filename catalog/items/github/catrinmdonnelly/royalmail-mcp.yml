  summary: An MCP server that exposes Royal Mail and Parcelforce shipping operations—booking, labeling, tracking, and cancellation—to any MCP-compatible AI client.
  why_it_matters: Developers can automate post-purchase logistics directly from their AI assistant by wiring UK carrier APIs into agents that already read orders and draft replies.
  mental_damage: We have successfully reached the point where canceling a parcel to Manchester requires a Claude Desktop config, an NPM package, and an API key issued by Royal Mail's Click & Drop portal.
