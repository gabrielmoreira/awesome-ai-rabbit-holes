insights:
  summary: A terminal user interface that provides a unified shell and session manager for running multiple AI coding agents such as Claude, Gemini, and Codex concurrently.
  why_it_matters: It lets developers interleave a real shell workflow with prompts to different agents while managing concurrent sessions and file context from a single TUI.
  mental_damage: You now have a terminal dashboard to orchestrate a small army of bots, because keeping track of which AI is hallucinating in which directory was the missing piece of your workflow.
