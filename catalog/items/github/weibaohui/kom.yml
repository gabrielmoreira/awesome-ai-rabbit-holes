insights:
  summary: kom is a Go SDK wrapper for Kubernetes operations that provides kubectl-like functionality with CRD support, SQL querying, and MCP server capabilities.
  why_it_matters: It simplifies Kubernetes resource management for developers by offering a programmatic interface with advanced features like SQL queries and multi-cluster MCP support.
  mental_damage: Another tool promising to replace kubectl while adding yet another layer to remember when your pod is crashing at 3 AM.
  tags:
    - kubernetes
    - sdk
    - mcp
    - sql
  confidence: high
