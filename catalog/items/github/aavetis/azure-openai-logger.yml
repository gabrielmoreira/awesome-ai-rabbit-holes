insights:
  summary: A deployment solution that uses Azure API Management to proxy and log Azure OpenAI requests to Application Insights.
  why_it_matters: It allows developers to maintain full control over LLM observability, traces, and usage metrics within their own Azure subscription.
  mental_damage: Because nothing says 'production ready' like adding another layer of Azure infrastructure just to see why your prompts are failing.
  tags:
    - azure
    - observability
    - llmops
    - logging
    - tracing
  confidence: high
curation:
  status: included
  reason: The tool's primary purpose is the observability and tracing of model behavior, which aligns with the explicit focus of the evals category.
  evidence:
    - Uses APIM as a proxy to funnel logs, requests, and responses to Application Insights
    - Provides prebuilt queries and workbooks for visualizing metrics and traces
    - Supports custom header tracking for user, plan, and application analytics
