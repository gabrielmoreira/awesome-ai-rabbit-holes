insights:
  summary: A Bicep-driven Azure deployment that adds API Management as a proxy in front of an Azure OpenAI instance to funnel requests, responses, and custom headers into Application Insights for observability.
  why_it_matters: It gives developers a batteries-included way to capture, query, and visualize every LLM call and token metric inside their own Azure subscription without building custom logging plumbing.
  mental_damage: Yet another reminder that we now need a full observability stack just to understand how many tokens our 'simple' AI wrapper actually burned.
  tags:
    - azure
    - observability
    - llm-logging
    - openai
  confidence: high
