insights:
  summary: A Bicep-based solution that deploys an Azure API Management proxy to log and monitor requests, responses, and metrics for an existing Azure OpenAI instance in Application Insights.
  why_it_matters: Developers running Azure OpenAI workloads can deploy this to gain immediate observability, custom header tracking, and prebuilt query workbooks without building their own logging pipeline.
  mental_damage: Because nothing says 'cloud-native observability' like deploying an entire API Management instance and a Bicep template just to find out why your GPT wrapper is silently burning tokens.
  tags:
    - azure
    - observability
    - logging
    - llmops
    - openai
  confidence: high
