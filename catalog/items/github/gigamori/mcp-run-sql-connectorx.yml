insights:
  summary: An MCP server that executes SQL queries across multiple databases via ConnectorX and streams results to CSV or Parquet files using Arrow RecordBatch.
  why_it_matters: It lets MCP clients like Cursor run heavy SQL workloads against diverse databases without clogging the context window with inline result payloads.
  mental_damage: We have invented a protocol so an AI can talk to a database just to write a file that the AI will then ask another tool to read back into context.
  tags:
    - mcp
    - sql
    - connectorx
    - databases
    - arrow
  confidence: high
