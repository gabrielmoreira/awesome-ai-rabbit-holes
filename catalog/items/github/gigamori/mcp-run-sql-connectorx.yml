insights:
  summary: An MCP server that executes SQL queries across multiple databases via ConnectorX and streams results to CSV or Parquet using Arrow RecordBatch.
  why_it_matters: It gives MCP-connected coding agents a high-efficiency, token-aware way to run heavy SQL workloads without choking on inline result payloads.
  mental_damage: We have finally reached the point where the database client needs its own middleware protocol just to stop the AI from pasting 500,000 tokens of CSV into the chat context.
