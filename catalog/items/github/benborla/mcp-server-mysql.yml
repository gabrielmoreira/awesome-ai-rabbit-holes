insights:
  summary: A Model Context Protocol server that provides read and write access to MySQL databases, enabling LLMs like Claude Code to inspect schemas and execute SQL queries via SSH tunnels.
  why_it_matters: It allows developers to grant AI agents direct, secure access to their database layer for inspection and query generation without leaving the IDE context.
  mental_damage: We have successfully abstracted away the need to remember SQL syntax by adding a Layer 8 protocol wrapper that requires its own SSH tunnel configuration file.
