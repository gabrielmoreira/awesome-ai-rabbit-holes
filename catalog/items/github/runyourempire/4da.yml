insights:
  summary: A local-first desktop app and MCP server that scans a developer's codebase and dependency tree to filter developer news, advisories, and releases using on-device LLM verification.
  why_it_matters: It aims to solve the problem of information overload by scoring ecosystem content against your actual stack and filtering out noise before it reaches your AI assistant.
  mental_damage: We now need a local AI agent to filter the firehose of AI-generated content so our AI coding agents don't hallucinate based on the latest AI blog posts.
