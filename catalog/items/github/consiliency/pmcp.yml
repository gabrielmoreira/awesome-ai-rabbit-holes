insights:
  summary: An MCP meta-server that uses progressive disclosure to prevent context bloat by lazily provisioning downstream tools on demand.
  why_it_matters: It prevents Claude Code and other MCP clients from being overwhelmed by dozens of tool schemas, saving tokens and reducing cognitive load.
  mental_damage: Finally, a way to manage the existential dread of seeing a 50-tool JSON schema dump every time you ask a simple question.
