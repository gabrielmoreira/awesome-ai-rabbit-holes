insights:
  summary: An Apple Mail MCP server for macOS that provides full-text email search and reading capabilities via an FTS5 index, designed for reliable performance on large mailboxes.
  why_it_matters: It allows developers using Claude Desktop or Claude Code to search and read emails directly from their local Apple Mail client without timing out on large datasets.
  mental_damage: We have successfully abstracted email, the most chaotic layer of the developer workflow, into a JSON tool call, yet we still haven't figured out how to actually answer them.
