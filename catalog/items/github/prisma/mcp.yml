insights:
  summary: Prisma provides local and remote MCP servers that expose database management, migration, and querying tools to AI agents and editor workflows.
  why_it_matters: Developers can let agents handle Prisma Postgres database creation, migrations, and SQL execution directly from tools like VS Code agent mode or Cloudflare's AI Playground.
  mental_damage: We have successfully abstracted database management so far that you now need a protocol server just to let your AI ask an AI to create a backup.
  tags:
    - mcp
    - database
    - prisma
    - agent-tools
    - migrations
  confidence: high
curation:
  status: included
  reason: The product is a first-party MCP server implementation that exposes Prisma database capabilities to any MCP-compatible agent or editor.
  evidence:
    - README explicitly defines two MCP servers (local and remote) with JSON configs for MCP client integration.
    - Listed in awesome-mcp-servers under 'Server Implementations > Databases' and 'Official Servers'.
    - Tools include ExecuteSqlQueryTool, migrate-dev, and Create-Prisma-Postgres-Database, all exposed via MCP.
