insights:
  summary: TempoGraph is an MCP server that builds a tree-sitter dependency graph of a codebase to provide AI coding agents with precise file context via 24 tools, including impact analysis and dead code detection.
  why_it_matters: It aims to stop agents from guessing which files to edit by supplying structural context, claiming consistent F1 score improvements in file prediction tasks across multiple models.
  mental_damage: We have successfully engineered a scenario where the AI needs a dedicated graph database just to figure out which files the AI is allowed to break today.
