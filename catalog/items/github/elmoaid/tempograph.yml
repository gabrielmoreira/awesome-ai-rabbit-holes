insights:
  summary: TempoGraph is a code graph context engine that builds a tree-sitter dependency graph of a repository and exposes 24 MCP tools to help AI agents identify the exact files needed for a task.
  why_it_matters: It replaces keyword guessing with structural dependency analysis, measurably improving file-retrieval F1 scores by ~27% for coding agents working in large codebases.
  mental_damage: We have finally built a dependency graph so your agent can confidently break exactly the right files instead of guessing wrong ones.
