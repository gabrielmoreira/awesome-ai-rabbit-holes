insights:
  summary: A structural RAG system that analyzes large codebases to build a living knowledge graph in Neo4j and ChromaDB, exposing this context via an MCP server for AI agents.
  why_it_matters: It solves AI context blindness by automating the extraction of architectural relationships, allowing agents to navigate complex codebases without manual prompt stuffing.
  mental_damage: We have successfully built a graph database whose only job is to remind the AI that the codebase it is looking at is, in fact, the same codebase it keeps forgetting.
