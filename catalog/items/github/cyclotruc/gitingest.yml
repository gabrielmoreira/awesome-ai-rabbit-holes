insights:
  summary: A tool that converts Git repositories into prompt-friendly text digests with token counts, available as a CLI, Python package, hosted service, and browser extension.
  why_it_matters: It solves the mechanical friction of feeding an entire codebase into an LLM by handling directory structure extraction, file filtering, and token budgeting automatically.
  mental_damage: We have officially reached the point where we need a dedicated utility just to translate our own source code into a dialect that our AI overlords can digest.
  tags:
