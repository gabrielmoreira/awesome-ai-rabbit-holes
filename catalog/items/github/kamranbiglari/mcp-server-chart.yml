insights:
  summary: An MCP server that exposes 15+ chart types with Zod schema validation so LLMs can generate professional visualizations via Streamable HTTP or SSE endpoints.
  why_it_matters: Developers can let their MCP-connected assistants produce bar, OHLC, violin, and Sankey charts without wiring up visualization libraries by hand.
  mental_damage: We’ve reached the point where an LLM needs a dedicated protocol server just to draw a bar chart that could have been a five-line Python script.
