insights:
  summary: Arbitova is an AI-powered trade arbitration platform with a non-custodial USDC escrow system and MCP server for agent-to-agent payments on Base.
  why_it_matters: It provides a deterministic, on-chain settlement primitive for agent commerce, filling the gap where existing A2A specs define communication but not trustless payment resolution.
  mental_damage: Now your agents can sue each other in Solidity, because even bots need a small claims court.
