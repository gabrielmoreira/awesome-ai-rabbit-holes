insights:
  summary: Arbitova is a non-custodial USDC escrow protocol on Base with an AI arbitration engine, TypeScript and Python SDKs, and an MCP server for agent-to-agent commerce.
  why_it_matters: It provides the missing settlement and dispute-resolution layer for autonomous agent commerce by combining on-chain escrow contracts with AI-driven verdicts that developers can integrate via SDKs or MCP tools.
