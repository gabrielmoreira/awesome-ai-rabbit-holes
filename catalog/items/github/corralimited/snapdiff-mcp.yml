insights:
  summary: A standalone MCP server for SnapDiff that provides tools for visual regression testing and screenshot capture.
  why_it_matters: It allows coding agents to visually verify UI changes and detect regressions by providing them with a way to 'see' and compare web pages.
  mental_damage: Now our agents can confidently tell us the UI is 'correct' while we still spend three hours debugging a 1px padding shift on mobile.
