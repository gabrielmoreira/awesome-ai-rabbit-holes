insights:
  summary: A static architecture analysis tool that groups code based on behavioral roles rather than just import graphs.
  why_it_matters: It provides AI agents and developers with behavioral boundaries and coupling data to make refactors and prompt-based changes less random.
  mental_damage: Finally, a tool that mathematically proves our codebase is a tangled web of behavioral accidents just before we ask an LLM to 'fix the architecture'.
  tags:
    - static-analysis
