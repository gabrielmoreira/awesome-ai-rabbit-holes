insights:
  summary: BGI is a static architecture analysis tool that groups code by behavioral role to generate bounded, machine-readable architectural graphs.
  why_it_matters: It helps developers see real component boundaries and risky couplings in large codebases, making refactoring and AI-assisted changes more predictable.
  mental_damage: Finally, a tool that admits your spaghetti code has behavioral tells — now your architecture diagrams can judge you too.
  tags:
    - static-analysis
    - architecture
    - mcp-server
  confidence: medium
curation:
  status: included
  reason: BGI is primarily an MCP server exposing architectural analysis tools over the Model Context Protocol, with its core identity tied to MCP registration and tooling rather than standalone analysis or agent behavior.
  evidence:
    - "The README emphasizes MCP Registry publication and provides MCP-specific usage: 'bgi mcp --graph bgi-graph.json --fuse-graph fuse-graph.json'"
    - It exposes MCP tools like `task_fingerprint`, `behavioral_twins`, and `twin_context` to ground AI prompts in repo behavior
