insights:
  summary: A read-only MCP server providing a local, version-aware index of official Python documentation for AI coding agents.
  why_it_matters: It provides agents with high-signal, version-specific documentation symbols to prevent hallucinations and reduce token waste caused by full-page web scrapes.
  mental_damage: Because we've reached the point where we need a dedicated local SQLite index just to make sure our agents don't hallucinate asyncio signatures.
