insights:
  summary: An MCP server that implements the ZAP1 attestation and proof-verification layer for Zcash-based AI agent workflows.
  why_it_matters: It allows developers to build agents that provide cryptographically verifiable receipts for actions, reducing the need to trust the underlying server.
  mental_damage: Because we have officially reached the point where agents need Merkle proofs just to convince us they actually did what they said they did.
