insights:
  summary: Devon is an open-source, terminal and UI-based AI pair programmer that plans changes, edits multiple files, writes tests, and debugs code across a repository using models from Anthropic, OpenAI, Groq, or local Ollama.
  why_it_matters: It gives developers a fully local or self-hostable alternative to hosted coding agents like Claude Code, with a plugin system and multi-model support for repo-wide tasks.
  mental_damage: We now have yet another terminal agent to evaluate while pretending we are not just procrastinating on the Jira board by re-reading SWE-bench scores.
  tags:
