insights:
  summary: EchoCoding is a CLI and MCP-compatible add-on that adds sound effects, ambient audio, TTS speech, and voice command capabilities to AI coding agents like Claude Code, Cursor, and Windsurf.
  why_it_matters: It gives developers spatial and auditory awareness of their agent's state and actions without requiring them to watch the terminal constantly.
  mental_damage: Your $200/month coding agent can now narrate its own existence while you pretend you're still 'pair programming' in a busy coffee shop.
  tags:
    - audio
    - voice
    - mcp
    - extensions
    - cli
  confidence: high
curation:
  status: included
  reason: The tool is explicitly designed to augment existing coding assistants with audio capabilities rather than acting as a primary coding assistant itself.
  evidence:
    - README states 'pipes, not brains' and that it 'gives your AI agent a mouth and ears' rather than doing coding itself.
    - Supported clients explicitly listed include Claude Code, Cursor, Windsurf, Codex CLI, Gemini CLI, and any MCP-compatible tool.
    - Source list placed it in 'Harnesses & orchestration > Agent infrastructure', but the product identity is clearly an integration layer.
