insights:
  summary: Persistent, searchable context storage plugin for Claude Code that uses SQLite + FTS5 to maintain memory across sessions.
  why_it_matters: Eliminates the need to re-explain context in every new Claude Code session by providing recallable, structured summaries of past work, decisions, and code patterns.
  mental_damage: Finally, a way to stop pretending you remember why you chose JWT over sessions three months ago.
  tags:
    - claude-code
    - memory
