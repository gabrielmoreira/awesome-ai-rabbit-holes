insights:
  summary: An MCP gateway that aggregates tools from multiple downstream MCP servers and provides BM25-based search with deferred loading to conserve context window space in Claude Desktop.
  why_it_matters: Developers running many MCP servers can unify tool access and search without exhausting their model's context window on unused tool definitions.
  mental_damage: We have successfully built infrastructure to manage the overwhelming abundance of infrastructure we just built to talk to other infrastructure.
