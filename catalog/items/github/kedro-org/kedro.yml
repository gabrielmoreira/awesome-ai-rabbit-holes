insights:
  summary: Kedro is an open-source Python framework for building modular, maintainable, and reproducible data engineering and data science pipelines.
  why_it_matters: It enforces software engineering best practices—like modular pipelines, versioned data catalogs, and standard testing—into data workflows that usually devolve into unmaintainable spaghetti.
  mental_damage: Now you can spend three days wrapping a two-hour pandas script in abstract base classes and configuration YAML, proudly calling it 'production-ready' while the business moves on without you.
  tags:
    - python
    - mlops
    - pipelines
    - data-engineering
    - framework
  confidence: high
curation:
  status: excluded
  reason: While a mature and well-supported project, Kedro is a traditional data science pipeline framework for ML engineering, lacking a specific AI-driven developer tooling angle required for this catalog.
  evidence:
    - Repo description defines it as a 'toolbox for production-ready data science' and 'data engineering and data science pipelines', not an AI coding tool.
    - Features focus on pipeline abstraction, data catalogs, and deployment to Argo/Databricks, typical of MLOps rather than AI-assisted coding.
    - Listed in Awesome-LLMOps under 'Training > Frameworks for Training', which confirms its role in model training infrastructure rather than developer agentic workflows.
