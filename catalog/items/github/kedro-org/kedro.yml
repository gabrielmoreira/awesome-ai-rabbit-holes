insights:
  summary: Kedro is an open-source Python framework for building modular, reproducible data engineering and data science pipelines with software engineering best practices.
  why_it_matters: It gives data teams a standardised project structure, data catalog, and pipeline abstraction so ML prototypes survive contact with production.
  mental_damage: Yet another excuse to spend three sprints refactoring a Jupyter notebook into an enterprise-grade pipeline architecture before anyone asks what the model actually predicts.
