insights:
  summary: An MCP server that exposes SQLite databases to AI agents via tools for schema discovery, arbitrary SQL execution, and Datasette-compatible canned queries.
  why_it_matters: It lets coding agents safely query local data without external system access, bridging structured data and agent workflows using a familiar metadata format.
  mental_damage: The ecosystem now requires installing a dedicated server just to let your AI assistant run SELECT * FROM users on a file that is already sitting on your hard drive.
