insights:
  summary: A local-first shared memory and context system that acts as a singleton brain for multiple AI coding agents, injecting briefings, causal memory chains, and task context across tools like Claude Code, Cursor, and Cline.
  why_it_matters: It attempts to solve the problem of agents starting from zero each session by sharing learned context, sub-agent state, and decision history across your entire local AI toolchain.
  mental_damage: You now have a singleton brain for your agents, which means they can all forget things together in perfect, cryptographically signed harmony.
  tags:
    - local-first
    - memory
    - multi-agent
    - context
    - mcp
  confidence: high
curation:
  status: included
  reason: The core novelty is a shared memory, causal chains, context injection, and prompt-shaping system that sits beneath other coding assistants rather than acting as the primary agent itself.
