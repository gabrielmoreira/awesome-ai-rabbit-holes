insights:
  summary: A local web UI that adds kanban planning, workspaces, and review surfaces to run and manage multiple coding agents like Claude Code, Codex, and Gemini CLI.
  why_it_matters: It gives developers a structured loop for planning issues, running agents in isolated branches, reviewing diffs, and merging PRs without leaving a single control surface.
  mental_damage: We have successfully abstracted the job of writing code into dragging cards on a board so that we can feel productive while supervising a small swarm of agents we no longer fully understand.
  tags:
    - kanban
    - multi-agent
    - cli
    - review
    - workflow
  confidence: high
curation:
  status: included
  reason: The product is an operated workbench and control plane for coordinating multiple coding agents across workspaces, review, and merge workflows, rather than being a standalone coding assistant itself.
  evidence:
    - README states it runs Claude Code, Codex, Gemini CLI, and 10+ other agents inside workspaces with branches, terminals, and dev servers.
    - Core workflow is kanban planning, agent execution, diff review, and PR creation from a single UI surface.
    - Listed in awesome-cli-coding-agents under 'Harnesses & orchestration > Session managers & parallel runners' and in awesome-spec-driven-development under 'Workflow Management'.
