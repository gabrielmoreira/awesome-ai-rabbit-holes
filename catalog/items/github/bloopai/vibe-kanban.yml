insights:
  summary: A kanban-style UI that orchestrates coding agents by turning issues into workspaces with branches, terminals, app previews, and diff review.
  why_it_matters: It packages the messy parts of “agent-driven dev” (planning, running, reviewing, and shipping) into a single workflow so teams can iterate faster without living in five separate tools.
  mental_damage: It formalizes the new career arc where you do project management for robots, then leave inline comments so your robot can fix its robot mistakes on a fresh branch.
