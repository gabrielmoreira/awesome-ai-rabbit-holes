insights:
  summary: An open-source CI/CD CLI and MCP server that detects AI-specific code defects like hallucinated imports, stale APIs, and over-engineering patterns across six languages.
  why_it_matters: It catches the class of bugs traditional linters miss when reviewing code generated by LLMs, providing a quality gate for AI-assisted workflows.
  mental_damage: We now need an AI tool to check if the last AI tool successfully hallucinated the correct dependencies.
