insights:
  summary: Persistent memory system for AI agents that integrates with MCP-compatible tools like Claude Code and Cursor.
  why_it_matters: Eliminates the need to re-teach agents about your codebase, preferences, or architecture across sessions by providing long-term, searchable memory.
  mental_damage: Finally, an answer to the existential dread of your AI forgetting your entire project context every time you close the terminal.
