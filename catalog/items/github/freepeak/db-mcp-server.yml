  summary: A Go-based server implementing the Model Context Protocol that gives AI assistants structured, concurrent access to multiple MySQL, PostgreSQL, SQLite, and Oracle databases.
  why_it_matters: It lets AI coding tools execute queries, inspect schemas, and manage transactions across several databases through a single, standardized MCP interface.
  mental_damage: Your AI agent can now confidently generate SQL queries for four different databases it doesn't actually understand, but at least it will fail consistently across all of them.
