insights:
  summary: A Rust-based CLI tool and MCP server that performs smart search and replace across codebases with case-aware transformations, built-in undo/redo, and VS Code/Cursor integration.
  why_it_matters: It solves the painful, error-prone problem of renaming symbols across an entire codebase by handling case conversions automatically and providing a safe plan-review-apply workflow with undo history.
  mental_damage: We've reached the point where we need a dedicated Rust binary with MCP support just to safely rename a variable without breaking every kebab-case file path and snake_case config key in sight.
  tags:
    - refactoring
    - cli
    - mcp
    - renaming
    - rust
  confidence: medium
