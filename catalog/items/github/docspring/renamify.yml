insights:
  summary: A Rust-based CLI and MCP server for smart case-aware search and replace across code and filenames, with VS Code and Cursor extensions.
  why_it_matters: It gives AI assistants and developers a safe, undoable way to rename symbols and files across an entire codebase without relying on fragile regex or git stash gymnastics.
  mental_damage: We have finally built a dedicated tool to help AI agents confidently rename things that humans already renamed three times before the agent arrived.
