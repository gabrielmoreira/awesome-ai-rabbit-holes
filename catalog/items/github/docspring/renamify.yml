insights:
  summary: A CLI tool for smart search-and-replace across code and filenames with case-aware transformations, built-in undo/redo, and MCP server support.
  why_it_matters: It automates large-scale renaming operations with safety features like preview, undo/redo, and ignore-file support, reducing manual refactoring errors.
  mental_damage: Finally, a tool that lets you rename everything at once—because nothing says 'confidence' like rewriting your entire codebase in one command.
