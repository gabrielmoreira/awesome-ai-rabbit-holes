insights:
  summary: MCP server wrapping JetBrains' ReSharper CLI for headless C# inspection and code cleanup for coding agents.
  why_it_matters: It allows coding agents to use professional-grade C# static analysis and automated refactoring tools directly within their existing workflows.
  mental_damage: Another specialized server to add to your .mcp.json just so your agent can finally respect your .NET linting rules.
  tags:
    - mcp
    - csharp
    - dotnet
    - jetbrains
    - static-analysis
  confidence: high
curation:
  status: included
  reason: The tool is built specifically as an MCP server to expose ReSharper's C# analysis capabilities to AI agents.
  evidence:
    - Wraps JetBrains' 'jb' command-line tool to expose inspections and cleanup via the Model Context Protocol
    - Manages solution-wide caches to minimize the cost of repeated agentic inspection calls
    - Includes SARIF-to-Markdown conversion to make analysis results compatible with LLM context windows
