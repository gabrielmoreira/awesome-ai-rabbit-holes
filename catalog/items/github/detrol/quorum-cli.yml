insights:
  summary: A terminal and web CLI that runs structured, multi-model debates between LLMs like GPT, Claude, Gemini, and local Ollama models using formal discussion methods.
  why_it_matters: It lets developers surface trade-offs and reach consensus by watching different models argue about architecture, tooling, and design decisions inside the terminal or Claude Code via MCP.
  mental_damage: Finally, a tool that lets GPT-4o, Claude, and Gemini argue about your PostgreSQL vs MongoDB debate so you can feel superior to all three at once.
