insights:
  summary: A repository of 100+ original architectural diagrams explaining the inner workings of LLMs, RL, VLM, and related training algorithms like PPO, DPO, and RAG.
  why_it_matters: It gives developers a visual mental model of how modern models are trained and aligned, which is useful context for anyone building or integrating AI tooling.
  mental_damage: Yet another high-effort resource proving that understanding the math behind the model is easier than getting the model to write a correct SQL query.
