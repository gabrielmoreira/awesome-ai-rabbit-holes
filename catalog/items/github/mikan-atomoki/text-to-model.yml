insights:
  summary: An MCP server add-in that connects Claude Desktop or Claude Code to Autodesk Fusion 360, exposing 64 CAD tools for natural language control of 3D modeling.
  why_it_matters: It lets developers and engineers bootstrap mechanical CAD work—sketches, extrusions, JIS fasteners, and parametric edits—directly from Claude instead of manually clicking through Fusion 360 menus.
  mental_damage: We’ve successfully automated the one hands-on engineering task that used to guarantee at least a few minutes of not reading Slack.
