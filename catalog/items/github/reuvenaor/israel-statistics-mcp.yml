insights:
  summary: >-
    An MCP server providing programmatic access to Israeli Central Bureau of Statistics economic data, including CPI,
    housing indices, and an inflation calculator.
  why_it_matters: >-
    It allows coding agents and LLMs to directly query official Israeli economic statistics without manually parsing
    government XML APIs.
  mental_damage: >-
    We have finally reached the point where an LLM can tell you the exact rate of inflation in Israel, but still can't
    reliably format a JSON config file without three retries.
