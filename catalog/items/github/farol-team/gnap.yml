insights:
  summary: GNAP is a git-native protocol for coordinating AI agents using only git repositories as transport and storage.
  why_it_matters: It lets developers orchestrate multiple AI agents (human or AI) without servers, databases, or vendor lock-in by treating git as the coordination layer.
  mental_damage: Finally, a way to make your agents argue over merge requests instead of just your pull requests.
  tags:
    - git
    - agent-orchestration
    - protocol
    - multi-agent
    - devtools
  confidence: high
curation:
  status: included
  reason: GNAP is a protocol for multi-agent coordination where agents use git to share tasks, state, and messages — making it a runtime platform for agent collaboration, not a coding assistant or extension.
  evidence:
    - "Repo description: 'GNAP — Git-Native Agent Protocol. RFC Draft for git-based agent orchestration. Zero servers.'"
    - "README: 'Your AI agents [...] work as a team through a shared git repo. Four JSON files. That's the entire protocol.'"
    - Architecture diagram shows GNAP Protocol layer sitting above Git transport, with agents reading/writing tasks, runs, messages via git pull/push.
