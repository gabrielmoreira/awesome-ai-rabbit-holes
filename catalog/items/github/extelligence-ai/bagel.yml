insights:
  summary: An MCP server that enables natural language querying of robotics, drone, and IoT data using deterministic DuckDB SQL and edge data reduction.
  why_it_matters: It allows developers to interrogate complex telemetry logs via LLMs without needing to manually write SQL or parse massive datasets.
  mental_damage: Because apparently, we can't even debug a drone without an LLM translating our feelings into DuckDB queries.
