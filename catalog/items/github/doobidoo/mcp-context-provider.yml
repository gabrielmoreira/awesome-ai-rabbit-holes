insights:
  summary: A TypeScript MCP server that provides Claude Desktop and Claude Code with persistent context rules and learned, confidence-scored instincts that survive across chat sessions.
  why_it_matters: It solves the friction of re-establishing coding preferences, syntax rules, and workflow patterns every time a new Claude session starts.
  mental_damage: We have successfully built infrastructure to help our AI assistants remember that we prefer single quotes, while we still forget what we were doing five minutes ago.
