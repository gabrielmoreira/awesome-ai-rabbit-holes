insights:
  summary: An MCP server that indexes local markdown files to enable AI assistants to search content, extract sections by heading, list table of contents, find code blocks, and parse frontmatter.
  why_it_matters: It lets coding agents understand and navigate your project's internal documentation, ADRs, and wikis as structured content instead of raw text.
  mental_damage: We have successfully built infrastructure to help the AI read the README so you don't have to, though you'll still need to debug why it extracted the wrong heading level.
