  summary: An MCP server that lets AI assistants perform DNS lookups, reverse DNS, and WHOIS queries using Node.js built-in modules with no API keys required.
  why_it_matters: It allows developers to debug DNS, MX, and domain issues directly through their AI assistant without leaving the IDE or signing up for external APIs.
  mental_damage: We have officially reached the point where resolving an A record requires a protocol server, a Node runtime, and an LLM to ask it politely.
