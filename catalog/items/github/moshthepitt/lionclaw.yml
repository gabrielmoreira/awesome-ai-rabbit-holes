insights:
  summary: A local Rust-based CLI that wraps existing coding agents like Codex and OpenCode with a secure sandbox, durable sessions, scheduled jobs, and credential management.
  why_it_matters: It lets developers reuse their preferred terminal agents while adding a hardened security boundary, persistent context, and long-running workflows without modifying the agents themselves.
  mental_damage: Another layer in the agent nesting doll, because running a secure local kernel to babysit your unsecure local agent is exactly the kind of architectural recursion we’ve been training for.
  tags:
    - local-ai
    - cli
    - security
    - sessions
    - agents
  confidence: medium
curation:
  status: included
  reason: LionClaw is a host integration and security wrapper that extends existing coding agents rather than acting as a primary assistant itself.
  evidence:
    - Repo description explicitly states it is a 'secure-first local AI CLI with ... installable skills' that wraps other agents.
    - README says 'The agent does the heavy lifting. LionClaw provides the security boundary, session state, runtime launch path, and audit log'.
    - Supports running existing agents like Codex and OpenCode via their native CLI paths rather than replacing them.
