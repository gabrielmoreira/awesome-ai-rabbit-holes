insights:
  summary: A local, security-first CLI that wraps existing coding agents like Codex and OpenCode with durable sessions, sandboxed execution, and installable skills.
  why_it_matters: It lets developers run autonomous coding agents inside a controlled local boundary with persistent memory and scheduled jobs without handing over full system access.
  mental_damage: We have finally invented the dedicated operating system layer for our AI agents, which means the stack is now deep enough to require its own onboarding flow.
