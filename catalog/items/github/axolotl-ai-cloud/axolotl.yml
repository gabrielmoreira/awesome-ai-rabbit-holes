curation:
  status: included
  reason: Axolotl is a code-first framework and CLI tool for building fine-tuning pipelines, fitting squarely into AI Frameworks and SDKs rather than a hosted app builder or coding agent.
  evidence:
    - README describes Axolotl as a 'free and open-source tool designed to streamline post-training and fine-tuning' using YAML configs and a CLI (axolotl train).
    - Supported workflows include LoRA, QLoRA, GRPO, and multi-GPU training via FSDP/DeepSpeed, targeting developers building training pipelines in code.
    - Listed under '微调 Fine-Tuning' in awesome-LLM-resources, confirming its niche as a developer tool for model post-training.
    - Repo description explicitly calls it an 'LLM Fine-tuning Framework'.
    - README highlights support for LoRA, DPO, and specific model architectures (Mistral, Qwen, Gemma) via configuration.
