insights:
  summary: typesafe-local is a local MLX-based implementation for asking typed questions to a local LLM and receiving calibrated probabilities instead of text output.
  why_it_matters: It enables developers to integrate decision-model-style outputs (e.g., classifications, scores) into local workflows on Apple Silicon without relying on hosted APIs or text parsing.
  mental_damage: Another local LLM wrapper that trades fluency for numbers, promising rigor while quietly reinventing the wrapper loop.
  tags:
    - local-ai
    - decision-models
    - mlx
  confidence: high
curation:
  status: included
  reason: The tool's core function is exposing a Jev-compatible decision model locally via MLX, returning typed judgments with probabilities — making the decision layer its primary identity, not a general LLM host or coding agent.
  evidence:
