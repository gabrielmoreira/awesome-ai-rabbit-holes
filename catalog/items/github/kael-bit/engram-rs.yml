insights:
  summary: A lightweight, single-binary Rust memory engine for AI agents that manages memory lifecycle across a three-layer time axis and self-organizing topic tree, exposing itself as an MCP server.
  why_it_matters: It gives coding agents a structured way to forget irrelevant context and promote durable knowledge using LLM-gated consolidation, hybrid search, and a local SQLite backend.
  mental_damage: Finally, an Ebbinghaus-forgetting-curve implementation to solve the problem of an agent remembering that one typo you made in a throwaway branch three months ago.
