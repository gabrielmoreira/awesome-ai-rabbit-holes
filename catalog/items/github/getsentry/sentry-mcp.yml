insights:
  summary: An official MCP server from Sentry that connects coding assistants like Claude Code and Cursor to Sentry's API for debugging errors, issues, and performance traces.
  why_it_matters: It allows coding agents to directly query and investigate production errors and traces within the developer's IDE or CLI workflow, bridging the gap between observability and AI-assisted debugging.
  mental_damage: We have successfully abstracted away the need to read stack traces ourselves, meaning the AI can now be confused by the Sentry UI on our behalf.
