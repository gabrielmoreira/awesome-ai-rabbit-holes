insights:
  summary: An open-source platform for developing, testing, and observing AI agents using Markdown-defined prompts with version control, evaluations, and OpenTelemetry tracing.
  why_it_matters: It lets developers manage prompts as code, run evaluations against datasets, and trace LLM calls across multiple SDKs from a single CLI and dev server.
  mental_damage: Finally, a way to version-control your prompt engineering despair in Markdown while convincing yourself that shipping a 400-line .prompt.mdx file counts as proper software architecture.
  tags:
    - agents
    - evals
    - observability
    - opentelemetry
    - prompt-management
  confidence: high
curation:
  status: included
  reason: While it includes agent tooling, the core workflow is prompt design, management, evaluation, and tracing infrastructure for developers, which aligns with context engineering.
  evidence:
    - "Repo description: 'Markdown for the AI era' with README defining it as a platform to 'develop, test, and observe your AI agents' via .prompt.mdx files."
    - Features include prompt management, OpenTelemetry-based tracing, datasets & evals, and type safety rather than autonomous code editing.
    - Actively maintained with recent pushes (2026-04-21) and adapters for multiple SDKs (Vercel AI SDK, Mastra, Claude Agent SDK, Pydantic AI).
