insights:
  summary: An MCP server that uses Playwright to capture structured website snapshots, network activity, and console logs for consumption by LLM tools.
  why_it_matters: It allows coding agents in editors like VS Code and Cursor to see and analyze live web pages, including network traffic and console output, without leaving the development environment.
  mental_damage: We have successfully abstracted the browser into a JSON tree so your agent can hallucinate about the DOM instead of you having to open the dev tools yourself.
