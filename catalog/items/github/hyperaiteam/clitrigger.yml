insights:
  summary: A command center for running multiple AI coding agents (Claude, Gemini, Codex) in parallel across isolated git worktrees.
  why_it_matters: Lets developers delegate multiple coding tasks simultaneously to different agents, then review and merge results the next day, maximizing token usage and parallelism.
  mental_damage: Finally, a way to turn your token quota into a 24/7 coding sweatshop—because nothing says 'work-life balance' like waking up to 17 merge conflicts.
