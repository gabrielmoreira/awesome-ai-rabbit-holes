insights:
  summary: A CLI and web UI tool that orchestrates parallel runs of coding agents like Claude, Gemini, and Codex inside isolated git worktrees.
  why_it_matters: It lets developers queue tasks across multiple AI agents overnight to maximize token quotas and review the resulting diffs in the morning.
  mental_damage: You can now deploy an AI night shift to burn through your rate limits while you sleep, turning every morning into a 50-diff code review hangoover.
