insights:
  summary: Swarm.js is a Node.js SDK implementing OpenAI's experimental Swarm framework for orchestrating multi-agent systems using the Chat Completions API.
  why_it_matters: It lets JavaScript/TypeScript developers build and coordinate multi-agent workflows in Node.js without relying on Python-based tools.
  mental_damage: Another Swarm clone popping up just as everyone realizes the original was a fragile research prototype, not a production foundation.
  tags:
    - multi-agent
    - orchestration
    - nodejs
    - openai
    - swarm
  confidence: medium
curation:
  status: included
  reason: Swarm.js is a code-first SDK developers import into Node.js projects to build agent systems, making it a framework rather than a standalone assistant or orchestration platform.
  evidence:
    - Repo description calls it a 'Node.js implementation' and 'SDK' for orchestrating multi-agent systems
