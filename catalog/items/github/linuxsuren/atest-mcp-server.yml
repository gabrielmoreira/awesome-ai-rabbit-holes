insights:
  summary: An MCP server that exposes the API testing capabilities of atest to AI tools and agents via the Model Context Protocol.
  why_it_matters: It allows coding agents and AI IDEs to discover, run, and validate API tests directly within their workflow without leaving the development environment.
  mental_damage: We have now successfully abstracted the act of testing an API into a protocol that allows an AI to ask another piece of software to test the API for it, just in case the developer was feeling too close to the actual endpoints.
