insights:
  summary: An MCP server that exposes the Rootly API to coding assistants like Claude Code, Cursor, and Windsurf for incident management and on-call operations.
  why_it_matters: It allows developers to query incidents, alerts, and services directly from their AI assistant instead of switching to the Rootly dashboard during an outage.
  mental_damage: We have successfully abstracted away the need to leave your editor to manage a production outage, ensuring you can break things and fix them without ever achieving emotional distance from the code.
  tags:
    - devops
    - incident-management
    - integration
    - mcp
  confidence: high
