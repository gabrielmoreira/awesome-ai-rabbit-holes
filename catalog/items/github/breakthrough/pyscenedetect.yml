insights:
  summary: PySceneDetect is a Python and OpenCV-based library and CLI tool for detecting scene cuts and transitions in videos.
  why_it_matters: >-
    It gives developers a programmatic way to automatically segment videos into scenes for editing, analysis, or further
    processing pipelines.
  mental_damage: Another reminder that video metadata extraction still feels like dark magic wrapped in FFmpeg incantations.
  tags:
    - video
    - opencv
    - scene-detection
    - cli
    - library
  confidence: high
curation:
  status: excluded
  reason: >-
    PySceneDetect is a computer vision tool for video analysis, not an AI-powered developer tool; it lacks any AI/ML
    model integration, agent behavior, or LLM-assisted workflow despite appearing in an LLM resources list.
  evidence:
    - 'Repo description: ''Python and OpenCV-based scene cut/transition detection program & library'''
