insights:
  summary: A natural-language dispatcher that uses TypeSafe's Jev decision model to select and invoke MCP server tools based on user input.
  why_it_matters: It lets developers drive MCP servers with natural language using a typed decision model, avoiding hard-coded tool selection logic.
  mental_damage: Another rung on the ladder where you replace if-statements with a Jev Choice, because deterministic tool selection was too mainstream.
