insights:
  summary: An MCP server that lets AI assistants like Claude Desktop authenticate with and call VRChat API endpoints for friends, avatars, worlds, and groups.
  why_it_matters: Developers building AI integrations for VRChat can give their assistants structured access to user data, worlds, and social features without writing raw API glue.
  mental_damage: We have finally reached the point where large language models can now manage your VRChat friends list, which is either the future of socialization or the clearest sign yet that we have run out of real problems to solve.
  tags:
    - mcp
    - vrchat
    - api
    - integration
  confidence: high
