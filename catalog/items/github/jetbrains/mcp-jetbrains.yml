insights:
  summary: A Model Context Protocol server and proxy that allows external AI tools and agents to connect to and interact with JetBrains IDEs, now integrated natively into IntelliJ-based IDEs since version 2025.2.
  why_it_matters: It allows developers to hook AI coding agents and MCP clients directly into their JetBrains workflow, bridging the gap between modern AI tooling and the IntelliJ ecosystem.
  mental_damage: We have successfully abstracted the IDE into a context server so that an AI can finally refactor the code you were about to write before the plugin was deprecated.
  tags:
    - ai-assistant
    - code-completion
    - ide
    - integration
    - jetbrains
    - mcp
  confidence: high
