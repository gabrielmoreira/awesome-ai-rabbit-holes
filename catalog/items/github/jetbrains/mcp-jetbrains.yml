insights:
  summary: A deprecated Model Context Protocol server for integrating JetBrains IDEs with MCP clients, now superseded by built-in IDE functionality.
  why_it_matters: It previously enabled MCP clients like Claude Desktop to interact with JetBrains IDEs, but this functionality is now natively supported in JetBrains IDEs since version 2025.2.
  mental_damage: The only thing more permanent than a deprecated integration is the documentation you wrote for it.
  tags:
    - mcp
    - jetbrains
    - ide-integration
    - deprecated
  confidence: high
