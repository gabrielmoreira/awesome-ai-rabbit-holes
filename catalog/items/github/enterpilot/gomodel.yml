        extracted_url: https://github.com/enterpilot/gomodel
        surrounding_text: "- [GoModel (Go AI gateway with a Jev provider and an OpenAI Decisions API endpoint that can be answered by Jev)](https://github.com/ENTERPILOT/GoModel) - Open-source AI gateway and proxy in Go with one OpenAI-compatible API in front of many providers. A `jev` provider (hosted TypeSafe System One or a self-hosted server) enables `POST /v1/decisions`, which answers OpenAI Decisions requests by translating them to and from System One, and `POST /v1/systemone`, which forwards System One requests natively so the TypeSafe SDK can point at the gateway. Pricing for Jev can be declared so the gateway costs decision requests. [Project guide](community/projects/tools/gomodel.md)."
        confidence: high
