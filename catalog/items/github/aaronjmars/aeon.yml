insights:
  summary: Aeon is a self-hosted autonomous agent framework that runs unattended on a schedule, manages its own skills, and performs recurring developer tasks like PR reviews and research without interactive approval loops.
  why_it_matters: It lets developers configure recurring CI-adjacent workflows—such as market monitoring, security scans, and morning briefs—to run autonomously on GitHub Actions without human intervention.
