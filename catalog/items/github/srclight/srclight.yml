insights:
  summary: A local MCP server that builds a deep, searchable index of codebases using SQLite FTS5, tree-sitter, and embeddings to provide AI agents with structured code intelligence tools.
  why_it_matters: It replaces dozens of wasteful grep and glob calls with precise symbol lookups, call graphs, and impact analysis, allowing coding agents to orient themselves in a fraction of the tokens.
  mental_damage: We have officially reached the point where our agents need their own agents just to figure out where the code is, saving tokens so they can burn them elsewhere on hallucinating new bugs.
  tags:
    - mcp
    - code-indexing
    - semantic-search
    - local-ai
    - tree-sitter
  confidence: high
