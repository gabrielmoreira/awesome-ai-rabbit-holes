insights:
  summary: A Rust-based Git worktree lifecycle manager that integrates with Jira, GitHub Issues, and GitLab to create isolated workspaces from tickets and ship stacked PRs in one command.
  why_it_matters: It eliminates the manual loop of syncing tickets, branches, and PRs while enabling parallel AI agent workflows and stacked changes without index lock collisions.
  mental_damage: Because what modern software development truly needed was a CLI tool to manage the parallel reality of twelve AI agents subtree-merging rate-limit fixes while you debug CI in a terminal Kanban board.
  tags:
    - git
    - worktree
    - cli
    - devops
    - ai-agent
  confidence: medium
curation:
  status: included
  reason: Its primary value is augmenting the Git/ticket workflow for developers and AI agents rather than being a coding assistant that writes or debugs code itself.
  evidence:
    - Repo description explicitly calls it a 'git worktree lifecycle manager' with 'Parallel AI agent workflows' as a feature, not the core identity.
    - Every command is designed to manage branches, tickets, and PR logistics (start, ship, stack, merge, ci), not to read or write application code.
    - Source list places it under 'Developer Productivity Tools', aligning with workflow automation rather than coding agents.
