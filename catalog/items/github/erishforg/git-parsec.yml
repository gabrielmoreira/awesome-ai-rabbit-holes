insights:
  summary: A Rust-based CLI tool that manages Git worktree lifecycles by connecting tickets from Jira or Git forges directly to isolated workspaces, automating the start-to-PR cycle with stacked PR support.
  why_it_matters: It eliminates context-switching between ticket trackers, terminals, and pull request UIs by providing a single command loop for starting work, shipping code, and managing stacked branches.
  mental_damage: Finally, a tool to manage the parallel reality of ten AI agents creating conflicting worktrees, because apparently we needed a manager for the managers.
