insights:
  summary: An MCP server that exposes OP.GG game data for League of Legends, TFT, and Valorant to AI agents via a Streamable HTTP endpoint.
  why_it_matters: It allows AI agents to query live game stats, meta builds, and match histories programmatically instead of scraping third-party sites.
  mental_damage: We have mastered the art of exposing Riot Games metadata to LLMs before we have mastered the art of not feeding 40k tokens of champion lore to a context window.
  tags:
    - mcp
    - gaming
    - api
    - league-of-legends
  confidence: high
