insights:
  summary: An MCP server that provides tools to trace code lines back through git blame, pull requests, and linked issues to explain why a specific piece of code exists.
  why_it_matters: It allows developers to query the historical context and intent behind code changes directly within their AI assistant, eliminating the need to manually dig through git logs and GitHub issue trackers.
