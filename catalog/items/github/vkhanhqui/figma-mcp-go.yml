insights:
  summary: figma-mcp-go is an open-source MCP server that provides full read/write access to live Figma data via a plugin bridge, enabling text-to-design and design-to-code workflows without using the Figma REST API or encountering rate limits.
  why_it_matters: It lets developers use AI assistants like Claude Code or Cursor to directly read and manipulate Figma files and generate code from designs, bypassing API limitations that hinder experimentation.
  mental_damage: Finally, a way to make your AI pair programmer feel useful while it redesigns your entire UI system in the time it takes to explain what a 'variant' is.
  tags:
    - figma
    - mcp
    - design-to-code
    - ai-dev-extensions
  confidence: high
curation:
  status: included
  reason: figma-mcp-go primarily extends existing AI coding assistants with Figma host capabilities rather than acting as a standalone coding assistant, making it an extension/integration.
  evidence:
