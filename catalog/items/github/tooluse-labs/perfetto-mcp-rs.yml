insights:
  summary: A Rust-based MCP server that lets AI coding agents analyze Perfetto performance traces using PerfettoSQL queries and dedicated Chrome profiling tools.
  why_it_matters: It gives agentic coding assistants like Claude Code and Codex the ability to directly diagnose scroll jank, page loads, and main-thread hotspots without leaving the coding workflow.
  mental_damage: Now your AI can definitively tell you that the reason your app feels slow is the same unoptimized main-thread loop you've been ignoring for six months.
