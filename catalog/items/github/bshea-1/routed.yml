insights:
  summary: A local hybrid search engine that routes coding prompts to specific agent skills to minimize context pollution and token costs.
  why_it_matters: It enables developers to use large, specialized skill sets in their AI assistants without overwhelming the model's context window or increasing latency.
  mental_damage: Another layer of middleware to debug when your agent suddenly forgets how to write Python because of a BM25 weighting error.
  tags:
    - mcp
    - prompt-routing
    - local-ai
    - context-management
    - agent-skills
  confidence: high
curation:
  status: included
  reason: It functions as a local, high-speed retrieval and routing layer designed to manage which agent skills are injected into an LLM's context.
  evidence:
    - Uses local hybrid search (BM25 and semantic) to route prompts
    - Claims to eliminate context pollution in tools like Cursor and Claude Desktop
    - Provides an MCP server to bridge skill routing with AI hosts
