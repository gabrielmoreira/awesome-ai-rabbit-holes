insights:
  summary: A persistent memory and session intelligence layer that tracks decisions, mistakes, and context via hooks for AI coding assistants like Claude Code.
  why_it_matters: It solves the 'context amnesia' problem by automatically mining session histories to prevent repetitive mistakes and inject relevant past decisions into current coding tasks.
  mental_damage: Finally, a tool to help you realize that 40% of your coding session was just you arguing with the LLM about the same typo.
  tags:
    - mcp-server
    - persistent-memory
    - claude-code
    - context-management
    - session-mining
  confidence: high
curation:
  status: included
  reason: The core novelty is the management of memory, retrieval of past session patterns, and context injection rather than acting as the primary assistant itself.
  evidence:
    - README claims it 'automatically tracks mistakes, decisions, and context via hooks'
    - Primary functionality revolves around 'ession mining' and 'emory management'
    - Uses MCP to provide tools like 'emory' and 'ession_mine' to a host assistant
