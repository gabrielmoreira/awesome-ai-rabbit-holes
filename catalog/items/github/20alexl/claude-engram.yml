insights:
  summary: A hooks-based memory and session intelligence toolkit for Claude Code that auto-tracks coding mistakes, decisions, and context, then mines session history for patterns and cross-session search.
  why_it_matters: It attempts to solve the context-window amnesia problem by persisting decisions and errors across sessions so your assistant stops repeating the same mistakes after a compaction.
  mental_damage: We have reached the point where the assistant needs its own assistant to remember why the assistant forgot what you told the assistant ten minutes ago.
  tags:
    - claude-code
    - memory
    - mcp
    - hooks
    - context
  confidence: high
curation:
  status: included
  reason: The core novelty is a memory, retrieval, and context-shaping system for Claude Code rather than being a primary coding assistant or a generic host integration.
  evidence:
