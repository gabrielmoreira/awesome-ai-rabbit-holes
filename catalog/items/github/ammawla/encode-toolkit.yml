insights:
  summary: An MCP server and Claude plugin that provides 20 tools and 47 skills for searching, downloading, analyzing, and cross-referencing ENCODE genomic data within Claude Code and other MCP-compatible editors.
  why_it_matters: It lets bioinformatics developers run complex genomic analyses, cross-reference 14 databases, and generate publication-ready methods using natural language instead of writing custom pipelines.
  mental_damage: You now have 47 specialized skills to analyze histone peaks, but you still need a separate AI tool to explain what a histone peak actually is.
