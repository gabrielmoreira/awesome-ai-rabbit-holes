insights:
  summary: A VS Code extension and MCP server that enables LLMs like Claude to interactively debug code via VS Code's debugger.
  why_it_matters: It lets developers delegate debugging sessions to an LLM, using breakpoints and expression evaluation without manual intervention.
  mental_damage: Now your AI can step through your code while you step away from responsibility.
  tags:
    - debugging
    - mcp
    - vscode-extension
    - llm-integration
  confidence: high
curation:
  status: included
  reason: The tool is primarily an extension that augments VS Code and MCP clients with debugging capabilities, rather than being a standalone coding assistant.
  evidence:
    - Repo description explicitly states it is an MCP server and VS Code extension for interactive debugging
    - README confirms it integrates with Claude Desktop, Continue, and Cursor via MCP
    - Source-list context places it under Developer Tools in MCP server lists
