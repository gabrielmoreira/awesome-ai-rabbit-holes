insights:
  summary: A VS Code extension and MCP server that lets LLMs like Claude interactively debug code by controlling breakpoints, stepping through execution, and evaluating expressions.
  why_it_matters: It bridges the gap between coding assistants and real debugging workflows, allowing models to inspect runtime state instead of guessing from static context.
  mental_damage: We have officially entered the era where your AI assistant now has the power to set breakpoints and stare at variables you could have inspected yourself in half the time.
  tags:
    - vscode-extension
    - mcp
    - debugging
    - llm-tooling
    - vibe-debugging
  confidence: high
