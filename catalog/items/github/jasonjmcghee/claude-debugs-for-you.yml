insights:
  summary: A VS Code extension and MCP server that allows LLMs like Claude to interactively debug code by attaching to running processes across any language.
  why_it_matters: It bridges the gap between conversational coding assistants and live debugging sessions, allowing the model to inspect variables and control execution flow directly within the editor.
  mental_damage: We have finally automated the part of the job where you stare at a failing test for three hours, only to have the AI stare at it for you instead.
  tags:
    - debugging
    - mcp
    - vscode
    - llm-integration
  confidence: high
