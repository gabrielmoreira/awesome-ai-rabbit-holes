insights:
  summary: An MCP proxy that reduces token usage by collapsing tool schemas and compressing large tool outputs.
  why_it_matters: It helps developers prevent context window bloat and high token costs when using agents with many MCP tools or massive data payloads.
  mental_damage: Because paying for 200,000 tokens of raw HTML is a lifestyle choice nobody actually wants to make.
  tags:
    - mcp
    - context-compression
    - token-optimization
    - proxy
  confidence: high
curation:
  status: included
  reason: While it is an MCP middleware layer, its core novelty is the compression and distillation of context to optimize token usage.
  evidence:
    - Collapses 50+ tool definitions into 4 meta-tools to save schema tokens.
    - Compresses real-world HTML and JSON tool outputs by 60–95%.
    - Sits as a local proxy between MCP clients (like Cursor or Claude Code) and downstream servers.
