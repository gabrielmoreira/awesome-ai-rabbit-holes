insights:
  summary: Cal.com is an open-source scheduling infrastructure platform for self-hosting appointment booking and calendar management.
  why_it_matters: It provides developers with a self-hostable, MIT-licensed foundation to build custom scheduling flows instead of relying on closed SaaS booking widgets.
  mental_damage: We have successfully open-sourced the calendar, meaning developers can now spend three weeks configuring PostgreSQL just to avoid sending a Calendly link.
