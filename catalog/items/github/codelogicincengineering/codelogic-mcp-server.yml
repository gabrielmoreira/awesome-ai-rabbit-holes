insights:
  summary: An MCP server that connects AI programming assistants to CodeLogic's software dependency graph to provide code impact analysis and database change assessments.
  why_it_matters: It lets your AI assistant check blast radius and dependency impacts before suggesting changes, moving code review from guesswork to graph-backed evidence.
  mental_damage: You now have an AI assistant that can perfectly diagram exactly how your 'simple' one-line fix will cascade into three weeks of unplanned outage.
