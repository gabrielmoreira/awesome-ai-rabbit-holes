        surrounding_text: "- [gulmezeren2-byte/erp-report-engine](https://github.com/gulmezeren2-byte/erp-report-engine) [![gulmezeren2-byte/erp-report-engine MCP server](https://glama.ai/mcp/servers/gulmezeren2-byte/erp-report-engine/badges/score.svg)](https://glama.ai/mcp/servers/gulmezeren2-byte/erp-report-engine) 🐍 🏠 - Read-only MCP over the SQL database behind an ERP (Logo Tiger, Netsis, Mikro). The agent sees canonical entities like `orders`, never raw ERP tables, through a four-layer read-only guard that checks the statement, fails closed, and blocks side-effecting functions (`pg_read_file`, `xp_cmdshell`, …) — measured by a public 28-attack benchmark and an in-browser \"break it\" playground running the real guard via Pyodide."
