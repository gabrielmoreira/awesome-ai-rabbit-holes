insights:
  summary: A policy enforcement layer for AI coding agents that uses repo-native memory to prevent repeating previously identified mistakes.
  why_it_matters: It turns transient chat history and team knowledge into deterministic CI/Git gates, preventing agents from confidently re-introducing known anti-patterns.
  mental_damage: Finally, a way to turn your team's 'don't do that again' Slack messages into a mandatory runtime error for your LLM.
