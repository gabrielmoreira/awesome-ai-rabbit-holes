insights:
  summary: A CLI tool and MCP server that builds task-specific context bundles from a codebase using rule-based filtering, smart outlining, and clipboard or MCP output for LLM workflows.
  why_it_matters: It reduces the friction of manually hunting, copying, and curating files by letting developers and agents define reusable rules that select, outline, and deliver the right code context for reviews, debugging, and task-focused sessions.
  mental_damage: We have finally built a tool to manage the context we only need because the models can’t remember the repo we just opened.
  tags:
    - cli
    - context-management
    - llm-workflow
    - mcp
    - rules
  confidence: high
