insights:
  summary: A Python CLI and MCP server that selects, filters, outlines, and shares project code context with LLMs via clipboard or the Model Context Protocol.
  why_it_matters: It reduces the manual “find files, paste chunks, hit token limits” loop by letting developers generate task-specific context and let chat-based agents fetch additional files on demand via MCP.
  mental_damage: Finally, a tool that turns “please paste the relevant files” into a configurable rules engine—so you can spend your afternoon debugging YAML instead of auth.
  tags:
    - mcp
    - context-engineering
    - cli
    - python
    - developer-workflow
  confidence: high
