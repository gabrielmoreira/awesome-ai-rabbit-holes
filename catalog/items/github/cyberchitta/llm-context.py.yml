insights:
  summary: A CLI tool and MCP server that uses rule-based YAML+Markdown configurations to select, filter, and format relevant project files for sharing with LLMs via clipboard or context protocol.
  why_it_matters: It replaces the manual, token-budget guessing game of copying files into chat with composable rules that automate context selection for tasks like code review and documentation.
  mental_damage: We have officially reached the point where we need a dedicated rule engine just to manage what we are willing to show the AI, because apparently our repos are now too large for the models but too precious for us to summarize ourselves.
  tags:
    - context-management
    - mcp
    - cli
    - rules
  confidence: high
curation:
  status: included
  reason: The core novelty is the context-shaping system itself—using rules for selection, filtering, and formatting project context—rather than being a primary coding agent or a simple host integration.
  evidence:
    - Repo description states it is for sharing code with LLMs via MCP or clipboard using 'rule-based customization'.
    - README emphasizes 'smart context management' and 'composable rules' as the solution to context friction, not autonomous coding.
    - Includes an MCP server ('lc-mcp'), but MCP is a delivery mechanism for its primary identity as a context selection tool.
