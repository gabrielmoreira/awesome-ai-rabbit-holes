insights:
  summary: A CLI tool for sharing code with LLMs via Model Context Protocol or clipboard, with rule-based context customization and smart code outlining.
  why_it_matters: It streamlines LLM workflows by automating context selection, reducing manual file copying and token waste while enabling task-specific focus.
  mental_damage: Finally, a tool that lets you stop playing 'guess which files the AI needs' every time you ask it to review code.
  tags:
    - mcp
    - context-management
    - cli
    - code-review
    - prompt-engineering
  confidence: high
curation:
  status: included
  reason: The core novelty is the context-shaping system itself—using rules for selection, filtering, and formatting project context—rather than being a primary coding agent or a simple host integration.
  evidence:
    - Repo description states it is for sharing code with LLMs via MCP or clipboard using 'rule-based customization'.
    - README emphasizes 'smart context management' and 'composable rules' as the solution to context friction, not autonomous coding.
    - Includes an MCP server ('lc-mcp'), but MCP is a delivery mechanism for its primary identity as a context selection tool.
