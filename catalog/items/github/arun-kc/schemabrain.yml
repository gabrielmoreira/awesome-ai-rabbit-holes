insights:
  summary: A read-only MCP server that acts as a semantic and security layer between AI agents and databases.
  why_it_matters: It enables developers to safely grant AI agents access to databases by enforcing read-only constraints, preventing PII leaks, and maintaining tamper-evident audit logs.
  mental_damage: Because the only thing scarier than an agent hallucinating a join is an agent hallucinating a 'DROP TABLE' command.
