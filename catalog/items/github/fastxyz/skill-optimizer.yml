insights:
  summary: A CLI and Docker workbench for benchmarking, evaluating, and optimizing agent skills against multiple LLMs via OpenRouter.
  why_it_matters: It gives developers a deterministic way to measure whether their agent skills actually perform reliably across different models before shipping them.
  mental_damage: Now you can scientifically prove that your agent’s PDF extraction skill is only slightly more reliable than a coin flip, and you have the Docker logs to prove it.
