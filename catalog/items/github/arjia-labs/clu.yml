insights:
  summary: >-
    A local-first, SQLite-backed issue tracker and coordination layer designed to manage multiple AI coding agents on a
    single machine.
  why_it_matters: >-
    It provides a durable, shared state and dependency management system that allows multiple autonomous agents to
    collaborate on a codebase without conflicting or duplicating work.
  mental_damage: >-
    Nothing says 'modern developer experience' like needing an issue tracker and dependency graph just to manage your
    autonomous agent fleet.
  tags:
    - sqlite
    - multi-agent
    - orchestration
    - cli
    - local-first
  confidence: high
curation:
  status: included
  reason: >-
    It acts as a coordination layer that manages shared state, task dependencies, and agent concurrency rather than
    being a single coding agent itself.
  evidence:
