insights:
  summary: An open-source workspace and launcher that connects multiple AI coding agents—such as Claude Code, Codex CLI, and Cursor—into a shared hub for context sharing, file access, and collaborative task execution.
  why_it_matters: It lets developers centralize and coordinate disparate AI agents across machines and terminals without writing glue code or manually stitching context together.
  mental_damage: You’ve graduated from managing one hallucinating assistant to managing an entire chat room of them, all sharing a browser and a filesystem like it’s 1999.
  tags:
    - agents
    - cli
    - collaboration
    - multi-agent
    - workspace
  confidence: high
curation:
  status: included
  reason: This is a user-facing control plane for coordinating multiple AI agent runtimes, not a primary coding assistant, IDE, or app builder.
  evidence:
    - Repo description explicitly calls it 'AI Agent Networks for Open Collaboration' and the README pitches 'The Collaborative OS for Agents'.
    - It supports connecting Claude Code, OpenClaw, Codex CLI, Cursor, and others into a shared workspace with @mentions and shared files/browser.
    - The included launcher (`agn`) is a terminal dashboard to manage, configure, and daemonize multiple agent runtimes rather than being an agent itself.
