insights:
  summary: Orchestrator that routes coding tasks between OpenCode on a cheap model and stronger subagents via Jev for difficult turns.
  why_it_matters: Reduces cost by using lightweight models for routine coding while escalating complex reasoning to stronger agents when needed.
  mental_damage: Yet another layer to manage in the ever-growing stack of model routers, subagents, and cache warmers just to write a for-loop.
  tags:
    - model-routing
    - agent-orchestration
    - cost-optimization
  confidence: medium
