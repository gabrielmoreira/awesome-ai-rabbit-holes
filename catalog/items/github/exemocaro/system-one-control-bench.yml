        surrounding_text: "- [System-One Control Bench](https://github.com/Exemocaro/System-One-Control-Bench) ![type: cli](https://img.shields.io/badge/type-cli-4B5563?style=flat-square) ![stars](https://img.shields.io/github/stars/Exemocaro/System-One-Control-Bench?style=flat-square&label=%E2%98%85) - Model evaluation: steers an agent through 100 key-and-door grid puzzles with one Jev `Choice` per move, scoring every pick against an exact BFS solver, and finds that Jev picks an optimal move in 90% of 495 fixed positions yet finishes only 57 of 100 games (Gemma 4 26B 61, DeepSeek V4.1 Flash 60, with reasoning 80; the open decision models GLiClass 13 and Laya 12), so strong single decisions do not add up to a finished task; report and recorded games at [socb.dev](https://socb.dev)."
