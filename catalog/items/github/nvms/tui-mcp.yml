insights:
  summary: An MCP server that wraps a managed pseudo-terminal (pty) to let AI agents launch, monitor, and interact with stateful TUI apps like vim, htop, and db shells as if they were sitting at a real terminal.
  why_it_matters: It gives coding agents a persistent, interactive terminal session that can handle multi-step CLI flows, ANSI UIs, and stateful REPLs that stateless bash tools cannot.
  mental_damage: We’ve finally built a tool so agents can suffer through ncurses menus and interactive installers exactly the way we do.
  tags:
    - mcp
    - terminal
    - pty
    - agent-integration
  confidence: high
curation:
  status: included
  reason: The product’s identity is an MCP server that exposes terminal interaction as tools, and MCP is the primary adopted interface rather than a compatibility footnote.
  evidence:
    - README positions it as an MCP server analogous to Chrome DevTools MCP, with setup via `claude mcp add`.
    - "Tools are explicitly MCP tools: launch, screenshot, send_keys, wait_for_text, and others over a node-pty + xterm-headless stack."
    - Listed in awesome-mcp-servers under Server Implementations > Command Line, reinforcing MCP-first identity.
