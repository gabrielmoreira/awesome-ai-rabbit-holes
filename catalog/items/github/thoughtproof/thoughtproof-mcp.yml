  summary: >-
    An MCP server that provides adversarial multi-model reasoning verification for AI agents by challenging claims
    across Claude, Grok, DeepSeek, and Gemini with signed attestations.
  why_it_matters: >-
    It lets developers add a verification layer to agent workflows so that high-stakes claims can be challenged and
