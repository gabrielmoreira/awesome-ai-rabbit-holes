insights:
  summary: The Perfect Orchestrator is a tmux-based CLI tool that lets one Claude Code session spawn and adversarially verify N autonomous Claude Code workers.
  why_it_matters: It reduces hallucinated or premature 'done' claims in multi-agent setups by requiring cross-verification before accepting any result.
  mental_damage: Finally, a way to make your AI coworkers double-check each other so you don’t have to — until they start verifying your verification.
  tags:
    - orchestration
    - claude-code
    - multi-agent
    - verification
    - tmux
  confidence: high
