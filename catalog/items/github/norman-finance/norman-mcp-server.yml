insights:
  summary: An MCP server that connects Norman's bookkeeping, invoicing, and VAT filing platform to Claude, Cursor, and other MCP-compatible AI clients so entrepreneurs can manage finances via chat.
  why_it_matters: Developers running solo businesses can automate German tax prep, invoice tracking, and transaction categorization directly inside their existing AI coding and chat workflows instead of switching to a separate finance dashboard.
  mental_damage: We have successfully reached the point where filing VAT returns is just another context window away, right between debugging a React hook and arguing with an AI about semicolons.
