  summary: A fork of Mailpit adding Postmark API emulation and an MCP server that lets AI assistants list, search, and analyze emails for debugging workflows.
  why_it_matters: It lets developers stub transactional email and then point an AI coding agent directly at the inbox to verify sending behavior without leaving the workflow.
