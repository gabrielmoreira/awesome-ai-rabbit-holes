insights:
  summary: An MCP server that translates GPS coordinates into AI-ready location context, including place names, categories, and real-time opening hours, for use with Claude and other MCP-compatible assistants.
  why_it_matters: It allows coding agents and local assistants to ground themselves in the user's physical location, enabling context-aware responses without hardcoding location logic.
  mental_damage: We have successfully abstracted 'where am I' into a server call, because apparently checking a map is now a task that requires an autonomous agent and a protocol buffer.
