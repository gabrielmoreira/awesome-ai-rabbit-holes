insights:
  summary: An open-source mobile and macOS app that runs a complete offline AI suite—text, vision, image generation, voice transcription, and tool calling—entirely on-device using llama.cpp.
  why_it_matters: It pushes on-device inference to mobile, but remains a consumer end-user application rather than a developer tool or infrastructure component.
  mental_damage: Another reminder that the AI tooling explosion now includes offline mobile chat apps, so your developer FOMO can finally follow you into airplane mode.
  tags:
    - local-ai
    - mobile
    - offline-llm
    - llama-cpp
    - privacy-first
  confidence: high
curation:
  status: excluded
  reason: The project is a consumer-facing mobile and desktop application distributed on the App Store and Google Play; it is not a developer-facing coding assistant, runtime, SDK, or infra product.
  evidence:
    - README pitches end-user features—chat, generate images, use tools, listen—and displays App Store / Google Play download badges as its primary surface.
    - Repo description frames it as a privacy-first 'Swiss Army Knife of Offline AI' for personal mobile use, with no developer API, extension, or coding-workflow positioning.
    - Despite using llama.cpp under the hood, its identity matches end-user local apps like PrivateGPT or Anything LLM, which are common false positives for the local-ai category.
