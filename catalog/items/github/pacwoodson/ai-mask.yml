insights:
  summary: A Chrome extension that acts as a local AI inference provider, caching models once in the browser and serving them to compatible web apps via an SDK.
  why_it_matters: It lets developers build web apps with free, private, on-device inference while avoiding repeated multi-gigabyte model downloads per domain.
  mental_damage: We've successfully reinvented the GPU driver layer as a Chrome extension so we can argue about model cache partitions instead of just running Ollama.
