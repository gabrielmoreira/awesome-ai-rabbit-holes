insights:
  summary: A read-only kubectl wrapper that exposes Kubernetes cluster resources as structured JSON tools via the Model Context Protocol.
  why_it_matters: It allows AI agents like Claude Code to perform cluster triage and inventory via structured data rather than brittle text parsing of CLI tables.
  mental_damage: Finally, an AI that can tell you exactly why your pod is crashing without having to hallucinate the missing columns in a kubectl output table.
