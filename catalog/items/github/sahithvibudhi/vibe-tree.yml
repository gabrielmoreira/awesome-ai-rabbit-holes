insights:
  summary: A cross-platform desktop and web app that runs multiple AI coding assistants in parallel across isolated git worktrees to reduce context switching.
  why_it_matters: It lets developers delegate different tasks to separate AI agent sessions simultaneously without clobbering each other's working directories.
  mental_damage: You now have the infrastructure to run six Claude sessions in parallel, which mostly confirms that your bottleneck was never context switching to begin with.
