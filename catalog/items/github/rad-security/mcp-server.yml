insights:
  summary: An MCP server that exposes RAD Security's Kubernetes and cloud security insights, container inventory, CVE data, and audit logs to AI assistants like Claude Desktop and Cursor.
  why_it_matters: It lets developers query runtime misconfigurations, CVEs, and cluster findings directly from their AI coding assistant instead of switching to a separate security dashboard.
  mental_damage: You can now ask your coding assistant why your cluster is on fire, and it will politely quote RAD Security findings back to you in the same window where you just introduced the bug.
