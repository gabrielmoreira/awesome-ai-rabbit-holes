insights:
  summary: An MCP server that converts Markdown text into interactive mind maps and exports them as PNG, JPG, or SVG images.
  why_it_matters: Developers can hand off Markdown-based specs, docs, or brain dumps to an LLM and get back a navigable mind map with zero manual diagramming.
  mental_damage: We have successfully automated the part of the job where you stare at a blank page and wonder if your thoughts are best expressed as a tree.
