insights:
  summary: An MCP server that converts Markdown text into interactive mind maps and exports them as PNG, JPG, or SVG images.
  why_it_matters: It gives coding agents and MCP clients a standardized tool to visualize structured text, specs, or planning docs as interactive diagrams without leaving the workflow.
  mental_damage: We have successfully abstracted Markdown—which was already a simplification of HTML—into a protocol server that renders a mind map, because apparently reading nested bullet points is now a context-window crisis.
