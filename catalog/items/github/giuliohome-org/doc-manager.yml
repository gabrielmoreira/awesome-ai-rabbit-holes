insights:
  summary: A zero-knowledge document vault that exposes an MCP server to let AI assistants list, search, and update private documents.
  why_it_matters: It enables a secure way to give LLMs access to a private knowledge base without sacrificing end-to-end encryption for the most sensitive files.
  mental_damage: The peace of mind that comes from zero-knowledge encryption is slightly undermined by the fact that you're still giving a third-party LLM a window into your encrypted vault.
