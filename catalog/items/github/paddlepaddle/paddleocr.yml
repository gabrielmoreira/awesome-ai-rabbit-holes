  summary: A Python-based OCR toolkit that converts PDFs and images into structured data formats like JSON and Markdown for downstream AI and LLM workflows.
  why_it_matters: It provides the foundational document-parsing layer needed to feed clean, structured data into RAG pipelines, agents, and other LLM applications.
  mental_damage: Yet another reminder that while models can debate philosophy, we are still writing 70,000-star libraries just to teach computers to read a tilted PDF.
