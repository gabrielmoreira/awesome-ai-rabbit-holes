insights:
  summary: A local Model Context Protocol (MCP) broker that aggregates multiple upstream servers into a single, compact endpoint for clients.
  why_it_matters: It prevents context window bloat and process duplication by routing tool requests on demand rather than loading every available tool definition into every session.
  mental_damage: Because instead of just letting the AI handle our tools, we now need a specialized middleware layer to manage the complexity of the tools the AI is handling.
  tags:
    - mcp
    - broker
    - context-reduction
    - local-infrastructure
    - middleware
  confidence: high
curation:
  status: included
  reason: The project's core identity is a protocol-level middleware layer designed specifically for MCP infrastructure.
  evidence:
    - README describes it as a 'PgBouncer for MCP' providing a stable local endpoint for multiple upstreams
    - Explicitly claims significant context reduction (92.94% tool-definition count reduction)
    - Operates as a local daemon via a Unix socket to manage server lifecycles
