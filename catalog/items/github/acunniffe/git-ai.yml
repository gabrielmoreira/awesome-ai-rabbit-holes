insights:
  summary: A Git extension that automatically tracks and attributes AI-generated code to the specific model, agent, and session that wrote it.
  why_it_matters: It restores provenance to repositories increasingly filled with agent-generated code, letting developers trace implementation details back to the original AI session and prompt.
  mental_damage: We have successfully reached the point where we need a dedicated audit trail just to remember which chatbot we delegated our codebase to.
