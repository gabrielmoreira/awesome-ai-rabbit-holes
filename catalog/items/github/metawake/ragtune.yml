insights:
  summary: A CLI tool for debugging, benchmarking, and monitoring RAG retrieval layers across vector stores like Qdrant, pgvector, and Pinecone.
  why_it_matters: It lets developers instrument and regression-test their retrieval pipeline with metrics like Recall@K and NeedleCoverage before the hallucinations hit production.
  mental_damage: You now have a CI gate to tell you exactly how broken your retrieval is, which is somehow more stressful than just hoping the embeddings figure it out.
