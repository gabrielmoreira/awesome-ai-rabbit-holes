insights:
  summary: ASC-MCP is a Swift-based Model Context Protocol server that exposes 348 tools for managing App Store Connect APIs from MCP-compatible hosts like Claude Code or Cursor.
  why_it_matters: It lets iOS/macOS developers automate App Store Connect workflows—releases, TestFlight, IAP, analytics—through natural language in their coding assistant.
  mental_damage: Finally, a way to plead with your AI to bump a version number without digging through Apple’s labyrinthine API docs.
