insights:
  summary: An MCP server that exposes JetBrains TeamCity CI/CD operations as tools for AI coding assistants like Claude Code, Cursor, and Windsurf.
  why_it_matters: It allows developers to trigger builds, inspect test failures, and manage build configurations directly from their AI assistant without context-switching to the TeamCity UI.
  mental_damage: Your AI assistant can now argue with you about why the build failed while simultaneously having the power to break the CI server entirely in 'Full Mode'.
