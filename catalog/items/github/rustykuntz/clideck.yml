insights:
  summary: A local dashboard for running and coordinating multiple AI CLI coding agents—such as Claude Code, Codex, and Gemini CLI—in a single browser window with live status, session management, and automated task routing.
  why_it_matters: It solves the terminal-management problem of running several concurrent coding agents by providing a unified UI, session resume, and an autopilot mode that hands off work between agents.
  mental_damage: We have entered the terminal multiplexer phase of AI tooling, where the newest developer skill is horizontally scaling your CLI agents while remotely supervising them from a phone like a digital foreman.
  tags:
    - cli
    - multi-agent
    - terminal
    - dashboard
    - local
  confidence: high
