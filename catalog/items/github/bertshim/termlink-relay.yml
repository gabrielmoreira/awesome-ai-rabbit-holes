insights:
  summary: An open-source relay protocol and binary for remotely accessing terminal-based coding agents via a browser or phone.
  why_it_matters: >-
    It allows developers to maintain a persistent, mobile-accessible connection to their local AI coding sessions
    without the security overhead of SSH or VPNs.
  mental_damage: >-
    Because your terminal-based coding agent still hasn't quite achieved its dream of being a mobile-first social media
    app.
  tags:
    - claude-code
    - remote-access
    - terminal
    - session-management
    - self-hosted
  confidence: high
curation:
  status: included
  reason: >-
    The tool functions as a connectivity layer that augments existing terminal agents with remote access capabilities
    rather than acting as the assistant itself.
  evidence:
    - Provides remote access for Claude Code, Codex CLI, and Cursor Agent
    - Uses a relay/host/client architecture to bypass SSH and VPN requirements
    - Repo is an open-source subset of the commercial TermLink product
