insights:
  summary: Gavelin is a hosted MCP server that provides AI agents with searchable access to bills and speaker-attributed hearing transcripts from all 50 US state legislatures.
  why_it_matters: It gives coding agents and MCP-compatible clients structured, speaker-attributed legislative data so they can answer policy and legal research queries without scraping government websites.
  mental_damage: We have finally reached the point where lobbyists can vibe-code their opposition research and bill tracking through a streaming HTTP endpoint.
