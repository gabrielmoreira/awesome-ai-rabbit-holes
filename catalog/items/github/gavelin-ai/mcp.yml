insights:
  summary: Gavelin is a proprietary MCP server that provides AI agents with structured access to US state legislative data, including speaker-attributed hearing transcripts and bill search across all 50 states.
  why_it_matters: It allows developers building policy, legal, or government-facing AI workflows to connect structured state-level legislative intelligence directly into Claude, Cursor, or custom MCP clients.
  mental_damage: Your AI agent can now cite exactly what a senator said in a committee hearing three years ago, ensuring your policy app is dangerously well-informed while the rest of us still struggle to get autocomplete to handle a useEffect dependency array.
