insights:
  summary: MCP server providing cross-platform file search via Everything SDK (Windows), mdfind (macOS), and locate/plocate (Linux).
  why_it_matters: Enables AI agents to instantly search local filesystems for code, docs, or assets without leaving the assistant interface.
  mental_damage: Yet another MCP server that turns your dev box into a searchable black box for LLMs to hallucinate file paths from.
