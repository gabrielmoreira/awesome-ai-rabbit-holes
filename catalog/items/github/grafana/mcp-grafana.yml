insights:
  summary: An official MCP server from Grafana that exposes dashboards, datasources, and query engines (Prometheus, Loki, ClickHouse, etc.) to AI models and MCP-compatible clients.
  why_it_matters: It lets developers and AI assistants directly search dashboards, run queries, and modify panels through natural language instead of clicking through Grafana UI or hand-writing API calls.
  mental_damage: You now have the privilege of debugging a PromQL query that was hallucinated by a model and proxied through three layers of MCP middleware.
  tags:
