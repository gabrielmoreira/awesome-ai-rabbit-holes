  summary: An opinionated, batteries-included agent harness built on top of LangGraph and LangChain.
  why_it_matters: >-
    It provides a standardized, production-ready implementation for complex multi-step agentic workflows, including
    sub-agents, persistent memory, and filesystem access.
  mental_damage: >-
