insights:
  summary: The official Model Context Protocol (MCP) server that exposes Kagi search and summarization tools to compatible AI clients like Claude Code and OpenAI Codex.
  why_it_matters: It allows developers to swap the default web search in their coding agents for Kagi's API, offering potentially higher-quality results and summary engines inside the IDE.
  mental_damage: We have successfully abstracted web searching to the point where we now need a protocol server to argue with our agents about which search engine they are allowed to use.
