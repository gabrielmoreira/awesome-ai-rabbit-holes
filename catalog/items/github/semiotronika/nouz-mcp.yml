insights:
  summary: An MCP server that connects local Markdown knowledge bases, such as Obsidian or Logseq vaults, to AI agents by generating semantic graphs, classifying content domains, and tracking knowledge drift.
  why_it_matters: It allows coding agents to semantically navigate personal knowledge graphs and project memory vaults via the Model Context Protocol, rather than treating notes as a flat list of files.
  mental_damage: You can now give your agent a five-level semantic hierarchy and watch it confidently hallucinate connections between your abandoned side projects and your actual work.
