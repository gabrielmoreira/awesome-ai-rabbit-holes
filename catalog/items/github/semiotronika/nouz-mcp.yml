insights:
  summary: An MCP server that builds semantic knowledge graphs over local Markdown vaults like Obsidian and Logseq, classifying notes into domains and detecting structural drift.
  why_it_matters: It gives MCP-compatible agents a structured, queryable memory layer so they can reason over your personal knowledge base instead of treating every note as an isolated file.
  mental_damage: Finally, a tool to worry about whether your weekend Obsidian notes are semantically drifting away from the domain you assigned them after two glasses of wine.
