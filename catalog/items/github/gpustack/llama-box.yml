insights:
  summary: An OpenAI-compatible local inference server for LLMs and diffusion models, built on llama.cpp and stable-diffusion.cpp, that supports multimodal inputs, function calling, and multi-GPU/RPC offloading.
  why_it_matters: It lets developers run a wide range of local models behind a familiar OpenAI API, making it easier to test, prototype, and integrate local AI without relying on hosted services.
  mental_damage: Yet another local inference wrapper that teaches us the true cost of AI autonomy is maintaining an RPC server for a project that politely tells you to use the upstream repo instead.
  tags:
    - cpp
