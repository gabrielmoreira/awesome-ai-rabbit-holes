insights:
  summary: A read-only local MCP server that exposes Swarmia's Export API to MCP clients for querying pull request metrics, DORA metrics, investment balance, and effort reporting.
  why_it_matters: It lets developers and AI assistants query team engineering metrics like DORA and cycle time directly from tools such as Claude or Cursor instead of switching to the Swarmia dashboard.
  mental_damage: Another MCP server so your AI can explain why your team's cycle time sucks while you're busy debugging the MCP config.
