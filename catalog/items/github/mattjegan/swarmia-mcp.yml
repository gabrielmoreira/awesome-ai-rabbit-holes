insights:
  summary: A read-only local MCP server that exposes Swarmia's Export API endpoints for pull requests, DORA metrics, investment balance, and effort reporting to MCP-compatible clients like Claude and Cursor.
  why_it_matters: It lets developers query team-level engineering metrics and capitalization reports conversationally inside their AI coding assistant instead of jumping into the Swarmia dashboard.
  mental_damage: We’ve reached the point where we need an AI agent just to help us emotionally process how long our pull requests have been sitting in review.
