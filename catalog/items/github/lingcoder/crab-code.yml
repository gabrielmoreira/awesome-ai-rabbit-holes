insights:
  summary: An open-source, Rust-native CLI coding agent that replicates Claude Code's workflows and toolset while supporting any LLM provider.
  why_it_matters: Developers can self-host an agentic coding loop with multi-provider flexibility while avoiding vendor lock-in to proprietary assistants.
  mental_damage: We have reached the point where building a 149k-line Rust clone of a proprietary CLI is considered the efficient path to coding autonomy.
  tags:
    - cli
    - rust
    - coding-agent
    - open-source
    - llm-agnostic
  confidence: high
curation:
  status: included
  reason: This is a standalone, terminal-native coding assistant that plans, edits, and executes across a repo, fitting the primary identity of a coding agent rather than an extension or framework.
