insights:
  summary: >-
    RLFactory is an RL post-training framework for agentic learning that decouples the environment from training,
    supports async tool-calling, and enables fast training of agent models like Qwen3 with MCP tools.
  why_it_matters: >-
    It gives developers a code-first way to train custom agent models with tool-use and reward shaping, cutting
    environment boilerplate and doubling RL training speed.
  mental_damage: >-
    Just when you thought you were done fine-tuning chatbots, it’s time to RL-train your agent against a custom reward
    function, because nothing says developer productivity like debugging a policy gradient loop at 2am.
