insights:
  summary: Continue runs AI agents as GitHub status checks on pull requests using markdown-defined rules powered by its open-source CLI.
  why_it_matters: It lets teams codify review standards as version-controlled AI checks that run automatically in CI, bridging the gap between linters and human code review.
  mental_damage: You can now version-control your anxiety by encoding subjective code review opinions into YAML files that an AI will enforce on every single pull request.
  tags:
    - ci
    - code-review
    - cli
    - github-checks
    - ai-agents
  confidence: high
