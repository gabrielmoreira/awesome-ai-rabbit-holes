insights:
  summary: Continue is an open-source CLI and CI tool that runs source-controlled AI checks, defined as markdown files in a repo, as GitHub status checks on pull requests.
  why_it_matters: It lets teams encode coding standards and review rules as version-controlled markdown files, enforcing them automatically via AI on every pull request.
  mental_damage: We have successfully automated the experience of waiting for a senior developer to sigh at your PR, but now it returns a diff in under three seconds.
