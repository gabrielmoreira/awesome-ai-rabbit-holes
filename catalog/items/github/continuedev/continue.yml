insights:
  summary: Open-source coding agent that runs AI checks as GitHub status checks on pull requests.
  why_it_matters: It lets developers enforce AI-driven code reviews (e.g., security checks) directly in CI via markdown-defined agents in `.continue/checks/`.
  mental_damage: Now your PRs can be rejected by both humans and YAML files.
