insights:
  summary: Continue is an open-source CLI that runs source-controlled AI checks as enforceable CI status checks on pull requests.
  why_it_matters: It lets teams codify review policies (security, style, conventions) as repo-owned agent/check definitions so PR feedback is consistent and automated.
  mental_damage: Now your code review can fail because a markdown file decided your PR “looks risky,” and you get to debug the diff suggestion like it’s a flaky unit test with opinions.
  tags:
