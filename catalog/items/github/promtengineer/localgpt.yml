insights:
  summary: A local, privacy-focused document intelligence platform that lets you chat with your files using on-device LLMs and a modular RAG pipeline with hybrid search.
  why_it_matters: It gives developers a self-contained way to index, retrieve, and query private documents via API or UI without sending data to external inference providers.
  mental_damage: Now you can run a full hybrid-search RAG stack on your laptop and still find a way to blame the context window when the answer is mediocre.
