insights:
  summary: An MCP server that rewrites vague prompts into platform-optimized versions for 58+ AI tools by pulling context from workspace files like CLAUDE.md and .cursorrules.
  why_it_matters: It sits between you and your AI tools to automatically inject the right syntax, parameters, and project context so you don't have to memorize platform-specific prompt dialects.
  mental_damage: We have now reached the point where we need an AI tool to optimize our prompts for the AI tools that are optimizing the prompts we use to talk to AI tools.
  tags:
    - mcp
    - prompt-optimization
    - context-awareness
    - multi-platform
  confidence: medium
