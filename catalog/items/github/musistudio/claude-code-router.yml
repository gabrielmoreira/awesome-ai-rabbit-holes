insights:
  summary: A CLI tool that acts as a proxy for Claude Code, allowing developers to route requests to alternative models like OpenRouter, DeepSeek, or Ollama while maintaining the Claude Code interface.
  why_it_matters: It decouples the Claude Code UX from Anthropic's specific models, letting teams use local or cheaper models for background tasks while keeping the workflow they already know.
  mental_damage: "We have achieved the final form of the AI arms race: a router for your router, so you can use a cheaper model to pretend it's the expensive one while praying the context window survives the proxy chain."
