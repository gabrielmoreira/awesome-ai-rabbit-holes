insights:
  summary: A CLI tool that proxies and routes Claude Code requests to alternative models and providers while keeping the Claude Code interface intact.
  why_it_matters: It lets developers keep using Claude Code’s workflow while routing background tasks, long-context work, and heavy thinking to cheaper or specialized models without switching tools.
  mental_damage: We have finally invented the middleware of the middleware, so you can now micro-manage your model routing while convincing yourself you’re still shipping.
  tags:
    - cli
    - model-routing
    - claude-code
    - multi-provider
    - terminal
  confidence: high
