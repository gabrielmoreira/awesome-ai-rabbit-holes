insights:
  summary: A Python CLI and module that takes an input CSV and target field, then generates optimized machine learning/deep learning models along with native Python pipeline code for TensorFlow and XGBoost.
  why_it_matters: It lets developers and data scientists skip writing boilerplate preprocessing and model architecture code by generating a tweakable baseline pipeline from the command line.
  mental_damage: Because nothing says modern developer productivity like pretending AutoML from 2019 didn't already teach us that generated baselines still require a human to clean up the mess.
