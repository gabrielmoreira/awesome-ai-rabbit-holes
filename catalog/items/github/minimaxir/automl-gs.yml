insights:
  summary: AutoML tool that generates trained models and pipeline code from a CSV and target field using TensorFlow or XGBoost.
  why_it_matters: Lets developers quickly prototype ML models without manual feature engineering or model definition, accelerating baseline experimentation.
  mental_damage: The illusion that AutoML eliminates thinking, when really it just shifts the cognitive load from tuning to trusting opaque hyperparameter searches.
