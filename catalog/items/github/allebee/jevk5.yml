          answers — yes/no, choice, score — in one forward pass with zero generated tokens (~13 ms on an H100), plus a
          head-to-head harness that puts Jev and the open model on the identical board and question so the two can be
          compared directly. It serves TypeSafe's \`/v1/systemone\` wire format, so a Jev client can point at it
          unchanged.
