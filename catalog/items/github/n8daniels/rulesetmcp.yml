insights:
  summary: An MCP server that exposes version-controlled project rules, coding standards, and guidelines to AI agents via tools for listing, querying, and validating code against defined conventions.
  why_it_matters: It lets teams define coding standards and architectural rules once in code, then makes them queryable and enforceable across any MCP-compatible AI session instead of re-explaining them every time.
  mental_damage: We have successfully abstracted away the need to manually paste our own rules into the chat, freeing up valuable tokens to argue with the AI about why it is still ignoring them.
