insights:
  summary: An open-source Python implementation of a Perplexity-like search experience that uses Google and an LLM to answer questions.
  why_it_matters: It gives developers a minimal, hackable way to build or understand AI-powered search agents from ~200 lines of code.
  mental_damage: Another clone of a commercial product that reinforces the idea that every AI feature must be reimplemented in under 300 lines to prove a point.
  tags:
    - ai-search
    - llm-agent
    - open-source
  confidence: medium
curation:
  status: included
  reason: It is a standalone terminal-based coding assistant that reads user queries, plans web searches, fetches content, and generates answers using an LLM, fitting the core behavior of a coding agent despite its search focus.
