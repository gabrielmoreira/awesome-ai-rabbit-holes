insights:
  summary: A local-first, self-hosted orchestration tool that coordinates Claude and Codex CLI coding agents across multiple repositories with an audit trail and dashboard interfaces.
  why_it_matters: It lets developers decompose tickets into cross-repo agent task graphs and preserve decision rationale, bridging the gap between single-repo assistants and multi-service backends.
  mental_damage: We have finally built Slack for the bots, which means the agents can now argue with each other about your architecture while you are stuck debugging the orchestrator.
  tags:
    - agent-orchestration
    - mcp
    - local-first
    - cross-repo
    - cli
  confidence: high
