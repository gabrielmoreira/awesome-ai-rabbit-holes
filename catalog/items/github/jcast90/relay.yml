insights:
  summary: A local-first, self-hosted orchestration tool that coordinates coding agents like Claude and Codex across multiple repositories via MCP, featuring CLI, TUI, and GUI dashboards with an audit trail.
  why_it_matters: It allows developers to manage cross-repo dependencies and agent communication in one place, turning high-level tickets into multi-repo execution plans with full state persistence.
  mental_damage: You now have a Slack channel for your bots to argue with each other across repos, ensuring that even your automation requires an organizational chart.
  tags:
    - agent-orchestration
    - multi-repo
    - mcp
    - local-first
    - cross-repo
  confidence: high
