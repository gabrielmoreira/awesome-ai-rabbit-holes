insights:
  summary: An MCP server that captures coding checkpoints on git events and inactivity, allowing AI assistants to retrieve context about what the developer was doing and what to do next.
  why_it_matters: It reduces the context-rebuilding overhead when returning to a project after time away by letting AI assistants read structured checkpoints instead of re-inferring state from scratch.
  mental_damage: We have invented a system to remind ourselves what we were doing, which is itself another background process we must now remember to configure and trust.
