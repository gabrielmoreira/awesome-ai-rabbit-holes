insights:
  summary: An MCP server that exposes the Coolify API to AI assistants, enabling deployment, management, and diagnostics for self-hosted applications.
  why_it_matters: It allows AI coding assistants to move beyond writing code and take direct action on the infrastructure where that code is deployed.
  mental_damage: Because now your AI assistant can not only hallucinate your logic but also accidentally wipe your production database.
