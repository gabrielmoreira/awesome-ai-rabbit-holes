insights:
  summary: An MCP server that exposes language server protocol (LSP) capabilities like go-to-definition, references, and diagnostics to MCP-enabled AI clients.
  why_it_matters: It allows coding assistants to perform deep semantic code navigation and refactoring by tapping into existing language servers rather than guessing structure from raw text.
  mental_damage: We have successfully abstracted the abstraction, so your AI can now use the same protocol your IDE uses to pretend it knows what your code actually does.
