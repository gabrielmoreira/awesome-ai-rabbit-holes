insights:
  summary: An MCP server and REST API that classifies crypto market structural regimes (bounded, active, unstable) and estimates stability half-life for pre-trade risk gating in trading bots and autonomous agents.
  why_it_matters: Developers building crypto trading agents can call a single endpoint to get structured regime signals and exit urgency instead of rolling their own TA pipelines.
  mental_damage: Celebrates 100% bounded-regime accuracy while quietly burying the fact that the model still has to survive an active or unstable market without your bot nuking the account.
