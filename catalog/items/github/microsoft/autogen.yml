insights:
  summary: A programming framework for building multi-agent AI applications in Python, now in maintenance mode in favor of Microsoft's newer Agent Framework.
  why_it_matters: It provides the foundational building blocks for developers to compose autonomous assistants that can coordinate tasks, use tools via MCP, and hand off work to specialist agents.
  mental_damage: We spent two years wiring agents together in a framework that is now gently sunset into a new Microsoft framework that will likely be sunset again by 2026.
  tags:
    - multi-agent
    - framework
    - python
    - mcp
    - orchestration
  confidence: high
curation:
  status: included
  reason: AutoGen is a code-first library and SDK used by developers to build multi-agent systems in Python, fitting the Frameworks & SDKs identity rather than a standalone coding assistant or control plane.
  evidence:
    - Repo description explicitly states 'A programming framework for agentic AI'.
    - README shows primary usage via Python imports (AssistantAgent, OpenAIChatCompletionClient) and pip install commands.
    - README explicitly labels the project as 'maintenance mode' and directs users to the newer Microsoft Agent Framework.
