insights:
  summary: A model-agnostic SDK for building AI agents and multi-agent systems, now positioned as the precursor to Microsoft's enterprise-grade Agent Framework.
  why_it_matters: It provides a stable, multi-language foundation for developers to orchestrate complex LLM workflows, connect to various model providers, and integrate tools via MCP without vendor lock-in.
  mental_damage: It’s the rare Microsoft library that upgrades itself out of a job, forcing you to migrate from a 'kernel' to a 'framework' just as you finished reading the docs.
