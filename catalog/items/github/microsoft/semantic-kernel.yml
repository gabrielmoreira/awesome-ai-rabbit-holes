insights:
  summary: Semantic Kernel is a model-agnostic SDK for building, orchestrating, and deploying AI agents and multi-agent systems.
  why_it_matters: It lets developers integrate LLM capabilities into applications using familiar .NET, Python, or Java code with plugin-based extensibility.
  mental_damage: Another enterprise SDK promising 'agent orchestration' while quietly adding to the stack of frameworks you’ll need to learn before shipping a single LLM feature.
  tags:
    - semantic-kernel
    - ai-framework
    - multi-agent
  confidence: high
curation:
  status: included
  reason: Semantic Kernel is primarily a code-first SDK for embedding AI agents into applications, matching the Frameworks & SDKs category’s focus on importable libraries rather than operated platforms or assistants.
  evidence:
    - README describes it as a 'model-agnostic SDK that empowers developers to build, orchestrate, and deploy AI agents'
    - Installation via pip, dotnet add package, and Java SDK shows it is designed to be imported into developer code
    - Source lists place it in 'AI Frameworks and SDKs' and 'Other LLM Frameworks' sections
