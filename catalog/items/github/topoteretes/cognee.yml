insights:
  summary: Cognee is an open-source memory control plane that combines embeddings, knowledge graphs, and cognitive science approaches to give AI agents persistent, searchable memory of data, decisions, and workflows.
  why_it_matters: It provides developers with unified ingestion and retrieval infrastructure so agents can maintain context, learn from feedback, and share knowledge across sessions instead of resetting every run.
  mental_damage: Yet another chance to outsource your own memory to a graph database, because clearly the problem wasn't too many moving parts in your agent stack.
  tags:
    - memory
    - rag
    - knowledge-graph
    - context-engineering
    - agent-infra
  confidence: high
curation:
  status: included
  reason: The core novelty is a memory and context system for agents—combining embeddings, graphs, and retrieval—rather than being a coding assistant, extension, or MCP-first tool.
  evidence:
    - Repo description says 'Memory control plane for AI Agents' and topics include ai-memory, context-engineering, graph-rag, knowledge-graph.
    - README states it 'combines embeddings, graphs and cognitive science approaches' to provide searchable, connected, and learning memory for agents.
    - Although listed in awesome-mcp lists, MCP is only a compatibility adapter (Claude Code plugin exists), not the product identity.
