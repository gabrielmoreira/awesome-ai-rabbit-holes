insights:
  summary: A CLI toolkit for testing LLMs against adversarial attacks like prompt injection and jailbreaking, while benchmarking models for security, bias, and toxicity.
  why_it_matters: It gives developers a command-line workflow to scan and benchmark their LLM deployments for vulnerabilities before shipping them to production.
  mental_damage: Finally, a tool to scientifically prove that your carefully aligned model will still tell users how to build a meth lab if they just ask nicely enough.
