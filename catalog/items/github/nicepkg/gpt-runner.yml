insights:
  summary: A VSCode extension, CLI, and web UI for managing reusable AI presets and chatting with selected project files using OpenAI or Anthropic models.
  why_it_matters: It lets developers version-control AI role presets as .gpt.md files and query multiple code files without manually copying them into a chat window.
  mental_damage: We have officially reached the point where we need a Storybook for our AI prompts, because apparently even our hallucinations deserve proper git history.
