insights:
  summary: A local CLI, web UI, and VSCode extension for managing AI presets and chatting with selected code files using OpenAI or Anthropic models.
  why_it_matters: It lets teams version-control reusable AI prompt presets as .gpt.md files and avoids the manual copy-paste workflow when discussing code with LLMs.
  mental_damage: We have finally solved the ancient engineering problem of copying code into a browser tab and pasting it back, provided you also maintain yet another config file format.
  tags:
    - prompt-presets
    - vscode-extension
    - cli
    - context-management
  confidence: medium
