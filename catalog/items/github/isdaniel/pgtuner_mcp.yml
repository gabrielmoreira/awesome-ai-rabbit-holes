insights:
  summary: An MCP server that connects AI assistants to PostgreSQL instances to analyze slow queries, recommend indexes using HypoPG, and surface database health metrics.
  why_it_matters: It lets coding agents and MCP clients directly diagnose and tune production database performance without the developer manually exporting query plans or guessing at index strategies.
  mental_damage: We have successfully automated the ritual of staring at pg_stat_statements and praying that adding an index won't explode the disk.
