  summary: A Model Context Protocol (MCP) server that allows AI agents in IDEs like Cursor and VS Code to query Azure Resource Graph for resource information across subscriptions.
  why_it_matters: It bridges the gap between AI coding assistants and live Azure infrastructure, allowing developers to query cloud resources directly from their editor without switching contexts.
  mental_damage: Now your AI can second-guess your Azure subscription costs while you're trying to write a for-loop, provided you've correctly configured three different JSON files and the Azure CLI.
