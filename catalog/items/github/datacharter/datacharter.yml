insights:
  summary: DataCharter is a local federated data explorer that lets developers query files and databases with DuckDB and govern AI agent access via charter.yaml contracts.
  why_it_matters: It enables developers to safely expose only the data they choose to AI agents, enforcing PII masking, access policies, and auditability locally.
  mental_damage: Finally, a way to stop panicking every time you point an AI at your data warehouse and whisper 'please don’t leak SSNs'.
  tags:
    - data-governance
    - local-first
    - mcp
    - ai-safety
  confidence: medium
curation:
  status: included
  reason: DataCharter’s core is governed context delivery—masking, policy enforcement, and audit trails that shape what agents see—making it a context engineering tool, not a coding agent or MCP server alone.
  evidence:
    - README emphasizes 'governed data plane for AI agents' with PII masking, column-level access, and policies like 'aggregates only' enforced via query analysis
    - Repo description and MCP server listing highlight federated local DuckDB access governed by charter.yaml contracts
    - Features like `datacharter eval`, `access diff`, and redteam tooling focus on measuring and verifying what context agents receive, not writing code
