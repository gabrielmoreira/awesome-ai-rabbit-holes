insights:
  summary: Fructose is a Python package that turns type-annotated functions into strongly-typed LLM calls via an `@ai` decorator.
  why_it_matters: It lets developers invoke LLMs as if they were native Python functions, with support for complex types, local function calling, and custom clients.
  mental_damage: Finally, a way to pretend your LLM is just a very expensive function call.
  tags:
    - python
    - llm-wrapper
    - type-annotations
    - function-calling
  confidence: high
