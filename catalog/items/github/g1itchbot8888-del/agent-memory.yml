insights:
  summary: A local-first memory system for autonomous agents using SQLite and local embeddings.
  why_it_matters: It provides a lightweight, private way for agents to maintain continuity across sessions via a three-layer memory architecture (identity, active, and archive).
  mental_damage: Finally, a way to ensure your agent remembers exactly which hallucination it decided to stick with during the last session.
