insights:
  summary: A local-first memory system for autonomous agents that uses a three-layer architecture (identity, active, archive) with SQLite and local embeddings to manage context across sessions.
  why_it_matters: It provides a token-efficient way for coding agents and AI tools to maintain state and recall decisions without relying on cloud APIs or enterprise memory servers.
  mental_damage: We have now reached the point where the agent is building its own therapy journal because it can't remember if it already fixed the bug or just hallucinated fixing it.
