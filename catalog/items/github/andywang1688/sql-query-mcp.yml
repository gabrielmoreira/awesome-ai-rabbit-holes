insights:
  summary: A read-only MCP server that lets AI clients discover schemas, sample data, and run constrained SQL queries across PostgreSQL and MySQL databases.
  why_it_matters: It lets you safely expose database context to coding agents for schema-aware SQL generation without handing over raw connection strings or write access.
  mental_damage: We have successfully abstracted the database so that the AI can now competently select from tables you forgot you had.
