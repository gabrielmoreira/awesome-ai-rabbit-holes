insights:
  summary: >-
    Official MCP server that exposes Browserless.io's smart scraper, search, and browser automation tools to LLM clients
    via the Model Context Protocol.
  why_it_matters: >-
    Lets AI agents perform real-world web tasks like scraping, crawling, and Lighthouse audits without managing
    Puppeteer or headless browsers themselves.
  mental_damage: >-
    Another MCP server promising to let your AI 'use the web' — as if the hard part wasn’t getting it to stop
    hallucinating trip itineraries from 2007.
