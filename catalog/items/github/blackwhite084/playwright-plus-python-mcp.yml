insights:
  summary: A Model Context Protocol server that exposes Playwright browser automation tools—navigation, screenshots, clicks, form fills, and evaluation—to AI assistants like Claude Desktop.
  why_it_matters: It lets AI agents control a real browser via MCP, enabling automated testing, scraping, and UI interaction workflows without custom glue code.
  mental_damage: We have successfully abstracted the browser so that the AI can now click buttons on our behalf while we debug why the AI clicked the wrong button.
