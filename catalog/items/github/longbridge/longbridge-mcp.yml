insights:
  summary: Longbridge MCP Server is an official Model Context Protocol server providing 145 financial tools for US and HK markets via the Longbridge brokerage API.
  why_it_matters: It lets developers access real-time trading data, order routing, and portfolio analytics through standardized MCP clients without custom API integration.
  mental_damage: Another day, another brokerage wrapping its REST API in MCP so your AI can finally lose money with standardized tool calls.
  tags:
    - mcp
    - finance
    - trading
  confidence: high
curation:
  status: included
  reason: The product is an MCP-first server exposing financial data and trading tools via the Model Context Protocol, making MCP its core identity rather than an adapter or compatibility layer.
  evidence:
    - Official MCP server for the Longbridge brokerage with 145 tools across real-time quotes, options, order routing, and portfolio analytics
    - Built with Rust using rmcp and axum, explicitly designed as MCP infrastructure with stateless architecture and OAuth 2.1 resource metadata compliance
    - Connects via standard MCP clients (Claude Desktop, Claude Code, Zed, Cursor) using streamable-http transport and auto-discovered OAuth via RFC 9728
