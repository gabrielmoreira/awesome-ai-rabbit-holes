insights:
  summary: A structured extraction API and MCP server that turns product URLs or HTML into JSON with per-field confidence scoring and extraction provenance.
  why_it_matters: Developers building commerce agents can stop guessing whether extracted product data is real or hallucinated by filtering low-confidence fields server-side before they reach the agent.
  mental_damage: We have finally built an API that confesses exactly how uncertain it is, so your agent can now hallucinate with complete transparency.
