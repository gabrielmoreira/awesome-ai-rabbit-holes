insights:
  summary: A product data extraction API and MCP server that structures e-commerce page content into JSON with per-field confidence scoring and extraction provenance.
  why_it_matters: Developers building shopping or commerce agents can integrate structured product data with confidence thresholds to filter unreliable extractions before they reach their application logic.
  mental_damage: We now have an API that grades its own homework per field, so you can confidently ship a product price to production while knowing the confidence score itself might be questionable.
