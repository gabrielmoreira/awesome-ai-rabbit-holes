curation:
  status: excluded
  reason: Although it provides an MCP server, the core product is a general-purpose email productivity SaaS and not a developer-tooling primitive.
  evidence:
    - Repo description defines it as 'The world's best AI personal assistant for email', targeting end-users rather than developers.
    - Primary features are inbox organization, reply drafting, calendar management, and bulk unsubscribe—standard productivity tasks.
    - Listed in awesome-mcp lists only as a Communication server, which is an integration layer rather than the product's identity.
