insights:
  summary: A Python-based file watcher that manages file headers and maintains an automated project tree structure within.cursorrules.
  why_it_matters: It helps prevent LLM context drift by pruning irrelevant files from the project tree and ensuring critical documentation headers remain consistent.
  mental_damage: Because nothing says 'odern development' like writing a script to manage the context so your AI doesn't hallucinate your entire directory structure.
  tags:
    - cursor
    - context-management
    - workflow-automation
    - ide-extension
  confidence: high
curation:
  status: included
  reason: The tool's core novelty is shaping and pruning the project context provided to the LLM through automated.cursorrules updates.
  evidence:
    - README claims it provides 'clean, focused context for LLM coding agents'
    - Core functionality is managing '.donotwatchlist' to hide irrelevant directories from the LLM
    - Aims to optimize the 'Self-Optimizing Context' feedback loop
