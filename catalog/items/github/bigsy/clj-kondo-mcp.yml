insights:
  summary: An MCP server that exposes clj-kondo linting capabilities for Clojure, ClojureScript, and EDN files to AI coding assistants like Claude Code.
  why_it_matters: It lets AI agents apply Clojure linting rules directly within their workflow, preventing the generation of technically valid but idiomatically poor code.
  mental_damage: Now your AI can detect that your parentheses are imperfectly nested while it simultaneously hallucinates an entire namespace.
