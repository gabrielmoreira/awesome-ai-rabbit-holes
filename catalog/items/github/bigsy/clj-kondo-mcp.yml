insights:
  summary: An MCP server that wraps clj-kondo to provide linting capabilities for Clojure, ClojureScript, and EDN files within MCP-compatible AI coding assistants.
  why_it_matters: It allows AI agents to catch static analysis errors in Clojure projects during generation, preventing the common issue of an assistant writing syntactically convincing but lint-failing code.
  mental_damage: We have successfully abstracted the act of asking a robot to check if the robot's code will make the other robot grumpy.
