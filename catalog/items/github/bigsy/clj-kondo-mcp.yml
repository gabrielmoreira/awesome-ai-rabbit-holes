insights:
  summary: >-
    clj-kondo-mcp is an MCP server that exposes clj-kondo linting for Clojure/ClojureScript/EDN files via the Model
    Context Protocol.
  why_it_matters: >-
    It lets AI coding assistants like Claude Code lint Clojure projects without built-in support, improving code quality
    in agent-assisted workflows.
  mental_damage: Another MCP server for a niche linter, because every AI agent now needs its own CLI tool wrapper to feel useful.
  tags:
    - mcp
    - clojure
    - linting
  confidence: high
