insights:
  summary: A spec-driven development harness that installs 17 reusable Agent Skills into AI coding agents to turn approved specs into long-running autonomous implementation with per-task review and auto-debug.
  why_it_matters: It gives teams a structured, boundary-first spec loop that lets humans approve contracts at phase gates while agents handle TDD, review, and debugging across eight different coding assistants.
  mental_damage: We have successfully abstracted project management into markdown files so that eight different AI agents can independently discover, design, and debug their way into the same architectural mess.
