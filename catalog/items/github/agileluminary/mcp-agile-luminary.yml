insights:
  summary: An MCP server that connects AI clients like Cursor and Claude Desktop to the Agile Luminary project management API to fetch tasks, documentation, and past work.
  why_it_matters: It lets developers query their project management system and surface current or historical work context directly inside their AI coding assistant without leaving the editor.
  mental_damage: Your agent can now debate your sprint velocity with you while you are trying to figure out why the authentication logic you wrote last Tuesday never actually worked.
