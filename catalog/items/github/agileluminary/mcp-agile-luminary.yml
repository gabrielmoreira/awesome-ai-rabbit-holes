insights:
  summary: An MCP server that connects AI clients like Cursor and Claude Desktop to the Agile Luminary project management API to fetch tasks, documentation, and past work.
  why_it_matters: It allows developers to query their project management context and history directly from their AI coding assistant without switching contexts to a separate PM tool.
  mental_damage: We have successfully bridged the gap between 'vibe coding' and 'agile ceremony compliance', ensuring your AI can now ask you for your stakeholder sign-off status.
