  summary: An MCP server that enables AI coding agents to discover ERC-8004 agents and execute payments via the Coinbase x402 protocol.
  why_it_matters: It provides a standardized bridge for developers to let their coding assistants autonomously find and pay for on-chain agent services using existing EOAs.
  mental_damage: Finally, you can let your IDE spend your crypto on random agents while you sleep.
