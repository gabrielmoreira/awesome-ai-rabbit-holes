insights:
  summary: A local-first, provider-neutral coding agent available as a terminal interface or a hosted web GUI.
  why_it_matters: It offers a high-trust execution environment with sandboxed shell calls, tamper-evident audit logs, and the ability to swap LLM providers without changing code.
  mental_damage: The promise of a 'small enough to audit' codebase provides a comforting illusion of control while an autonomous agent rewrites your production config in a sandbox you hope is actually locked.
