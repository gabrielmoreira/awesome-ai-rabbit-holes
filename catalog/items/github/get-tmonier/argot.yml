insights:
  summary: A statistical code analyzer that uses repository history to detect and lint deviations from established coding patterns.
  why_it_matters: It provides a local, non-LLM-based guardrail to ensure AI-generated code remains consistent with your project's historical style and structure.
  mental_damage: Because nothing says 'I don't trust my LLM' like running a Rust-based statistical audit every time you want to commit code.
  tags:
    - linter
    - code-review
    - cli
    - git
    - statistical-analysis
  confidence: high
