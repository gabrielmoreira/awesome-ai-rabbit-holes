insights:
  summary: A terminal UI (TUI) for running multiple coding agents in parallel using git worktrees and tmux sessions.
  why_it_matters: It lets developers coordinate isolated agent sessions across worktrees with a single dashboard instead of juggling multiple terminals.
  mental_damage: You now have a dedicated UI to watch six agents politely disagree with each other in separate tmux panes.
