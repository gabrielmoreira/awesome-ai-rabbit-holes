insights:
  summary: A terminal UI for launching and managing multiple coding agents in parallel across isolated git worktrees using tmux.
  why_it_matters: It lets developers orchestrate isolated agent sessions across worktrees so multiple AI assistants can work on different branches simultaneously without stepping on each other.
  mental_damage: You now have a dashboard to watch twelve agents politely disagree with each other in separate tmux panes while your original branch wonders if you're ever coming back.
  tags:
    - tui
    - parallel-agents
    - tmux
    - git-worktree
    - orchestration
  confidence: high
