insights:
  summary: A TypeScript toolkit and MCP server from PayPal that exposes commerce APIs as function-calling tools for AI agents and frameworks like OpenAI, LangChain, Vercel AI SDK, and MCP.
  why_it_matters: Developers building AI agents that need to create orders, manage invoices, handle subscriptions, or process refunds can wire PayPal into their agent workflows without manually wrapping every API endpoint.
  mental_damage: We have officially reached the point where even a payment provider ships its own agent toolkit, because apparently the only thing more terrifying than payments code is payments code being written autonomously by an LLM at 3am.
