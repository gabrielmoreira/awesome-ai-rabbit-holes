insights:
  summary: An MCP server that exposes dbt project context, SQL execution, semantic layer, discovery, CLI, and admin APIs to AI agents.
  why_it_matters: Lets AI assistants query, generate, and act on dbt projects (models, metrics, lineage, jobs) without leaving the agent workflow.
  mental_damage: Now your AI can run `dbt test` while you’re still deciding whether your YAML is indented with spaces or tabs.
  tags:
    - mcp-server
    - dbt
    - data-engineering
    - sql
    - model-context-protocol
  confidence: high
