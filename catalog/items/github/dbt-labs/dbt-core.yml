insights:
  summary: dbt-core is an open-source command-line tool that enables data analysts and engineers to transform data in warehouses using software engineering practices like versioning, testing, and modular modeling.
  why_it_matters: It brings CI/CD, testing, and dependency management to SQL-based data transformation, allowing data teams to treat analytics code with the same rigor as application software.
  mental_damage: We've successfully applied the entire software engineering stack to SQL, meaning you can now enjoy merge conflicts and broken CI pipelines while waiting for your warehouse credits to burn.
  tags:
