insights:
  summary: A deterministic CLI orchestrator that splits development goals across 30+ AI coding agents in parallel, using git worktree isolation, test verification, and an HMAC-signed audit trail.
  why_it_matters: It lets teams run a swarm of existing CLI agents on the same codebase simultaneously, automatically merging only the code that passes tests.
  mental_damage: "We have finally achieved the logical endpoint of modern engineering: writing one prompt and then anxiously watching a committee of bots race to rewrite your repo in parallel."
  tags:
    - agent-orchestration
    - cli
    - multi-agent
    - git-worktree
    - mcp
  confidence: high
