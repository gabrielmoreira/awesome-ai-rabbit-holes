insights:
  summary: Git-native workflow control for coding agents, adding approved plans, verification, and reviewable evidence for tools like Claude Code, Codex, Cursor, and Aider.
  why_it_matters: It turns scattered agent work (chat history, terminal scrollback) into auditable Git artifacts, making agent-driven changes reviewable and reversible.
  mental_damage: Finally, a way to prove to your teammates that the AI didn’t just hallucinate its way through your codebase.
