insights:
  summary: An open-source CLI that creates an audit trail for coding agents like Claude Code and Cursor by recording task intent, plans, and verification as Git artifacts.
  why_it_matters: It allows developers to review the reasoning and approval chain behind AI-generated changes, not just the final diff, by keeping workflow state inside the repository.
  mental_damage: We have successfully invented bureaucracy for the bots, ensuring that before your AI agent can break production, it must first fill out the proper paperwork in triplicate.
