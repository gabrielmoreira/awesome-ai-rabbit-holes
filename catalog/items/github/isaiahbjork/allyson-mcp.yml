insights:
  summary: An MCP server that connects to the Allyson API to generate animated SVG components from static files using AI, designed for integration with AI assistants like Claude Desktop and Cursor.
  why_it_matters: It allows developers to delegate UI animation tasks to an AI assistant via the MCP protocol, turning static assets into usable code components directly within their workflow.
  mental_damage: We have successfully abstracted the ancient art of bouncing balls in CSS into a five-star API call, ensuring no developer ever has to pretend to understand keyframe timing again.
