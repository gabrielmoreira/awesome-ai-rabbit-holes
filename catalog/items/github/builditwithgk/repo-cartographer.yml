insights:
  summary: An MCP server, CLI, and GitHub Action that generates architecture diagrams and dependency maps to provide structured context to LLMs.
  why_it_matters: It provides deterministic structural facts to coding assistants, preventing them from hallucinating incorrect dependency graphs or file relationships.
  mental_damage: Because we have officially reached the stage of needing to provide AI assistants with a map just so they don't get lost in their own hallucinations.
  tags:
    - mcp
    - architecture
    - cli
    - context
    - diagrams
  confidence: high
