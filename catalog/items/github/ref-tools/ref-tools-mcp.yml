insights:
  summary: An MCP server that provides AI coding tools with token-efficient access to documentation through agentic search and targeted content retrieval.
  why_it_matters: It reduces context rot and API costs by fetching only the most relevant documentation snippets instead of dumping entire pages into the model's context window.
  mental_damage: We have successfully built infrastructure to solve the problem of our previous infrastructure making our models dumber by feeding them too much infrastructure documentation.
