  status: included
  reason: FreeToken is a local runtime and serving stack designed for private, self-hosted execution of large MoE models on consumer hardware, making local inference its core identity.
  evidence:
    - README states it is an 'edge-native Mixture-of-Experts (MoE) serving engine designed for running frontier-scale open-weight models on personal and consumer hardware'
