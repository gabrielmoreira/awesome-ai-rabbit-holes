insights:
  summary: A desktop app that records screen activity to build work context and surfaces automation opportunities, queryable via MCP in AI chats.
  why_it_matters: It turns passive observation of developer workflows into structured context that can be fed into AI assistants for smarter automation suggestions.
  mental_damage: Now your AI knows you spent 20 minutes renaming a variable and will judge you silently.
  tags:
    - mcp
    - workflow-automation
    - context-building
    - desktop-app
  confidence: high
