insights:
  summary: A desktop app that records your screen to build contextual understanding of your workflow and surfaces automation opportunities queryable via MCP in any AI chat.
  why_it_matters: It attempts to automate the tedious context-gathering phase of AI assistance by watching you work and feeding relevant history directly into your coding agent.
  mental_damage: We have finally reached the point where your computer watches you code so it can tell the AI what you were trying to do before you gave up and asked for help.
