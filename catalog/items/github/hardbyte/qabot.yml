insights:
  summary: CLI tool for natural language queries on local or remote data files using LLMs and DuckDB.
  why_it_matters: Lets developers ask ad-hoc analytical questions against CSV, Parquet, SQLite, Excel, or S3 data without writing SQL or code.
  mental_damage: Finally, a way to offload your 'quick data questions' to an LLM that will definitely write better SQL than you.
