insights:
  summary: A sample accelerator for building ChatGPT-like experiences over enterprise data using Azure OpenAI, LangChain, and vector stores like Pinecone or Azure Cognitive Search.
  why_it_matters: It provides developers with a concrete, end-to-end reference implementation for RAG patterns, including advanced techniques and evaluation flows using Azure ML Prompt Flow.
  mental_damage: Yet another accelerator proving that while we can index the entire enterprise, we still haven't figured out how to stop the model from hallucinating the lunch menu.
  tags:
    - rag
    - azure
    - langchain
    - enterprise
    - evaluation
  confidence: high
