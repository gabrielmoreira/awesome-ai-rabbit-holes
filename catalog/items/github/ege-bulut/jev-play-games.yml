        surrounding_text: "- [Jev Play Games by Ege Bulut (watch Jev play 2048, Snake, a platformer and more live, with the odds of every move on screen)](https://github.com/Ege-BULUT/jev-play-games) - `Source available` · `Free`. Live site where Jev plays browser games (2048, Snake, a block-drop puzzle, Hill Climb, Super Jev Bros, a Freedoom raycaster) and shows the probability of each legal move as bars next to the game. Every move is one Jev choice question; the server owns the seeded game state, the viewer who presses Play live drives the session for everyone watching, and nothing is called when no one is watching. Every decision is recorded for exact replays. [Project guide](community/projects/apps/jev-play-games.md)."
