insights:
  summary: A terminal TUI that manages multiple AI coding agents (Claude Code, Codex, Gemini CLI, Aider) in isolated tmux sessions and git worktrees so developers can run several background tasks in parallel.
  why_it_matters: It lets you scale beyond one assistant at a time by coordinating parallel agent sessions with isolated branches, review workflows, and a single navigation surface.
  mental_damage: You now have the infrastructure to confidently run six conflicting AI agents simultaneously and call it a productivity system.
