insights:
  summary: Shifts is an Elixir framework for composing autonomous AI agent workflows using multiple LLM backends like Anthropic and Ollama.
  why_it_matters: It lets Elixir developers wire together multi-agent workflows and tools in a language-native way instead of reaching for Python-first stacks.
  mental_damage: Because nothing says productive quite like orchestrating a swarm of experimental agents in a pre-0.1 framework to automate the chores you used to do while pretending to be busy.
