insights:
  summary: Shifts is an Elixir framework for composing autonomous AI agent workflows using a mixture of LLM backends like Anthropic and Ollama.
  why_it_matters: It allows Elixir developers to build stateful, multi-step agent workflows with tool-calling capabilities directly within their existing ecosystem.
  mental_damage: Now you can orchestrate a swarm of agents in Elixir while pretending the 0.0.x stability tag and the 'for the brave and adventurous' warning don't exist.
