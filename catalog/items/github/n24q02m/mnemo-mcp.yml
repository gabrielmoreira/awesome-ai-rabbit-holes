insights:
  summary: An open-source MCP server that provides AI assistants with persistent memory through hybrid search, knowledge graphs, and multi-machine sync via rclone.
  why_it_matters: It gives local coding agents like Claude Code and Cursor a structured way to remember decisions, preferences, and context across sessions without external API dependencies.
  mental_damage: We have finally solved the problem of AI assistants forgetting what we told them five minutes ago, provided we are willing to self-host a SQLite database with knowledge graphs and configure rclone to sync our memories to Google Drive.
