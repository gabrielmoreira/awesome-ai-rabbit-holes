insights:
  summary: An open-source MCP server providing persistent AI memory with hybrid search, knowledge graphs, and multi-machine sync for coding assistants like Claude Code and Cursor.
  why_it_matters: It gives local-first coding agents a structured way to remember preferences, decisions, and facts across sessions without relying on cloud APIs or brittle context windows.
  mental_damage: We have finally solved the problem of AI assistants forgetting who we are, only to create a dedicated SQLite database to remind them that we still haven't finished that one refactor from three months ago.
  tags:
    - mcp
    - memory
    - hybrid-search
    - local-first
    - context
  confidence: high
