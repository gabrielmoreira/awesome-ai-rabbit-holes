insights:
  summary: A lightweight, AST-based semantic code search CLI that indexes local codebases to reduce token usage by approximately 70% when used with coding agents.
  why_it_matters: It integrates with Claude, Codex, and Cursor via CLI, Skill, or MCP to deliver relevant code context without blowing through context windows or API budgets.
  mental_damage: Yet another clever tool to solve the fundamental problem of feeding an entire codebase to a model that still can't remember what it did three prompts ago.
  tags:
    - ast
    - code-search
    - token-optimization
    - mcp
    - context-engineering
  confidence: high
