insights:
  summary: A lightweight, AST-based semantic code search CLI that integrates with coding agents via CLI, Skill, or MCP to reduce context tokens by roughly 70%.
  why_it_matters: It gives coding agents a fast, local way to retrieve relevant code snippets without stuffing entire repositories into context windows.
  mental_damage: We have officially reached the point where our AI assistants need their own indexing pipeline just to cope with the context we keep feeding them.
  tags:
    - code-search
    - ast
    - mcp
    - context-engineering
    - coding-agent
  confidence: high
