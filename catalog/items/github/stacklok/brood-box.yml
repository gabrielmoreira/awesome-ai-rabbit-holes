insights:
  summary: A CLI tool that runs coding agents like Claude Code and Codex inside hardware-isolated microVMs, requiring explicit user review of file changes before they reach the workspace.
  why_it_matters: It lets developers experiment with autonomous coding agents without handing over full filesystem access or API keys to a process running natively on their machine.
  mental_damage: We have successfully reached the point where we need KVM-backed microVMs just to survive letting an LLM run `rm -rf` on our behalf.
  tags:
    - security
    - sandboxing
    - microvm
    - cli
    - agents
  confidence: high
curation:
  status: included
  reason: The tool is a security and execution harness that wraps existing coding agents (Claude Code, Codex) in microVMs rather than acting as the primary coding assistant itself.
  evidence:
    - Repo description explicitly states it is a 'CLI tool for running coding agents inside hardware-isolated microVMs.'
    - README shows it launches Claude Code inside a VM via `bbox claude-code` and is not the agent itself.
    - Listed as 'Agent infrastructure' in awesome-cli-coding-agents, reinforcing its identity as a harness/orchestration layer for other agents.
