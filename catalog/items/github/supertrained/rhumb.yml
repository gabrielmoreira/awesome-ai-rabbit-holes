insights:
  summary: Rhumb is an agent gateway that scores external services with an 'AN Score' and routes capability calls through governed execution rails, exposed as an MCP server.
  why_it_matters: It acts as a middleware layer that lets agents discover, evaluate, and safely execute external tools without the developer needing to hand-curate API integrations.
  mental_damage: We have successfully abstracted the job of choosing an API into a separate paid abstraction layer with its own scoring system and receipts.
