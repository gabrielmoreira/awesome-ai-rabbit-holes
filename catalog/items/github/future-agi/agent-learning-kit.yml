insights:
  summary: An evaluation framework and SDK for scoring AI workflows using a mix of 72 local metrics and LLM-as-judge refinement.
  why_it_matters: It provides a unified `evaluate()` API to catch hallucinations and safety violations before they hit production, with support for RAG, function calling, and agent trajectories.
  mental_damage: The peace of mind knowing your LLM passed 72 local metrics right before it manages to hallucinate a new way to delete your production database.
  tags:
    - ai-observability
    - benchmarking
    - evals
