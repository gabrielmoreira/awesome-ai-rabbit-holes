insights:
  summary: A Python and TypeScript SDK providing 72 local metrics, LLM-as-Judge augmentation, guardrail scanners, and streaming assessment to evaluate AI workflows and agent behavior.
  why_it_matters: It gives developers a unified evaluate() API to catch hallucinations, validate function calls, and regression-test agents locally before shipping to production.
  mental_damage: You now have 72 ways to scientifically prove your LLM is broken, assuming you have the time to write the evals while the model writes your code.
