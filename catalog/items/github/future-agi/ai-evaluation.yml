insights:
  summary: An evaluation SDK that provides local and cloud-based metrics for assessing LLM performance, safety, and reliability.
  why_it_matters: It allows developers to move beyond manual prompting by providing automated, programmable scoring for metrics like faithfulness, hallucination, and function calling.
  mental_damage: Because nothing validates your architecture like watching a single `evaluate()` call confirm your model's descent into hallucination.
