  summary: An open-source library for automated prompt optimization using various algorithms and metrics.
  why_it_matters: It automates the tedious process of prompt engineering by iterating on prompts to maximize performance against specific metrics.
  mental_damage: Now you can outsource the frustration of prompt tuning to a Bayesian search instead of doing it yourself.
