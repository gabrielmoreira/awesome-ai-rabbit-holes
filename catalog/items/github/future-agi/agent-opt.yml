insights:
  summary: agent-opt is an open-source Python library that automates the optimization of AI agent prompts using six algorithms, any LLM via LiteLLM, and custom or built-in metrics.
  why_it_matters: It lets developers automatically tune prompts against datasets and metrics instead of hand-tuning them every time a model changes, closing the loop between evaluation and prompt generation.
  mental_damage: You can now mathematically optimize the prompts you were previously rewriting by vibes, adding another layer of rigorous automation to the already towering stack of AI workflow tooling.
  tags:
    - prompt-optimization
    - agent-evals
    - llm
    - automation
  confidence: high
curation:
  status: included
  reason: The core job is measuring, scoring, and automatically optimizing prompts and agent workflows against datasets and metrics, which aligns directly with evals-focused tooling rather than a coding agent or framework.
  evidence:
