insights:
  summary: An open-source credential vault and HTTP gateway that transparently injects API keys into AI agent requests so agents never handle raw secrets.
  why_it_matters: Centralizes secret management and audit logging across multiple AI agents, removing the need to scatter API keys across every agent config and script.
  mental_damage: Finally, a dedicated piece of infrastructure to solve the problem of handing your API keys to autonomous loops that you already regret giving shell access to.
  tags:
    - secrets
    - agents
    - infrastructure
    - security
    - gateway
  confidence: high
curation:
  status: included
  reason: OneCLI is a self-hosted control plane and gateway for managing, injecting, and auditing credentials across multiple AI agents, which aligns with agent orchestration infrastructure rather than being a coding assistant or extension.
  evidence:
    - README describes it as 'an open-source gateway that sits between your AI agents and the services they call' with a web dashboard for managing agents and secrets.
    - Architecture includes a Rust gateway for credential injection, a Next.js management dashboard, and encrypted secret storage, forming a control-plane product.
