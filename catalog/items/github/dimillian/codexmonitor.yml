  status: included
  reason: The product is a desktop UI layer that wraps and manages the Codex CLI agent with workspaces, threads, and git/PR integrations, making it an extension of the Codex assistant rather than a primary coding agent itself.
  evidence:
    - Repo description explicitly states it is 'an app to monitor the (Codex) situation', framing it as a management layer over Codex.
