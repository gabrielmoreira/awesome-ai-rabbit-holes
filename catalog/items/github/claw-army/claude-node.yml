insights:
  summary: claude-node is a thin Python subprocess bridge for controlling the local Claude Code CLI as a long-lived process with stream-json communication.
  why_it_matters: It lets developers embed and supervise the real Claude Code runtime in their own systems without reimplementing or abstracting the CLI.
  mental_damage: Finally, a way to wrap your CLI assistant in more CLI so you can CLI while you CLI.
  tags:
    - claude-code
    - runtime-bridge
    - python
    - stream-json
    - subprocess-control
  confidence: high
