insights:
  summary: An MCP-based coordination layer that enables different AI coding agents to communicate and share work-state.
  why_it_matters: It prevents multiple agents from overwriting each other's work by allowing them to claim files and exchange decisions through a shared workspace.
  mental_damage: Now you can watch your various AI agents negotiate a peace treaty instead of just fighting over who owns `package.json`.
