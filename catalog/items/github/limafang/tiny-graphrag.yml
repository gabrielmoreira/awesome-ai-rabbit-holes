insights:
  summary: A minimal, educational Python implementation of GraphRAG that builds local knowledge graphs in Neo4j and supports local and global queries.
  why_it_matters: It gives developers a simple, code-first foundation for experimenting with graph-based retrieval-augmented generation without adopting a heavier framework.
  mental_damage: Yet another weekend GraphRAG implementation proving that the fastest way to learn RAG is to reinvent it, push to GitHub, and declare victory with 45 stars.
