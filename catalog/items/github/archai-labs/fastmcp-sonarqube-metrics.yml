insights:
  summary: A Python-based MCP server that exposes SonarQube project metrics, history, and issue data as tools for AI assistants like Claude Desktop.
  why_it_matters: It allows developers to query code quality metrics and track technical debt trends directly through a chat interface instead of navigating the SonarQube UI.
  mental_damage: We have successfully abstracted away the one dashboard that actually told us our code was bad, so we can now hear the bad news from an LLM with a friendly tone.
