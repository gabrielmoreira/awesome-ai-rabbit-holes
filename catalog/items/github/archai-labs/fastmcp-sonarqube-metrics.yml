insights:
  summary: A FastMCP server that exposes SonarQube project metrics, history, and issues as tools for AI agents and LLM clients to query via the Model Context Protocol.
  why_it_matters: It allows developers and AI coding agents to natively query code quality metrics and technical debt trends without leaving their agent workflow or writing custom API wrappers.
  mental_damage: We have successfully abstracted the act of checking our code quality into a tool that lets an AI ask an API about the mess we just made, so we can maintain plausible deniability while the context window fills up with bug counts.
