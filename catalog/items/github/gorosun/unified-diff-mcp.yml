  summary: An MCP server that visualizes code diffs as HTML or images with GitHub Gist integration for Claude Desktop.
  why_it_matters: Developers can instantly turn unified diffs into shareable, visually rich comparisons directly from their AI assistant workflow.
  mental_damage: Now you can argue about code changes in full color, with auto-deleting gists that vanish before your PR review can catch up.
