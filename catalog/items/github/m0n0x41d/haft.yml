insights:
  summary: Haft is an engineering decisions engine that enforces spec-driven development with evidence decay and parity enforcement for AI-assisted coding.
  why_it_matters: It bridges the gap between fast AI-generated code and governed engineering by turning intentions into falsifiable contracts before execution.
  mental_damage: Finally, a tool that makes you feel guilty for shipping fast without first writing a 200-line spec your agents will ignore anyway.
  tags:
    - spec-driven
    - mcp
    - governance
  confidence: high
