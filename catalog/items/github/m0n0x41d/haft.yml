insights:
  summary: Haft is a CLI and MCP plugin that adds structured engineering decision-making, spec governance, and evidence decay tracking to AI coding agents like Claude Code and Codex.
  why_it_matters: It forces agents to frame problems, compare options under parity, and record falsifiable decisions before writing code, aiming to prevent velocity from outrunning engineering discipline.
  mental_damage: Finally, a tool to govern the agents that are already ignoring your half-written Jira tickets with unprecedented confidence.
