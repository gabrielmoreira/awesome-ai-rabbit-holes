insights:
  summary: Dolphin is an open-source, lightweight vision-language model from ByteDance that parses complex document images—including PDFs, tables, formulas, and code blocks—into structured outputs using a two-stage heterogeneous anchor prompting architecture.
  why_it_matters: It gives developers a high-performance, 3B-parameter alternative to heavy OCR pipelines for extracting structured data from messy real-world documents, with support for vLLM and TensorRT-LLM acceleration.
  mental_damage: Yet another reminder that while we build agents to write code, the industry is still funneling massive research energy into teaching models how to correctly read a PDF without hallucinating the table headers.
  tags:
    - ocr
    - document-parsing
    - vlm
    - pdf
    - bytedance
  confidence: high
