insights:
  summary: Dolphin is a document image parsing system from ByteDance that uses heterogeneous anchor prompting to analyze layout, reading order, and elements (text, tables, formulas, code) in both digital and photographed documents.
  why_it_matters: It provides developers with a lightweight, high-performance local model for converting complex PDFs and images into structured data, reducing reliance on brittle traditional OCR pipelines.
  mental_damage: Finally, a 3B parameter model to solve the 'is this a table or just a very organized accident' problem that every PDF parser since 1995 has failed to answer.
