insights:
  summary: Dolphin is a document image parsing model using heterogeneous anchor prompting, released by ByteDance with versions up to 3B parameters.
  why_it_matters: It improves document parsing (text, tables, formulas, code blocks) for both digital and photographed documents, which can be useful for developers needing OCR or structured document extraction.
  mental_damage: Another model that turns your PDFs into structured data, because apparently typing is still too hard.
