insights:
  summary: A terminal UI session manager for coordinating and switching between multiple AI coding agent instances like Claude Code, OpenCode, and Gemini CLI.
  why_it_matters: It provides a single command center to manage, group, and track the cost and activity of multiple concurrent agent sessions and git worktrees.
  mental_damage: Because managing ten different terminal tabs for ten different agents is exactly the kind of complexity we deserve in 2025.
  tags:
    - tui
    - session-manager
    - ai-agents
    - cli
    - orchestration
  confidence: high
