  summary: A CLI tool that connects coding agents across terminals, allowing them to message, spawn, and observe each other to coordinate multi-agent workflows.
  why_it_matters: It lets developers wire together Claude Code, Gemini CLI, Codex, and OpenCode into coordinated pipelines without abandoning their existing terminal workflows.
  mental_damage: Your biggest debugging challenge has evolved from 'why is this code broken' to 'which of my three locally-running AI agents is silently judging the others via SQLite.'
