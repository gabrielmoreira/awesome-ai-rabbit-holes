insights:
  summary: A zero-dependency MCP extension that gives Claude Desktop terminal, filesystem, and background job access on Linux via an installable .mcpb package.
  why_it_matters: It enables developers on Linux to grant Claude direct shell and file access for local automation, filling a gap left by the platform's limited config-based MCP support.
  mental_damage: We have successfully reached the point where we install unverified extensions to let an AI hold an SSH-grade session on our main machine, guarded only by a denylist that admits it can be trivially bypassed.
  tags:
    - mcp
    - claude-desktop
