insights:
  summary: An MCP server that lets AI agents join online meetings on Zoom, Google Meet, and Microsoft Teams to capture transcripts, recordings, and generate meeting summaries via the ChatterBox API.
  why_it_matters: Developers building meeting-aware agents can plug this server into Claude or other MCP clients to automate attendance, transcription, and post-meeting summarization without wiring up platform-specific meeting APIs themselves.
  mental_damage: We have successfully built the infrastructure to send a bot to the standup so the AI can tell us what the AI said while we were debugging the bot that joined the meeting.
  tags:
    - mcp
    - meetings
    - zoom-bot
    - google-meet
    - transcription
  confidence: medium
