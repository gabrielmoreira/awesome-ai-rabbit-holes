insights:
  summary: A context-building tool that creates persistent codebase concept maps and provides change impact analysis for LLMs.
  why_it_matters: It reduces token consumption and improves model accuracy by providing a persistent architectural map that prevents LLMs from re-exploring the same codebase every session.
  mental_damage: Because why just read a file when you can spend hundreds of tokens building a map of why that file exists in the first place?
  tags:
    - context-engineering
    - mcp
    - cli
    - codebase-mapping
    - token-optimization
  confidence: high
curation:
  status: included
  reason: The tool's core value is providing persistent memory and context-shaping via concept maps to optimize how LLMs interact with codebases.
  evidence:
    - README explicitly states the core feature is a 'concept map' that persists across sessions to prevent re-exploring code.
    - Provides tools for change impact analysis and git history aggregation to refine model context.
    - Can be used as a standalone CLI or an MCP server, but the primary substance is the context management.
