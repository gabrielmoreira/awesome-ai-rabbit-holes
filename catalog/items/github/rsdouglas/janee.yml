insights:
  summary: Janee is a local-first MCP server that lets AI agents call external APIs using injected credentials, without ever exposing raw API keys to the agent itself.
  why_it_matters: It gives developers a way to grant agents API access with request-level policies, session TTLs, and audit logs instead of copying long-lived keys into agent configs.
  mental_damage: Another layer of infrastructure so your autonomous agent can invoice Stripe on your behalf while you console yourself that at least the key stayed in ~/.janee/.
  tags:
    - mcp
    - secrets
    - agent-security
    - local-first
    - audit-logs
  confidence: high
