insights:
  summary: A local-first MCP server that provides persistent, typed memory and token-aware context injection for AI coding agents using a SQLite-backed knowledge store.
  why_it_matters: It allows coding agents like Claude Code and Cursor to retain architectural decisions, conventions, and pitfalls across sessions, reducing the need to re-explain project context and burn tokens.
  mental_damage: We have finally solved the 'AI forgets why we did it that way' problem by adding a database to remember the things we originally wrote down in markdown files that the AI also forgot.
