insights:
  summary: A self-correcting memory and behavioral tracking engine for Claude Code that provides cross-session persistence via local SQLite and semantic search.
  why_it_matters: It solves the 'amnesia' problem in terminal-based coding agents by allowing them to remember past decisions, user corrections, and project context across sessions.
  mental_damage: Nothing says 'cutting edge' like attempting to cultivate a stable personality for a CLI tool that might be superseded by a new model release tomorrow.
  tags:
    - claude-code
    - memory
    - mcp
    - local-ai
    - context-engineering
  confidence: high
curation:
  status: included
  reason: The project's core novelty is a persistent memory and retrieval system designed to shape the context of an existing assistant.
  evidence:
    - Uses local SQLite and Ollama embeddings for cross-session semantic memory
    - Tracks behavioral patterns and user corrections to improve model judgment over time
    - Integrates with Claude Code specifically to manage context and session history
