insights:
  summary: An open source JupyterLab extension that connects AI agents to computational notebooks via ACP and MCP.
  why_it_matters: It brings multi-agent AI collaboration directly into JupyterLab, enabling developers to use agents like Claude or Copilot for notebook-centric workflows with guardrails and custom tooling.
  mental_damage: Now your notebooks can argue with each other about pandas syntax while you watch.
  tags:
    - jupyter
    - notebooks
    - agents
    - acp
    - mcp
  confidence: high
