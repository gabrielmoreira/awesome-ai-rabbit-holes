  summary: An MCP server that connects AI coding assistants to EN Diagram, enabling deterministic structural analysis of systems using graph theory and mathematical theorems.
  why_it_matters: It lets developers ask an AI agent to validate system architecture, check for deadlocks, and verify invariants without the AI guessing—backed by actual math instead of vibes.
