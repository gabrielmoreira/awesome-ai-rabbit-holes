insights:
  summary: Filestash is a self-hosted, plugin-driven file management platform that provides universal data access across 20+ storage protocols including FTP, S3, SFTP, and WebDAV, with gateway support for exposing data over protocols like MCP.
  why_it_matters: It provides developers with a unified interface and API gateway to manage disparate storage backends while offering an MCP gateway for AI tool integration.
  mental_damage: Yet another self-hosted panacea promising to unify every storage protocol known to humanity, this time with an MCP gateway so your coding agent can theoretically browse your SMB shares.
  tags:
    - file-management
    - self-hosted
    - mcp
    - storage
    - gateway
  confidence: high
curation:
  status: excluded
  reason: The core product is a general-purpose file manager and data access layer, not a developer-facing AI tool, despite offering an MCP gateway as one of many integrations.
  evidence:
    - Repo description and README define it as a 'File Management Platform / Universal Data Access Layer' and 'storage agnostic Dropbox-like file manager', not an AI tool.
    - MCP is listed as just one of many gateway protocols (SFTP, S3, FTP, WebDAV, MCP, AS2) rather than the product identity.
    - Appears in awesome-mcp-servers lists, but the decision ladder states primary product identity beats source-list placement.
