insights:
  summary: Skill Dash is a local dashboard that uses Jev to evaluate Claude Code and Codex skills and plugins on usefulness, redundancy, clarity, duplicates, and safety, backed by the corpus pipeline behind whichskills.dev.
  why_it_matters: It helps developers objectively assess and compare the quality of AI coding agent skills, reducing guesswork when extending assistants like Claude Code or Codex.
  mental_damage: Finally, a way to quantify skill fatigue — because judging whether another 'supercharged logging' plugin is actually useful shouldn’t require a PhD in Jev and despair.
  tags:
    - skill-evaluation
    - jev
    - claude-code
    - codex
    - dashboard
  confidence: high
