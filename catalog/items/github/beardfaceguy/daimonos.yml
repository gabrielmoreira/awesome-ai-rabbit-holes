insights:
  summary: An MCP server that replaces standard shell and git tool outputs with structured JSON to reduce token consumption for AI coding agents.
  why_it_matters: It cuts API costs and latency by preventing agents from reading hundreds of lines of verbose terminal noise when a simple status summary would suffice.
  mental_damage: We've reached the era where we need a specialized OS layer just to stop our agents from spending $5 in tokens to read a '47 passed' test result.
