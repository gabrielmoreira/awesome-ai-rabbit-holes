insights:
  summary: OpenClaw is a self-hosted, cross-platform personal AI assistant that integrates with messaging channels and provides a local control plane for running models on your own devices.
  why_it_matters: It lets developers run a personal AI assistant across macOS, Linux, Windows (WSL2), and mobile devices while integrating with WhatsApp, Slack, Discord, and other messaging channels they already use.
  mental_damage: Yet another opportunity to carefully configure a local gateway and onboarding wizard so you can ask a lobster to summarize your Slack messages instead of actually touching your repo.
  tags:
    - personal-assistant
    - self-hosted
    - cli
    - multi-channel
    - local-ai
  confidence: high
curation:
  status: excluded
  reason: The core product is a personal, multi-channel AI assistant focused on messaging and local interaction rather than a developer-facing coding assistant, IDE, framework, or repo-editing tool.
  evidence:
