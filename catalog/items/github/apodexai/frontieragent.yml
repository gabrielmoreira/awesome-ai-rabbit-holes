insights:
  summary: FrontierAgent is an open-source agent runtime with a terminal TUI that provides ReAct and Agent Team workflows for file-based research and task automation.
  why_it_matters: It gives developers a self-contained, sandboxed agent system for long-horizon file and research tasks without requiring Docker or complex setup.
  mental_damage: Finally, an agent that won’t trash your repo but will happily coordinate a team of interns to write your literature review while you pretend to supervise.
  tags:
    - agent-framework
    - terminal-agent
    - multi-agent
    - tui
    - sandbox
  confidence: high
curation:
  status: included
  reason: FrontierAgent’s core identity is a workbench for coordinating multiple agents via a task board and sandboxed workflows, making it an agent orchestration platform rather than a standalone coding assistant.
  evidence:
    - README describes Agent Team mode where a coordinator delegates work to parallel sub-agents and synthesizes results
    - Repo description calls it an 'agent framework' with native command-line TUI and Agent Team modes
    - Architecture shows clear separation between coordinator, task board, sub-agents, and shared sandbox
