  summary: A terminal-native coding agent distributed as a single C++ static binary with low-latency startup.
  why_it_matters: Provides a lightweight, model-agnostic alternative to heavy Node- or Python-based agents, featuring built-in local RAG and sandboxed execution.
  mental_damage: Because our terminal environments weren't already cluttered enough with competing, single-binary AI abstractions.
