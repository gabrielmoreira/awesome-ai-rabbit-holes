insights:
  summary: A TypeScript SDK and CLI that unifies 17+ AI providers and 100+ models under a single streaming API with built-in tools, MCP support, memory, and enterprise-grade routing.
  why_it_matters: Developers can switch AI providers with a single parameter, add 64+ tools and MCP servers out of the box, and rely on multi-provider failover and context management without wiring multiple SDKs by hand.
  mental_damage: We have successfully abstracted the abstraction, so you can now experience provider lock-in as a configurable streaming option rather than a costly architectural mistake.
  tags:
    - mcp
    - multi-provider
    - sdk
    - streaming
    - typescript
  confidence: high
curation:
  status: included
  reason: This is a code-first SDK and CLI framework that developers import to embed AI behavior into applications, not a control plane, editor, or hosted builder.
  evidence:
