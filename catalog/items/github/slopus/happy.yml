insights:
  summary: A mobile and web client for Claude Code and Codex that wraps the CLI to enable remote, encrypted, cross-device control of coding sessions.
  why_it_matters: It lets developers monitor and steer long-running coding agents from their phone with push notifications and end-to-end encryption, removing the desk-tether from agentic workflows.
  mental_damage: "We have finally achieved the future: CI broke, the agent is stuck in a loop, and now you can watch it burn in real time from a coffee shop three miles away."
  tags:
    - claude-code
    - codex
    - mobile
    - cli-wrapper
    - encryption
  confidence: high
curation:
  status: included
  reason: Happy is a remote UI and wrapper for Claude Code and Codex rather than a primary coding assistant itself, making it an extension/integration.
  evidence:
    - Repo description explicitly calls it a 'Mobile and Web client for Codex and Claude Code'.
    - README instructs users to 'run happy instead of claude' or 'happy codex' to restart sessions in remote mode controlled from a phone.
