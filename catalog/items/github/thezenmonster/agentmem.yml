insights:
  summary: A local-first memory system for coding agents like Claude Code and Cursor that adds governance, conflict detection, and trust ranking to stored memories.
  why_it_matters: It solves the 'stale context' problem by letting agents track memory lifecycles, detect contradictions, and surface only validated information within token budgets.
  mental_damage: Now when your AI forgets why it abandoned that architectural pattern in March, you can blame the memory governance score instead of the model.
  tags:
    - memory
    - context
    - mcp
    - local-first
    - governance
  confidence: medium
curation:
  status: included
  reason: The core novelty is a governed memory and context-shaping infrastructure for coding agents, not a primary assistant or a thin host integration.
