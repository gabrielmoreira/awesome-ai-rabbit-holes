insights:
  summary: Lossless local memory for Claude Code that stores every tool call, file edit, and thinking block verbatim in SQLite for searchable recall.
  why_it_matters: It prevents Claude Code's automatic session rotation from erasing developer history, enabling instant retrieval of past decisions and code changes without API calls.
  mental_damage: Another tool to install just to remember what your AI assistant forgot, because apparently persistence is now a premium feature.
