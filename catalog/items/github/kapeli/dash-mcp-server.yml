insights:
  summary: An MCP server that exposes the Dash macOS documentation browser's installed docsets, search, and full-text search capabilities to MCP-compatible AI clients.
  why_it_matters: It lets developers query offline API documentation directly from their AI coding assistant instead of interrupting the flow to open a separate browser window.
  mental_damage: We have successfully built a bridge to let an LLM ask your local docs app to explain the API you could have just read yourself in that same docs app.
