insights:
  summary: A CLI, MCP server, and desktop toolkit that audits Tailwind and shadcn/ui apps, extracts design tokens, and exports shadcn-native registries so coding agents share the same design-system memory.
  why_it_matters: It gives Codex, Claude Code, Cursor, and other agents a shared, auditable design context so AI-generated UI changes stay consistent instead of drifting into unstyled chaos.
  mental_damage: We have finally built infrastructure to make sure our agents agree on what a button looks like, while still pretending they know how to center a div.
  tags:
    - design-ci
