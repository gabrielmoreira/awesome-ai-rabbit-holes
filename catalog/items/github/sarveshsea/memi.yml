insights:
  summary: memi is a CLI and daemon that exports design tokens and components from Tailwind apps into shadcn-native registries for AI coding agents.
  why_it_matters: It gives AI coding agents memory of a project's design system so they can edit code without breaking UI consistency.
  mental_damage: Finally, a way to make AI feel less like a bull in a china shop and more like a designer who actually read the style guide.
  tags:
    - agent-skills
    - ai-agents
    - cli
    - design-ci
    - design-system
    - mcp
    - shadcn
    - tailwind
  confidence: high
curation:
  status: included
  reason: The core product augments other coding assistants and editors with design-system memory, audits, and MCP-based context rather than acting as a primary coding agent itself.
  evidence:
    - "Repo description: 'Shadcn-native Design CI for Tailwind apps: export registries that work with shadcn, v0, AI editors, and npm.'"
    - "README: 'Give Codex, Claude Code, Cursor, OpenCode, Hermes, OpenClaw, shadcn, v0, and Figma the same design-system memory before they edit your app.'"
    - README shows MCP config generation for Claude Code and Cursor via `memi mcp start` and agent skill installs for Hermes/OpenClaw.
    - "README states: 'Give Claude Code, Cursor, and Codex memory of your tokens, components, and Figma — so they edit your app without breaking the design.'"
    - Provides MCP config and skill kits for external agents, not a self-directed coding agent.
    - Core function is exporting design tokens and components as registries for AI tool consumption.
