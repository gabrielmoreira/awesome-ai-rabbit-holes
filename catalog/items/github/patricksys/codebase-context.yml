insights:
  summary: A local-first MCP server and CLI that maps a codebase's architecture, patterns, and conventions to give AI agents a preflight context map before they start searching or editing.
  why_it_matters: It stops agents from wasting tokens wandering through generic examples by showing them the team's actual patterns, golden files, and architectural layers first.
  mental_damage: One more layer of infrastructure to ensure your AI agent understands your repo well enough to generate code that still somehow ignores the conventions you just mapped for it.
  tags:
    - mcp
    - context-engineering
    - local-first
    - semantic-search
    - codebase-mapping
  confidence: high
curation:
  status: included
  reason: The core novelty is a context-shaping system that maps architecture, detects patterns from git history, and provides preflight context to agents via MCP, making it a context engineering tool rather than a coding agent or thin extension.
