insights:
  summary: A local-first MCP server that maps a codebase's architecture, patterns, and conventions to provide bounded context and semantic search for AI agents.
  why_it_matters: It helps AI agents stop generating 'correct' but architecturally misaligned code by grounding them in the team's actual current patterns and git history before they start editing.
  mental_damage: We have successfully reached the point where we need dedicated infrastructure just to teach the AI that the three-year-old deprecated pattern is not, in fact, the architectural north star.
  tags:
    - mcp
    - context-engineering
    - local-first
    - semantic-search
    - codebase-mapping
  confidence: high
