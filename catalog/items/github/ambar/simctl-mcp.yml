insights:
  summary: An MCP server that exposes iOS Simulator control operations as tools for AI assistants.
  why_it_matters: Lets AI coding assistants directly manipulate iOS simulators—booting devices, installing apps, managing permissions, or taking screenshots—without leaving the chat or editor.
  mental_damage: Now your AI can open shortcuts:// while you stare at your actual phone, wondering which one is the simulator.
