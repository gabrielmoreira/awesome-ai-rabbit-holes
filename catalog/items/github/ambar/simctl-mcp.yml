  summary: A Model Context Protocol server that exposes iOS Simulator control commands—such as device management, app lifecycle, and system settings—to MCP-compatible coding assistants.
  why_it_matters: It lets AI coding agents directly manage simulator devices, install and launch apps, and capture screenshots without breaking out to manual Xcode tooling.
