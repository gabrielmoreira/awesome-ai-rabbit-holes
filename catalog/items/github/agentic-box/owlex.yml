insights:
  summary: An MCP server that runs multi-model council deliberations and individual sessions for Codex, Gemini, OpenCode, and others directly from Claude Code.
  why_it_matters: It lets developers cross-check architecture decisions, debugging, and tricky design questions across multiple AI models without leaving their existing Claude Code workflow.
  mental_damage: You can now spend three times as long deliberating with four different hallucinations before synthesizing them into one confidently wrong answer.
