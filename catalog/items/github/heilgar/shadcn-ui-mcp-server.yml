insights:
  summary: An MCP server that lets AI coding assistants like Claude and Cursor list, document, and install shadcn/ui components and blocks directly through the Model Context Protocol.
  why_it_matters: Developers can delegate UI scaffolding and component discovery to their AI assistant instead of manually checking docs and running CLI commands.
  mental_damage: We have successfully abstracted away the two seconds it takes to read shadcn documentation into a protocol handshake that requires a server restart.
