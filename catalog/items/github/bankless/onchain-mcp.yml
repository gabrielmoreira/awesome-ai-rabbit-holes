insights:
  summary: An MCP server that exposes on-chain blockchain data and smart contract operations from the Bankless API to AI models and coding assistants.
  why_it_matters: It allows developers to delegate blockchain state queries, event log fetching, and contract interactions directly to AI tools that support the Model Context Protocol.
  mental_damage: Finally, you can ask your AI assistant to debug a smart contract while it simultaneously debugs your understanding of decentralized finance, all without leaving the chat window.
