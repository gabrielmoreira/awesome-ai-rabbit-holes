insights:
  summary: An MCP (Model Context Protocol) server that exposes the Bankless Onchain API so AI tools can query blockchain contract state, events, and transactions.
  why_it_matters: If you’re building agents that need on-chain context, this turns common chain lookups (ABI/source/events/tx history) into structured MCP tools instead of custom glue code.
  mental_damage: Now your agent can confidently fetch contract state at 3am and still hallucinate what it means, but with much better citations.
