insights:
  summary: A governance and attestation tool that wraps AI coding assistants like Claude Code, Cursor, and Codex to gate merges, detect breaking changes, and sign replayable audit receipts.
  why_it_matters: It lets teams enforce quality and safety gates on AI-generated code across multiple models and assistants without sacrificing the audit trail.
  mental_damage: You now have a cryptographically signed receipt proving that Claude, Gemini, and Codex collectively broke your API, so the postmortem can be properly distributed among the responsible parties.
