insights:
  summary: A desktop app for managing multiple AI coding agent sessions, worktrees, and projects across Claude CLI, Codex CLI, Cursor CLI, and OpenCode.
  why_it_matters: It consolidates multi-agent workflows, git worktree automation, and cross-project context into a single interface, reducing the friction of switching between tools and repositories.
  mental_damage: Finally, a way to juggle five different AI coding agents, twelve git worktrees, and your existential dread in one window.
  tags:
    - desktop
    - multi-agent
    - session-manager
    - git-worktrees
    - claude-code
  confidence: high
curation:
  status: included
  reason: Jean is a UI shell and workflow manager that augments existing CLI coding agents with worktree automation, session management, and project integrations rather than acting as a primary coding assistant itself.
  evidence:
    - Repo description identifies it as 'A dev environment for AI agents', specifically a desktop UI for Claude CLI, Codex CLI, Cursor CLI, and OpenCode.
    - README confirms it is an opinionated Tauri wrapper that adds worktree automation, session recap/digest, and GitHub/Linear integrations on top of installed CLI agents.
    - Source list awesome-cli-coding-agents places it in 'Harnesses & orchestration > Session managers & parallel runners', reinforcing its identity as an orchestration UI rather than a standalone agent.
