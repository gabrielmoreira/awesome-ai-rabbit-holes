insights:
  summary: A Tauri-based desktop app that provides a unified UI for managing projects, git worktrees, and chat sessions across Claude CLI, Codex CLI, Cursor CLI, and OpenCode.
  why_it_matters: It centralizes multi-project AI workflows by handling worktree automation, session management, and integrations with GitHub and Linear in a single native interface.
  mental_damage: We have successfully built a desktop wrapper to manage the growing pile of CLI agents we installed to avoid managing our actual codebase directly.
