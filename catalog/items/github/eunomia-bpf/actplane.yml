insights:
  summary: An eBPF-based information flow enforcement engine that provides deterministic safety and security policies for AI agent harnesses.
  why_it_matters: It replaces probabilistic prompt-based guardrails with kernel-level enforcement, preventing agents from bypassing restrictions via subprocesses, shell scripts, or SDK calls.
  mental_damage: The comforting realization that our only hope for agent safety is moving the guardrails from the prompt window to the Linux kernel.
  tags:
    - ebpf
    - agent-security
    - sandboxing
    - runtime-enforcement
    - linux
  confidence: high
curation:
  status: included
  reason: The tool does not act as an assistant itself, but rather augments existing agents (like Claude Code or Codex) by providing a security and workflow harness.
  evidence:
    - README states it is a 'Runtime enforcement and observability for AI agent harnesses'
    - Explicitly differentiates itself from sandboxes by providing 'corrective feedback' to the agent
    - Designed to run existing agents under its harness (e.g., 'actplane run claude')
