insights:
  summary: VectorChord is a PostgreSQL extension for scalable, high-performance, and disk-efficient vector search, designed as the successor to pgvecto.rs.
  why_it_matters: It allows developers to host billion-scale vector datasets directly in Postgres with significantly lower infrastructure costs, simplifying the AI stack by removing the need for separate vector databases.
  mental_damage: We have successfully abstracted the vector database so far that we are now just arguing with Postgres about how many bits we can shave off a float before the model starts hallucinating its own childhood memories.
  tags:
    - database-extension
    - llmops
    - postgres
    - vector-database
    - vector-search
  confidence: high
