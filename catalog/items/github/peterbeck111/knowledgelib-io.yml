insights:
  summary: A structured knowledge library and MCP server providing pre-verified, cited knowledge units designed to reduce hallucinations and token usage for AI agents.
  why_it_matters: Developers can integrate a ready-made knowledge graph of 1,500+ verified facts into agents via MCP, REST, or LangChain, replacing unreliable web searches with sourced answers.
  mental_damage: We have finally solved the problem of AI making things up by introducing a manually curated library of facts that will inevitably be outdated exactly five minutes after you deploy your agent.
