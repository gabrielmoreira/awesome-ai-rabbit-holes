insights:
  summary: An MCP server for diagnosing iOS memory leaks and performance regressions using specialized Swift-centric pattern recognition.
  why_it_matters: It allows iOS developers to investigate complex retain cycles and MetricKit payloads directly within their AI chat interface without manually navigating Xcode Instruments.
  mental_damage: Because nothing says 'modern development' like delegating the hunt for a single retain cycle to a language model while you stare blankly at the chat window.
