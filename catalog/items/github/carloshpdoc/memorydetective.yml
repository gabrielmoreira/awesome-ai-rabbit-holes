        surrounding_text: "- [carloshpdoc/memorydetective](https://github.com/carloshpdoc/memorydetective) [![carloshpdoc/memorydetective MCP server](https://glama.ai/mcp/servers/carloshpdoc/memorydetective/badges/score.svg)](https://glama.ai/mcp/servers/carloshpdoc/memorydetective) 📇 🏠 🍎 - iOS leak hunting and performance investigation. Reads `.memgraph` (`leaks(1)`) and `.trace` (`xctrace`) files, classifies retain cycles against a 34-pattern catalog (SwiftUI, Combine, Swift Concurrency, UIKit, Core Animation, Core Data, SwiftData, RxSwift, Realm), surfaces a Swift `fixTemplate` snippet for each match, and bridges to source via SourceKit-LSP. Single-call build+boot+launch fixes the macOS 26.x `leaks --outputGraph` regression; `replayScenario` + `captureScenarioState` close the verify-fix loop. 31 MCP tools, 34 catalog resources, 5 investigation prompts. CI-gateable via `verifyFix` and `compareTracesByPattern`. Apache 2.0."
