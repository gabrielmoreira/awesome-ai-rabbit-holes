insights:
  summary: An MCP server that exposes Buildkite pipeline, build, job, and test data to AI agents via the Model Context Protocol.
  why_it_matters: Enables AI coding agents to query Buildkite CI data for debugging, trend analysis, and incident investigation without leaving their workflow.
  mental_damage: Another MCP server to install, another YAML snippet to copy-paste, another token scope to grant—because asking 'why did this build fail?' clearly needed a protocol layer.
