insights:
  summary: An MCP server that provides unified access to multiple LLM APIs—including ChatGPT, Claude, Gemini, and others—with tag-based model selection, prompt logging, and cost optimization.
  why_it_matters: Developers working in MCP-enabled environments like Cursor or Claude Desktop can route prompts across providers from a single tool, simplifying multi-model experimentation and cost tuning.
  mental_damage: Another essential piece of middleware so you can agonize over whether your prompt is best answered by Claude, Gemini, or a model you forgot you had an API key for.
