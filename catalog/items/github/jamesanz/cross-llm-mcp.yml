insights:
  summary: An MCP server that provides unified access to multiple LLM APIs (ChatGPT, Claude, Gemini, Mistral, etc.) with smart model selection and prompt logging.
  why_it_matters: Developers can switch between LLM providers and manage prompts/logs without leaving their MCP-enabled environment (e.g., Cursor, Claude Desktop).
  mental_damage: Now you can argue with nine different LLMs at once, because one model’s hallucinations weren’t enough.
  tags:
