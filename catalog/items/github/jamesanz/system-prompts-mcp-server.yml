insights:
  summary: An MCP server that exposes a library of system prompts, summaries, and tool definitions from popular AI tools like Cursor, Claude, and Devin as callable tools for hosts like Claude Desktop and Cursor.
  why_it_matters: It lets developers browse, discover, and inject proven system prompts from competing AI tools directly into their own local coding workflows.
  mental_damage: Now you can spend your afternoon meticulously copying the system prompt of an AI tool you already pay for, just to paste it into a different AI tool you also pay for.
