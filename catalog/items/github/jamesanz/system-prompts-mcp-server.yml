insights:
  summary: An MCP server that exposes a library of system prompts, summaries, and tool definitions from popular AI tools like Cursor, Claude, and Devin as callable tools in MCP-compatible environments.
  why_it_matters: It lets developers inspect, reference, and reuse the exact system prompts that power today's leading AI coding tools directly inside their own workflows.
  mental_damage: Because nothing says 'I have my own workflow' quite like installing a server to steal personality traits from an AI tool you're already paying for.
