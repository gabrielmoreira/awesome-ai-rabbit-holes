  confidence: high
curation:
  status: included
  reason: The tool's primary value is the semantic retrieval and management of conversation history to improve model context.
  evidence:
    - Uses Ollama and embeddings to perform semantic search over raw Claude Code session transcripts
    - Implements an MCP server to inject retrieved context back into Claude Code sessions
    - Specifically designed to overcome the loss of context in compressed session summaries
