insights:
  summary: A semantic search tool that indexes Claude Code session transcripts to provide long-term memory via MCP.
  why_it_matters: It allows developers to retrieve specific reasoning, constraints, and past decisions from previous Claude Code sessions to provide richer context for current tasks.
  mental_damage: Now you can finally search for the exact moment you convinced yourself that a specific architectural mistake was actually a 'feature'.
  tags:
    - claude-code
    - mcp
    - semantic-search
    - ollama
