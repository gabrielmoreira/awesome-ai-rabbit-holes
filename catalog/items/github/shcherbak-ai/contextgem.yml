insights:
  summary: ContextGem is an open-source Python framework that uses LLMs to extract structured data, insights, and justifications from documents with granular source references.
  why_it_matters: It lets developers describe extractions in natural language and handles the prompt engineering, validation, and reference mapping automatically.
  mental_damage: Yet another framework promising to solve the 'I have a PDF and a dream' problem, ensuring you can now turn a legal contract into a Pydantic model without ever reading it.
