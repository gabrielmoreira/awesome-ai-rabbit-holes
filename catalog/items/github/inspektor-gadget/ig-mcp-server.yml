insights:
  summary: An MCP server that exposes Inspektor Gadget's eBPF-powered container and Kubernetes observability tools as LLM-callable tools for AI-driven root cause analysis.
  why_it_matters: It lets developers ask an AI to debug low-level kernel and networking issues in Kubernetes by autonomously selecting and correlating real-time telemetry.
  mental_damage: Now your AI can confidently tell you why your pods are failing by reading eBPF events, while you still can't figure out why your kubeconfig won't load.
