insights:
  summary: An MCP server that exposes Inspektor Gadget's eBPF-powered container and Kubernetes observability tools as AI-callable functions for automated root cause analysis.
  why_it_matters: It lets developers delegate low-level Kubernetes debugging to LLMs by turning dense kernel telemetry into structured data that an AI agent can reason over directly from a chat interface.
  mental_damage: Now your AI can confidently explain exactly why your cluster is on fire while you sit back and wonder when you became the human approval step for an eBPF agent.
