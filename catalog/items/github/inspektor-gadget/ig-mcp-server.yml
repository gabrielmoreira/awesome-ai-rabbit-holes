insights:
  summary: An MCP server that exposes Inspektor Gadget's eBPF-powered container/Kubernetes observability tools to AI agents via the Model Context Protocol.
  why_it_matters: It lets developers use LLMs to autonomously select, run, and correlate low-level kernel telemetry gadgets for root cause analysis in containerized environments.
  mental_damage: Now your AI can debug your DNS failures by reading the kernel’s mind, because apparently logs were too high-level.
