insights:
  summary: Open framework for deploying AI applications in confidential VMs using Intel TDX and NVIDIA confidential computing to provide cryptographic privacy guarantees.
  why_it_matters: It lets developers run inference, agents, and training workloads inside hardware-isolated containers with cryptographic attestation, aiming to eliminate the need to trust cloud operators with sensitive data or model weights.
  mental_damage: Because the natural evolution of 'it works on my machine' is 'it works in my cryptographically attested Intel TDX confidential VM with reproducible OS hashes.'
  tags:
    - confidential-computing
    - trusted-execution-environment
    - privacy
    - infrastructure
    - ai-deployment
  confidence: high
curation:
  status: excluded
  reason: It is primarily a confidential-computing deployment platform and runtime infrastructure (VMM, KMS, Gateway, CVM orchestration) rather than a code-first framework, local inference runtime, or any other defined category shape.
  evidence:
    - Repo and README identify it as a framework for deploying AI in TEEs, emphasizing infrastructure components like VMM, Gateway, and over-the-socket SDKs.
    - The project's main workflow is Docker Compose native deployment onto bare-metal TDX hosts, not importing code-first building blocks or operating as a coding assistant.
    - No available category cleanly captures confidential-computing runtime infrastructure; it sits awkwardly between ai-frameworks and local-ai without fitting either primary identity.
