insights:
  summary: TeDDy is a terminal-based coding harness that uses Markdown files as the interface to enforce test-driven development and hexagonal architecture via specialized AI agents.
  why_it_matters: It aims to reduce AI-generated code defects by enforcing proven software engineering practices directly in the agent workflow.
  mental_damage: Another opinionated framework that replaces one black box (the LLM) with another (XML-driven agent roles and Markdown phase gates).
  tags:
    - coding-harness
    - test-driven-development
    - markdown-interface
    - hexagonal-architecture
    - local-first
  confidence: medium
