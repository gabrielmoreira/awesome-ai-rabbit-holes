insights:
  summary: A local, zero-config persistent memory system for AI agents that stores project context in a JSON file and exposes it via an MCP server.
  why_it_matters: It solves the common pain of AI agents forgetting project-specific context, architecture, and decisions between sessions without requiring cloud services or complex infrastructure.
  mental_damage: We have finally engineered a way to make sure the AI remembers we prefer async patterns, right before we forget why we needed async patterns in the first place.
  tags:
