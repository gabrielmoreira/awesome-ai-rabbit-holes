insights:
  summary: rememb is a local, zero-config persistent memory system for AI agents that stores project context in a .rememb/ directory and works via MCP with Cursor, Windsurf, and Claude.
  why_it_matters: It solves the repetitive context reloading problem in AI-assisted development by giving agents project-scoped memory that survives sessions without requiring cloud services or API keys.
  mental_damage: Finally, a way to make your AI agent remember your project’s auth strategy without manually re-pasting it every time you start a new chat — until you forget where you put the .rememb folder.
  tags:
    - memory
    - mcp
    - context-persistence
    - local-ai
    - developer-tool
  confidence: high
curation:
  status: included
  reason: rememb’s core value is persistent, local memory management for AI agents via structured JSON storage and semantic search, making it a context-shaping infrastructure rather than a coding agent or host extension.
  evidence:
    - "README states: 'rememb gives them persistent memory — local, portable, and works with any agent' and describes saving/loading project context like tech stack, auth location, and async patterns"
    - Core functionality revolves around .rememb/ directory with entries.json, meta.json, and config.json for structured memory storage and retrieval
    - Uses local semantic embeddings (paraphrase-MiniLM-L3-v2) for search without API calls, emphasizing on-device, zero-config memory persistence
