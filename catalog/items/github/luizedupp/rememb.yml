insights:
  summary: A local, zero-config MCP server that gives AI agents persistent memory by storing project context, decisions, and preferences in a JSON file within the repo.
  why_it_matters: It eliminates the repetitive context-rewriting loop across sessions in Cursor, Windsurf, and Claude by letting agents read and write structured memory locally without cloud dependencies.
  mental_damage: We have finally solved the tragedy of the AI that forgets it’s supposed to be using PostgreSQL before you’ve finished your morning coffee, provided you remember to configure the memory server that remembers things.
