insights:
  summary: A privacy-first developer intelligence tool that filters internet content and releases against a developer's local codebase and tech stack.
  why_it_matters: It eliminates the noise of generic AI newsletters and feeds by scoring content based on your actual dependencies, git history, and local filesystem.
  mental_damage: Now we can finally automate the process of discovering exactly which breaking change in a niche Rust crate is about to ruin our Friday afternoon.
  tags:
    - context-filtering
