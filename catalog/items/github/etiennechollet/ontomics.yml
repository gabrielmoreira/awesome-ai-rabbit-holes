insights:
  summary: A Model Context Protocol server that builds a semantic index of a codebase's domain concepts, naming conventions, and behavioral similarities to reduce token usage and tool calls for coding agents.
  why_it_matters: It allows coding agents like Claude Code and Codex to retrieve deep domain knowledge in a single tool call rather than burning tens of thousands of tokens on exploratory searches.
  mental_damage: We have successfully optimized the part of the workflow where the AI guesses what your code means, so you can spend the saved time arguing with it about why the generated tests still don't compile.
