insights:
  summary: A Rust-based MCP server that indexes a codebase's domain concepts, naming conventions, and behavioral similarities to provide instant semantic context for coding agents, reducing tool calls and token usage by roughly 20x.
  why_it_matters: It allows coding agents like Claude Code and Codex to answer domain-specific questions with a single tool call instead of crawling a repo for minutes, making large or unfamiliar codebases navigable without burning through context windows.
  mental_damage: We have successfully abstracted away understanding the code by building a machine that understands the code, so we can now spend our time debugging the machine that understands the code.
  tags:
    - mcp
    - context-engineering
    - semantic-search
    - rust
    - token-optimization
  confidence: medium
curation:
  status: included
  reason: The core novelty is a semantic indexing and retrieval system that packs domain knowledge into the context window, fitting Prompt & Context Engineering even though it is delivered as an MCP server.
  evidence:
