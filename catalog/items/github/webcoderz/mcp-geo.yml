insights:
  summary: An MCP server implementation that exposes geocoding, reverse geocoding, and distance calculation tools via GeoPY to Large Language Models.
  why_it_matters: Brings structured location intelligence into conversational coding workflows, letting Claude and other MCP clients resolve addresses to coordinates and validate distances without external API calls or hallucinated geography.
  mental_damage: Realizing we've normalized spinning up a persistent Python microservice just to ask an AI 'how far is this from that' without it confidently placing Tokyo in New Jersey.
