        surrounding_text: "- [zhurong2020/pyobfus](https://github.com/zhurong2020/pyobfus/tree/main/pyobfus_mcp) [![zhurong2020/pyobfus MCP server](https://glama.ai/mcp/servers/zhurong2020/pyobfus/badges/score.svg)](https://glama.ai/mcp/servers/zhurong2020/pyobfus) 🎖️ 🐍 🏠 🍎 🪟 🐧 - Official MCP server for the pyobfus Python obfuscator (installed from PyPI as `pyobfus-mcp`; source lives in the `pyobfus_mcp/` subfolder of the pyobfus monorepo). Seven tools: pre-flight risk scan (`check_obfuscation_risks`), zero-config init (`generate_pyobfus_config`), reverse stack-trace mapping (`unmap_stack_trace`) so production tracebacks remain debuggable after obfuscation, `list_presets` and `explain_preset` for FastAPI / Django / Flask / Pydantic / Click / SQLAlchemy, plus `recommend_tier` and `start_pro_trial` for community-vs-Pro tier guidance. Published in the official MCP Registry as `io.github.zhurong2020/pyobfus-mcp`."
