insights:
  summary: A local-first memory management layer that transforms agent conversations and resources into searchable, editable Markdown files.
  why_it_matters: It provides a persistent, human-readable knowledge base that allows AI agents to retain context, project decisions, and workflow experience across sessions.
  mental_damage: Now you have to manage your agent's long-term memory like you're organizing a chaotic personal wiki.
