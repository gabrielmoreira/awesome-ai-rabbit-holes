insights:
  summary: A Model Context Protocol (MCP) server that connects AI clients to the CODESYS automation platform.
  why_it_matters: It allows LLMs to programmatically manage PLC projects, edit POU code, and trigger compilations in CODESYS via the Scripting Engine.
  mental_damage: The dream of AI-driven industrial automation is now just one configuration error in a JSON file away from accidentally rewriting your factory floor logic.
