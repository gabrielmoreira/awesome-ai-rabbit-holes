        surrounding_text: "- [Decision Models as Guardrails](https://github.com/raxITlabs/decision-models-as-guardrails) - Guardrail benchmark where Jev 1.13.0 and 1.14.0 answer each of 9,975 labelled checks (content, direct and indirect prompt attacks, denied topics, profanity, PII, grounding) as a typed yes/no question, and code blocks at a probability of 0.5 or more; 16 other decision models and Amazon Bedrock Guardrails get the same fixed rule. Scored on balanced accuracy with 95% bootstrap intervals and USD per 1,000 checks at list price; version 1.0.0 reports 88.7 for Jev 1.14.0, 90.4 for the Perplexity Decisions API, and 79.0 for Bedrock Guardrails, with per-row results public, a 2,269-row contamination-check slice held back, and no per-model threshold tuning. [Leaderboard](https://dm-as-guardrails.raxitlabs.com), [dataset](https://huggingface.co/datasets/raxITLabs/decision-models-as-guardrails)."
