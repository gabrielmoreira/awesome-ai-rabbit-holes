insights:
  summary: A context engine that stores full episodic memory for long-running AI agents and retrieves forgotten constraints instead of letting them be compacted away.
  why_it_matters: It lets developers keep agents reliable across long sessions without prompt hacks, by recovering original instructions and decisions that default context-window compaction would otherwise summarize into oblivion.
  mental_damage: It is oddly dystopian that we now pay for external episodic memory so our agents can remember not to delete emails after thirty turns.
  tags:
    - context-engine
    - memory
    - retrieval
    - openclaw
    - agents
  confidence: high
curation:
  status: included
  reason: The product's entire identity is memory and retrieval infrastructure for long-running agents, which squarely fits Prompt & Context Engineering rather than being the agent itself or a thin host integration.
  evidence:
    - README describes itself as a 'context engine' that 'stores full episodes and retrieves old constraints instead of losing them to summaries.'
    - Core mechanism is hierarchical clustering, beam-search retrieval, and episodic storage—classic context-shaping infrastructure.
    - Marketed as a drop-in OpenClaw plugin for constraint recovery, not as a coding agent, orchestration platform, or IDE extension layer.
