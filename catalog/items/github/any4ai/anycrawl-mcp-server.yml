insights:
  summary: An MCP server that exposes web scraping, crawling, and search engine result parsing capabilities to LLM clients like Cursor and Claude.
  why_it_matters: It gives coding agents the ability to fetch live web content and search results directly into their context, reducing the need to copy-paste documentation or API docs manually.
  mental_damage: We have successfully abstracted the act of reading the documentation into a server that scrapes the documentation, so the agent can hallucinate about the documentation it just scraped.
