insights:
  summary: A quantitative finance API and MCP server providing 63 deterministic calculators for options, derivatives, risk, and crypto math, designed to be called by autonomous financial agents.
  why_it_matters: It gives AI agents a reliable way to perform complex financial math with exact analytical formulas instead of relying on probabilistic LLM calculations.
  mental_damage: We've reached the point where we don't trust the all-knowing neural network to correctly calculate Black-Scholes, so we've built a deterministic API just to keep the hallucination-prone agent from bankrupting the simulated portfolio.
