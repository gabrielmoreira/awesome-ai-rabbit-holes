insights:
  summary: A Node.js/TypeScript MCP server that exposes Atlassian Jira projects, issues, and development info to AI assistants like Claude and Cursor via the Model Context Protocol.
  why_it_matters: It lets developers query, create, and update Jira issues using natural language through their existing AI assistants instead of context-switching to the Jira UI.
  mental_damage: We have successfully abstracted away the Jira interface, meaning you can now procrastinate on your tickets using conversational AI instead of clicking through a bloated web app.
