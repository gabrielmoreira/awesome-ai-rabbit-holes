insights:
  summary: A Node.js/TypeScript MCP server that enables AI assistants to interact with Atlassian Confluence spaces, pages, and search via CQL.
  why_it_matters: It bridges the gap between your team's unstructured documentation in Confluence and your AI assistant's ability to use that knowledge as context.
  mental_damage: Because nothing says 'developer productivity' like having an LLM parse through your company's messy, outdated Confluence wiki.
