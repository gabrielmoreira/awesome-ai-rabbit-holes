insights:
  summary: A Node.js/TypeScript MCP server that connects AI assistants to Atlassian Confluence, providing tools to list spaces, retrieve pages as Markdown, and search using CQL.
  why_it_matters: It allows developers to query internal documentation, API guides, and specs directly from their AI assistant without context-switching to the browser.
  mental_damage: We have successfully reached the point where the AI needs an adapter just to read the documentation we were too busy prompting to write.
