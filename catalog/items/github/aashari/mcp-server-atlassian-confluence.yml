insights:
  summary: A Node.js/TypeScript MCP server that exposes Atlassian Confluence spaces, pages, and search (via CQL) to AI assistants like Claude and Cursor using the Model Context Protocol.
  why_it_matters: It lets developers query their team's Confluence documentation directly from their AI coding assistant instead of context-switching to a browser.
  mental_damage: You can now ask a large language model to summarize your team's sprawling Confluence wiki, thereby combining the hallucination risk of AI with the structural opacity of enterprise documentation.
