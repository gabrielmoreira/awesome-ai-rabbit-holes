insights:
  summary: A Node.js/TypeScript MCP server that exposes Atlassian Bitbucket workspaces, repositories, and pull requests as tools for AI assistants like Claude and Cursor via the Model Context Protocol.
  why_it_matters: Developers can point AI assistants directly at their Bitbucket repos to review PRs, search code, and manage version control workflows using natural language.
  mental_damage: Finally, your AI can argue about your pull request formatting without you needing to grant it access to your browser or your dignity.
