insights:
  summary: A Node.js/TypeScript MCP server that lets AI assistants like Claude and Cursor read repositories, manage pull requests, and search code in Atlassian Bitbucket Cloud.
  why_it_matters: It connects LLMs directly to version control workflows so developers can query repo status, review PRs, and automate Bitbucket tasks using natural language.
  mental_damage: Yet another MCP server ensuring your AI can comment on a pull request before you’ve even decided whether that pull request should exist.
