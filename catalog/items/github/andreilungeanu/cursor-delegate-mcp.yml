insights:
  summary: An MCP server that allows coding assistants like Claude Code or GitHub Copilot to delegate multi-file implementation tasks to Cursor's Composer engine.
  why_it_matters: It enables developers to use high-reasoning frontier models for planning and review while offloading token-heavy boilerplate implementation to Cursor's specialized environment.
  mental_damage: Because why use one model efficiently when you can orchestrate a high-stakes handoff between two different AI ecosystems?
  tags:
    - mcp
    - cursor
    - claude-code
    - automation
    - workflow
  confidence: high
curation:
  status: included
  reason: It functions as an integration layer that augments existing assistants with the specific capability to use Cursor, rather than acting as a standalone assistant.
  evidence:
    - README defines it as an 'MCP bridge' for Claude Code, ChatGPT, and Copilot
    - Core value proposition is delegating implementation to Cursor to save frontier model limits
    - Provides a 'skill' to existing assistants to enable multi-file edits via Cursor's CLI
