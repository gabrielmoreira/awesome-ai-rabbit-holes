insights:
  summary: A macOS daemon that enables remote control of local coding CLI agents via a Telegram interface.
  why_it_matters: It allows developers to monitor progress, kick off tasks, and approve dangerous commands for autonomous agents from their phones while away from their desks.
  mental_damage: Because nothing says 'future of work' like approving a risky 'rm -rf' command from a Telegram chat while standing in line for coffee.
  tags:
    - macos
    - telegram
    - coding-agents
    - remote-control
    - cli
  confidence: high
curation:
  status: included
  reason: It is an extension that augments existing CLI coding agents with a remote session UI and workflow management via Telegram.
  evidence:
    - Acts as a daemon that manages local coding CLI agents like Claude Code, Codex, Pi, and Gemini
    - Provides a remote interface for tasking, progress streaming, and command approval via Telegram
    - Does not perform coding tasks itself, but rather interfaces with existing authenticated local agents
