insights:
  summary: An open-source agent control plane that runs and manages dozens of parallel Claude Code sessions in tmux, with a web dashboard, kanban board, and REST API for agent-to-agent coordination.
  why_it_matters: It lets developers orchestrate multiple unattended coding agents from a single interface, adding self-healing, task claiming, and mobile control to long-running Claude Code workflows.
  mental_damage: Now you can wake up at 3am to check your kanban board on your phone and watch twelve Claude sessions argue with each other in real time instead of just wondering why your single agent stopped working.
  tags:
    - agent-orchestration
    - claude-code
    - parallel-agents
    - tmux
    - control-plane
  confidence: high
