insights:
  summary: Governance framework for AI coding agents that enforces task traceability, structural gates, session continuity, and audit trails for tools like Claude Code, Cursor, and Copilot.
  why_it_matters: It prevents AI agents from making destructive or untraceable changes by enforcing mandatory task gates, blocking risky commands, and maintaining audit trails.
  mental_damage: Finally, a way to stop your AI from force-pushing to main while you’re in the bathroom.
  tags:
    - governance
