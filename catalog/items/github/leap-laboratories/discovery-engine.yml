insights:
  summary: Discovery Engine (Disco) is a Python SDK and API that finds novel, statistically validated feature interactions and subgroup patterns in tabular data using ML interpretability and literature cross-checks.
  why_it_matters: It lets data-focused developers uncover non-obvious, FDR-corrected variable interactions and novelty classifications without having to pre-form hypotheses or hand-craft pandas queries.
  mental_damage: Yet another magical black box that promises to find the insights you should have had, provided you’re comfortable outsourcing your statistical intuition to a pipeline you can’t quite replicate locally.
  tags:
    - data-science
    - ml-interpretability
    - python-sdk
    - pattern-discovery
  confidence: high
