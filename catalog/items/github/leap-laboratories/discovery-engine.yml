insights:
  summary: Discovery Engine is a statistical pattern-finding tool that identifies validated, novel feature interactions in tabular data using ML and literature checks.
  why_it_matters: It helps developers and data scientists uncover hidden, hypothesis-free patterns in data that standard analysis or LLMs would miss.
  mental_damage: Finally, a tool that automates the anxiety of wondering what important interactions you’re accidentally ignoring in your CSV.
  tags:
    - data-science
    - pattern-discovery
    - ml
  confidence: medium
curation:
  status: included
  reason: It is a code-first SDK/SDK-like tool for extracting patterns from data, not an assistant, orchestrator, or app builder, fitting best as a reusable framework for ML-based pattern discovery.
  evidence:
    - "Repo description: 'Discovery Engine — find novel, statistically validated patterns in tabular data'"
    - "README: 'You cannot replicate this by writing pandas code or asking an LLM to look at a CSV. It finds structure that hypothesis-driven analysis misses.'"
    - "Usage: Developers import and script against it via Python SDK (`from discovery import Engine`) as a library."
