insights:
  summary: A container-free sandbox that provides kernel-enforced filesystem, network, and syscall isolation for AI coding agents on Linux and macOS.
  why_it_matters: It allows developers to run autonomous agents like Claude Code or Cursor with the confidence that they won't accidentally leak secrets or compromise the host system.
  mental_damage: It adds a whole new layer of kernel-level infrastructure to manage just so you can finally trust a chatbot with your SSH keys.
  tags:
    - security
    - sandboxing
    - ai-agents
    - linux
    - macos
  confidence: high
curation:
  status: included
  reason: The tool acts as a security wrapper and host integration that augments the safety of existing coding agents rather than acting as an agent itself.
  evidence:
    - Provides kernel-enforced isolation for agents like Claude Code, Cursor, and Aider
    - Offers a 'greywatch' observability mode to trace agent behavior
    - Uses Landlock and Seccomp for container-free sandboxing
