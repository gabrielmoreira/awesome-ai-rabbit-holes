insights:
  summary: ZeroClaw is a Rust-based autonomous AI personal assistant runtime that runs locally, connects to multiple LLM providers and communication channels, and executes actions via tools including shell, browser, hardware, and MCP servers.
  why_it_matters: It gives developers a fully self-hosted, extensible agent they can own and customize for automating workflows across desktop, terminal, and hardware without relying on hosted assistants.
  mental_damage: Another 'own your agent' pitch that makes you wonder if you're escaping vendor lock-in just to become your own DevOps team.
  tags:
    - ai-agent
    - local-ai
    - autonomous
    - cli-tool
    - rust
  confidence: high
curation:
  status: included
  reason: ZeroClaw functions as a standalone coding assistant that can edit code, run commands, and automate development tasks via its agent loop, tool use, and ACP protocol, positioning it as a primary assistant rather than an extension.
  evidence:
    - ZeroClaw is an agent runtime — a single Rust binary you configure and run. It talks to LLM providers [...] and acts through tools (shell, browser, HTTP, hardware, custom MCP servers).
    - It includes an Agent Client Protocol (ACP) for IDE/editor integration via JSON-RPC 2.0 over stdio, enabling use as a coding assistant.
    - The quick start includes `zeroclaw agent` for interactive chat in the terminal and `zeroclaw onboard` to configure providers and channels for autonomous operation.
    - Listed in 'awesome-cli-coding-agents' under 'Terminal-native coding agents > OpenClaw ecosystem', indicating recognition as a terminal-native coding agent.
