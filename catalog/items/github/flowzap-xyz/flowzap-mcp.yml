insights:
  summary: An MCP server that lets AI assistants generate workflow, sequence, and architecture diagrams using the FlowZap visual diagramming tool and its text-based DSL.
  why_it_matters: It allows coding agents to read artifacts like HTTP logs or OpenAPI specs and automatically produce shareable visual diagrams without the developer switching contexts to a whiteboard tool.
  mental_damage: We have successfully abstracted drawing a box with an arrow into a multi-agent protocol negotiation, because apparently opening a blank document by hand is now a workflow failure.
