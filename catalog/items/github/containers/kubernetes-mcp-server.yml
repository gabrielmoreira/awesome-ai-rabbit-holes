insights:
  summary: An MCP server that exposes Kubernetes and OpenShift operations to AI assistants via native Go API calls instead of wrapping kubectl.
  why_it_matters: It lets developers delegate pod logs, Helm charts, Tekton pipelines, and cluster CRUD to AI assistants without installing kubectl or other local dependencies.
  mental_damage: Native Go performance means your coding assistant can delete namespaces with none of the comforting latency of wrapper scripts.
  tags:
    - mcp
    - kubernetes
    - devops
    - openshift
    - infrastructure
  confidence: high
