insights:
  summary: CoreMCP is an open-source Model Context Protocol (MCP) server that bridges AI assistants with legacy databases like MSSQL.
  why_it_matters: It lets developers securely expose database schemas and queries to AI agents via MCP, enabling read-only or controlled access to legacy systems without direct code changes.
  mental_damage: Finally, a way to let your AI assistant query that 20-year-old MSSQL ERP without accidentally dropping the production table.
