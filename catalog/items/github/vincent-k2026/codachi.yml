  summary: Codachi is a tamagotchi-style virtual pet that lives in the Claude Code statusline, showing context usage, rate limits, git state, and playful mood messages.
  why_it_matters: It adds lightweight, zero-overhead productivity awareness and delight to Claude Code sessions without consuming tokens or making API calls.
  mental_damage: Now you have to worry about your virtual pet's feelings while already juggling context windows and rate limits.
