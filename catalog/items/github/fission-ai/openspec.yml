insights:
  summary: A spec-driven development framework that uses slash commands to generate and manage proposal, spec, design, and task artifacts for AI coding assistants.
  why_it_matters: It introduces a structured spec layer that forces alignment on requirements and implementation steps before AI assistants generate code, reducing unpredictable outputs in existing codebases.
  mental_damage: We have successfully abstracted the waterfall method into markdown files so your LLM can ignore the requirements with perfect documentation.
