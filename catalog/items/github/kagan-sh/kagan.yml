insights:
  summary: A terminal-based Kanban board that orchestrates AI coding agents in isolated git worktrees with a mandatory human review gate before merging.
  why_it_matters: It adds a structured workflow and safety rails for teams delegating tasks to multiple coding agents by enforcing human approval and isolating agent work.
  mental_damage: We have successfully built a project-management tool to manage the ghosts in the machine, because apparently watching one AI edit your code wasn't anxious enough—now you need a board for five of them.
  tags:
    - kanban
    - agent-orchestration
    - tui
    - git-worktree
    - human-review
  confidence: high
curation:
  status: included
  reason: The product is a control-plane workbench that coordinates multiple coding agents (Claude Code, Codex, Gemini CLI, etc.) through a state-machine Kanban board rather than acting as a coding assistant itself.
  evidence:
    - "Repo description explicitly states: 'The Orchestration Layer for AI Coding Agents'."
    - README describes a Kanban TUI that manages runs for Claude Code, Codex, Gemini CLI, and 11+ other agents in isolated git worktrees.
    - Includes an MCP server to let external agents drive the board, plus a VS Code extension and web dashboard as companion surfaces.
