insights:
  summary: Kanban TUI for AI coding agents with a structural human review gate, enforcing explicit approval before merges.
  why_it_matters: It introduces a workflow where AI agents operate in isolated git worktrees and require human approval before merging, adding governance to agentic development.
  mental_damage: Finally, a way to make your AI agent wait for permission like a well-trained intern.
