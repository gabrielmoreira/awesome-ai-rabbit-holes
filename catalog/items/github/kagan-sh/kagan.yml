insights:
  summary: A terminal-based Kanban board and orchestration layer that manages AI coding agents in isolated git worktrees and enforces a human review gate before merging code.
  why_it_matters: It adds a structured workflow and safety rails for teams running autonomous coding agents, ensuring no AI-generated patch reaches main without explicit human approval.
  mental_damage: We have successfully built a bureaucracy around the hallucination machine so that it can spawn branches in isolation while we wait to approve its work in a TUI.
  tags:
    - kanban
    - tui
    - git-worktree
    - human-review
    - mcp
  confidence: high
curation:
  status: included
  reason: Kagan is a user-facing control plane for coordinating and gating multiple AI coding agents rather than a primary coding assistant itself, which aligns with the agent-orchestration category.
  evidence:
    - Repo description explicitly calls it 'The Orchestration Layer for AI Coding Agents'.
    - README states it is a 'Kanban TUI for AI coding agents with a structural human review gate' and supports Claude Code, Codex, and others.
