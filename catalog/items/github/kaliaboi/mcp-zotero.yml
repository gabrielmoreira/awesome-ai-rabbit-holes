insights:
  summary: An MCP server that enables Claude Desktop to interact with a user's Zotero library via the Zotero Cloud API.
  why_it_matters: Developers and researchers using Claude can now directly query, retrieve, and manage academic papers and collections from their Zotero libraries without leaving their coding workflow.
  mental_damage: Finally, a way to make your AI assistant cite its sources—just like you never do.
