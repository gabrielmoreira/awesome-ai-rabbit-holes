insights:
  summary: A local web app that sends queries to multiple LLMs via OpenRouter, has them review and rank each other's responses anonymously, and synthesizes a final answer via a designated Chairman model.
  why_it_matters: Developers can compare model reasoning, reduce provider bias, and audit decision traces when evaluating LLM outputs for complex technical questions.
  mental_damage: Because nothing says 'confident engineering decision' like outsourcing your judgment to a committee of language models that rank each other in a blind peer review.
  tags:
    - llm-eval
    - multi-model
    - local-tool
    - openrouter
  confidence: medium
curation:
  status: included
  reason: The project is an eval-oriented tool for comparing and judging multiple LLM responses with decision traces and repeatable scoring, not a coding agent or app builder.
  evidence:
    - README describes Stage 1–3 pipeline focused on anonymized ranking, aggregate rankings, and decision-auditable runs rather than code editing.
    - Fork notes emphasize evaluation artifacts, Stage 2 smoke/quality scripts, and persisted aggregate ranks for comparing council behavior across runs.
    - Repo description and README position it as a 'LLM Council' for answering hard questions, not assisting with repo/IDE coding workflows.
