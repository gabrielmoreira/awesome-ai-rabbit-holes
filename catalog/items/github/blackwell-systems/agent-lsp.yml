insights:
  summary: >-
    agent-lsp is an MCP server that orchestrates language servers into agent-native workflows for AI-powered code
    intelligence.
  why_it_matters: >-
    It reduces cold-start latency and token usage by keeping language servers warm and exposing batch, speculative
    editing workflows to AI agents via MCP.
