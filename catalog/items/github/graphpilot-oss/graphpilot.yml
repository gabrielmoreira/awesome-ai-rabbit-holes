insights:
  summary: A local CLI and MCP server that indexes TypeScript/JavaScript repositories into a structural graph for coding agents to query symbols, callers, and call-edges.
  why_it_matters: It reduces token spend and hallucinations by providing agents with persistent, structural memory of a codebase's architecture instead of relying on repetitive grep-like file reads.
  mental_damage: The realization that we are now building sophisticated graph databases just so our agents stop forgetting where a function is called across three files.
  tags:
    - mcp
    - code-analysis
    - typescript
    - local-ai
    - context-window
  confidence: high
