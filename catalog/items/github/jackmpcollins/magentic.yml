insights:
  summary: A Python library that uses decorators like @prompt and @chatprompt to define LLM-powered functions with structured outputs using Pydantic and multi-provider support.
  why_it_matters: It lets developers treat LLM calls as typed, testable Python functions with native streaming, retries, and observability instead of managing raw API payloads.
  mental_damage: You can now quietly ship multi-agent systems that look exactly like normal Python functions, making it even harder to explain to your team where the actual logic lives.
  tags:
    - python
    - llm
    - pydantic
    - structured-output
    - agents
  confidence: high
