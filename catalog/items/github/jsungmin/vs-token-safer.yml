insights:
  summary: >-
    A token-optimized code retrieval layer that uses language server indexes like clangd and Roslyn to provide semantic
    search for coding agents.
  why_it_matters: >-
    It prevents coding agents from flooding their context windows with irrelevant code by replacing naive grep searches
    with precise, symbol-based lookups.
  mental_damage: >-
    Because apparently, even the smartest LLMs can't be trusted to find a function without accidentally reading the
    entire monorepo.
