insights:
  summary: A token-optimized code retrieval layer that uses language server indexes like clangd and Roslyn to provide semantic search for coding agents.
  why_it_matters: It prevents coding agents from flooding their context windows with irrelevant code by replacing naive grep searches with precise, symbol-based lookups.
  mental_damage: Because apparently, even the smartest LLMs can't be trusted to find a function without accidentally reading the entire monorepo.
  tags:
    - mcp
    - context-engineering
    - claude-code
    - semantic-search
    - token-optimization
  confidence: high
curation:
  status: included
  reason: The tool's core novelty is the semantic retrieval and token reduction of code context, which is the primary focus of the Prompt & Context Engineering category.
  evidence:
    - Uses clangd, Roslyn, and tree-sitter for semantic, symbol-based indexing instead of raw text grep
    - Claims 97–99% token savings compared to traditional grep searches in large repos
    - Designed specifically to sit between large codebases and agents like Claude Code to manage context windows
