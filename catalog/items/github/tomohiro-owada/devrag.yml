insights:
  summary: A local MCP server that indexes markdown files into a vector database using multilingual-e5-small embeddings to provide semantic search capabilities for Claude Code.
  why_it_matters: It reduces token consumption by ~40x and speeds up documentation lookups by retrieving only relevant chunks instead of forcing Claude Code to read entire files.
  mental_damage: We have officially reached the point where we need a RAG system to manage the documentation required to use our AI coding assistant efficiently.
