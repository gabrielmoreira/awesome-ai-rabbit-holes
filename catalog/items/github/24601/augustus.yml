insights:
  summary: Augustus is a library of reusable agent skills for designing, training, evaluating, and improving application-specific decision systems using primitive/model selection, data assembly, export/reload, and bounded hill climbing, with TypeSafe Jev as the default hosted exemplar.
  why_it_matters: It provides developers with composable, typed decision-model skills to build and refine domain-specific AI agents that output calibrated probabilities instead of free-form text.
  mental_damage: Finally, a way to feel like you're doing real AI work while mostly just wiring together pre-packaged judgment modules someone else already validated.
  tags:
    - agent-skills
    - decision-models
    - jev
  confidence: medium
curation:
  status: included
  reason: Augustus distributes reusable skill packs and rules bundles for decision-model agent behavior, making it a content-first product that installs into agents like Claude Code or Cursor to extend their judgment capabilities, not a standalone agent or framework.
