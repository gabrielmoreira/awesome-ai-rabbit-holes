insights:
  summary: >-
    An official MCP server that exposes Kontent.ai content models, taxonomies, and items to AI assistants like Claude
    and Cursor via the Model Context Protocol.
  why_it_matters: >-
    It lets developers manage and prototype structured content models in Kontent.ai through natural language
    conversations inside their existing AI-enabled editors.
  mental_damage: >-
    Yet another official MCP server proving that the modern developer experience now involves installing a dedicated
