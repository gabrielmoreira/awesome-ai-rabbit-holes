insights:
  summary: A Swift-based tool that crawls Apple's developer documentation and serves it locally to AI agents via the Model Context Protocol (MCP).
  why_it_matters: It gives coding agents deterministic, offline access to over 405,000 pages of Apple API docs, reducing hallucinations during Swift and platform development.
  mental_damage: We have successfully solved the problem of AI confidently inventing UIKit APIs by building a 3.4 GB local database, because apparently the modern developer workflow requires a local search index just to keep the ghost in the machine honest.
