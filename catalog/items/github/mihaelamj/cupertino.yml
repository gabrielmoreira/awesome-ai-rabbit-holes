insights:
  summary: A local Swift-based tool that crawls and indexes Apple Developer documentation into a searchable database and serves it to AI agents via the Model Context Protocol.
  why_it_matters: It provides offline, hallucination-free access to over 405,000 pages of Apple documentation, allowing AI coding assistants to answer framework questions with accurate, up-to-date context.
  mental_damage: We have built a system to feed the AI the manual so it stops guessing SwiftUI modifiers, effectively admitting that the model's training data is already obsolete the moment Xcode updates.
