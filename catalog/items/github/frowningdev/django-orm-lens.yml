        surrounding_text: "- [FROWNINGdev/django-orm-lens](https://github.com/FROWNINGdev/django-orm-lens) [![FROWNINGdev/django-orm-lens MCP server](https://glama.ai/mcp/servers/FROWNINGdev/django-orm-lens/badges/score.svg)](https://glama.ai/mcp/servers/FROWNINGdev/django-orm-lens) 🐍 🏠 🍎 🪟 🐧 - Django ORM static-analysis MCP server. Nine read-only tools (`list_apps`, `list_models`, `describe_model`, `find_relations`, `cascade_preview`, `er_diagram`, `describe_migration_dependency`, `suggest_indexes`, `signal_graph`) that expose Django schema, relationships (FK/M2M/O2O, on_delete, related_name), migration deps, missing indexes, and signal graphs — no DB, no Django boot, no credentials. Companion to a VS Code / VSCodium / Cursor extension (Open VSX verified) and a `django-orm-lens` PyPI CLI. `pip install django-orm-lens[mcp]`."
