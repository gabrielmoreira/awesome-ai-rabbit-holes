insights:
  summary: A static analysis tool for Django that provides schema intelligence through VS Code extensions, a CLI, and an MCP server.
  why_it_matters: It allows developers and AI agents to perform deep schema analysis, N+1 detection, and migration impact studies using static parsing without requiring a running database or environment.
  mental_damage: Because understanding your own database schema is much easier when you just outsource the archaeology to an MCP server.
  tags:
    - django
    - mcp
    - static-analysis
    - orm
    - python
  confidence: high
