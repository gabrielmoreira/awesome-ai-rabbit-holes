insights:
  summary: An automatic evaluator for instruction-following language models that uses a powerful LLM to score outputs against a reference model, validated against 20K human annotations.
  why_it_matters: It enables developers to quickly benchmark model quality during development for under $10 and in under 3 minutes, replacing slow and expensive human evaluation loops.
  mental_damage: You now have a 0.98 correlated excuse to avoid reading your model's outputs entirely while you chase leaderboard positions that correlate perfectly with being verbose.
  tags:
    - evals
    - benchmarking
    - llm
    - leaderboard
  confidence: high
