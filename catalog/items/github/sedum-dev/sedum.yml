        surrounding_text: "- [Sedum](https://github.com/sedum-dev/sedum) ![type: cli](https://img.shields.io/badge/type-cli-4B5563?style=flat-square) ![stars](https://img.shields.io/github/stars/sedum-dev/sedum?style=flat-square&label=%E2%98%85) - Browser end-to-end testing: in goal mode each turn asks one Jev `Choice` for the next operation (click, type, done or blocked) plus a speculative target among the page's offered elements, capped at 24 requests, 18 actions and 120 s, and the test passes only when an independent verify claim clears two `Noul`s (holds ≥ 0.75, contradicted flagged at ≥ 0.5), since the planner's done is never a verdict; authored-step tests reuse the same `Choice` to resolve each plain-English step, and with your own API key a 20-person team's PR suite costs $38–$91 a month vs $4,875 on a per-step AI platform."
