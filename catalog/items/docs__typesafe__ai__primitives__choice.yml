insights:
  summary: A structured question type for decision models that returns a selected option from a defined set along with probabilities and a confidence score.
  why_it_matters: It enables developers to replace unpredictable free-text classification with reliable, probabilistic routing and triage logic.
  mental_damage: Now you can finally quantify exactly how much you don't trust your model's classification choices.
