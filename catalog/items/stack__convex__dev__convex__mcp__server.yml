insights:
  summary: An official MCP server from Convex that lets AI agents introspect deployments, run functions, and read and write data via standardized tool calls.
  why_it_matters: Developers can wire Convex backends directly into MCP-compatible coding agents, letting models safely query tables, run functions, and manipulate environment variables without leaving the agent loop.
  mental_damage: Yet another perfectly valid reason to let your agent silently rearrange your production database while you wonder when exactly you stopped reviewing PRs.
  tags:
    - mcp
    - convex
    - backend
    - agent-integration
  confidence: high
curation:
  status: included
  reason: This is an official MCP server implementation from Convex, making MCP its primary product identity rather than a secondary compatibility feature.
  evidence:
    - Official Convex article announces 'Convex now supports a powerful MCP server' as a beta feature in Convex 1.19.5.
    - Listed in multiple awesome-mcp directories under Databases and Official Servers sections.
    - Exposes tools for introspecting tables, running functions, reading/writing data, and managing environment variables via the MCP stdio transport.
