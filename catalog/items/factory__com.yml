insights:
  summary: Factory.com provides autonomous AI agents that plan, build, test, and deploy code across desktop, terminal, web, and CLI for enterprise software development.
  why_it_matters: It reduces manual engineering effort by letting teams delegate full coding lifecycles to governed, model-independent agents that turn enterprise intent into production software.
  mental_damage: Finally, a way to feel guilty about not trusting your AI coworkers more than your human ones.
  tags:
    - ai-agents
    - autonomous-coding
    - enterprise-ai
    - software-factory
  confidence: medium
curation:
  status: included
  reason: Factory's core product is an autonomous coding agent (Droid) that performs end-to-end software development tasks—planning, building, testing, deploying—directly on codebases, making it a primary coding agent rather than an extension, framework, or orchestration platform.
  evidence:
    - "Scraped site states: 'Plan, build, review, and ship software with autonomous agents across desktop, terminal, web, and CLI' and 'Turn enterprise intent and codebase context into validated production software.'"
    - "Source-list placement in awesome-ai-coding-tools under 'Coding Agents' with description: 'Factory Droids automate coding, testing, and deployment for startups and enterprises.'"
    - "Product emphasizes agent-driven code workflows: 'Use Droid to plan, build, and validate changes,' 'AutoWiki gives every repository a living wiki,' and 'Code Review [on] every pull request.'"
