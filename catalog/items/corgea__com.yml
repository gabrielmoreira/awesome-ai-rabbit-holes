insights:
  summary: An AI-native application security platform that automates the detection and remediation of vulnerabilities in code, dependencies, infrastructure, and containers.
  why_it_matters: It aims to reduce the 'ecurity tax' on developers by providing high-precision, automated fixes rather than just noisy alerts.
  mental_damage: Another tool to ensure your 'quick fix' doesn't accidentally introduce a massive security regression.
  tags:
    - appsec
    - saas
    - vulnerability-remediation
    - ai-sast
    - devsecops
  confidence: medium
curation:
  status: included
  reason: Corgea is an end-to-end security platform and SaaS product that integrates with IDEs and SCM; it acts as a specialized workflow add-on for security rather than a primary coding agent or framework.
  evidence:
    - Seen in awesome-ai-coding-tools under the 'Security' section for finding and fixing vulnerabilities.
    - Platform integrates with GitHub, GitLab, Azure DevOps, Bitbucket, and IDEs (VS Code, Cursor, IntelliJ).
    - Core value includes AI SAST, IaC scanning, and MCP integrations to extend secure coding workflows.
