insights:
  summary: Corgea is an AI-native application security platform that detects and fixes vulnerabilities in code, packages, infrastructure, and containers.
  why_it_matters: It reduces noise and false positives in security scanning while delivering developer-ready fixes, helping teams ship secure code faster.
  mental_damage: Finally, a security tool that doesn't make you wish you'd majored in interpretive dance to understand its findings.
  tags:
    - security
    - sast
    - devsecops
    - ai
  confidence: medium
curation:
  status: included
  reason: Corgea primarily functions as a security scanning and remediation tool that integrates into developer workflows via IDEs, SCM, and agents, making it an extension/addon rather than a standalone coding agent or app builder.
  evidence:
    - Integrates with IDEs like VS Code, Cursor, and IntelliJ, and SCM systems like GitHub and GitLab
    - Positioned in the 'awesome-ai-coding-tools' list under the Security section for finding and fixing vulnerabilities
    - Core functionality includes AI SAST, dependency scanning, container scanning, and auto-fix generation for pull requests
