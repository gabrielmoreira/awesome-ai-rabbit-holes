insights:
  summary: Corgea is an AI-native application security platform that detects and fixes vulnerabilities across code, packages, infrastructure, and containers.
  why_it_matters: It helps developers secure their applications by providing accurate, review-ready fixes directly in their workflow, reducing the noise and manual effort of traditional security tools.
  mental_damage: Yet another security tool promising to 'shift left' while adding yet another dashboard, alert, and integration to the ever-growing AppSec tax.
  tags:
    - security
    - devsecops
    - ai-sast
    - vulnerability-management
  confidence: high
curation:
  status: included
  reason: Corgea is primarily a security scanning and fixing tool that integrates into IDEs, SCM systems, and agents to augment existing development workflows, making it an extension rather than a standalone coding agent or framework.
  evidence:
    - Integrates with IDEs like Visual Studio Code, Cursor, and IntelliJ, and SCM systems like GitHub and GitLab
    - Described as providing 'developer & agent ready fixes' and fitting into developer workflows
    - Listed in awesome-ai-coding-tools under the Security section as a tool that 'finds, triages, and fixes vulnerabilities'
