insights:
  summary: HackMD is a real-time collaborative Markdown editor that provides versioned notes and API access for teams and AI agents to share context.
  why_it_matters: It reduces token overhead for agents by serving Markdown directly and keeps human-AI workflows synchronized through shared, version-controlled documentation.
  mental_damage: Another tool promising to be the 'universal context layer' while adding yet another tab to check when your agent's output diverges from the team's latest Markdown doc.
  tags:
    - collaborative-editing
    - markdown
    - ai-context
    - developer-tools
  confidence: medium
curation:
  status: included
  reason: HackMD functions as a persistent knowledge base where agents can retrieve and write Markdown context via API, fitting the memory-and-context category's focus on externalized agent memory and knowledge storage.
  evidence:
    - Every HackMD note is Markdown all the way down, enabling agents to pull context/reference docs via REST API or CLI
    - Push agent-generated drafts back into your workspace with version history tracking
    - Explicitly positioned as a 'shared context layer' for teams and agents to stay aligned
