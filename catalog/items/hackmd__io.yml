insights:
  summary: HackMD is a real-time collaborative Markdown editor with GitHub sync, version history, and API access for team and agent workflows.
  why_it_matters: It provides a shared Markdown context layer where human teams and AI agents can read, write, and sync documentation using the same source of truth.
  mental_damage: Yet another place to check whether your agent’s latest draft made it into the team’s shared brain before it gets overwritten by a human with stronger opinions.
  tags:
    - collaboration
    - documentation
    - markdown
    - api
    - context-sharing
  confidence: high
curation:
  status: excluded
  reason: HackMD is a general-purpose collaborative documentation tool whose primary value is team Markdown editing, not AI-specific developer tooling like coding agents, context engineering, or app building.
  evidence:
    - Scraped site context positions HackMD as a real-time Markdown editor for collaborative work, with features like version history, GitHub sync, and team workspaces.
    - README emphasizes real-time editing, comments, templates, and public community notes — core functionality is human collaboration, not AI agent enablement.
    - Source-list context appears in awesome-mcp-servers only as a community server due to Markdown API access, not as an MCP-native tool.
