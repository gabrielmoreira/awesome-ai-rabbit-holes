insights:
  summary: JEV SPEED is a browser-based Speed card game where a Jev decision model controls one player and the user plays the other, with rules for misplays and penalties.
  why_it_matters: It demonstrates a Jev decision model in an interactive, real-time adversarial setting, showing how typed judgments can drive game logic.
  mental_damage: Another reminder that we now benchmark AI not by solving problems but by watching it lose at solitaire variants we invented to feel superior.
