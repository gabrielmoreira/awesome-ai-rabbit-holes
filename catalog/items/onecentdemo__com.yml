insights:
  summary: onecentdemo.com is a tool that generates narrated demo videos from natural language prompts by driving a real browser with the Jev decision model.
  why_it_matters: It lets developers quickly create product demos without manual screen recording, turning simple sentences into guided browser walkthroughs with voiceover.
  mental_damage: Finally, a way to automate the soul-crushing task of making demo videos that no one watches but everyone insists you need.
  tags:
    - demo-generation
    - browser-automation
    - ai-narration
  confidence: high
curation:
  status: excluded
  reason: The tool is primarily a browser automation utility driven by a decision model (Jev), not a developer-facing AI tool that writes, edits, or assists with code; its output is a video demo, not code or development workflow artifacts.
  evidence:
    - The product generates narrated demo videos by driving a browser with Jev, a decision model, to perform clicks and form fills based on natural language prompts.
    - It maps app routes, records outlined frames, and outputs MP4/GIF files with optional voiceover and music — no code editing, file writing, or repo interaction is described.
    - It appears in the awesome-jev list under 'Apps powered by Jev' as a demo generation tool, not as a coding assistant, agent, or developer workflow enhancer.
