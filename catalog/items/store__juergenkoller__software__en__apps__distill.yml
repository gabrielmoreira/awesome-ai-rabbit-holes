curation:
  status: included
  reason: Distill is a file-renaming utility with AI analysis and MCP server features, but its core function is enhancing developer workflows via Finder integration and folder watching, making it a workflow add-on rather than a coding agent or MCP-first product.
  evidence:
    - Distill provides a FinderSync extension for right-click renaming in Finder
    - It watches folders in the background and automatically renames new files
    - It includes a REST API with Swagger UI and MCP server for integration with Claude and other AI assistants
