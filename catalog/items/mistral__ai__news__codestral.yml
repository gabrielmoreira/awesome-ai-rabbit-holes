  confidence: high
curation:
  status: included
  reason: This is a foundational model and API endpoint used to build other tools or power coding assistants, fitting the AI Frameworks and SDKs category as a building block rather than a standalone coding agent or IDE.
  evidence:
    - Described as a '22B open-weight generative AI model explicitly designed for code generation tasks' with instruct and FIM endpoints.
    - Available via API (codestral.mistral.ai) and downloadable on HuggingFace for self-deployment.
    - Integrated into frameworks like LangChain/LlamaIndex and IDE tools like Continue.dev and Tabnine as the underlying intelligence.
