insights:
  summary: BrainGrid is a web-based AI product planner that structures app ideas into specs, tasks, and prompts designed to be executed by external coding agents like Cursor or Claude Code.
  why_it_matters: It attempts to solve the 'planning gap' by generating architecture and acceptance criteria that coding agents can consume, aiming to reduce regressions and prototype staleness.
  mental_damage: We’ve now reached the point where we need an AI tool to organize the prompts for the AI tool that writes the code, adding a middle manager to a workflow that was supposed to eliminate middle managers.
  tags:
    - planning
    - specs
    - mcp
    - workflow
  confidence: high
curation:
  status: included
  reason: The product centers on a spec-first loop—brainstorming, planning, and generating structured specifications and tasks to drive external coding agents—rather than acting as the coding agent or IDE itself.
  evidence:
    - Site claims it 'writes your specs, plans your features, and creates structured tasks and prompts that coding agents... can execute reliably.'
    - Explicitly listed in awesome-mcp-servers under 'Developer Tools' for generating tasks for AI coding tools.
    - Works via MCP, CLI, or copy-paste to send tasks to agents like Cursor, Claude Code, and Windsurf rather than editing code directly.
