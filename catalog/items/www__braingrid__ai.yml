insights:
  summary: BrainGrid is a web-based AI product planner that generates structured specs, feature plans, and task breakdowns designed to be consumed by coding agents like Claude Code and Cursor.
  why_it_matters: It attempts to solve the 'planning gap' by turning vague ideas into scoped tasks and acceptance criteria, reducing the back-and-forth friction when delegating work to AI coding tools.
  mental_damage: We have officially entered the era of needing AI to plan the work so that other AI can build it, ensuring the human's primary job is now managing the project management agent.
  tags:
    - spec-driven
    - planning
    - ai-workflow
    - product-management
  confidence: high
curation:
  status: included
  reason: The product's core identity is generating specs, architecture context, and tasks to drive implementation, fitting the spec-first loop definition better than a generic coding agent.
  evidence:
    - Scraped site describes it as 'The AI Product Planner' that writes specs and tasks for coding agents.
    - "Explicit workflow: 'Describe needs -> Clarify with questions -> Specs AI coding tools will love -> Break into tasks'."
    - Lists compatibility with Claude Code, Cursor, and others via MCP, CLI, or copy-paste, confirming it is not the agent itself.
