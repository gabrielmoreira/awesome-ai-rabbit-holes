  reason: Wispy is a technical writing and documentation generator, not a developer-facing AI tool for coding, agents, workflows, or infrastructure; it produces end-user artifacts like reports and specs rather than code, apps, or agent behaviors, placing it outside the catalog’s scope of practical AI tools for software developers.
  evidence:
