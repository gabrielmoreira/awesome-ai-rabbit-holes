insights:
  summary: Jev plays Pac-Man is a web demo where TypeSafe's Jev decision model steers a Pac-Man recreation using structured game state and typed directional queries.
  why_it_matters: It demonstrates decision models in action for real-time control, showing how Jev outputs probabilistic moves from game-state inputs without vision or hardcoded paths.
  mental_damage: Watching an AI play Pac-Man at 0.5x speed while you wonder if this is the future of game AI or just a neat way to avoid writing a pathfinder.
  tags:
    - decision-model
    - demo
    - game-ai
  confidence: medium
curation:
  status: included
  reason: The project's core identity is showcasing the Jev decision model's typed judgment capability in a game context, making it a decision-model tool rather than a coding agent or app builder.
  evidence:
    - "Scraped site context: 'Jev, TypeSafe's System One model, steers this Pac-Man recreation. Before each junction the game sends Jev the maze, the actors, and the legal directions as structured data; Jev answers with one direction and a probability for each option.'"
