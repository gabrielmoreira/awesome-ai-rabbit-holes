insights:
  summary: Jev Hooks is an independent library that provides typed semantic state hooks for React and backend programs, enabling composition of model judgments like state.
  why_it_matters: It lets developers integrate decision-model outputs directly into application logic as reactive values, reducing boilerplate for AI-influenced UI and backend behavior.
  mental_damage: Another layer of abstraction where your state now has opinions, and your UI rerenders not because data changed, but because the model felt differently about it.
  tags:
    - ai-integration
    - react-hooks
    - decision-models
    - state-management
  confidence: medium
curation:
  status: included
  reason: The product's core identity is integrating Jev (a decision model) into application code via hooks, making it an SDK for calling decision models with typed questions, not a standalone agent or app builder.
  evidence:
    - "Scraped site: 'Jev Hooks makes typed model judgments part of ordinary application composition' and provides hooks like useScore, useNoul, useChoice"
