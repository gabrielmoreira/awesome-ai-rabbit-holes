  confidence: high
curation:
  status: excluded
  reason: Retool AI is primarily a low-code platform for internal tools, not a developer-facing AI coding agent, framework, or orchestrator; its core value is enabling business users to build apps with AI, not developers writing or editing code directly.
  evidence:
    - Appears in awesome-ai-coding-tools under 'Database and API Tools' section as a way to 'build bespoke AI-powered tools for your business'
    - README emphasizes building AI apps, workflows, and agents on top of an enterprise-grade platform using live production data, with features like context-aware editing, one-click RAG, and automated workflows
    - Positioned as a platform where 'humans and AI build from shared primitives' and 'AI-generated apps inherit enterprise security', targeting business analysts and operations teams alongside developers
