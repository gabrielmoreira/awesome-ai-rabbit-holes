insights:
  summary: Dosu is a knowledge infrastructure platform that captures context from coding agent sessions, documentation, and chat tools to build a shared team memory and maintain documentation automatically.
  why_it_matters: It reduces token usage and increases consistency by giving coding agents access to automatically maintained team knowledge instead of forcing them to re-prompt for context.
  mental_damage: We have successfully reached the point where we need a platform to document what our AI agents learned so the next AI agent doesn't bother us with the same questions.
  tags:
    - memory
    - mcp
    - context
    - documentation
    - knowledge-management
  confidence: high
curation:
  status: included
  reason: Dosu's core novelty is automatic knowledge capture and context infrastructure for agents, making it a memory and context system rather than a primary coding assistant or generic platform.
  evidence:
    - Dosu's MCP Server 'builds team-wide memory in the background during every coding agent session'
    - Claims 'automatic knowledge capture gives your team shared context and improves agent performance'
    - Maintains living documentation including AGENTS.md and CLAUDE.md automatically from agent sessions
