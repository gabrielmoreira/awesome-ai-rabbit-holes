insights:
  summary: Dosu is a knowledge infrastructure service that captures team and agent learnings into a shared, updatable cache to reduce redundant context gathering.
  why_it_matters: It cuts token usage and speeds up agent workflows by preventing repeated re-learning of the same information across sessions.
  mental_damage: Finally, a way to stop feeling like your AI agents are goldfish with internet access.
  tags:
    - knowledge-management
    - agent-tooling
    - token-optimization
  confidence: high
curation:
  status: included
  reason: Dosu's core identity is a shared knowledge cache that persists and reuses agent learnings, making it a memory and context system rather than a coding agent or extension.
  evidence:
    - Dosu automatically captures what your team and agents learn, making every agent faster, more accurate, and more token-efficient
    - It updates existing sources instead of creating conflicting copies, keeping humans and agents aligned around the same truth
    - Knowledge in Dosu is human-readable, markdown-based, Open Knowledge Format (OKF) compatible, and syncable to GitHub, Confluence, Notion, and more
