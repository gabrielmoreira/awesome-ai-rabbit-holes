insights:
  summary: Dosu is a knowledge infrastructure service that automatically captures and shares agent and team learnings to reduce redundant context gathering.
  why_it_matters: It reduces token waste and speeds up AI coding agents by turning session insights into reusable, up-to-date knowledge without workflow changes.
  mental_damage: Finally, a tool that acknowledges your agents keep relearning the same thing — and sells you a knowledge cache to fix the amnesia loop.
  tags:
    - knowledge-sharing
    - agent-context
    - token-efficiency
  confidence: high
curation:
  status: excluded
  reason: Dosu is a knowledge infrastructure layer for agents, not a developer-facing AI tool itself; it serves agents and teams as a backend service, not a direct coding assistant, builder, or workflow tool for developers to use in their loop.
  evidence:
