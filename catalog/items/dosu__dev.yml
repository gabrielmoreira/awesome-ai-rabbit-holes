insights:
  summary: Dosu is a knowledge infrastructure product that captures context from coding agent sessions and tool integrations to automatically maintain documentation and improve agent performance.
  why_it_matters: It provides a shared memory layer and MCP server that allows coding agents to access consistent team context, reducing token usage and improving implementation consistency across sessions.
  mental_damage: We have finally solved the problem of stale documentation by ensuring our agents quietly document their own hallucinations directly into the repo's permanent record.
  tags:
    - agent-memory
    - context-engineering
    - knowledge-management
    - mcp
  confidence: high
curation:
  status: included
  reason: Dosu primarily extends the capabilities of existing coding agents (like Claude Code) by providing memory, context, and documentation automation via an MCP server, rather than acting as a primary coding assistant itself.
