insights:
  summary: A CLI and MCP server for discovering verified GitHub repositories and Rust crates using typed decision-model scoring to prevent LLM hallucinations.
  why_it_matters: It provides developers and AI agents with deterministic metadata and ranked results for dependency discovery, replacing probabilistic LLM guesses with verified registry data.
  mental_damage: Because we’ve reached the point where we need a dedicated oracle just to confirm a package name actually exists.
