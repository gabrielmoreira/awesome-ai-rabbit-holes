  confidence: high
curation:
  status: excluded
  reason: The product is a no-code SaaS platform aimed at non-developers and enterprise users building chatbots and simple AI apps, not a developer-facing coding tool, framework, or agent.
  evidence:
    - Scraped site describes it as 'no-code platform' with templates, drag-and-drop builders, and no coding experience required.
    - Primary use cases are marketing content, AI SDR, HR, and Slack/Discord bots, not repo editing or developer workflow automation.
    - Listed in awesome-ai-agents under a section for 'autonomous agents', but the product itself is a no-code app builder, not a coding agent or developer SDK.
