insights:
  summary: Pi Agent Foreman is an extension that enables a terminal-based coding agent (Pi) to resume unfinished work by checking for explicit work commands in user requests.
  why_it_matters: It helps developers avoid manually re-triggering coding agents after interruptions by automating continuation based on parsed intent.
  mental_damage: Another layer of agent supervision to manage the agent that’s supposed to be managing you.
  tags:
    - extension
    - coding-agent
    - workflow
  confidence: medium
curation:
  status: included
  reason: Pi Agent Foreman is an add-on that extends the Pi coding agent with workflow continuation logic, making it an extension rather than a standalone agent.
  evidence:
    - Described as a terminal-based coding agent extension installed via `pi install npm:pi-agent-foreman`
    - Its core function is to check user requests for explicit work commands and trigger the agent to continue unfinished work
    - Requires Pi 1.0.0 or newer and integrates via package manifest, acting as a runtime extension
