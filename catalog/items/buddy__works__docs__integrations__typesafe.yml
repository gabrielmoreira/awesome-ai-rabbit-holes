  status: included
  reason: The product's primary identity is a decision model (Jev) that provides structured, probabilistic outputs for programmatic automation.
  evidence:
    - Jev returns typed results (SCORE, CHOICE, or BOOLEAN) rather than generated text.
    - The service is designed to be used in trigger conditions for automation without parsing free-form text.
