insights:
  summary: Wordware is an AI company that offers Sauna, an AI assistant designed to augment deep work by learning user context and anticipating needs.
  why_it_matters: It claims to reduce cognitive load by automating context-aware task anticipation, potentially improving developer focus on complex work.
  mental_damage: Another AI assistant promising to read your mind and eliminate busywork — as if context scraping wasn't already a full-time job.
  tags:
    - ai-assistant
    - context-augmentation
    - productivity
  confidence: high
curation:
  status: excluded
  reason: Wordware's Sauna is a general-purpose AI assistant focused on personal productivity and context learning, not developer-specific tooling like code editing, app building, or agent orchestration.
  evidence:
    - The product is described as an 'AI assistant built for compounding context' that 'learns your taste, detects hidden patterns, augments your brain context and works proactively'
    - It positions itself as a tool to 'reclaim and augment your deep work' and 'eliminate the busywork' — general productivity claims, not software development workflows
    - No mention of coding, codebases, terminals, IDEs, APIs, or any developer-facing technical workflow in the provided materials
