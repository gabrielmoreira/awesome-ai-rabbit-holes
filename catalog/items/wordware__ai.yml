insights:
  summary: Wordware is an AI context lab whose main product is Sauna, an AI assistant focused on compounding context and proactive collaboration.
  why_it_matters: It promises to augment deep work by learning user preferences, detecting patterns, and anticipating next steps in a workspace.
  mental_damage: Finally, an assistant that claims to do your deep work so you can focus on the shallow work of explaining to it what deep work is.
