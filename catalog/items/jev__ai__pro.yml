insights:
  summary: Jev AI is a playground and API for Jev, TypeSafe's System One decision model that returns typed answers (Yes/No, Choice, Score) with calibrated probabilities instead of generating text.
  why_it_matters: It gives developers access to a fast, structured decision model for routing, triage, scoring, and guardrails where deterministic, probability-backed outputs are needed over free-form generation.
  mental_damage: Another specialized model API to juggle when all you wanted was a yes/no on whether your support ticket is urgent.
  tags:
    - decision-model
    - structured-output
    - typed-questions
  confidence: high
curation:
  status: included
  reason: Jev AI's core identity is hosting and exposing the Jev decision model via playground and API, which returns constrained typed answers with probabilities—not generated text—making it a canonical decision-model product rather than a coding agent, framework, or MCP tool.
  evidence:
    - "README states: 'Jev AI lets you try Jev, the TypeSafe System One model, in the browser. Ask yes/no, choice and score questions about any text and get calibrated probabilities and confidence.'"
    - Scraped site positions Jev AI as an independent playground and API for Jev, emphasizing typed questions (Yes/No, Choice, Score) and calibrated confidence over text generation.
    - Source-list context shows inclusion in awesome-jev under Infra/SDKs/Integrations with description matching Jev AI's self-pitch as a playground and API for the Jev model.
