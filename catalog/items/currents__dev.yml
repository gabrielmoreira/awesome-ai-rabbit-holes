insights:
  summary: Currents is a Playwright-focused dashboard, reporter, and test orchestrator that provides test history, debugging artifacts, and smart CI test balancing.
  why_it_matters: It helps teams debug failed tests faster and cut CI costs by automatically balancing Playwright test suites and detecting flaky tests.
  mental_damage: You can now vibe-fix flaky tests with an AI agent that has rich context, provided you first survive the irony of adding a SaaS dashboard to solve the complexity of your test orchestration.
