insights:
  summary: An experimental evaluation where a text-only decision model (Jev) is asked to classify hand-drawn sketches converted to SVG or base64 text.
  why_it_matters: It demonstrates the limits of text-only models for visual tasks, helping developers understand when multimodal input is necessary.
  mental_damage: Another reminder that feeding pixels as text to a model is like trying to read a map in Morse code — technically possible, practically pointless.
  tags:
    - evaluation
    - decision-models
    - vision-limits
  confidence: medium
curation:
  status: included
  reason: The project centers on evaluating Jev, a TypeSafe System One decision model, by measuring its accuracy on a classification task using text representations of drawings, making it a decision-model benchmark rather than a coding agent or app builder.
  evidence:
    - The experiment tests Jev, a text-only System One model, on classifying sketches converted to SVG or base64 text.
    - Results are analyzed using statistical tests (Wilson confidence intervals, McNemar’s exact test) to compare Jev against Claude Sonnet 5 and random guessing.
    - The source-list context describes it as turning '400 hand-drawn sketches into text and asked Jev... to name them', framing it as an evaluation of Jev’s capabilities.
