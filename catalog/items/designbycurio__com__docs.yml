insights:
  summary: Curio is a design library that provides AI agents with shareable links, MCP server access, or downloadable DESIGN.md files to apply machine-readable design styles to generated content.
  why_it_matters: It lets developers offload visual styling to AI agents using structured design tokens, reducing manual CSS/theme work when generating UIs, slides, or documents.
  mental_damage: Now you have to manage design credits just to ask an AI to make something look not awful.
  tags:
    - design
    - mcp
    - ai-styling
  confidence: high
