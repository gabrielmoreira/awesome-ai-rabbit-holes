insights:
  summary: MCP Store is a directory and discovery service for Model Context Protocol servers that allows users to add MCP-enabled AI capabilities to clients like Claude and Cursor.
  why_it_matters: It simplifies finding and installing MCP servers, lowering the barrier for developers to extend AI agents with external tools and data sources.
  mental_damage: Another registry in the growing MCP gold rush, promising one-click salvation while quietly adding yet another layer of abstraction to your AI toolchain.
  tags:
    - mcp
    - registry
    - discovery
  confidence: medium
curation:
  status: included
  reason: MCP Store's core identity is as a registry and discovery service for MCP servers, making MCP its primary protocol identity rather than a side feature, which aligns with the MCP category's focus on infrastructure and discovery tools.
  evidence:
    - Scraped site context describes it as 'Find and connect to 30,000+ MCP servers' and 'Easily add AI servers to Claude, Cursor and other LLM clients'.
    - Source-list context shows it is included in awesome-LLM-resources under the '模型上下文协议 MCP' section as a discovery resource.
    - The product enables users to create, configure, and install MCP servers via a web interface, positioning it as a registry and tooling layer for the MCP ecosystem.
