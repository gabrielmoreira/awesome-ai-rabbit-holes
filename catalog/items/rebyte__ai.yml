insights:
  summary: A platform for hiring and coordinating teams of AI agents that operate as digital employees with their own cloud computers, identities, and tool access.
  why_it_matters: It lets developers delegate end-to-end software tasks (e.g., code reviews, PR fixes, on-call triage) to specialized agents that work autonomously in Slack or via API.
  mental_damage: Now you can fire your intern and replace them with a Slack thread that never sleeps, complains, or asks for equity.
  tags:
    - multi-agent
    - slack-integration
    - autonomous-agents
    - cloud-compute
    - workforce-platform
  confidence: high
curation:
  status: included
  reason: The core product is a workforce platform for coordinating multiple specialized agents (e.g., researchers, engineers, analysts) with shared context, identities, and tool access, not a single coding assistant or extension.
  evidence:
    - Described as 'hire a team of digital employees — agents on real cloud computers that build, ship, and operate software for you'
    - Agents are scoped, named, and equipped like hires (identities, roles, cloud machines, tools, access control)
    - Multi-agent coordination is the primary workflow (e.g., @claude reviews, @codex implements in the same Slack thread)
