insights:
  summary: H2O.ai provides an end-to-end GenAI and predictive AI platform for enterprise use cases with a focus on private, air-gapped, and on-premises deployment.
  why_it_matters: It offers developers a full-stack AI platform for building, deploying, and monitoring enterprise AI agents and models without data leaving private infrastructure.
  mental_damage: Another 'end-to-end AI platform' promising sovereignty while quietly locking you into enterprise contracts and JVM-based tooling.
  tags:
    - enterprise-ai
    - platform
    - air-gapped
  confidence: high
curation:
  status: excluded
  reason: H2O.ai is a broad enterprise AI platform with GenAI and predictive capabilities, but it lacks a clear developer-tooling identity as a coding agent, framework, app builder, or similar tool; it is primarily a vertical AI solution for regulated industries rather than a developer-facing product.
  evidence:
    - "Source-list context: listed under 'awesome-local-ai' in the 'Platforms / full solutions' section as an end-to-end GenAI platform for air-gapped, on-premises or cloud VPC deployments."
    - "Scraped site context: emphasizes enterprise use cases (banks, telcos, government) and products like h2oGPTe, H2O Driverless AI, H2O Wave, and H2O GenAI App Store, focusing on business outcomes rather than developer workflows."
    - No clear indication of being a coding agent, framework, SDK, app builder, or local AI runtime; instead, it markets prebuilt agents, no-code tools, and enterprise apps for domain-specific automation.
