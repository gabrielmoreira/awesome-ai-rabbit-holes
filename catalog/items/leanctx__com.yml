insights:
  summary: Context engineering tool that uses AST analysis and shell patterns to compress context for AI coding agents.
  why_it_matters: It reduces token usage and improves agent reasoning by stripping noise from file reads and shell outputs.
  mental_damage: Your agent's intelligence is now entirely dependent on how much noise you can aggressively prune from its vision.
  tags:
    - mcp
