insights:
  summary: LeanCTX is a context gateway that selects, filters, and records what AI systems can see from connected data sources.
  why_it_matters: It gives developers fine-grained control over AI data access, reducing token waste and preventing sensitive information leakage.
  mental_damage: Another layer of middleware to debug when your AI keeps ignoring the rules you just set.
  tags:
    - context-control
    - ai-gateway
    - data-filtering
  confidence: high
curation:
  status: included
  reason: LeanCTX's core function is managing what context reaches AI models through retrieval, filtering, and recording—fitting the memory and context infrastructure category rather than acting as a coding agent or extension.
  evidence:
    - LeanCTX sits between AI and the systems it reads. It selects relevant context, applies supported controls, and records what the integration can observe.
    - Features include Sources & Retrieval, Context Control, Memory & Continuity, and Cost & Outcomes measurement.
    - Listed in Awesome-LLMOps under Optimizations for context selection and control capabilities.
