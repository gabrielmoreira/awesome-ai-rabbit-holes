curation:
  status: included
  reason: The product's entire identity is context shaping—AST-based compression, visibility, session memory, and routing—making it a canonical fit for Prompt & Context Engineering rather than an extension of any specific editor or agent.
  evidence:
    - Site claims it 'sits between your AI and your codebase' with 10 read modes and Tree-sitter AST parsing to compress file reads by 60-99%.
    - Markets cross-session memory, knowledge graphs, and context checkpoints as core features, not side integrations.
    - Works with 29+ AI tools (Cursor, Claude Code, Copilot) as a compatibility layer, but its substance is token distillation and context lifecycle management.
