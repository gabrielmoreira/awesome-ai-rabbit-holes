insights:
  summary: LeanCTX is an open-source Rust binary that sits between AI coding tools and codebases to visualize, compress, and control what context reaches the model.
  why_it_matters: It cuts token costs and context bloat by stripping noise—like comments and whitespace—while preserving structure, and adds session memory and cross-agent context control across 29+ editors and assistants.
  mental_damage: You now get a live dashboard to watch your AI context window fill up with garbage, because apparently 'please ignore the comments' was too ambiguous for a trillion-parameter model.
  tags:
    - context-compression
    - context-window
    - token-optimization
    - memory
    - ai-tooling
  confidence: high
curation:
  status: included
  reason: The product's entire identity is context shaping—AST-based compression, visibility, session memory, and routing—making it a canonical fit for Prompt & Context Engineering rather than an extension of any specific editor or agent.
  evidence:
    - Site claims it 'sits between your AI and your codebase' with 10 read modes and Tree-sitter AST parsing to compress file reads by 60-99%.
    - Markets cross-session memory, knowledge graphs, and context checkpoints as core features, not side integrations.
    - Works with 29+ AI tools (Cursor, Claude Code, Copilot) as a compatibility layer, but its substance is token distillation and context lifecycle management.
