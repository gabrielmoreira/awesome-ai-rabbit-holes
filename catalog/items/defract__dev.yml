insights:
  summary: Defract is a macOS and Windows desktop application that orchestrates parallel Claude Code agents across isolated git worktrees to manage end-to-end software development workflows from scoping to release.
  why_it_matters: It reduces cognitive load and prevents agent collisions by letting humans approve high-level decisions while agents execute coding tasks in parallel, isolated environments.
  mental_damage: Finally, a way to feel like a manager of AI interns without actually having to manage anything.
  tags:
    - agent-orchestration
    - git-worktrees
    - claude-code
    - parallel-agents
    - workflow-automation
  confidence: high
