insights:
  summary: PermisAPI is a French REST API providing access to 1.2M building permits since 2013 with enrichment data like estimated construction costs, local contractor networks, resale prices, and opportunity scores for real estate analysis.
  why_it_matters: Developers building PropTech, urban planning, or real-estate investment tools can integrate official French permit data with structured economic and risk enrichments via a documented API and optional Claude/ChatGPT connectors.
  mental_damage: Finally, an API that lets you pretend your real-estate side hustle is powered by cutting-edge AI, when really it’s just French open data wrapped in a slick dashboard and a permissive free tier.
  tags:
    - permits
    - france
    - real-estate
    - api
    - mcp
  confidence: high
curation:
  status: excluded
  reason: PermisAPI is a domain-specific data API for French building permits with AI-compatible connectors, but its core identity is data provision, not developer-facing AI tooling such as coding agents, frameworks, or orchestration platforms.
  evidence:
    - The product provides access to 1.2M French building permits since 2013 with enrichment data like construction costs, local contractors, and resale prices via REST API.
    - It offers an official MCP connector for Claude and ChatGPT, but MCP is an adapter feature, not the product’s primary identity.
    - The README and site emphasize use by real-estate professionals, architects, and PropTech startups, not software developers building AI-powered development tools.
