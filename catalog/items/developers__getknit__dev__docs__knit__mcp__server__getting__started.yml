insights:
  summary: A managed service that provides hosted Model Context Protocol (MCP) servers for connecting AI agents to various SaaS applications.
  why_it_matters: It allows developers to quickly grant AI agents access to a vast array of enterprise tools like Salesforce, HubSpot, and Jira without writing custom integration code for each one.
  mental_damage: Now you have to manage a centralized hub of third-party connectors just to keep your agents from being trapped in a context-less vacuum.
  tags:
    - mcp
    - saas-integrations
    - ai-agents
    - connectivity
  confidence: high
curation:
  status: included
  reason: The product's core identity is serving as a managed hub of MCP servers to facilitate agent-to-SaaS connectivity.
  evidence:
    - Directly describes itself as an 'MCP Hub for AI Agents'
    - Provides a marketplace-style selection of tools (CRM, Accounting, HRIS) to package into an MCP server
    - Supports deployment to Claude, Cursor, and Windsurf via MCP
