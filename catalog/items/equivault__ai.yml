insights:
  summary: EquiVault.ai is an AI-powered equity research platform that answers natural-language questions about public companies with sourced, timestamped citations from SEC filings and earnings transcripts.
  why_it_matters: It saves developers and analysts time by automating deep financial research into defensible theses with verifiable data, turning hours of filing-reading into minutes of insight.
  mental_damage: Finally, an AI tool that makes you feel guilty for not reading 10-Ks yourself — until you realize you still have to verify the sources anyway.
  tags:
