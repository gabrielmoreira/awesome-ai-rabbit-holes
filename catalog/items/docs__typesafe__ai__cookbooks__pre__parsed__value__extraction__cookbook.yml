insights:
  summary: A TypeSafe AI cookbook demonstrating regex-based candidate extraction followed by Jev model selection for structured data like emails, phone numbers, and monetary values.
  why_it_matters: Shows developers how to combine deterministic parsing with probabilistic model selection to reliably extract and normalize structured values from unstructured text.
  mental_damage: Another reminder that even simple data extraction now requires juggling regexes, model APIs, and caching layers just to get a phone number right.
  tags:
    - extraction
    - typesafe
    - jev
    - cookbook
  confidence: medium
curation:
  status: included
  reason: The cookbook centers on using TypeSafe's Jev (System One) model to make constrained selections from regex-found candidates, making the decision model the core identity rather than a coding agent or general tool.
  evidence:
    - The cookbook uses TypeSafe's Jev model via Choice and Noul questions to pick specific spans from regex-extracted candidates
    - Source-list context identifies it as a Jev-powered example under 'Patterns and cookbooks > Extraction and structured data'
    - "The workflow is: regex over-finds candidates → Jev selects the correct one → code normalizes the verbatim output"
