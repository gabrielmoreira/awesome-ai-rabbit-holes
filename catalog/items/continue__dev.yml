insights:
  summary: Continue was an open-source coding agent that has been acquired by Cursor and is no longer actively maintained as an independent project.
  why_it_matters: It was a notable open-source alternative to proprietary coding agents, offering developers a self-hosted, IDE-integrated AI pair programmer before its acquisition.
  mental_damage: Watching your favorite open-source coding agent get absorbed into a closed-source IDE feels like seeing your DIY project get bought by the very corporation you were trying to avoid.
  tags:
    - coding-agent
    - acquired
    - open-source
    - ide-integration
  confidence: high
