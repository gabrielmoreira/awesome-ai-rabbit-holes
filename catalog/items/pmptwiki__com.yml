insights:
  summary: A platform and CLI for recording, sharing, and cloning structured AI prompting journeys so that others can reproduce how a product was built with AI.
  why_it_matters: Developers can stop guessing which vague prompt led to a working prototype by cloning documented, versioned prompt workflows and pasting them directly into Claude or Cursor.
  mental_damage: We’ve moved from 'it works on my machine' to 'it prompted on my machine,' and now we’re publishing the hallucinations as reproducible artifacts.
  tags:
    - prompt-sharing
    - cli
    - reproducibility
    - mcp
  confidence: medium
curation:
  status: included
  reason: The product centers on capturing, structuring, and replaying prompt/context workflows across AI tools, which fits prompt and context engineering rather than being a primary coding agent or app builder.
  evidence:
    - Site describes itself as 'Share how you build with AI. A platform to record and share your product development journey.'
    - CLI commands include pmpt plan, pmpt save, pmpt clone, and copying AI prompts to clipboard for Claude/Cursor.
    - Listed in awesome-mcp-servers under Developer Tools with MCP integration to 'record everything automatically'.
