insights:
  summary: Reader-LM is a small language model designed to convert raw HTML into clean markdown for LLM grounding.
  why_it_matters: It provides a lightweight, multilingual alternative to heuristic-based HTML-to-Markdown pipelines, improving data preparation for LLM workflows.
  mental_damage: Another model solving a problem we already patched with regex — now we just need to fine-tune the fine-tuner.
  tags:
    - html-to-markdown
    - small-language-model
    - data-preprocessing
  confidence: medium
curation:
  status: included
  reason: Reader-LM fits as a context engineering tool because its core function is cleaning and shaping input data (HTML) into a structured format (markdown) for better LLM consumption, aligning with context optimization goals.
  evidence:
    - Designed to convert raw, noisy HTML from the open web into clean markdown
    - Trained to perform selective-copy from HTML to markdown with minimal generation
    - Positioned as an end-to-end replacement for heuristic pipelines like Readability + Turndown
