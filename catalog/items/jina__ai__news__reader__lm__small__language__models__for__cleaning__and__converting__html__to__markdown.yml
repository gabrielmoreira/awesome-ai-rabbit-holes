insights:
  summary: Reader-LM is a pair of compact, long-context language models (0.5B and 1.5B parameters) trained to convert raw, noisy HTML into clean markdown for downstream LLM grounding.
  why_it_matters: Developers can self-host or run these small models at the edge to reliably clean and structure web content for RAG pipelines without relying on heuristic scrapers or large, expensive LLMs.
  mental_damage: We have officially reached the point where we train custom neural networks just to avoid writing one more regular expression.
