insights:
  summary: Reader-LM is a pair of small language models (0.5B and 1.5B parameters) designed to convert raw, noisy HTML from the web into clean markdown.
  why_it_matters: It offers developers a lightweight, long-context alternative to larger models for preprocessing web content into LLM-friendly markdown, improving grounding and reducing noise.
  mental_damage: Because nothing says 'modern web scraping' like replacing regex and heuristics with a 1.5B parameter model that still can't handle your corporate footer.
