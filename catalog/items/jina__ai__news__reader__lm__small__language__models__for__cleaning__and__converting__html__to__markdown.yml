insights:
  summary: >-
    Reader-LM is a pair of small language models (0.5B and 1.5B parameters) designed to convert raw, noisy HTML into
    clean markdown using a 256K context window.
  why_it_matters: >-
    It provides developers a lightweight, cost-efficient way to preprocess web content for LLMs without relying on
    fragile heuristic pipelines.
  mental_damage: >-
    Yet another model claiming to solve HTML-to-markdown 'better' — as if developers weren’t already drowning in parsing
    libraries and regex band-aids.
  tags:
    - html-processing
    - small-language-model
    - markdown-generation
  confidence: high
curation:
  status: excluded
  reason: >-
    Reader-LM is a model for data transformation, not a developer-facing tool, agent, framework, or infrastructure that
    changes how software is built or maintained.
  evidence:
    - The project releases two SLMs (reader-lm-0.5b and reader-lm-1.5b) on Hugging Face for converting HTML to markdown.
    - >-
      It is positioned as a replacement for heuristic-based pipelines like Jina Reader, focusing on model performance
      and training efficiency.
    - >-
      No evidence of CLI, SDK, IDE integration, agent behavior, or workflow automation for developers — it is a model
      artifact, not a tool.
