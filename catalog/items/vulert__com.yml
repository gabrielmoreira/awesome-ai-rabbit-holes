insights:
  summary: Vulert is a web-based software composition analysis service that scans dependency manifests and SBOMs to detect vulnerabilities and provide version-specific remediation guidance without accessing source code.
  why_it_matters: It lets developers monitor open-source dependencies for vulnerabilities continuously and get actionable fixes, especially useful for auditing AI-generated code changes.
  mental_damage: Another tool to add to the growing list of things you have to remember to run before shipping, because trusting AI-generated dependencies is now a compliance liability.
  tags:
    - security
    - sca
    - dependency-monitoring
  confidence: high
curation:
  status: included
  reason: Vulert is a security scanning tool that integrates with coding agents via MCP to provide vulnerability monitoring and remediation guidance, making it an extension that enhances agent workflows rather than a standalone coding agent or framework.
  evidence:
    - Scraped site context shows Vulert provides software composition analysis with no install, using manifest files, and offers real-time vulnerability alerts.
    - "Primary page excerpt includes a dedicated section: 'MCP for Coding Agents' describing how Vulert connects to Codex, Claude Code, Cursor and other MCP-compatible agents to scan dependency files before and after changes."
    - Source-list context from awesome-ai-coding-tools places it in the Security section, noting it provides software composition analysis with no install, using manifest files, and real-time vulnerability alerts.
