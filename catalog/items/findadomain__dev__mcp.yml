  summary: An HTTP-based Model Context Protocol (MCP) server that provides real-time domain availability checking, WHOIS lookups, and TLD listing across more than 1,400 top-level domains.
  why_it_matters: Developers building AI-powered domain generators or portfolio tools can integrate live domain verification directly into their assistant workflows without wiring their own registrar APIs.
  mental_damage: Your coding agent can now argue with you about whether your startup idea is available as a .com, while silently burning tokens to check 1,441 TLDs you’ve never heard of.
