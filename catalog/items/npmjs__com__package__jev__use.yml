insights:
  summary: jev-use is an npm package providing a TypeScript hook for integrating the Jev decision model into applications.
  why_it_matters: It enables developers to programmatically access Jev's typed-decision capabilities (Choice, Score, Noul/Boolean) within their codebases via a React-style hook.
  mental_damage: Yet another wrapper turning a novel decision model into yet another hook you'll forget to clean up in useEffect.
  tags:
    - jev
    - decision-model
    - react-hook
    - typescript
    - typesafe
  confidence: medium
curation:
  status: included
  reason: jev-use is a client SDK whose core purpose is calling the Jev decision model with typed questions, placing it firmly in decision-models rather than as a coding agent or extension.
  evidence:
    - The package is an npm module named jev-use, indicating a React-style hook for Jev integration.
    - It appears in the source list 'awesome-jev' under the 'Agent tooling' section for projects built on Jev.
    - Jev itself is a canonical positive for the decision-models category as TypeSafe's System One model.
