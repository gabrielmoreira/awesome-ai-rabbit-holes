insights:
  summary: Antigravity is an agent-first IDE based on a modified Visual Studio Code fork that enables autonomous AI agents to plan, code, test, and browse in parallel via a dual-view interface.
  why_it_matters: It redefines the IDE as an agent orchestration surface where developers delegate full coding workflows to multiple AI agents working in parallel.
  mental_damage: Finally, an IDE where your AI agents have better task management than you do.
  tags:
    - ide
    - coding-agents
    - agent-orchestration
  confidence: high
curation:
  status: included
  reason: Antigravity is a standalone IDE whose core identity is autonomous AI agents performing coding tasks — planning, writing, testing, and browser-based validation — making it a coding agent first, despite its IDE form.
  evidence:
    - Deploys autonomous AI agents that independently plan tasks, write code, execute terminal commands, and open a built-in Chrome browser to visually test applications.
    - "Features a two-view architecture: Editor View for hands-on coding and Manager View ('Mission Control') to dispatch up to five agents working on different tasks in parallel."
    - Positioned as 'Google's Free, Agent-First IDE' that lets AI plan, code, and test for you, distinguishing it from chatbot-style assistants like Cursor or Copilot.
