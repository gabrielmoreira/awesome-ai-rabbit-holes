insights:
  summary: Antigravity is an AI-native IDE built on a modified Visual Studio Code fork that uses autonomous agents to plan, write, execute, and test code across a multi-agent 'Mission Control' interface.
  why_it_matters: It shifts the developer workflow from line-by-line assistance to parallel, agent-driven task execution with integrated visual testing and multi-model support.
  mental_damage: Just when you thought you had a handle on 'vibe coding' with a chatbot sidebar, now you need to manage a five-agent scrum team that opens its own browser to judge your UI.
  tags:
    - ide
    - coding-agents
    - google
    - vscode-fork
    - multi-agent
  confidence: medium
curation:
  status: included
  reason: The primary product surface is a standalone, AI-native editor/IDE (a modified VS Code fork) that hosts the agents, making it a fit for ai-ides-editors rather than a pure coding agent.
  evidence:
    - Built on a modified fork of Visual Studio Code and described as an 'AI-powered integrated development environment'.
    - Features a two-view architecture (Editor View and Manager View) where the IDE itself is the primary surface for the agents.
    - Listed under 'Code Editors and Assistants' in the awesome-ai-coding-tools directory.
