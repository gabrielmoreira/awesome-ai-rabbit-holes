curation:
  status: excluded
  reason: Claude (Anthropic) is a general AI assistant and provider platform, not a developer-facing tool whose primary identity is coding, agent orchestration, app building, or any other developer-tooling category in the catalog.
  evidence:
    - The scraped site positions Claude as an AI assistant for work tasks like drafting memos, building decks, analyzing data, and automating routines across apps — not as a coding agent or developer tool.
    - Claude Code is explicitly listed as a separate product under 'Build with' and 'For developers', indicating the main Claude product is not the coding agent.
    - No evidence suggests the core product is a developer-facing agent, framework, orchestrator, or builder; instead, it emphasizes broad workplace use cases in marketing, sales, finance, legal, and HR.
