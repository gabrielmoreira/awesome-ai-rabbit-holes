curation:
  status: excluded
  reason: Exclude because the primary product is a vertical SaaS platform for financial data sourcing, not a developer-facing tool, framework, or coding assistant.
  evidence:
    - The site describes itself as 'The web data platform for investment firms' focused on finance use cases.
    - Value proposition is end-to-end data pipeline generation for analysts and investors, not a tool developers import, script against, or use to edit repos.
    - While it mentions using coding agents and offering an MCP integration, these are internal or peripheral features of a finance-specific data SaaS.
