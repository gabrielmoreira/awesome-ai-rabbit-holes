insights:
  summary: Kadoa is a web data platform for finance that uses coding agents to generate and maintain deterministic data scraping pipelines from natural language prompts.
  why_it_matters: It allows developers and analysts to skip writing and fixing brittle web scrapers by letting internal agents generate the pipeline code automatically.
  mental_damage: You can now outsource your scraping nightmares to a specialized agent, giving you more free time to wonder when an agent will replace the analyst reading the data, too.
  tags:
    - web-scraping
    - agents
    - finance
    - data-pipelines
  confidence: high
curation:
  status: excluded
  reason: The product is a vertical SaaS platform for investment firms, not a developer tool for building software, editing code, or extending a coding environment.
  evidence:
    - "Scraped site title and description explicitly state: 'Kadoa is the web data platform for investment firms.'"
    - The workflow is designed for analysts and data scientists ('analysts can now extract public data themselves'), not software developers building apps.
    - While it uses 'coding agents' to generate scraping code, the user never touches the IDE or repo; it is a hosted data service, not a developer tool.
