insights:
  summary: A playable simulation demonstrating decision-model-driven NPC behavior via local WebGPU inference.
  why_it_matters: It provides a practical look at how constrained, typed decision models can drive agentic behavior more reliably than unpredictable text generation.
  mental_damage: One poorly tuned prompt and your entire village goes extinct in the name of local inference.
