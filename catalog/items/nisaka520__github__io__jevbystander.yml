insights:
  summary: JevBystander is an Android app that reads WeChat messages via accessibility services and uses the Jev decision model to suggest response postures without generating replies.
  why_it_matters: It gives developers a privacy-preserving way to offload message interpretation to a local decision model, reducing cognitive load in personal chats.
  mental_damage: Finally, an AI that won’t auto-reply to your ex — just silently judge them while you decide whether to ghost or engage.
  tags:
    - decision-model
    - android
    - privacy-first
    - accessibility
    - jev
  confidence: medium
curation:
  status: included
  reason: The product’s core identity is the Jev decision model judging message intent and emotion, making it a decision-model tool rather than a coding agent or extension, even though it uses accessibility services to read screens.
  evidence:
    - The app does not generate replies, only shows 3 Toast suggestions based on Jev’s probability distribution over intent and emotion
    - It uses only accessibility service to read the current screen, no OCR, no screenshot, no injection, and runs locally with no third-party dependencies
    - The README explicitly contrasts it with Jev chat assistants that generate replies, positioning JevBystander as a pure judgment layer
