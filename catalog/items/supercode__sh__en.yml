insights:
  summary: Supercode is a browser extension that optimizes token usage and provides curated skills for Claude, Codex, and Cursor.
  why_it_matters: It reduces token waste and improves agent reliability by pre-processing context and injecting structured skills, letting developers get more useful work from existing AI coding assistants.
  mental_damage: Finally, a way to feel like you're upgrading your AI pair programmer without admitting you still need to babysit it.
  tags:
    - token-optimization
    - agent-extension
    - skills-catalog
  confidence: high
curation:
  status: included
  reason: Supercode is an extension that augments existing coding agents (Claude, Codex, Cursor) with token optimization and skill injection, making it an add-on rather than a standalone agent or framework.
  evidence:
    - Supercode installs into Claude, Codex, and Cursor to cut token usage by up to 60% and provide built-in skills
    - Its core value is augmenting host agents via context preprocessing and curated skill packs, not autonomous coding
    - Listed in awesome-ai-coding-tools under Developer Productivity Tools as a way to 'Improve Claude, Codex, and Cursor'
