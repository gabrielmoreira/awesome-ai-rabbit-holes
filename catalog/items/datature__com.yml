curation:
  status: excluded
  reason: Datature is a vertical computer vision SaaS platform for enterprise ML workflows, not a developer-facing AI coding tool, agent, or infrastructure component.
  evidence:
    - Product is described as an 'end-to-end platform for data labeling, model training, and deployment' for Vision AI.
    - Primary workflows are annotation, model training without code, and deployment to edge/cloud, not coding assistance or dev tooling.
    - Seen in awesome-local-ai under 'Developer tools', but the tool itself is a hosted CV platform, not local AI or a coding utility.
