    - "Scraped site description explicitly targets physicians: '解決新手醫師不熟申報、老鳥醫師沒時間寫病歷的痛點' (solving the pain of new doctors unfamiliar with claims and veteran doctors having no time to write medical records)."
    - No repository description, README, or code context indicating it is a reusable developer tool, framework, or general-purpose MCP infrastructure.
