insights:
  summary: A Taiwan-focused AI assistant that translates Chinese patient complaints into English medical records, looks up ICD-10 codes, and warns physicians about national health insurance rejection risks.
  why_it_matters: It is a domain-specific MCP server implementation that demonstrates how to build structured medical workflows on top of the protocol for non-software-engineering verticals.
  mental_damage: We have successfully abstracted the Taiwanese healthcare billing system into a prompt, proving once again that no human workflow is safe from being turned into a context window.
