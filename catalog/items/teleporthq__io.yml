insights:
  summary: A low-code front-end design and development platform that uses AI to generate website layouts from prompts, which can then be refined visually and exported as static sites or component code.
  why_it_matters: It allows developers to rapidly prototype and ship production-ready static websites and UI components by converting Figma designs or text prompts directly into code for frameworks like React, Angular, and Vue.
  mental_damage: Another 'AI-powered' builder promising to bridge the design-developer gap, ensuring you can now spend your afternoon arguing with a drag-and-drop editor about margin pixels instead of writing CSS.
  tags:
    - figma-to-code
    - low-code
    - static-site
    - ui-generator
    - website-builder
  confidence: high
curation:
  status: included
  reason: This is a browser-first SaaS product that generates and deploys whole websites from prompts and visual edits, fitting the app-builders definition over coding-agents.
  evidence:
    - Listed in awesome-ai-coding-tools under 'UI Generators' as a front-end platform with a visual builder.
    - Scraped site describes a 'Professional website builder' that generates layouts from prompts and exports to HTML, CSS, JS, and React/Vue/Angular.
    - Features GitHub integration and free code export, positioning it as a tool to generate sites/components rather than a repo-resident coding agent.
