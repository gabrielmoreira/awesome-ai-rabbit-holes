insights:
  summary: Component Charades is a Taboo-style web game where developers describe UI components without naming them, and the Jev decision model bets on guesses using probability outputs.
  why_it_matters: It demonstrates decision-model interaction in a playful, educational way that reveals how Jev interprets descriptive prompts through probability distributions.
  mental_damage: A reminder that even guessing games now require model introspection, turning UI design into a probabilistic charades act with real token costs.
  tags:
    - game
    - decision-model
    - design-system
  confidence: medium
