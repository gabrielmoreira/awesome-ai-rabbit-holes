    - ai
  confidence: high
curation:
  status: included
  reason: RapidNative generates complete, deployable React Native apps from prompts, matching the core app-builder identity of turning natural language into runnable software.
  evidence:
    - Describe what you want in plain English, and RapidNative builds real React Native screens—instantly.
    - Every project ships with authentication, file storage, and realtime updates wired up on day one.
    - You can export clean React Native code anytime and have your developers extend it, or publish directly to app stores.
