curation:
  status: included
  reason: Supercode.sh is an extension that augments existing coding agents (Claude, Codex, Cursor) with token optimization, skills, and workflows, rather than acting as a standalone agent or framework.
  evidence:
    - Marketed as 'Supercode Extension for Claude, Codex and Cursor' with install links for each
    - Core features include token usage reduction (up to 60%), curated agent Skills, and project context built for reliable AI coding
    - Positioned as bringing 'agentic experience to the next level' by improving existing agents, not replacing them
