insights:
  summary: Supercode.sh is a paid extension that optimizes token usage and provides curated skills for Claude, Codex, and Cursor agents.
  why_it_matters: It reduces context waste and improves agent output quality, lowering token costs while maintaining or improving coding assistance.
  mental_damage: Another layer of subscription friction between you and the AI that already feels like it’s charging you by the sigh.
