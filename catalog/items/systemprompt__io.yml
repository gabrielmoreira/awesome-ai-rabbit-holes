insights:
  summary: A self-hosted, provider-agnostic governance layer for AI agents that authenticates, authorizes, rate-limits, logs, and costs every AI interaction via a single compiled Rust binary.
  why_it_matters: It gives developers a unified control plane to govern any AI agent or model across their organization while maintaining full data sovereignty and audit trails on their own infrastructure.
  mental_damage: Finally, a stack that lets you discover exactly how much your team spent on Claude before the auditor asks, provided you first deploy a self-hosted Rust binary and configure the PostgreSQL it depends on.
  tags:
    - governance
    - self-hosted
    - rust
    - audit
    - mcp
  confidence: high
curation:
  status: included
  reason: The product is an operated control plane and governance platform for coordinating, governing, and observing AI agents and inference across an organization, not a code-first SDK or single coding assistant.
  evidence:
    - Described as 'the governance layer for AI agents' with a single compiled Rust binary handling auth, rate-limiting, logging, and cost tracking.
    - Functions as a control plane with MCP governance, role-scoped skills/plugins, and identity-bound audit trails across any agent or provider.
    - Listed in Awesome-LLMOps under LLMOps, reinforcing its infrastructure and governance positioning rather than IDE or agent extension work.
