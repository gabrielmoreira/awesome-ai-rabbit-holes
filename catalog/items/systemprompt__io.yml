insights:
  summary: SystemPrompt is a self-hosted Rust runtime for governing AI client access, model routing, and tool execution with centralized policy enforcement and audit logging.
  why_it_matters: It gives development teams a way to enforce security and compliance policies on AI agents without changing their existing workflows or tools.
  mental_damage: Finally, a control plane for the AI agents you didn’t realize were already running wild in your infra.
  tags:
    - ai-governance
    - self-hosted
    - security
    - mcp
    - rust
  confidence: medium
curation:
  status: included
  reason: SystemPrompt functions as an enterprise control plane that coordinates multiple AI agents by managing identity, tool access, model routing, and policy enforcement across clients and providers, fitting the agent orchestration category as a hosted platform for governing agent behavior.
  evidence:
    - SystemPrompt provides a self-hosted control plane that connects identity, models, tools, and audit in your environment with policy enforcement before tool execution.
    - It enables teams to govern connected AI clients, apply access rules, route model requests, and inspect governed execution records and audit trails.
    - The product emphasizes deploying the Rust runtime with PostgreSQL on infrastructure you control, positioning it as an operated platform rather than a library or extension.
    - jev winnow:e4b 0.25 below gate 0.50; proposed decision-models / Agent Gates, Routers & Skills; placement kept at agent-orchestration (unverified)
