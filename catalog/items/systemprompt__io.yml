insights:
  summary: A self-hosted Rust binary that provides a unified control plane for governing, logging, and cost-tracking AI interactions across multiple providers and agents.
  why_it_matters: Developers can centrally enforce policies, manage secrets, and audit all AI actions across teams and providers without vendor lock-in.
  mental_damage: Finally, a way to stop your AI from leaking secrets—just in time for your CISO to ask why it took so long.
  tags:
    - self-hosted
    - ai-governance
    - control-plane
    - mcp
    - enterprise
  confidence: high
curation:
  status: included
  reason: The product is a control plane for coordinating and governing multiple AI agents and providers, fitting the Agent Orchestration category's focus on operated workbenches and runtime platforms.
  evidence:
    - Described as 'one compiled Rust binary that governs, logs, and costs every AI interaction across every provider'
    - Supports multi-agent governance (Claude, Codex, Gemini, etc.) with centralized rule enforcement
    - Self-hosted, extensible architecture with MCP server support and audit logging
