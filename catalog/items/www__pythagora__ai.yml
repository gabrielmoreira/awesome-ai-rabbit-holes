insights:
  summary: >-
    Pazi is a business-focused AI agent platform that builds and runs AI teams to execute business ideas from a
    dashboard.
  why_it_matters: >-
    It attempts to replace manual business setup with autonomous AI agents handling planning, execution, and workflow
    coordination for entrepreneurs.
  mental_damage: >-
    Another AI tool promising to 'build your business' while you sip coffee, adding to the pile of vaporware that
    confuses agent orchestration with actual revenue.
  tags:
    - ai-agents
    - business-automation
    - workflow-platform
  confidence: high
curation:
  status: excluded
  reason: >-
    Pazi is a business automation platform focused on end-to-end idea execution via AI agents, not a developer-facing
    tool for coding, app building, or workflow engineering; its core value targets non-technical users launching
    ventures, not software development workflows.
  evidence:
    - >-
      The site positions Pazi as building 'a team around you and starts making it happen' for business ideas like coffee
      shops, books, and apps, with no mention of code editing, SDKs, or developer tooling.
    - >-
      Features emphasize dashboards, opportunity tracking, task calendars, and business pulse — generic workflow and
      project management, not code-centric AI assistance.
    - >-
      Use cases span e-commerce, SaaS, health, education, and creative industries, framed as end-user business outcomes,
      not developer productivity gains.
