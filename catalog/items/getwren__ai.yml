insights:
  summary: Wren AI is a generative BI platform that converts natural language questions into SQL queries, charts, and insights using a unified semantic layer.
  why_it_matters: It allows developers and data teams to embed conversational analytics into products and workflows without writing manual SQL or building custom dashboard scaffolding.
  mental_damage: We have successfully abstracted away the pain of learning SQL, only to replace it with the new, exciting pain of debugging why the AI thinks your revenue column is actually 'user_count'.
