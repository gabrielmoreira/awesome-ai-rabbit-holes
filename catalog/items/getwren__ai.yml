insights:
  summary: Wren AI is a generative business intelligence platform that converts natural language questions into SQL queries, charts, and dashboards, backed by a semantic layer supporting various databases.
  why_it_matters: It allows developers and data teams to embed conversational analytics into products and internal tools, drastically reducing the amount of manual SQL required for ad-hoc reporting.
  mental_damage: Finally, a way to automate yourself out of the 'can you pull this number' Slack messages, only to be replaced by the 'why is the AI's SQL wrong' Slack messages.
  tags:
    - analytics
    - business-intelligence
    - natural-language
    - semantic-layer
    - sql
  confidence: high
curation:
  status: excluded
  reason: Despite being open source and listed in agent directories, the product is a business intelligence tool for end-users, not a developer tool for writing code, orchestrating agents, or building applications.
  evidence:
    - Scraped site context describes it as 'Generative BI' that turns 'plain-language questions into governed SQL, charts, and insights'.
    - The site targets 'Data Teams', 'Executives', and 'Non-tech' users rather than software engineers building software.
    - Listed in awesome-ai-agents under a 'Wren' section, but the tool functions as an autonomous analyst, not a coding assistant.
