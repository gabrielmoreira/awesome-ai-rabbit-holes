  status: included
  reason: The core identity is a decision model (Jev) producing Score and Noul judgments for entity alignment, fitting the decision-models category where the product's reason to exist is typed question answering with probabilities.
  evidence:
    - Uses TypeSafe's Jev model to output Score questions with three levels and Noul questions for field matching
    - The cookbook's purpose is demonstrating a judgment call on entity pairs via decision model outputs, not coding or app generation
    - Listed in awesome-jev under 'Patterns and cookbooks > Extraction and structured data' as a Jev-powered decision example
