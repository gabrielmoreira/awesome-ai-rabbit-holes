insights:
  summary: Fulcra is a user-owned context backend that aggregates real-world data, files, and agent work into a shared context lake for AI agents.
  why_it_matters: It lets developers give AI agents persistent, controllable memory across tools and sessions, reducing the need to rebuild context from scratch.
  mental_damage: Yet another context layer promising to solve agent amnesia, as if the real problem wasn't having too many of these already.
  tags:
    - context
    - memory
    - mcp
  confidence: medium
curation:
  status: included
  reason: Fulcra's core identity is a persistent context backend for AI agents, focusing on memory, retrieval, and context ownership rather than acting as a coding agent or MCP-first product.
  evidence:
    - Describes itself as a 'user-owned context backend' and 'context lake' combining structured, semi-structured, and unstructured data from agents and apps
    - Emphasizes agent memory, cross-agent context sharing, and controllable access to accumulated knowledge over time
    - Listed in awesome-mcp-servers under 'Official Servers' but MCP is presented as a connectivity option, not the product's primary identity
