insights:
  summary: A unified, human-owned memory layer that allows AI agents to read and contribute persistent context across different platforms and sessions.
  why_it_matters: It solves the fragmented context problem by providing a single source of truth for personal data and state that can be shared across multiple agents via a Life API and MCP server.
  mental_damage: The dream of a 'Personal Data OS' is just a fancy way of saying we're now managing a database of our own existence so our agents don't forget we're allergic to peanuts every time we start a new chat.
  tags:
    - mcp
    - memory
    - personal-data
    - context-layer
  confidence: high
curation:
  status: included
  reason: The core product identity is a memory and retrieval system for shaping context, rather than being an agent or a simple integration.
  evidence:
    - Claims to be a 'memory layer you own' and 'one unified memory' for agents.
    - Focuses on 'Readable and controllable' memory stores and 'dynamic memory features'.
    - Provides a 'Life API' and 'MCP Server' to deliver this context to other LLMs.
