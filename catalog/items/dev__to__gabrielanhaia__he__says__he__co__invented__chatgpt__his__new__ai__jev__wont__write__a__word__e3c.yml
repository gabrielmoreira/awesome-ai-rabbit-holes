  summary: Jev is a decision model that returns typed judgments with calibrated probabilities instead of generating text.
  why_it_matters: It lets developers replace brittle LLM text parsing with structured, probabilistic outputs for routing, classification, and triage in code.
  mental_damage: Another promise of 'zero hallucinations' that shifts the burden of correctness from the model to your threshold tuning.
