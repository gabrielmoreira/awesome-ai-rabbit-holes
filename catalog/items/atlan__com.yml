insights:
  summary: An enterprise context layer that unifies business logic, data lineage, and institutional knowledge into a graph for AI agents.
  why_it_matters: It solves the 'issing context' problem by providing agents with the semantic meaning and governance required to act on enterprise data accurately.
  mental_damage: Because apparently, our models are smart, but they still can't figure out what 'evenue' actually means in your specific SQL table.
