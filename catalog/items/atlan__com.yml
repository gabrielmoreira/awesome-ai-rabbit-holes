insights:
  summary: Atlan is an enterprise data governance platform that creates a 'context layer' by unifying business systems, data lineage, and knowledge graphs to make organizational context available to AI agents via an MCP server.
  why_it_matters: It allows developers building enterprise AI agents to stop hardcoding business logic and instead connect their tools to a centralized, governed source of truth for data definitions and company metrics.
  mental_damage: Finally, a way to formally document that 'revenue' actually means 'net ACV minus discounts' so the AI agent can confidently hallucinate the wrong answer with enterprise-grade authority.
  tags:
    - mcp
    - context-engineering
    - enterprise
    - data-governance
    - agents
  confidence: high
curation:
  status: excluded
  reason: While it offers an MCP server integration, the core product is an enterprise data governance and cataloging SaaS (targeting non-technical stakeholders like 'VP of Data') rather than a developer-facing tool, framework, or infrastructure component.
  evidence:
    - Scraped site context describes the product as 'The missing context layer for enterprise AI' targeting business systems, data lineage, and governance for 'humans' and 'domain experts', not developers directly.
    - Inclusion in 'awesome-mcp-servers' is specifically noted as a link to a third-party directory (mcpservers.org/submit) rather than the server being a primary developer tool.
    - The workflow described (Unify, Bootstrap, Collaborate, Activate) is centered on data governance, glossary creation, and certification by business users, not code development.
