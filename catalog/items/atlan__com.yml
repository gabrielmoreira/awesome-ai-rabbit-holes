insights:
  summary: Atlan is an enterprise data catalog and governance platform that acts as a centralized context layer for AI agents, exposing business logic, data lineage, and governance policies via an MCP server.
  why_it_matters: It allows developers building enterprise AI agents to stop hardcoding business definitions and permissions by querying a unified, governed context store instead of rebuilding context for every new use case.
  mental_damage: Finally, a way to solve the problem of AI agents not understanding your business, assuming you were already planning to deploy an enterprise data graph, a context lakehouse, and a dedicated governance team.
  tags:
    - context-engineering
    - mcp
