insights:
  summary: Lindy is an AI teammate that connects to work tools and performs real work like pulling reports, updating CRM, and debugging code via natural language commands.
  why_it_matters: It automates cross-tool workflows that developers and teams manually stitch together today, reducing context-switching and toil.
  mental_damage: Another 'AI coworker' that promises to replace your intern while quietly becoming the new source of alert fatigue.
  tags:
    - ai-agent
    - workflow-automation
    - tool-integrations
  confidence: medium
curation:
  status: included
  reason: Lindy is a general-purpose executive assistant for administrative tasks, not a developer-tooling product focused on coding, IDEs, or AI workflows for software development.
  evidence:
    - Lindy connects to Slack, Gmail, Notion, HubSpot, Zendesk, PostHog, GitHub, Linear, and 1,000+ more tools to execute workflows like debugging ad spend, triaging support tickets, and reconciling finances.
    - It performs multi-agent-like task chains (e.g., pull data → analyze → draft response → file ticket) autonomously after a single user prompt in chat.
    - Appears in awesome-ai-agents under the Lindy section as an AI employee that connects to all tools and does real work for the whole team.
