insights:
  summary: Push To Display is a platform that pushes structured content from AI agents, scripts, or automation tools to programmable display boards on iOS and Android devices via HTTP API, CLI, MCP server, or integrations.
  why_it_matters: It gives developers a simple way to surface real-time data, alerts, or AI agent output on shared physical screens without building custom display infrastructure.
  mental_damage: Finally, a way to make your terminal spam visible to coworkers who still believe in stand-up meetings.
  tags:
    - display
    - mcp
    - automation
    - iot
  confidence: medium
curation:
  status: included
  reason: Push To Display primarily acts as an integration layer that enables AI agents and automation tools to push content to displays, making it an extension rather than a standalone agent or core infrastructure.
  evidence:
    - Ships an MCP server auto-discovered by Claude Code, Cursor, and Codex for AI agent integration
    - Provides GitHub Action, CLI, n8n, and Zapier integrations to push content from automation workflows
    - Core value is pushing structured content from external systems (AI agents, CI/CD, scripts) to shared display boards
