insights:
  summary: Dash is an offline API documentation browser and code snippet manager for macOS and Windows with MCP support for AI integration.
  why_it_matters: It lets developers instantly search local documentation and reuse code snippets without context-switching to the web.
  mental_damage: Another tool promising to save you from browser tabs, while silently adding yet another icon to your menu bar.
  tags:
    - documentation
    - snippets
    - offline
  confidence: high
curation:
  status: excluded
  reason: Dash is primarily a documentation browser and snippet manager, not an AI developer tool; its MCP support is a compatibility feature, not its core identity.
  evidence:
    - Dash provides instant offline access to 200+ API documentation sets, code snippets, and cheat sheets.
    - Dash supports MCP (Model Context Protocol), integrating with AI assistants like Claude or ChatGPT.
    - The product's main value is documentation search and snippet expansion, not AI agent functionality.
