insights:
  summary: Dash is a macOS API documentation browser and code snippet manager that provides instant offline access to 200+ API docsets and integrates with AI assistants via MCP.
  why_it_matters: Its MCP support lets coding agents query up-to-date framework and package documentation directly, reducing hallucinations and the need to context-switch to a browser.
  mental_damage: We have finally built a bridge between a ten-year-old doc browser and LLMs, so your agent can now confidently hallucinate from an offline copy of the Django docs instead of the live site.
  tags:
    - documentation
    - mcp
    - macos
    - snippets
    - offline
  confidence: high
