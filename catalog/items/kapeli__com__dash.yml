insights:
  summary: Dash is a macOS application that provides offline access to over 200 API documentation sets, code snippets, and cheat sheets, with added MCP support for integrating documentation into AI workflows.
  why_it_matters: It gives AI agents like Claude direct access to up-to-date, offline framework documentation via MCP, reducing hallucinations and manual lookups during coding sessions.
  mental_damage: We have finally reached the point where our offline documentation browsers need to be agent-ready, just in case the AI decides it wants to read the React docs without bothering a search engine.
