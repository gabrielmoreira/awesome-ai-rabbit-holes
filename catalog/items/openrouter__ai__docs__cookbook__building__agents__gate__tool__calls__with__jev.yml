insights:
  summary: A recipe for gating tool calls in OpenRouter Agent SDK using Jev decision models to conditionally approve, block, or escalate refund decisions based on ticket context.
  why_it_matters: Shows developers how to replace static human-in-the-loop rules with probabilistic, context-aware checks that reduce unnecessary escalations while maintaining safety.
  mental_damage: Another layer of YAML and TypeScript to debug when the AI decides your refund is ‘sort of’ valid and now you’re on hook for auditing its feelings.
  tags:
    - agent-tool
    - jev
    - human-in-the-loop
    - openrouter
    - decision-gating
  confidence: high
curation:
  status: included
  reason: The core identity is a tool-call gate driven by Jev decision-model judgments, which belongs in decision-models per precedence rule — even though it’s used in an agent, the judgment layer is the product’s reason to exist.
  evidence:
    - The recipe gates tool calls using Jev to return probabilities on whether a refund is justified by ticket evidence, not generated text.
    - It appears in the 'awesome-jev' list under 'Guides and cookbooks' as a Jev-specific decision-model application.
    - "The guide explicitly states: 'Jev fits here because it doesn’t generate text. It reads the state you give it and returns a probability per question.'"
