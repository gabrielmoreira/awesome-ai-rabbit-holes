insights:
  summary: Jevr is a Rust crate providing a Jev-compatible client for interacting with TypeSafe System One decision models.
  why_it_matters: It lets Rust developers query decision models like Jev for probabilistic judgments in agent workflows and tool-call gates.
  mental_damage: Another crate to remember which model speaks in probabilities and which one just hallucinates confidently.
