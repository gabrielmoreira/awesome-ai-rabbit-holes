insights:
  summary: Jev is a decision model from TypeSafe that outputs a probability score (0–1) for typed yes/no questions about text, such as spam or promotional content detection.
  why_it_matters: Developers can use Jev as a low-cost, fast signal in moderation pipelines or agent tools to pre-filter content without invoking full LLMs.
  mental_damage: Another model promising to replace human judgment with a number, while quietly shifting the burden of threshold-tuning onto the developer.
  tags:
    - decision-model
    - content-moderation
    - api
  confidence: high
curation:
  status: included
  reason: Jev’s core identity is a decision model that returns constrained probabilistic answers to typed questions, fitting the decision-models category even though it is used via MCP and evaluated in an evals context.
  evidence:
    - Jev gives a number between 0 and 1 for yes/no questions about text, with no paragraph or chat output.
    - It is used in the validate_post tool to check captions against platform rules via four typed questions.
    - The source-list context places it in the Evaluation & Benchmarking section of awesome-jev, but the product itself is a decision model, not an eval framework.
