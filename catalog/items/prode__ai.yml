insights:
  summary: A code-grounded workspace that generates PRDs, specs, and system context for engineering teams, exposing planning artifacts to coding agents via an MCP server.
  why_it_matters: It anchors product planning in an actual codebase knowledge graph so specs stay aligned with reality and coding agents like Cursor and Claude Code can pull approved context instead of guessing.
  mental_damage: "Just what the modern workflow needed: another layer of ceremony promising that if we plan perfectly enough, the agents will finally stop refactoring our authentication stack at 2 a.m."
