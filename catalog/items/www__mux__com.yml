curation:
  status: excluded
  reason: Mux is a general video infrastructure SaaS platform; despite having an MCP server listed in directories, the core product is not a developer AI tool, agent, or protocol-specific utility, but rather a general media service.
  evidence:
    - Primary page excerpt describes Mux as a 'Video API for developers' focused on streaming, moderation, and analytics.
    - Featured 'Mux Robots' are presented as pre-built AI workflows (summarization, moderation) within a broader video platform, not a standalone AI dev tool.
    - Listed in awesome-mcp-servers only as an 'Official Server', implying MCP is an integration adapter rather than the product's core identity.
