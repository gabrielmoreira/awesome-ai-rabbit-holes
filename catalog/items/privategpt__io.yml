insights:
  summary: A private RAG platform that allows users to query internal data sources like Notion, JIRA, and Slack using secure LLMs.
  why_it_matters: It enables organizations to leverage LLMs on sensitive internal documentation without the risk of leaking data to third-party model providers.
  mental_damage: There is no greater relief than finally trusting an LLM, only to realize you've accidentally indexed your entire company's 'confidential' Slack history.
  tags:
    - rag
    - local-ai
    - privacy
    - knowledge-management
    - security
  confidence: high
curation:
  status: included
  reason: It belongs in local-ai because its primary identity is providing a private, secure environment for LLM interaction, even though it functions as a RAG platform.
  evidence:
    - Claims to be a 'private ChatGPT' for company knowledge.
    - Explicitly states that data won't be used to train AI.
