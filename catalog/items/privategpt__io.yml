insights:
  summary: A private AI tool that connects to company data sources (Notion, JIRA, Slack, GitHub) to enable natural language queries over organizational knowledge.
  why_it_matters: It solves the problem of fragmented internal knowledge by providing a secure, private way to query company data without training on external models.
  mental_damage: Finally, a way to ask 'Where did we bury that decision from 2022?' without digging through Slack archives like a forensic archaeologist.
