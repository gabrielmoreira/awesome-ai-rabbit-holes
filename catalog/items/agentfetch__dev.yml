insights:
  summary: AgentFetch is an MCP-native web fetch server that provides token-budgeted, cached Markdown extraction from URLs for AI agents.
  why_it_matters: It reduces context window waste by converting noisy web pages into LLM-ready Markdown, saving tokens and eliminating per-agent scraper maintenance.
  mental_damage: Another MCP wrapper for a problem solved by copy-pasting into a tokenizer — now with billing tiers and six-hour cache staleness.
  tags:
    - mcp
    - web-fetch
    - token-optimization
  confidence: high
curation:
  status: included
  reason: AgentFetch is an MCP server whose primary identity is exposing web-fetching tools over the Model Context Protocol, making MCP its core product identity rather than a compatibility feature.
  evidence:
    - Product markets itself as an 'MCP-native web scraping & fetch API for AI agents' and provides an MCP server install via pip
    - "Exposes four MCP tools: fetch_url, estimate_tokens, fetch_multiple, and search_and_fetch"
    - Positioned as a 'managed MCP web fetch server' with caching, token budgeting, and auto-routing
