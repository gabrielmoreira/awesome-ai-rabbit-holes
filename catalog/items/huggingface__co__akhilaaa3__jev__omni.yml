insights:
  summary: Jev-Omni is a multimodal decision classifier that outputs probabilities for text, image, audio, and video inputs based on typed questions and options.
  why_it_matters: It provides calibrated, multimodal decision-making via a Jev-style model for use in agent workflows requiring structured judgments over diverse inputs.
  mental_damage: Another model claiming to replace thinking with probabilities, as if uncertainty were just a softmax problem.
  tags:
    - decision-model
    - multimodal
    - je-v
  confidence: high
curation:
  status: included
  reason: Jev-Omni's core identity is a multimodal decision model that answers typed questions with probabilities, fitting the decision-models category despite its Hugging Face model hosting.
  evidence:
    - Model card describes it as 'A multimodal decision classifier for text, images, audio and video. Supply a question and options; receive a probability for each option—not a generated explanation.'
    - Built on Gemma 4 12B IT with fine-tuning on 30,000 questions for decision classification tasks like DecisionBench and JevBench.
    - Listed in awesome-jev under 'Developer projects and integrations' and 'Calibration & Research', indicating community recognition as a Jev-related decision model.
