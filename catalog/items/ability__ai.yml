insights:
  summary: An applied AI lab offering a self-improving cognitive core (Cornelius) and an open-source production runtime (Trinity) for sovereign agentic systems.
  why_it_matters: Provides developers with a production-grade runtime and cognitive core for building and operating self-improving agents that compound knowledge over time.
  mental_damage: Finally, a runtime that promises agents that improve instead of decaying—just don’t ask how many YAML files it takes to configure one.
  tags:
    - agent-runtime
    - self-improving-agents
    - sovereign-ai
    - open-source
    - production-agents
  confidence: high
curation:
  status: included
  reason: The core product is a runtime platform (Trinity) and cognitive core (Cornelius) for coordinating and operating multiple agents in production, fitting the agent orchestration category.
  evidence:
    - Trinity is described as an open-source production runtime for agents, with scheduling, auditing, and sovereign deployment
    - Cornelius is a self-improving cognitive core that compounds knowledge and upgrades agent fleets
    - The platform is positioned as infrastructure for running agentic systems in production, not as a coding assistant or IDE
