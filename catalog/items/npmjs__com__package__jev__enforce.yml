  summary: jev-enforce is a package that provides Jev decision-model judgments for TypeSafe AI's System One model.
  why_it_matters: It lets developers integrate typed decision-model outputs (Choice, Score, Noul/Boolean) into workflows via a Jev-compatible interface.
  mental_damage: Another npm package to install just to get a probability when all you wanted was a yes/no from a model that thinks in spreads, not sentences.
