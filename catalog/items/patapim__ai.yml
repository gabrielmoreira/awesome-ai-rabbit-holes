insights:
  summary: A desktop terminal and workspace manager that orchestrates Claude Code, Codex, and Gemini across multiple local terminals with integrated browser automation, session persistence, and remote mobile access.
  why_it_matters: It provides a unified local control plane for running multiple coding agents in parallel, preserving context and state across sessions without requiring additional API subscriptions.
  mental_damage: We have officially reached the point where the selling point is 'run ten AI agents at once so you can anxiously watch them all fail in different tabs simultaneously.'
  tags:
    - terminal
    - multi-agent
    - session-management
    - claude-code
    - local-first
  confidence: high
curation:
  status: included
  reason: This is an end-user desktop platform for coordinating multiple AI coding agents (Claude, Gemini, Codex) and their state, fitting the user-facing orchestration category rather than being a coding agent itself.
  evidence:
