insights:
  summary: Patapim.ai is a desktop utility that adds multi-project workspaces, voice dictation, remote control, and browser automation to Claude Code and compatible CLI agents.
  why_it_matters: It lets developers run multiple agent sessions in parallel with persistent context and system-level control without leaving the terminal.
  mental_damage: Finally, a way to feel productive while juggling six terminal windows that all think they're the main character.
  tags:
    - cli
    - agent-extension
    - workflow
  confidence: high
curation:
  status: included
  reason: Patapim is an extension that augments Claude Code with system capabilities like computer control and voice input, not a standalone coding agent.
  evidence:
    - Source-list context identifies it as adding 'multi-project workspaces, voice, remote control, live notifications' to Claude Code
    - "Scraped site states: 'Patapim adds everything Claude Code is missing — without taking the terminal away from you'"
    - Features include local API, SDK, and plugin system that register MCP tools in Claude Code sessions
