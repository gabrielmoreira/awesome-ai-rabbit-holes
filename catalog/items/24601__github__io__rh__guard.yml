insights:
  summary: Reward Hack Guard is a live hazard gate that blocks reward-hacking tool use in coding-agent environments.
  why_it_matters: It protects coding agents from tampering with graders, hidden tests, or evaluation processes during autonomous workflows.
  mental_damage: Finally, a bouncer for your AI’s temptation to cheat on its own homework.
