insights:
  summary: >-
    Kilo is an open source AI coding agent that operates across VS Code, JetBrains, CLI, and cloud environments with
    access to 500+ models and local model support.
  why_it_matters: >-
    It gives developers a unified, private, and markup-free AI coding experience across their preferred tools without
    vendor lock-in.
  mental_damage: >-
    Yet another agent promising to be 'the one' for every workflow, adding to the paralysis of choosing which AI to
    trust with your code today.
  tags:
    - ai-agent
    - ide-integration
    - cli-tool
    - open-source
    - multi-model
  confidence: high
curation:
  status: included
  reason: >-
    Kilo functions as a primary coding agent that reads codebases, writes/edit files, and operates across IDEs and CLI
    as its core purpose, fitting the coding-agents category despite being distributed via extensions.
  evidence:
    - >-
      Kilo is described as 'the open source AI coding agent for VS Code, JetBrains, CLI, and Cloud' in both the
      source-list context and scraped site.
    - >-
      It performs core coding tasks like writing, refactoring, debugging, and architecting across multiple developer
      surfaces using a single agent.
    - >-
      The product emphasizes agent modes (Code, Architect, Debug) that directly act on codebases and workflows rather
      than extending another agent.
