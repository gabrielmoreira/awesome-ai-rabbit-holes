insights:
  summary: Fotocopiatrice is a Jev-powered tool that analyzes Italian budget amendments to detect duplicate or similar proposals and identify their likely external authorship.
  why_it_matters: It demonstrates how decision models can automate legislative text analysis to reveal patterns of influence and redundancy in public policy documents.
  mental_damage: "Finally, an AI that confirms what we suspected: our tax money is often spent on copy-pasted legislation written by lobbyists, not legislators."
  tags:
    - decision-model
    - legislative-analysis
    - jev
  confidence: high
curation:
  status: included
  reason: Fotocopiatrice uses a Jev decision model to answer closed questions about legislative texts (e.g., whether an amendment allocates funds to a specific municipality) with probabilistic outputs, making its core identity a decision-model-driven analysis tool rather than a coding agent or general automation.
  evidence:
    - The tool uses the Jev decision model from TypeSafe to analyze budget amendments with closed-question outputs and safety percentages.
    - It is listed in 'awesome-jev' under 'Apps powered by Jev', confirming its identity as a Jev-driven application.
    - The analysis focuses on detecting textual duplication and inferring external authorship through automated reading of 5,082 amendments, a task aligned with judgment-based processing.
