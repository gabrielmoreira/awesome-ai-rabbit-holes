  summary: Grit is a declarative query language and CLI tool for searching and transforming source code at scale.
  why_it_matters: It lets developers automate large-scale migrations, custom linting, and code quality improvements across millions of lines with Rust-powered performance.
  mental_damage: Finally, a way to feel productive while refactoring — until you realize you’ve just built a new lint rule that breaks someone else’s mental model.
