insights:
  summary: Yes/No is a free web demo of the Jev decision model from TypeSafe AI that returns Yes, No, or Maybe answers to typed questions, optionally using live web search.
  why_it_matters: It gives developers a no-signup way to test a decision model’s judgment for routing, triage, or verification tasks in agent workflows.
  mental_damage: Yet another toy demo that makes you wonder if your next production guardrail will be built on a coin-flip API.
  tags:
    - decision-model
    - demo
    - jev
  confidence: high
curation:
  status: included
  reason: YesNo is a hands-on demo of the Jev decision model itself, making the model’s judgment the core product rather than a coding agent, framework, or MCP adapter.
  evidence:
    - Scraped site describes it as 'a free web tool and a hands-on demo of Jev by TypeSafe AI'
    - README excerpt states 'Jev estimates how likely the answer is Yes' and returns constrained Yes/No/Maybe outputs
    - Source-list context places it in awesome-jev under 'Demos & playgrounds' for the Jev System One model
