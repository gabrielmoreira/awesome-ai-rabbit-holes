insights:
  summary: AIPM is a marketplace and CLI for installing versioned agent skills and prompts into Claude Code, Cursor, and Codex.
  why_it_matters: It lets developers share and pin reusable AI agent behaviors like packages, reducing drift and duplication across teams.
  mental_damage: Finally, a way to argue about skill versions instead of just arguing about which prompt wording is 'more correct'.
  tags:
    - ai-skills
    - cli
    - marketplace
    - agent-extensions
  confidence: medium
curation:
  status: included
  reason: AIPM is a registry and CLI for distributing installable agent skills and prompts, making it a content-first marketplace rather than a tool that executes behavior.
  evidence:
    - Marketplace of Claude skills, agent skills, and AI prompts that users install like packages via CLI
    - Primary artifact is installable content (SKILL.md files) that changes agent behavior when added to .claude/skills
    - Listed in awesome-ai-coding-tools under CLI Tools as a marketplace for Claude/Cursor/Codex skills
