insights:
  summary: iletiMerkezi is a Turkish SMS platform providing bulk messaging, SMS API, OTP, email-to-SMS, and developer integrations for business communication.
  why_it_matters: Developers can add SMS capabilities to their applications via documented APIs and SDKs for notifications, authentication, and user engagement.
  mental_damage: Yet another API wrapper promising seamless integration while silently adding yet another credential to manage and another vendor to debug when deliveries fail at 3 AM.
  tags:
    - sms
    - api
    - notifications
    - otp
    - developer-tools
  confidence: high
curation:
  status: excluded
  reason: iletiMerkezi is a general-purpose SMS infrastructure provider whose core offering is telecommunications messaging, not AI-enhanced developer tooling; while it offers APIs for developers, its identity lacks any AI agent, workflow, or tooling component relevant to the catalog’s scope.
  evidence:
    - The platform markets SMS API, OTP, bulk messaging, and enterprise communication solutions with no mention of AI, LLMs, agents, or intelligent features in its core pitch.
    - Developer sections describe standard SDKs and documentation for SMS integration, positioning it as a utility API rather than an AI-powered tool.
    - No evidence of AI-driven features like smart routing, message optimization, or prompt-based campaign generation beyond a single blog post on AI-assisted copywriting.
