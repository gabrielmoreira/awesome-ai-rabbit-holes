insights:
  summary: Audioscrape is a Model Context Protocol server that enables AI assistants to search and access indexed audio content such as podcasts and interviews.
  why_it_matters: It gives developers a standardized way to feed real-time audio search results into AI coding agents, expanding their context beyond text and code.
  mental_damage: Another MCP server promising to fix context limits while developers juggle yet another authentication flow just to ask Claude what a podcast guest said about Rust.
  tags:
    - mcp
    - audio
    - search
  confidence: high
curation:
  status: included
  reason: Audioscrape's core identity is an MCP server exposing audio search and transcription tools, making it a clear fit for the MCP Ecosystem category rather than a coding agent or extension.
  evidence:
    - The project provides an MCP server at mcp.audioscrape.com with 15 tools for searching, retrieving, and transcribing audio content.
    - It is listed in the awesome-mcp-servers directory under 'Official Servers' as an MCP server that lets AI assistants access audio content.
    - The documentation emphasizes MCP-specific details like OAuth 2.1 authentication, resource indicators, and client setup for Claude, Cursor, and ChatGPT.
