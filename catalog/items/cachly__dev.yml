insights:
  summary: A memory layer for AI coding assistants that bootstraps a knowledge base from git history to provide context on past fixes and architectural decisions.
  why_it_matters: It eliminates the need to manually re-explain codebase architecture and past bugs to AI assistants by automatically indexing git history into a causal knowledge graph.
  mental_damage: The dream of never explaining your stack again is only possible if you trust a tool to tell your AI exactly why you made that regrettable architectural choice three months ago.
