  confidence: medium
curation:
  status: included
  reason: Although it is an extension/feature, IntelliCode is a first-party, core AI capability deeply integrated into the Visual Studio and VS Code editor surfaces, making it an editor-native assistant rather than a standalone coding agent or a thin third-party plugin.
  evidence:
    - Scraped site identifies it as 'AI-assisted development capabilities' integrated directly into Visual Studio and VS Code.
    - Features include whole-line autocompletions, IntelliSense ranking, and refactoring assistance within the editor environment.
    - Listed in awesome-ai-coding-tools under the 'Code Completion' section, aligning with editor-native assistance.
