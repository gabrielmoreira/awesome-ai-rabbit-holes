insights:
  summary: Trade It is a non-custodial brokerage integration that lets users draft and confirm stock, options, and crypto trades from Claude, ChatGPT, Discord, or custom channels using their existing brokerage accounts.
  why_it_matters: It enables developers and traders to execute real financial trades through AI interfaces without switching apps or creating new accounts, streamlining workflow between analysis and action.
  mental_damage: Finally, your LLM can lose you money in real time — not just hallucinate it.
  tags:
    - trading
    - brokerage
    - ai-integration
    - finance
    - mcp
  confidence: high
curation:
  status: included
  reason: Trade It's core identity is as an MCP server that exposes brokerage trading capabilities (stocks, options, crypto) over the Model Context Protocol, enabling AI agents like Claude and ChatGPT to interact with financial tools as first-class MCP resources.
  evidence:
    - Trade It explicitly supports MCP as an integration method for embedding trading in products and communities
    - The platform connects major brokerages (Robinhood, Schwab, Coinbase, etc.) to enable trading from AI chat surfaces
    - Trade It emphasizes non-custodial trade drafting and confirmation, positioning itself as a tool layer, not a financial advisor or broker
