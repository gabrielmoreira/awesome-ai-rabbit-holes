insights:
  summary: A crypto market data API that provides aggregated cross-exchange orderflow and derived metrics via MCP or REST with x402 micropayments in USDC.
  why_it_matters: Developers building trading agents can access institutional-grade crypto market microstructure data without managing multiple exchange APIs or paying subscription fees.
  mental_damage: Another pay-per-call crypto API that makes you wonder if your trading bot’s edge is just paying for someone else’s aggregated orderflow.
