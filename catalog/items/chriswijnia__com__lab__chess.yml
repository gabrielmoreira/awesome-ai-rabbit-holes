  summary: An interactive chess board where you play against Jev, a TypeSafe AI decision model, or watch it play itself with visible reasoning.
  why_it_matters: Shows how decision models can be used in turn-based games with transparent reasoning, offering a toy example of AI-assisted gameplay.
  mental_damage: Another reminder that we now need AI to tell us whether to move a knight or resign to existential dread.
