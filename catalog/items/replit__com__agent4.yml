insights:
  summary: Replit's Agent 4 is an AI agent for building, designing, and shipping apps, sites, and other digital products within the Replit platform.
  why_it_matters: It enables developers and teams to collaborate with an AI agent that can design, build, and coordinate tasks in parallel, accelerating the development of full-stack applications.
  mental_damage: Finally, an agent that can turn your napkin sketch into a deployable app while you argue with your team about tabs vs. spaces.
  tags:
    - app-builder
    - ai-agent
    - replit
    - collaboration
    - multi-agent
  confidence: high
curation:
  status: included
  reason: Agent 4's primary value is turning prompts and collaborative input into full applications, sites, and tools within Replit, fitting the app-builder category better than a generic coding agent.
  evidence:
    - Described as Replit's 'fastest, most versatile Agent to date' with pillars like 'Design Freely', 'Build Together', 'Ship Anything', and 'Move Faster'
    - Explicitly supports building apps, sites, decks, mobile apps, and more from prompts in a shared project context
    - Source-list context places it in 'Coding Agents', but its core identity is prompt-to-app generation
