  summary: Agent 4 is Replit's AI coding agent that performs autonomous coding tasks like designing, building, and shipping apps through natural language prompts.
  why_it_matters: It lets developers delegate full-stack app creation to an agent that works in parallel across design, code, and deployment, reducing manual context switching.
  mental_damage: Now you can feel guilty not just for vibing, but for watching an agent vibe for you while you pretend to supervise.
