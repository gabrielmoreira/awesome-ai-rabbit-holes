insights:
  summary: Hollow Creek is a Vercel-hosted interactive simulation where a Jev decision model powers villagers that remember, judge, and react to the player's actions in a persistent village.
  why_it_matters: It demonstrates how decision models like Jev can drive persistent, socially reactive NPCs in game-like environments, offering a pattern for agent memory and judgment in interactive systems.
  mental_damage: Watching your lies propagate through a gossip network of probabilistic villagers feels less like gameplay and more like debugging a production reputation system.
  tags:
    - decision-model
    - simulation
    - jev
  confidence: medium
curation:
  status: included
  reason: The product's core identity is the Jev decision model driving villager judgments and memory, fitting decision-models as it centers on typed questions with probabilistic outputs rather than coding tasks or app generation.
  evidence:
    - The simulation uses Jev to answer typed questions about villager reactions, memory, and intentions, returning probabilities and confidence scores.
    - It appears in the awesome-jev list under 'Games & simulations' as a project built on Jev, TypeSafe AI's System One model.
    - "The README-style excerpt shows Jev processing actions like 'T talk' or 'G give' and returning structured judgments (e.g., 'Mood toward you: neutral 2.0', 'Feels threatened: probability of yes –')."
