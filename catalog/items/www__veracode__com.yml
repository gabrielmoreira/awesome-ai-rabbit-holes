insights:
  summary: Veracode is an enterprise application security platform that scans code for vulnerabilities and uses AI to automate remediation across the software development lifecycle.
  why_it_matters: It offers AI-driven code fixes and SAST/DAST scanning that integrate directly into developer workflows to catch security flaws in both human and AI-generated code earlier.
  mental_damage: Now you can add 'waiting for the AI to fix the AI's security holes' to your list of existential workflow ironies.
  tags:
    - security
    - sast
    - enterprise
    - remediation
  confidence: high
curation:
  status: excluded
  reason: Excluded because Veracode is a broad enterprise application security platform (SaaS) rather than a developer-facing AI coding tool, agent, or infrastructure component.
  evidence:
    - Scraped site context describes it as an 'Application Risk Management Platform' with SAST, DAST, and SCA, not a coding assistant.
    - Core features include 'Risk Manager (ASPM)' and 'Security Training', which are enterprise compliance functions rather than developer tooling.
    - Although listed under 'Code Review and Refactoring' in an awesome list, the primary product identity is SDLC security compliance, not AI coding assistance.
