insights:
  summary: ask-jev is a Windows PowerShell hook for Codex that audits agentic coding sessions by querying the Jev decision model for probabilistic yes/no judgments.
  why_it_matters: It lets developers get automated, data-informed feedback on agent behavior without adding friction to their Codex workflow.
  mental_damage: Yet another layer of AI watching your AI watch your code, just in case the vibes were off.
  tags:
    - decision-model
    - codex-hook
    - jev
    - audit
  confidence: high
curation:
  status: included
  reason: ask-jev's core identity is invoking the Jev decision model to return probabilistic judgments on agentic sessions, making it a decision-model tool rather than a coding agent or extension.
  evidence:
    - The README states it 'utilizes Jev, the RLCD-type model provided by TypeSafe AI, to independently and cheaply judge agentic coding sessions'
    - It sends selected conversation and instructions to TypeSafe for Jev inference and returns probabilities, not generated explanations
    - It installs as a Codex hook via UserPromptSubmit to trigger audits without starting a model turn
