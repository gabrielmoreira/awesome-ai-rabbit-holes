  status: included
  reason: The product's core identity is tracing and measuring agent behavior to improve performance, which falls squarely under the Evals category.
  evidence:
    - Claims to 'clarify the messiness of agent behaviour'
    - Features tracing, custom metrics, and instrumentation
    - Focuses on identifying failure modes and improving performance through iteration
