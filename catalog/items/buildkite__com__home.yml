  reason: Buildkite is a general-purpose CI/CD platform with AI workflow support, not a developer-facing AI tool, agent, or infrastructure primarily designed for coding tasks or AI-assisted development.
  evidence:
    - Repo description is missing, but scraped site positions Buildkite as 'The fastest CI for AI workflows at scale' and a platform for 'Building the CI/CD workflows you need'.
