curation:
  status: excluded
  reason: EduBase is a general-purpose online learning and exam platform (LMS) for businesses and schools, not a developer tool; its inclusion in awesome-mcp-servers appears to be for an integration endpoint rather than an MCP infrastructure product, and it lacks the developer-facing tooling identity required for this catalog.
  evidence:
    - The scraped site context describes a 'Customizable Online Learning & Exam Platform' for customers, employees, and students, not developers.
    - Primary features highlighted are quizzing, cheating detection, SCORM support, and branding, which are LMS features rather than coding tools.
    - Mentioned in awesome-mcp-servers, but the product itself is a SaaS platform with an 'EduBase MCP server' as a compatibility feature, not an MCP-first toolkit.
