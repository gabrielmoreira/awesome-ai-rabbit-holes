curation:
  status: excluded
  reason: While it provides an MCP server, the core product is a general-purpose e-learning SaaS for education and compliance, not a developer-facing tool for coding, infrastructure, or app building.
  evidence:
    - Primary product is an online learning platform for customers, employees, and students, not a developer tool.
    - AI features are limited to generating quiz questions from documents, not assisting with coding or development workflows.
    - Appears in awesome-mcp-servers only as a listed server implementation for a non-developer product.
