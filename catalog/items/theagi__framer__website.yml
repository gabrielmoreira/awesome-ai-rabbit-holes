insights:
  summary: AGI, Inc. is a consumer-focused AI lab promoting AGI-0, an on-device action AI for phones and computers that performs cross-app tasks via screen understanding.
  why_it_matters: It demonstrates edge-agent concepts that could inspire developer tools for private, context-aware automation across applications.
  mental_damage: Another 'superintelligence' pitch that conflates consumer convenience with developer infrastructure, adding noise to the already crowded agent space.
  tags:
    - agent
    - edge-ai
    - automation
  confidence: high
