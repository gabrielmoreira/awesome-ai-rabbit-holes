  status: included
  reason: Rivestack is a developer-facing infrastructure product providing managed PostgreSQL with pgvector as a building block for AI applications, which fits as a code-first infrastructure component rather than a broader platform play.
  evidence:
    - Listed in Awesome-LLMOps under Search > Vector search as a dedicated pgvector hosting solution
