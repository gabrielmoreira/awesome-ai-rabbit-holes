insights:
  summary: pgjev is a PostgreSQL extension that adds SQL functions for natural-language filtering, classification, scoring, and choice via the Jev decision model.
  why_it_matters: It lets developers query and manipulate database rows using plain English conditions instead of writing complex SQL or application-layer logic.
  mental_damage: Finally, a way to replace your CASE statements with vibe-based database queries that cost fractions of a cent per scan.
  tags:
    - postgres
    - sql
    - decision-models
    - jev
  confidence: high
curation:
  status: included
  reason: pgjev's core identity is exposing the Jev decision model as SQL functions for probabilistic judgments, making it a decision-model tool rather than a coding agent, framework, or extension.
  evidence:
    - "Scraped site context: 'jev() returns a boolean, a probability, a rubric score or a class per row. No embeddings, no index.'"
    - "README excerpt: 'The core job is answering typed questions with probabilities: classification, routing, triage, scoring, ranking, verification, or guardrails.'"
    - "Source-list context: listed in awesome-jev under Integrations for Jev, a TypeSafe AI System One model."
