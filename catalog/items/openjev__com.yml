insights:
  summary: OpenJev (SemIf) is a browser-based experiment that runs local decision models like Qwen3 and MiniCPM to compute conditional probabilities for constrained choices using logits or token-by-token JSON generation.
  why_it_matters: It lets developers test and compare decision model inference strategies entirely client-side, enabling private, low-latency prototyping of typed-question systems without backend dependencies.
  mental_damage: Another locally quantized model demo that makes you feel like you're cracking the AGI code while just measuring softmax over three options in your lunch break.
  tags:
    - decision-models
    - browser
    - local-ai
  confidence: high
curation:
  status: included
  reason: OpenJev's core identity is a local decision model runner that exposes Jev-style typed-question inference in the browser, matching the decision-models category's focus on local serving and gateways for System One models.
  evidence:
    - Scraped site describes it as 'Run typed option logits and autoregressive JSON locally with open models and WebGPU' and 'Semantic ifs from open models, in your browser'
    - Source-list context shows it appears in awesome-jev under 'Benchmarks & research' as a project built on Jev (TypeSafe AI's System One model)
    - "README excerpt emphasizes local model execution: 'Weights come from Hugging Face and remain in your browser cache. Inputs never leave this page.' and compares direct logit readout vs token-by-token JSON generation for decision output"
