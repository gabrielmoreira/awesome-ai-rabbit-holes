insights:
  summary: A desktop and SaaS tool that connects to SQL databases so users can query, visualize, and build dashboards using natural language instead of writing SQL.
  why_it_matters: It lets engineering teams offload ad-hoc internal data requests to non-technical staff by embedding a conversational interface directly over production databases.
  mental_damage: We have successfully automated away the need to learn SQL, meaning the new job description is just 'person who nervously approves AI-generated SELECT statements on a production replica.'
  tags:
    - bi
