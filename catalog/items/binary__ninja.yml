curation:
  status: excluded
  reason: Binary Ninja is a traditional reverse engineering and security analysis platform; its AI features are secondary accelerators, and it lacks the MCP server identity required for inclusion via the awesome-mcp-servers list.
  evidence:
    - The scraped site describes it as a 'modern reverse engineering platform with a scriptable and extensible decompiler', not an MCP tool.
    - The source list entry in awesome-mcp-servers merely references the tool, but the product itself is a standalone binary analysis suite, not MCP infrastructure.
    - The primary workflow is reverse engineering and debugging binaries, which falls outside the catalog's focus on AI coding agents, app builders, and developer AI infrastructure.
