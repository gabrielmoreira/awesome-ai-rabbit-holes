insights:
  summary: Scorable is an LLM evaluation platform for building and calibrating custom LLM-as-a-judge evaluators to monitor AI apps in production.
  why_it_matters: It gives developers a way to produce independent, versioned evidence of AI behavior for compliance, quality, and upgrade safety.
  mental_damage: Finally, a tool that makes AI reliability feel less like vibe-coding and more like admitting your agents need supervision.
  tags:
    - evals
    - llm-judges
    - ai-auditing
  confidence: high
curation:
  status: included
  reason: Scorable's core identity is measuring and scoring AI agent behavior through customizable LLM-as-a-judge evaluators, which matches the evals category's focus on measuring model/prompt/agent behavior rather than being an agent itself.
  evidence:
    - "Scorable is an LLM evaluation platform: build and calibrate custom LLM-as-a-judge evaluators, run experiments, and monitor AI apps in production with independent, verifiable evidence."
    - It provides calibrated AI judges that find failures and weaknesses in agents to make them invincible.
    - Use cases include organization-specific rules compliance, agent quality optimization, agent self-optimization via learning loops, and safe model/prompt upgrades.
