  summary: Typed primitives for interacting with TypeSafe AI's System One decision models.
  why_it_matters: It replaces unpredictable LLM prose with structured, probabilistic, and typed answers that can be directly composed in application logic.
  mental_damage: A new way to achieve the illusion of certainty by turning model uncertainty into a perfectly typed floating-point number.
