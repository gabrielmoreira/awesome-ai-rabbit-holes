insights:
  summary: Agent Skill is a reusable skill pack that gives AI coding agents full context on the TypeSafe API for structured evaluation workflows.
  why_it_matters: It lets developers offload API-specific judgment to their coding agent, reducing boilerplate when working with TypeSafe's evaluation system.
  mental_damage: Another skill to install, another prompt to remember, and yet another layer of abstraction between you and actually writing code.
  tags:
    - agent-skills
    - typesafe
    - prompt-context
  confidence: high
curation:
  status: included
  reason: Agent Skill is a portable skill pack designed to be installed into coding agents like Claude Code or Codex to extend their behavior with TypeSafe-specific knowledge, fitting the Agent Skills category's definition of installable content that changes agent behavior.
  evidence:
    - The product is described as a 'Drop-in skill for Claude Code, Codex, and other agent environments' and provides installable skill content via npx skills or Claude plugin marketplace.
    - The core artifact is a skill pack (SKILL.md and reference files) that users copy into their agent's skills directory to change behavior, not an executable tool or standalone agent.
    - It appears in the awesome-jev list under 'Official SDKs and tools' as a drop-in skill, reinforcing its identity as installable content rather than a platform or framework.
