curation:
  status: included
  reason: The project's core identity is a decision model (Jev) designed for typed questions with probabilistic outputs, not text generation, and it is positioned as a System One model for routing and classification.
  evidence:
    - The model is described as a 'System One Model' that only decides/classifies/routes/scores.
    - It is trained via RLCD (calibrated decisions) and optimized for decisions, not text generation.
