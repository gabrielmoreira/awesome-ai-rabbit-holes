insights:
  summary: Voyager is an LLM-powered embodied lifelong learning agent in Minecraft that explores, acquires skills, and makes discoveries without human intervention.
  why_it_matters: It demonstrates how LLMs can drive autonomous agents to solve complex, open-ended tasks through iterative prompting and skill composition.
