insights:
  summary: Jev sites is a Vercel-hosted directory of judgment tools built on the Jev decision model, each returning typed decisions via text input.
  why_it_matters: It offers developers a gallery of domain-specific decision gates (e.g., support routing, ICP scoring) that demonstrate how Jev can be applied to structured judgment tasks.
  mental_damage: Another reminder that the future of AI tooling is less about writing code and more about pasting prompts into someone else’s Vercel app to get a yes/no from a black-box scorer.
  tags:
    - decision-tools
    - jev
    - vercel
    - demo-gallery
  confidence: high
curation:
  status: excluded
  reason: The site is a demonstration directory of applications built on Jev, not a standalone developer tool; it showcases use cases but does not itself perform coding, decision modeling, or workflow automation for developers.
  evidence:
    - The site hosts 'Eleven judgment sites' each as a path on jev-projects.vercel.app, offering tools like Triage Desk, Lead Fit, and Clause Finder.
    - It is listed in the source list 'awesome-jev' under the section 'Demos & playgrounds', indicating its role as a showcase rather than a tool.
    - The primary function is to return typed decisions from pasted text via the Jev model, but the site itself does not expose Jev as an API, SDK, or integratable service for developer workflows.
