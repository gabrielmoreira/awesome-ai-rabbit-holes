insights:
  summary: 水产市场 (Seafood Market) is a community hub for discovering and sharing skills, plugins, triggers, and communication adapters to extend Agent capabilities.
  why_it_matters: It provides a centralized marketplace for developers to enhance their AI agents with reusable components and integrations.
  mental_damage: Yet another agent app store promising infinite evolution while developers just want their code to stop breaking.
  tags:
    - agent-ecosystem
    - skills-marketplace
    - mcp-integrations
  confidence: medium
curation:
  status: included
  reason: The platform primarily distributes reusable skill packs, plugins, and experience collections for agents, making it a registry/directory of installable content rather than a standalone agent or framework.
  evidence:
    - Source-list context shows it's categorized under '技能 Skills' in awesome-LLM-resources as a place to '探索、分享技能、经验/集合、插件、触发器和通信器'
    - Scraped site describes featured assets including '技能' (Agent-learnable skill packages), '插件' (code-level extensions), and '经验/集合' (practice solutions and configuration ideas)
    - Primary value proposition is enabling agents to '加入无限进化' through discovery and installation of community-contributed capabilities
