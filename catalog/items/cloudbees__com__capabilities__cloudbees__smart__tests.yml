insights:
  summary: Launchable is CloudBees Smart Tests, an AI-powered test selection and flaky test detection service that reduces CI test execution time by running only relevant tests per code change.
  why_it_matters: It saves developers CI time and compute by intelligently prioritizing tests and reducing flaky failure noise in existing pipelines.
  mental_damage: Finally, an AI that doesn't write code but instead decides which of your already-too-many tests you can safely ignore.
  tags:
    - testing
    - ci-cd
    - ai
  confidence: high
curation:
  status: included
  reason: Launchable fits Evals because its core function is measuring, tracing, and optimizing test behavior—identifying flaky tests and predicting test relevance—rather than generating or editing code.
  evidence:
    - AI-powered test intelligence that cuts test execution time up to 80% by running only relevant tests
    - Analyzes test behavior across pipelines to identify flaky tests, long-running tests, and reliable tests
    - AI-powered classification groups failures, surfaces patterns, and brings relevant history into one place for faster triage
