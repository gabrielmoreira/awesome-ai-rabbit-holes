insights:
  summary: laya.tools is a directory showcasing 1810+ open-source projects built on the Laya decision model, including ports, agents, APIs, and demos.
  why_it_matters: It helps developers discover real-world implementations of Laya for local, typed-decision AI in routing, agents, and tooling.
  mental_damage: Another directory promising 'everything built on X' — as if the world needed yet another taxonomy of niche model ports to feel productive.
  tags:
    - directory
    - decision-models
    - showcase
  confidence: high
curation:
  status: excluded
  reason: laya.tools is a curated directory of projects using Laya, not a developer-facing AI tool itself; it lacks autonomous functionality and serves only as a discovery index, which falls outside the catalog's scope for active tooling.
  evidence:
    - The site describes itself as 'The directory of 1810+ open-source projects built on Laya' and emphasizes browsing and showcasing projects.
    - It provides no coding agent, framework, SDK, or tooling — only links to external repos and demos hosted elsewhere.
    - Appears in awesome-jev under 'Related lists' and 'Full list > Related Practices / Discussions', confirming its role as a directory, not a primary tool.
