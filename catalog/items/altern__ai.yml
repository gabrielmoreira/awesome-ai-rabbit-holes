  summary: Altern is a general AI tools directory and discovery platform with categories, curated lists, and search for AI products across many domains.
  why_it_matters: It helps developers discover AI tools by aggregating them in one searchable directory with categorization and user submissions.
  mental_damage: Another AI tool directory promising to be the 'one place for all things AI' while adding to the infinite scroll of tool discovery fatigue.
