insights:
  summary: Google Antigravity is an agentic development platform offering a CLI, IDE, SDK, and extensions for building with AI agents.
  why_it_matters: It provides a unified local-first environment for developers to orchestrate and interact with autonomous coding agents across multiple workflows.
  mental_damage: Yet another 'agent-first' platform promising liftoff while developers just want their PRs reviewed.
  tags:
    - agent-platform
    - cli
    - ide
    - sdk
  confidence: medium
curation:
  status: included
  reason: Google Antigravity positions itself as a primary agentic development platform with autonomous coding agents, IDE, and CLI — its core identity is performing coding tasks, not extending another agent or orchestrating multiple agents.
  evidence:
    - Described as 'an agentic development platform, allowing anyone to build in the agent-first era' with products like Antigravity 2.0, CLI, IDE, and SDK
    - Antigravity IDE is a 'fully-featured, agentic IDE' with agent manager and deep codebase understanding
    - Antigravity CLI enables 'running autonomous coding agents, executing shell commands, and managing background subagents' from the terminal
