curation:
  status: excluded
  reason: Harness is a desktop client for interacting with AI agents (likely via Jev or similar) but does not itself perform coding tasks, make decisions, or extend agent behavior—it’s a frontend layer without core AI tooling identity.
  evidence:
    - The scraped site context describes Harness as a downloadable desktop app for macOS and Linux with no mention of coding, decision-making, or agent extension capabilities.
    - It is listed in 'awesome-jev' under 'Community projects > Apps powered by Jev', indicating it is a Jev-powered app, not a decision model, agent, or developer tool in its own right.
    - The primary value is installation and UI access, not any developer-facing AI functionality like code editing, prompt engineering, or workflow automation.
