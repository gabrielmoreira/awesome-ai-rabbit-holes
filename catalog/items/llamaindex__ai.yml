insights:
  summary: LlamaIndex is a framework SDK for building AI-powered applications with retrieval-augmented generation and document processing capabilities.
  why_it_matters: It lets developers import and program against a library to add document understanding, indexing, and retrieval to their AI apps without building those systems from scratch.
  mental_damage: Yet another ‘all-in-one’ AI framework that promises to simplify RAG while quietly adding another layer of YAML, abstractions, and version drift to your stack.
  tags:
    - ai-frameworks
    - rag
    - document-processing
  confidence: high
curation:
  status: included
  reason: LlamaIndex is a code-first SDK developers import and program against to build AI applications, with retrieval and document processing as core modules, making it a clear fit for Frameworks & SDKs.
  evidence:
    - Awesome list sources categorize LlamaIndex under 'AI Frameworks and SDKs' and 'Developer tools'
    - Scraped site shows product identity as LlamaIndex with LlamaParse as a document processing product, not the core framework
    - README and site emphasize LlamaIndex as a platform for building AI agents via indexing, retrieval, and workflows
