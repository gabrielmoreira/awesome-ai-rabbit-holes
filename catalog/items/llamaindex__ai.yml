insights:
  summary: LlamaParse is a cloud and local document parsing service that uses vision-language models and agentic workflows to convert complex PDFs, images, and office documents into structured, LLM-ready outputs.
  why_it_matters: It handles the messy reality of tables, charts, and handwritten notes so developers can stop writing fragile regex parsers and start building RAG pipelines that actually work on real-world documents.
  mental_damage: We have successfully automated the soul-crushing task of reading PDFs, only to create a new class of engineer whose entire job is prompt-tuning the OCR that replaced the intern.
  tags:
    - agentic
    - document-parsing
    - llm-ready
    - ocr
    - rag
  confidence: high
curation:
  status: included
  reason: The product is a developer-facing toolkit and API for parsing and indexing documents to feed into LLM workflows, fitting the code-first building block definition of Frameworks & SDKs.
  evidence:
    - Product description identifies LlamaParse as agentic OCR for processing complex documents (scraped site context).
    - Offers LiteParse as an open-source, local parsing option via npm install @llamaindex/liteparse (scraped site context).
    - Listed in awesome-ai-coding-tools under 'AI Frameworks and SDKs' due to its indexing and retrieval capabilities (source-list context).
