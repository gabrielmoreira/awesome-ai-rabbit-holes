insights:
  summary: A CUDA-native inference engine designed to run open models like Qwen3.5 as high-speed, typed decision models using the Jev System One wire format.
  why_it_matters: It enables extremely low-latency, non-autoregressive decision-making—such as classification, scoring, and routing—by bypassing the standard text-decoding loop.
  mental_damage: Because why use a general-purpose LLM for reasoning when you can optimize a specialized CUDA kernel to tell you if a customer is angry in 30 milliseconds?
  tags:
    - cuda
    - decision-models
    - inference-engine
    - qwen
    - system-one
  confidence: high
curation:
  status: included
  reason: The project's primary identity is a high-performance engine for executing the Jev decision-model protocol, prioritizing typed outputs over generative text.
  evidence:
    - Specifically designed for 'System One' workloads (state in, typed answers out)
    - Implements Jev's wire format (Choice, Score, Noul) to avoid text decoding
    - Optimized for Qwen3.5 using hand-written CUDA kernels for local GPU execution
