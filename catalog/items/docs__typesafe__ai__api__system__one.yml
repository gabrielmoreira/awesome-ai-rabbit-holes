insights:
  summary: An API that returns probabilistic, structured answers to typed questions based on a provided state.
  why_it_matters: It allows developers to implement reliable routing, classification, and guardrails using model judgments without the unpredictability of generative text.
  mental_damage: Because nothing says 'production-ready' like replacing LLM creativity with a probability score.
  tags:
    - decision-models
    - api
    - structured-output
    - typesafe-ai
  confidence: high
curation:
  status: included
  reason: The product's core identity is a decision model that returns constrained, typed answers (Choice, Score, Noul) with associated probabilities rather than text.
  evidence:
    - API documentation specifies input of 'questions' with types like 'noul' and returns 'answers' with probability scores.
    - Explicitly identified in documentation and source lists as the 'System One' model from TypeSafe.
    - Provides structured response formats (Choice, Score, Noul) designed for programmatic decision-making.
