insights:
  summary: System One Router is a benchmark comparing routing decisions of multiple decision models on 80 labelled prompts.
  why_it_matters: It lets developers evaluate which decision model minimizes cost or maximizes accuracy for routing tasks in agent workflows.
  mental_damage: Another benchmark to stare at while your agent keeps sending simple queries to the most expensive model anyway.
