    - test-maintenance
  confidence: high
curation:
  status: included
  reason: Checksum functions as an autonomous coding agent focused on test generation, execution, and self-healing, making it a coding agent whose primary output is test code rather than a general-purpose assistant or extension.
  evidence:
    - Checksum generates, runs, and maintains end-to-end tests automatically using specialized AI agents.
    - It operates continuously in the background, detecting failures and opening PRs with auto-healed test fixes without human prompting.
