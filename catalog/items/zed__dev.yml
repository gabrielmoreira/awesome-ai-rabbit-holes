insights:
  summary: Zed is a modern, collaborative code editor built for high-performance software development with AI-powered features.
  why_it_matters: It matters because it reimagines the editor as a real-time collaborative environment with native AI assistance, reducing context-switching and friction in coding workflows.
  mental_damage: It creates the anxiety of yet another editor to learn, promising seamless AI collaboration while quietly reinforcing the idea that your current setup is inadequate.
  tags:
    - editor
    - ai-assistant
    - collaboration
  confidence: high
curation:
  status: included
  reason: Zed qualifies as a coding agent because it integrates AI as a core assistant that actively helps write, edit, and understand code within the editor, going beyond passive suggestions to interactive coding support.
  evidence:
    - Zed's README and site emphasize AI pair programming, contextual code understanding, and in-editor agent interactions as central features.
    - It is listed in 'awesome-ai-coding-tools' under 'Code Editors and Assistants', indicating recognition as an AI-enhanced development environment.
    - Unlike general IDEs, Zed positions AI not as an add-on but as a foundational layer for real-time collaboration and code manipulation.
