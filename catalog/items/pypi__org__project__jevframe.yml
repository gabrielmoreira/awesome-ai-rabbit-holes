insights:
  summary: Jevframe is a decision-model-based tool built on TypeSafe AI's Jev (System One) model for typed probabilistic judgments.
  why_it_matters: It provides developers with a deterministic decision layer for routing, scoring, or guardrails in agent workflows without relying on generative model outputs.
  mental_damage: Another layer to debug when your agent keeps choosing the wrong tool because the probabilities don't add up.
  tags:
    - decision-models
    - jev
    - typed-judgments
  confidence: medium
curation:
  status: included
  reason: Jevframe is built on and exposes the Jev decision model via a PyPI package, making it a developer-facing SDK for calling typed probabilistic judgments, which aligns with decision-models' core purpose.
