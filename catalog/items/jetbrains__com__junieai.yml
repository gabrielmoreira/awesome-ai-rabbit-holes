insights:
  summary: Junie is a JetBrains AI coding agent that works in the terminal or IDE to plan, write, edit, and test code using any model via Bring Your Own Key.
  why_it_matters: It lets developers delegate coding tasks to an agent that runs locally or in CI/CD while staying within JetBrains' ecosystem and security boundaries.
  mental_damage: Finally, an AI agent that makes you feel guilty for not reviewing its PRs while you're on vacation.
  tags:
    - ai-agent
    - jetbrains
    - cli
    - ide-integration
    - byok
  confidence: high
curation:
  status: included
  reason: Junie is positioned as a standalone AI coding agent that performs planning, editing, testing, and reviewing code across terminal and IDE environments, fitting the core definition of a coding agent rather than an extension or framework.
  evidence:
    - "Product description: 'The most cost efficient coding agent' and 'AI Coding Agent'"
    - Claims to 'plan, write, edit, review, test, and repair code' via terminal, IDE, GitHub, GitLab
    - Offers Junie CLI for direct terminal use and 'Air in IDEs' for IDE integration
    - Supports autonomous workflows with 'Live Prompting', 'Human in the Loop', and 'Remote Control' via CLI + web monitoring
    - Structured planning (.junie/plans) and model-agnostic execution (BYOK, local models)
