insights:
  summary: Jevinik is a decision-model-powered terminal tool that analyzes US and European stocks using live Valyu evidence and returns structured 30-day outlooks via Jev evaluation.
  why_it_matters: It gives developers a direct way to query financial decision models for structured, evidence-backed equity analysis without leaving the terminal.
  mental_damage: Finally, a tool that lets you outsource your stock anxiety to a judgment model while pretending it's productive work.
