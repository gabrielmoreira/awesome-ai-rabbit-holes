insights:
  summary: Crafty Controller is a self-hosted web-based Minecraft server manager for local and remote administration.
  why_it_matters: Provides developers and sysadmins with an open-source tool to run and manage Minecraft servers without relying on cloud services.
  mental_damage: Finally, a way to automate your griefing prevention stack so you can focus on more important things like explaining why the server keeps crashing.
  tags:
    - self-hosted
