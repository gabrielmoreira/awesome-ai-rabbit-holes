curation:
  status: excluded
  reason: Crafty Controller is a Minecraft server management tool with no AI integration, agent behavior, or developer-facing AI workflow, placing it outside the catalog's scope of practical AI tools for software developers.
  evidence:
    - The tool is described as a 'cross platform minecraft server controller' with no mention of AI, agents, LLMs, or automation in its functionality.
    - Its core features include starting/stopping servers, managing players, editing files, and backups — all standard server admin tasks without AI augmentation.
    - It is positioned as a self-hosted web interface for Minecraft server control, not as a developer tool, AI assistant, or workflow enhancer for coding or agent orchestration.
