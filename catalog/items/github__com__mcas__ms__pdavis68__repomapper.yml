insights:
  summary: RepoMapper is an MCP server that provides file system access for Continue via the Model Context Protocol.
  why_it_matters: It lets Continue and similar AI coding agents read and navigate local codebases through a standardized MCP interface.
  mental_damage: Another MCP server to glue together the growing stack of agent-tooling adapters we now need just to let AI see our own files.
  tags:
    - mcp
    - continue
    - file-system
  confidence: medium
