insights:
  summary: Jev Filter is a semantic filtering tool that reduces agent tool context by converting retrieved records into typed evidence packets with recoverable originals.
  why_it_matters: It cuts the noise fed to AI agents by up to 97%, letting them focus on relevant evidence without losing traceability to source data.
  mental_damage: Another layer to insert between your agent and reality, because apparently even filtering needs its own MCP-compatible CLI and benchmarks.
  tags:
    - semantic-filtering
    - context-reduction
    - evidence-packets
  confidence: high
curation:
  status: included
  reason: Jev Filter’s core identity is a decision model that outputs typed judgments (Choice/Score/Noul) on retrieved data, making it a judgment tool rather than a coding agent or extension.
  evidence:
    - Returns compact, typed evidence packets with source IDs and review cases based on semantic judgment against task context
    - Described as screening 'retrieved search results, code candidates and logs' to return 'compact, typed evidence packets'
    - Positioned as making 'repeated judgments' so the 'primary agent plans, reasons and writes'
