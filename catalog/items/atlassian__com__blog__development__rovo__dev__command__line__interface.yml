insights:
  summary: Rovo Dev CLI is an Atlassian-powered command-line AI agent that understands, writes, and edits code while integrating with Jira, Confluence, and Bitbucket.
  why_it_matters: It lets developers perform end-to-end coding tasks — from issue to PR — without leaving the terminal, reducing context switching in enterprise workflows.
  mental_damage: Finally, an AI agent that asks for your Jira ticket number before it starts refactoring your legacy monolith.
  tags:
    - cli-agent
    - atlassian
    - enterprise-dev
  confidence: high
curation:
  status: included
  reason: Rovo Dev CLI is a standalone coding agent that performs autonomous code understanding, generation, and editing in the terminal, with deep Atlassian integration as a feature, not the core identity.
  evidence:
    - The tool transforms the command line into an intelligent development agent that understands, codes, and collaborates with you.
    - It performs code navigation, generation, refactoring, testing, and debugging directly in the terminal.
    - It integrates with Jira, Confluence, and Bitbucket via MCP servers to complete work items end-to-end without context switching.
