insights:
  summary: Rovo Dev CLI is Atlassian's command-line AI coding agent that integrates with Jira, Confluence, and Bitbucket to perform coding tasks in the terminal.
  why_it_matters: It enables developers to offload coding workflows like code navigation and feature implementation directly from their terminal while staying within the Atlassian ecosystem.
  mental_damage: Another AI agent promising to eliminate context switching—while locking you deeper into a single vendor's toolchain.
  tags:
    - cli-agent
    - atlassian
    - jira-integration
  confidence: medium
curation:
  status: included
  reason: Rovo Dev CLI is positioned as a primary coding agent that performs autonomous coding tasks in the terminal, aligning with the coding-agents category's focus on agents that act on code.
  evidence:
    - Rovo Dev CLI transforms the command line into an intelligent development agent that understands, codes, and collaborates with you
    - It performs code understanding, navigation, development acceleration, and integrates with Jira, Confluence, and Bitbucket from the terminal
    - It achieves a 41.98% resolve rate on SWE-bench full benchmark, demonstrating real-world code editing capabilities
