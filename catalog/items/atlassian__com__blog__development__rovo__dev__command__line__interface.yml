insights:
  summary: "Rovo Dev CLI is an enterprise-focused AI coding agent from Atlassian that runs in the terminal, integrates with Jira, Confluence, and Bitbucket, and scores #1 on the SWE-bench full benchmark."
  why_it_matters: It offers terminal-native repo work backed by enterprise permission controls, Atlassian ecosystem integration, and a top-tier SWE-bench score for real-world issue resolution.
  mental_damage: You can now watch a corporate AI agent with memory files and role-based permissions refactor your code while politely updating Jira tickets you were hoping to ignore.
  tags:
    - atlassian
    - cli
    - coding-agent
    - enterprise
    - swe-bench
  confidence: high
curation:
  status: included
  reason: The product is a standalone AI coding agent that runs in the terminal, reads and edits code, and coordinates repo work, matching the coding-agents identity rather than an extension or integration layer.
  evidence:
    - "Blog states: 'Rovo Dev CLI turns your command line into an intelligent development agent that understands, codes, and collaborates with you.'"
    - Capabilities include code understanding, AI-assisted completion, refactoring, testing, debugging, and repo editing directly in the terminal.
    - "Achieves #1 on SWE-bench full benchmark and integrates with Jira, Confluence, and Bitbucket as part of its core workflow."
