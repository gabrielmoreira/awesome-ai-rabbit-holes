insights:
  summary: Wassenger is a WhatsApp Business API platform that provides shared team inboxes, AI-powered messaging via Claude or ChatGPT, and workflow automation for sales, support, and operations teams.
  why_it_matters: It lets developers and teams integrate AI assistants directly into WhatsApp workflows using REST APIs, webhooks, and MCP servers to automate customer communication without building custom infrastructure.
  mental_damage: Another ‘AI-native’ layer on top of WhatsApp that promises to finally make team inboxes sane — until you realize you’re now managing AI agents *and* human agents across yet another SaaS dashboard.
  tags:
    - whatsapp
    - mcp
    - ai-assistant
    - business-api
    - team-inbox
  confidence: high
curation:
  status: included
  reason: Wassenger’s primary developer-facing identity is its MCP server that exposes WhatsApp capabilities to AI assistants like Claude and ChatGPT, making MCP the core product identity rather than a secondary feature.
  evidence:
    - The site explicitly markets an 'Official MCP server' that lets users 'Connect WhatsApp to Claude, ChatGPT or your agent' with 'Nothing to install. Works out of the box.'
    - "It appears in the awesome-mcp-servers list under 'Community Servers' with the description: 'One WhatsApp number for your whole team, with AI in every chat. Run it all from Claude or ChatGPT and connect your stack.'"
    - The Developers section highlights 'MCP Server' as a top-level product alongside REST API, Webhooks, and WhatsApp Skills, positioning it as a first-class integration point for AI workflows.
