insights:
  summary: >-
    Humanloop was a development platform for managing and evaluating LLM applications, now being sunsetted following its
    acquisition by Anthropic.
  why_it_matters: >-
    It was an early infrastructure player focused on the prompt management and evaluation lifecycle of LLM-based
    software.
  mental_damage: >-
    It is the quintessential AI startup lifecycle: spend years building a specialized tool only to have it absorbed into
    a model provider's dashboard.
