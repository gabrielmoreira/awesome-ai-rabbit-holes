insights:
  summary: Augment Code offers Cosmos, an agent orchestration platform for building and running software factory workflows that automate SDLC stages via expert agents.
  why_it_matters: It lets engineering organizations deploy autonomous agent teams for end-to-end tasks like code review, incident response, and ticket-to-PR, reducing manual toil.
  mental_damage: Finally, a way to feel guilty about not automating your guilt over not automating your workflow.
  tags:
    - agent-orchestration
    - software-factory
    - sdlc-automation
  confidence: high
curation:
  status: included
  reason: Cosmos is an enterprise control plane that coordinates multiple expert agents across triage, authoring, review, and verification loops, making agent orchestration the primary identity.
  evidence:
    - "Cosmos orchestrates agents for end-to-end SDLC loops: triage, author, review, verify"
    - Experts are reusable agents with memory, environment, and capabilities that hand off work between stages
    - Platform provides triggers, shared memory, sandboxing, and human-in-the-loop checkpoints
