insights:
  summary: Augment Code's Cosmos is an agent orchestration platform that manages AI experts across the software development lifecycle.
  why_it_matters: It lets engineering teams run autonomous agents for code review, testing, and incident response without managing the underlying agent infrastructure.
  mental_damage: Finally, a way to feel productive while your AI agents do the work you used to take pride in.
  tags:
    - agent-orchestration
    - ai-agents
    - developer-platform
  confidence: high
curation:
  status: included
  reason: Cosmos is primarily a platform for coordinating multiple AI agents (Triage, Author, Review, Verify) across SDLC stages, fitting the agent orchestration category rather than a coding agent or extension.
  evidence:
    - Cosmos orchestrates work across triage, authoring, review, and verification loops with human-in-the-loop checkpoints
    - It provides a software factory platform with agent runtime, context engine, and shared memory for organizational-scale agent deployment
    - Source lists describe it as 'the platform that closes the gap' between engineers having agents and organizations not having them
