insights:
  summary: Column Race is a demo tool that compares AI model outputs on app reviews by running side-by-side sentiment, topic, bug report, and churn risk analyses using TypeSafe Jev and Gemini APIs.
  why_it_matters: It lets developers visualize and benchmark how different AI models weigh and prioritize signals in the same dataset, useful for tuning decision models or prompt weighting in classification workflows.
  mental_damage: Another benchmark that turns your API keys into a spectator sport while you wonder if your prompts are actually doing anything.
  tags:
    - decision-models
    - benchmark
    - ai-comparison
  confidence: medium
curation:
  status: included
  reason: The tool's core function is exposing and comparing judgments from decision models (Jev and Gemini) via typed questions on structured data, making it a decision-model-driven benchmark rather than a coding agent or general eval platform.
  evidence:
    - The demo runs side-by-side AI columns for Sentiment, Topic, Bug report, and Churn risk on the same batch of app reviews using TypeSafe and Google Gemini APIs.
    - It uses Jev (TypeSafe System One) to return probabilities that are treated as data for re-ranking, indicating a decision-model identity.
    - Listed in awesome-jev under both 'Community projects > Apps powered by Jev' and 'Benchmarks & research' sections, confirming its role as a Jev-powered decision benchmark.
