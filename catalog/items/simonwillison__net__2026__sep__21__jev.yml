insights:
  summary: Jev is a System One decision model that accepts text input and returns probabilistic scores for yes/no, choice, or rating questions instead of generating text.
  why_it_matters: It enables fast, cheap structured judgments for tasks like spam detection, relevance scoring, or guardrails where developers need typed decisions over open-ended text.
  mental_damage: Another clever way to trade model interpretability for latency and cost savings, now with extra steps to pretend it's not just a classifier.
  tags:
    - decision-model
    - llm
    - inference
  confidence: high
