insights:
  summary: >-
    OpsLevel is an internal developer portal that provides a unified catalog, scorecards, workflows, and AI-powered
    context to improve developer experience and software standards.
  why_it_matters: >-
    It centralizes service ownership, documentation, and workflows so developers spend less time hunting for context and
    more time coding.
  mental_damage: >-
    Yet another portal promising to be the single pane of glass, adding yet another tab to the developer's
    context-switching hell.
  tags:
    - internal-developer-portal
    - developer-experience
    - service-catalog
  confidence: medium
curation:
  status: included
  reason: >-
    OpsLevel is an internal developer portal platform, not a developer-facing AI tool or infrastructure; it belongs in
    curated lists as a navigation aid for engineering teams evaluating IDPs.
  evidence:
    - Scraped site context describes OpsLevel as an internal developer portal unifying tools, knowledge, and tasks
    - >-
      Features include service catalog, scorecards, workflows, and AI-powered context layer, but no AI agent or tooling
      that developers directly use for coding tasks
    - >-
      No evidence of being a coding agent, app builder, framework, or MCP server; it is a SaaS platform for platform
      engineering and developer productivity
    - jev winnow:e4b 0.34 below gate 0.50; proposed out of scope; placement kept at awesome-awesomes (unverified)
