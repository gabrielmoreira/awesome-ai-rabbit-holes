insights:
  summary: Spacelift is an infrastructure-as-code orchestration platform for Terraform, OpenTofu, Ansible, and CloudFormation that adds an AI assistant and natural-language interfaces to traditional IaC/GitOps pipelines.
  why_it_matters: It aims to reduce infrastructure ticket queues by letting developers request resources through natural language, though the core value remains conventional IaC orchestration with AI as a secondary interface.
  mental_damage: "It promises to turn your Terraform ticket queue into a self-service AI conversation, which means you now have two problems: state drift and prompt drift."
  tags:
    - iac
    - terraform
    - infrastructure-orchestration
    - devops
    - ai-assistant
  confidence: high
curation:
  status: excluded
  reason: Spacelift is fundamentally a traditional IaC orchestration platform; its AI assistant and MCP server are features layered onto infrastructure workflows, and none of the catalog's AI-native categories cleanly fit a conventional DevOps platform.
  evidence:
    - Site copy and positioning identify Spacelift as 'The IaC Orchestration Platform' for Terraform, OpenTofu, and Ansible, with AI appearing as an auxiliary deployment interface.
    - The product's primary workflow is infrastructure orchestration, drift detection, and policy enforcement rather than code generation, agentic coding, or AI developer tooling.
    - Source-list placement in 'DevOps and Infrastructure' confirms its primary domain is traditional infrastructure management, not AI-native developer tools.
