insights:
  summary: Broadn is a vertical AI agent platform that automates sales quoting and order entry for U.S. manufacturers by parsing RFQs from email and syncing structured outputs to ERPs and CRMs.
  why_it_matters: It demonstrates how specialized AI agents can integrate with industrial sales stacks (SAP, Quickbooks, Salesforce) to automate complex, domain-specific workflows without developer intervention.
  mental_damage: Just when you thought the agent hype couldn't get more niche, we now have offline agents negotiating margin control on HVAC orders while you wonder if your own job is next.
