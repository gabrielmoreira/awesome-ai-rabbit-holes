  status: included
  reason: The product is a hosted decision model (Jev) exposed via a gateway, making its core identity the judgment layer rather than coding, orchestration, or app generation.
  evidence:
    - Jev evaluates declared questions in parallel and returns typed answers plus probabilities directly
