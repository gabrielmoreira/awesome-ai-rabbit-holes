insights:
  summary: Jev Traffic Simulator demonstrates a TypeSafe AI decision model (Jev) by simulating a car crossing Chicago using fixed vs adaptive signal logic.
  why_it_matters: Shows developers a concrete, interactive example of how a decision model behaves in a real-world traffic scenario.
  mental_damage: Another reminder that 'seeing AI work' now means watching a pixelated car obey probabilistic stoplights instead of just reading benchmarks.
