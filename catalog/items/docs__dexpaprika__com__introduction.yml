insights:
  summary: DexPaprika is a REST and SSE API for querying on-chain liquidity, swap transactions, OHLCV, and token prices across 36 blockchain networks.
  why_it_matters: Developers building DeFi analytics, trading bots, or portfolio trackers can access real-time and historical DEX data without API keys or signup.
  mental_damage: Another API that makes you feel behind for not already having a trading strategy that prints money from on-chain volume delta signals.
  tags:
    - defi
    - api
    - blockchain
    - dex
  confidence: high
curation:
  status: excluded
  reason: DexPaprika is a general-purpose DeFi data API with no AI agent, tooling, or developer workflow integration identity; it serves market data, not AI-driven development tasks.
  evidence:
    - The API provides liquidity pool, swap, OHLCV, and token price data across 36 chains via REST and SSE streaming.
    - It is listed in awesome-mcp-servers as an official MCP server, but MCP is only a compatibility feature, not the product's primary identity.
    - The README and documentation focus on data access for analytics and trading, not on augmenting coding agents, IDEs, or AI development workflows.
