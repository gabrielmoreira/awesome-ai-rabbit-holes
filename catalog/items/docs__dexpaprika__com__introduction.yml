    - blockchain
  confidence: high
curation:
  status: excluded
  reason: >-
    DexPaprika is a general-purpose market data API for blockchain analytics, not a developer-facing AI tool, agent,
    framework, or infrastructure with a clear AI-tooling purpose.
  evidence:
    - >-
      Scraped site context: API for liquidity pools, swap transactions, OHLCV and token prices across 36 chains over
      REST and SSE.
    - >-
      Source-list context: Listed in awesome-mcp-servers as an official MCP server, but MCP is only an adapter feature,
      not the product identity.
    - >-
      README/excerpt: Focuses on market data access, tutorials, SDKs, and use cases like price tracking and DEX
      aggregation—no mention of AI agents, coding assistance, or developer workflows beyond generic API consumption.
