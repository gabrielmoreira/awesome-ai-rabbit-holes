insights:
  summary: RailCall is a local-first, MCP-compatible governance layer that lets AI agents draft workflows while requiring human approval and generating verifiable receipts for every action.
  why_it_matters: It gives developers a way to safely use AI agents on sensitive data by enforcing dry-run-by-default execution, human approval gates, and cryptographic receipts without sending data off-machine.
  mental_damage: Finally, an AI tool that treats your production data like live ammunition — so you can finally stop trusting the vibes and start verifying the receipts.
  tags:
    - local-first
    - ai-governance
    - mcp
    - receipt-backed
    - developer-tools
  confidence: high
curation:
  status: included
  reason: RailCall fits as an app builder because its core flow turns natural language prompts into governed apps, workflows, or internal tools that execute locally with human approval and cryptographic receipts, rather than acting as a coding agent editing existing code.
  evidence:
    - Describe any program — RailCall composes it from a pre-audited library and the integrations on your left rail, then runs it airlocked. One receipt for the build, one for every flow.
    - Every run mints an Ed25519-signed receipt — independently verifiable, offline.
    - "Source-list context: placed in awesome-ai-coding-tools under App Builders with description 'Run AI agents on your data — it never leaves your machine. Local-first governance: dry-run by default, BYOK, every flow minted to a tamper-evident receipt.'"
