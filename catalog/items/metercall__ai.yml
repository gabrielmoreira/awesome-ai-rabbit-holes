insights:
  summary: >-
    RailCall is a local-first governance tool that lets AI agents draft workflows and data actions, which must be
    human-approved before execution and produce verifiable cryptographic receipts.
  why_it_matters: >-
    It lets developers safely run AI agents on sensitive data by enforcing approval gates and auditability without data
    leaving the machine.
  mental_damage: >-
    Finally, a way to feel paranoid about AI agents that also gives you a notarized alibi when they inevitably
    misbehave.
  tags:
    - local-first
    - governance
    - ai-agents
    - audit
    - workflows
  confidence: high
curation:
  status: included
  reason: >-
    RailCall fits as an app builder because its core flow turns natural language prompts into governed apps, workflows,
    or internal tools that execute locally with human approval and cryptographic receipts, rather than acting as a
    coding agent editing existing code.
  evidence:
    - >-
      Describe any program — RailCall composes it from a pre-audited library and the integrations on your left rail,
      then runs it airlocked. One receipt for the build, one for every flow.
    - Every run mints an Ed25519-signed receipt — independently verifiable, offline.
    - >-
      Source-list context: placed in awesome-ai-coding-tools under App Builders with description 'Run AI agents on your
      data — it never leaves your machine. Local-first governance: dry-run by default, BYOK, every flow minted to a
      tamper-evident receipt.'
    - >-
      jev winnow:e4b 0.31 below gate 0.50; proposed decision-models / Agent Gates, Routers & Skills; placement kept at
      app-builders (unverified)
