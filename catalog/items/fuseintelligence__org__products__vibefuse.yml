insights:
  summary: VibeFuse is a free Windows desktop harness that runs AI coding agents (Claude Code, Codex, Cursor, Gemini, Qwen) alongside terminals, browsers, and custom widgets in a unified canvas.
  why_it_matters: It gives developers a single desktop workspace to orchestrate multiple coding agents and UI widgets without paying for another IDE seat or cloud computer subscription.
  mental_damage: Now you can finally feel the existential dread of managing six concurrent AI agents while Jarvis whispers 'Yes, sir?' in your ear.
  tags:
    - ai-harness
    - desktop-agent
    - windows-only
    - multi-agent
    - widget-marketplace
  confidence: medium
curation:
  status: included
  reason: VibeFuse is included because it primarily coordinates multiple coding agents and UI widgets on a shared desktop canvas, making it a harness for agent workflows rather than a standalone coding agent.
  evidence:
    - VibeFuse runs Claude Code, Codex, Gemini, Cursor, and Qwen side-by-side on one canvas with terminals and browsers
    - It enables voice-controlled canvas layout, named sessions, and multi-agent workflows (e.g., comparing Claude and Codex in parallel)
    - The product markets itself as a 'free Windows harness' and 'agent drives custom marketplace widgets' — positioning it as a coordination layer, not a primary coder
