insights:
  summary: Jev Chess is a live demo site where the Jev decision model plays chess against itself, showing probability distributions for each move.
  why_it_matters: It demonstrates how a decision model evaluates chess positions in real time, offering insight into probabilistic reasoning for developers exploring TypeSafe AI's System One models.
  mental_damage: Watching an AI agonize over every knight fork in probabilistic limbo is both enlightening and a sobering reminder of how much compute we spend to mimic human intuition.
