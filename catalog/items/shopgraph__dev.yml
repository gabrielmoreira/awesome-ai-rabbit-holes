insights:
  summary: ShopGraph is an API that extracts product data from URLs, attaching per-field confidence scores and provenance so developers and agents can decide what data to trust.
  why_it_matters: It gives commerce automation pipelines structured, normalized product data with visible extraction provenance, removing the guesswork from scraping at scale.
  mental_damage: We have finally built an API that admits when it is guessing, which is more honesty than most of our own standups.
  tags:
    - data-extraction
    - e-commerce
    - confidence-scoring
    - api
    - agent-ready
  confidence: medium
curation:
  status: included
  reason: ShopGraph is a developer-facing API and data extraction service with SDK-style utility, fitting cleanly as a code-first building block for commerce automation.
  evidence:
    - Primary page describes an extraction API with per-field confidence scores and UCP JSON output.
    - Listed in awesome-mcp-servers under E-Commerce, but its core identity is a standalone extraction service, not MCP infrastructure.
    - Designed for automation pipelines and agents to consume structured data with threshold enforcement.
