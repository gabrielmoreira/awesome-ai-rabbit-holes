insights:
  summary: >-
    ShopGraph is a product data extraction API that returns structured UCP format with per-field provenance and
    freshness signals.
  why_it_matters: >-
    It lets developers trust automated product data pipelines by showing exactly how each field was derived and how
    recent it is.
  mental_damage: >-
    Finally, an extraction tool that forces you to confront the uncomfortable truth that your scraped data might be
    lying to you.
  tags:
    - data-extraction
    - provenance
    - api
  confidence: high
