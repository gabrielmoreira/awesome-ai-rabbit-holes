insights:
  summary: ShopGraph is an API that extracts structured product data from commerce URLs, returning per-field provenance and confidence scores to help automated agents decide what data to trust.
  why_it_matters: Developers building commerce agents can standardize extraction across merchants using a single schema and filter results based on confidence thresholds, reducing brittle scraping logic.
  mental_damage: Another layer of metadata to obsess over while your agent confidently buys a widget that hasn't been in stock since 2019.
