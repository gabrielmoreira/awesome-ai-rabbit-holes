insights:
  summary: ShopGraph is an extraction API that returns product data with per-field provenance and freshness signals derived from schema.org, LLM, or Playwright extraction methods.
  why_it_matters: Developers building automation pipelines can trust extracted product data because each field includes visible source and recency signals for informed decision-making.
  mental_damage: Now your scrapers need to show their work like a stressed-out intern footnoting every Wikipedia claim in a group presentation.
  tags:
    - extraction
    - provenance
    - data-pipeline
  confidence: medium
curation:
  status: included
  reason: ShopGraph fits as a retrieval-focused context tool because its core value is providing fresh, provenance-tagged product data for agent decision-making, not generating code or orchestrating agents.
  evidence:
    - "Every extracted field carries provenance and freshness: which extraction method produced the value and how recent it is."
    - ShopGraph evaluates target URLs across five dimensions of machine-readability and returns a 0-100 AgentReady Score.
    - The API handles the extraction pipeline so agents get structured data with provenance without managing proxies or infrastructure.
