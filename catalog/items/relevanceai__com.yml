insights:
  summary: >-
    Relevance AI is an enterprise platform for building and running specialist AI agents to automate business tasks in
    sales, marketing, HR, and operations.
  why_it_matters: >-
    It lets non-technical teams deploy AI agents that handle repetitive workflows like CRM enrichment or meeting prep,
    reducing manual effort in go-to-market functions.
  mental_damage: >-
    Another 'AI workforce' platform promising ROI while quietly reinventing the idea that every business process needs
    its own bespoke agent army.
  tags:
    - ai-agents
    - enterprise-ai
    - workflow-automation
  confidence: high
curation:
  status: excluded
  reason: >-
    Relevance AI is a business-focused AI agent platform for sales, HR, and operations workflows, not a developer-facing
    tool for coding, app-building, or agent infrastructure.
  evidence:
    - Marketed as a platform for 'specialist agents for every task' in sales, marketing, HR, and customer success
    - >-
