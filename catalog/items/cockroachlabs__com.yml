insights:
  summary: CockroachDB is a cloud-agnostic, PostgreSQL-compatible distributed SQL database built for global scale, high availability, and strong consistency.
  why_it_matters: It offers a resilient OLTP datastore for business-critical apps, but as general-purpose database infrastructure rather than a purpose-built AI developer tool.
  mental_damage: The creeping realization that your weekend LLM side-project now 'requires' a globally distributed, serializable database is exactly how a three-week prototype becomes a three-year platform migration.
  tags:
    - distributed-database
    - sql
    - infrastructure
  confidence: high
