insights:
  summary: jev-mcp is an MCP server that exposes Jev (TypeSafe System One decision model) judgments over the Model Context Protocol.
  why_it_matters: It lets coding agents and other MCP clients query a decision model for typed, probabilistic answers like classification or scoring.
  mental_damage: Yet another MCP wrapper that turns a niche decision model into yet another protocol endpoint you’ll forget to configure.
