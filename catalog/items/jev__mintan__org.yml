insights:
  summary: Jev.mintan.org is a Japanese-language web demo of the Jev decision model that answers typed questions with probabilistic judgments about user personality, origin, and age.
  why_it_matters: It demonstrates how decision models like Jev can be used for lightweight, constrained inference tasks instead of open-ended text generation.
  mental_damage: Another reminder that even 'safe' AI tools are just guessing your birth year with 87% confidence.
  tags:
    - decision-model
    - demo
    - jev
  confidence: medium
curation:
  status: included
  reason: The product's core identity is the Jev decision model serving typed questions with probabilistic outputs, which matches the decision-models category's focus on judgment-based models rather than coding agents or app builders.
  evidence:
    - "The site states: 'AIが かくしんした じてんで、しつもんは とまります' (In the AI's confident knowledge, questions stop)."
    - It answers questions about personality, origin, and age using the Jev model, returning constrained judgments rather than generating text.
    - It is powered by 'TYPE SAFE JEV' and links to its GitHub source, indicating it is a demonstration of the Jev decision model itself.
