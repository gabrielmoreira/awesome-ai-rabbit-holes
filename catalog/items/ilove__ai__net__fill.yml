insights:
  summary: fill is a browser-based tool that extracts form field labels from PDFs and sends them to a Jev decision model for field-value prediction without transmitting user data.
  why_it_matters: It lets developers test or prototype PDF form-filling workflows using decision models while keeping sensitive data local to the browser.
  mental_damage: Finally, a way to automate bureaucratic form-filling without trusting a third party with your social security number—until you realize you still have to fill out the form yourself.
  tags:
    - pdf
    - form-filling
    - jev
    - browser-tool
    - decision-models
  confidence: medium
curation:
  status: included
  reason: The tool's core function is routing PDF form field labels to a Jev decision model for probabilistic field-value inference, making the decision model the primary product identity rather than a generic browser automation tool.
  evidence:
    - The tool sends only '欄の近くの文字' (nearby text fragments) and '項目名' (field names) to Jev, explicitly stating '値はこのブラウザから出ません' (values never leave the browser).
    - The scraped site context identifies Jev (TypeSafe System One) as the decision model powering the field-value predictions, with the gateway declaring '保持なし・学習不使用'.
    - The source-list context places it in awesome-jev under 'Browser & computer use', confirming its association with Jev-based browser automation.
