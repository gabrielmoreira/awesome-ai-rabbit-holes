  reason: This is a developer-facing retrieval and memory infrastructure product used as a building block in AI workflows, fitting the Memory / Retrieval Infrastructure section of Frameworks & SDKs.
  evidence:
    - "Site states: 'Pinecone is a fully managed vector database built for AI. Writes are instantly searchable, indexing is automatic, and queries stay fast at any scale.'"
