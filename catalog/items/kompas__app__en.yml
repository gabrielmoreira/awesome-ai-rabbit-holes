insights:
  summary: Kompas is a local-first desktop app for capturing ideas, conversations, and documents into a personal knowledge graph that uses AI to retrieve past context and assist in writing.
  why_it_matters: It offers developers a way to keep AI-augmented thinking, reading, and decisions in a connected, private graph rather than scattered across disposable chat tabs.
  mental_damage: Another chance to feel productive about organizing your thoughts while your actual codebase remains untouched and mildly resentful.
  tags:
    - knowledge-graph
    - local-first
    - ai-writing
    - personal-knowledge
  confidence: high
