insights:
  summary: Kompas is a desktop application that captures and connects user ideas, notes, and external content to augment thinking and writing using user-provided or local AI models.
  why_it_matters: It helps developers retain and build upon fragmented thoughts and research by creating a persistent, interconnected knowledge graph that surfaces relevant context during thinking and writing.
  mental_damage: Another tool promising to make your scattered thoughts useful — as if the real problem wasn’t having too many tools to begin with.
  tags:
    - knowledge-management
    - note-taking
    - ai-assisted-thinking
    - local-first
  confidence: high
curation:
  status: excluded
  reason: Kompas is a personal knowledge and thinking tool focused on idea capture and writing augmentation, not developer-facing AI tooling for coding, agents, workflows, or infrastructure.
  evidence:
    - Kompas is described as 'a compass for thought' that captures documents, highlights, voice notes, and web pages to grow ideas into usable work.
    - It targets essayists, researchers, founders, and Obsidian/Logseq users, with no mention of coding, software development, or developer workflows.
    - While it allows bringing your own AI (OpenAPI, Anthropic, Claude Code, Ollama), its core function is thinking and writing support, not coding assistance or agent orchestration.
