insights:
  summary: >-
    Kompas is a desktop app for capturing and connecting personal ideas into a growing graph to aid thinking and
    writing.
  why_it_matters: It helps developers retain and build upon their own thoughts across sessions, reducing redundant rethinking.
  mental_damage: Another tool promising to make your fleeting insights stick—until you forget to open it.
  tags:
    - knowledge-management
    - personal-ai
    - idea-tracking
  confidence: high
curation:
  status: excluded
  reason: >-
    Kompas is a personal knowledge and thinking tool focused on idea capture and writing support, not a developer-facing
    AI tool for coding, agents, or workflow automation.
  evidence:
    - Designed for essayists, researchers, founders, and Obsidian/Logseq users to grow ideas, not for coding tasks.
    - >-
      Core functionality centers on capturing documents, voice notes, and web pages into a connected graph for writing,
      not code editing or generation.
    - Marketed as a 'compass for thought' with use cases in reflection, decision-making, and long-form writing.
