insights:
  summary: Workflow evals is a benchmark suite that measures model accuracy, cost, and speed on structured automation tasks using decision-model primitives.
  why_it_matters: It provides a standardized way to compare how models perform on real-world workflows when decomposed into typed questions and code-driven rules.
  mental_damage: Finally, a way to quantify why your ‘just ask the LLM’ approach loses to actually breaking the problem into tiny, answerable pieces.
  tags:
    - evals
    - benchmarking
    - workflow-automation
  confidence: medium
curation:
  status: included
  reason: The project's core function is evaluating model behavior across structured workflows using decision primitives, which matches the evals category's focus on measuring AI system quality.
  evidence:
    - Primary page excerpt describes evaluating models on workflows like Security Incidents, Invoice Processing, etc., measuring accuracy, cost, and time
    - Uses Noul, Choice, and Score primitives to decompose tasks into programmatic rules and intelligent judgments
    - Compares model performance in workflows vs. standalone prompts, showing workflows are more accurate, cheaper, and faster
