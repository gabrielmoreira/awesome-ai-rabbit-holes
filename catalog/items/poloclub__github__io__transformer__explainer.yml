insights:
  summary: An interactive visualization tool that explains how transformer models (like GPT) work by demonstrating tokenization, attention mechanisms, and next-token prediction in a live GPT-2 model.
  why_it_matters: Helps developers intuitively grasp the internals of transformer architectures, which is foundational for debugging, fine-tuning, or building with LLMs.
  mental_damage: Finally, a way to see why your model hallucinates—just watch the attention heads ignore your prompt entirely.
