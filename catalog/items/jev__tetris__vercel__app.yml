insights:
  summary: Jev vs the LLMs is a real-time Tetris game where the Jev decision model competes against language models like Claude Haiku 4.5 and Gemini Flash.
  why_it_matters: It demonstrates decision-model performance in a competitive, time-sensitive setting, offering developers a tangible way to compare model latency and reasoning under pressure.
  mental_damage: Watching an AI sweat over Tetris while gravity accelerates is the closest we’ve come to seeing machine anxiety in real time.
  tags:
    - decision-model
    - demo
    - competition
    - tetris
    - jev
  confidence: high
curation:
  status: included
  reason: The project centers on the Jev decision model as the core product, with gameplay built around its typed judgments; this fits decision-models over coding agents or app builders because the model’s output—not code generation or app creation—is the primary artifact.
  evidence:
    - Two models play the same Tetris piece sequence in real time. First to top out loses.
    - Jev answers with a Choice distribution; the opponent answers through a forced function call whose argument is one of the option ids.
