insights:
  summary: Blink.review is a CLI tool that enforces team style guides by reviewing edits made by coding agents like Claude Code and Codex and notifying the agent of violations.
  why_it_matters: It catches style-guide violations early in the agent feedback loop, reducing noisy PR reviews and keeping agent-generated code consistent with team standards.
  mental_damage: Finally, a tool that lets your AI intern get scolded by a linter before you have to.
