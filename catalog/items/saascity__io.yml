insights:
  summary: SaaSCity.io is a directory and launch platform for SaaS and AI tools, presented as an interactive city map where each product appears as a building with a dedicated indexable page and dofollow backlink.
  why_it_matters: It helps developers and founders discover new AI and SaaS tools while providing SEO value through permanent, dofollow backlinks on a domain with measurable authority.
  mental_damage: Another directory where your tool’s visibility depends on upvotes and badges, adding yet another launch ritual to the already exhausting chore of shipping something no one asked for.
  tags:
    - directory
    - saas
    - ai-tools
    - backlinks
    - launch-platform
  confidence: high
curation:
  status: excluded
  reason: SaaSCity.io is a general-purpose directory and marketing platform for SaaS and AI products, lacking a specific focus on developer tooling, AI engineering workflows, or code-centric utilities required for inclusion in this catalog.
  evidence:
    - The platform describes itself as a 'SaaS directory & launch platform' where users 'browse new SaaS and AI tools, vote on the best, and put your product on the live city map'.
    - Source-list context shows it appears in 'awesome-mcp-list' under a 'Marketing' section, indicating its primary positioning is as a promotional tool, not a developer-facing utility.
    - The scraped site emphasizes SEO backlinks, domain rating, traffic metrics, and sponsored placements — core to its value proposition — rather than any developer workflow, code integration, or AI-assisted development feature.
