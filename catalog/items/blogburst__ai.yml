insights:
  summary: >-
    An AI-powered marketing automation engine designed to find buyer intent and generate evidence-backed content for
    social and blog channels.
  why_it_matters: >-
    It automates the loop of identifying customer questions on platforms like Reddit and X and converting them into
    attributable marketing content.
  mental_damage: >-
    Now you can outsource the guilt of having an unread blog to an autonomous engine that tracks exactly how much
    revenue it's missing.
