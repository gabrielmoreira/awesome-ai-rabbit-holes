curation:
  status: excluded
  reason: BlogBurst is a marketing growth engine for founders focused on buyer intent, content generation, and attribution — it does not involve coding, code editing, software development workflows, or developer tooling.
  evidence:
    - README states it is 'Built for founders with something to sell' and targets indie developers only as a user segment, not as a tool for coding tasks
    - Core functionality centers on finding buyer questions on Google, Reddit, X, creating evidence-backed content, shipping it to blogs/social, and tracking via UTM links — none of which are coding-related activities
    - No mention of code generation, editing, debugging, IDE integration, terminal use, or any software development lifecycle support
