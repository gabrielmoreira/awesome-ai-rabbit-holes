    - agentic-coding
  confidence: high
curation:
  status: included
  reason: Amazon Q Developer is a standalone AI agent whose core function is performing coding tasks like writing, debugging, and refactoring code directly in developer environments, making it a coding agent rather than an extension or app builder.
  evidence:
    - Scraped site describes it as 'The most capable generative AI–powered assistant for software development' that 'writes, debugs, and refactors code natively in your IDE'
    - It offers agentic capabilities that 'autonomously perform a range of tasks–everything from implementing features, documenting, testing, reviewing, and refactoring code'
    - Available as plugins/extensions for VS Code, JetBrains, Visual Studio, Eclipse, and CLI, indicating it operates as a primary coding assistant within host tools
