  summary: slop-grader is an npm package that evaluates text outputs from language models to detect and score low-quality or nonsensical content ('slop').
  why_it_matters: It helps developers automate quality checks on AI-generated text, reducing the need for manual review of model outputs in pipelines or testing.
  mental_damage: Finally, a tool to quantify the existential dread of reading AI-generated nonsense so you can automate your despair.
