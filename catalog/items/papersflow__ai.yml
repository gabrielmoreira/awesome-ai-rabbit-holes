insights:
  summary: An AI research workspace that indexes over 474 million academic papers to power literature reviews, citation management, LaTeX writing, and presentation generation for researchers.
  why_it_matters: It offers an MCP server integration that allows developers building research-adjacent tools to query a massive academic corpus programmatically rather than scraping Google Scholar.
  mental_damage: Another all-in-one 'workspace' arrives to save us from the terrifying possibility that a PhD student might have to use Zotero and Overleaf in two different browser tabs.
  tags:
    - research
    - mcp
    - literature-review
    - academic
  confidence: high
curation:
  status: excluded
  reason: This is an end-user SaaS for academic research and writing, not a developer tool for building software, despite its presence in an MCP servers list.
  evidence:
    - Primary pitch is 'AI research workspace' for literature reviews, LaTeX writing, and citation management, targeting students and researchers.
    - Listed in awesome-mcp-servers under 'Knowledge & Memory', but the product itself is a closed SaaS for academics, not a developer infrastructure tool.
    - No evidence of an IDE plugin, CLI agent, or coding workflow; it generates presentations and paraphrases text rather than code.
