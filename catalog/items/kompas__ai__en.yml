insights:
  summary: >-
    Kompas is a desktop app for capturing, connecting, and developing personal ideas into structured writing using AI as
    a thinking partner.
  why_it_matters: >-
    It helps developers turn fragmented thoughts, notes, and conversations into coherent output by surfacing relevant
    past work during writing sessions.
  mental_damage: >-
    Another tool promising to finally make your scattered ideas useful — until you realize you now have to manage yet
    another knowledge graph.
  tags:
    - knowledge-management
    - writing-assistant
    - ai-augmentation
  confidence: high
curation:
  status: excluded
  reason: >-
    Kompas is a personal knowledge and writing tool focused on idea development and reflection, not on software
    development workflows, coding tasks, or developer-facing tooling.
  evidence:
    - >-
      Marketed for essayists, researchers, founders, and Obsidian/Logseq users to grow ideas and reveal connections
      between concepts
    - >-
      Core workflow centers on capturing sessions, connecting past notes, and writing from personal thought graphs — not
      code editing, generation, or agent-assisted development
    - >-
      Describes itself as 'a place where your ideas grow' and 'a compass for thought', with no mention of coding,
      software development, or developer tooling
