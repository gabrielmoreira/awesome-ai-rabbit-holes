insights:
  summary: Kompas is a desktop application that captures, connects, and retrieves user notes and AI sessions into a personal knowledge graph to support thinking and writing.
  why_it_matters: It helps developers retain and compound insights across sessions, reducing repetitive thinking and improving personal knowledge synthesis.
  mental_damage: Another tool promising to make your fleeting AI chats stick around — until you realize it's just another place to hoard half-formed ideas you never actually use.
  tags:
