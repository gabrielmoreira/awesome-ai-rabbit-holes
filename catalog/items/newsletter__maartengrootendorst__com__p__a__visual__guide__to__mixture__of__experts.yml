insights:
  summary: A visual blog post and guide explaining the Mixture of Experts (MoE) architecture used in modern Large Language Models, illustrated with over 50 diagrams.
  why_it_matters: It helps developers understand the trade-offs between sparse and active parameters in models like Mixtral 8x7B, which impacts infrastructure decisions for hosting and inference.
  mental_damage: You will read this entire guide to feel smart about router load balancing, only to immediately forget the difference between Token Choice and Soft-MoE when the next model drops.
