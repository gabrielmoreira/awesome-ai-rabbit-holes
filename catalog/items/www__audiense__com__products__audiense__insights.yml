insights:
  summary: Audiense Insights is an audience research platform that analyzes social media data to uncover consumer behaviors, interests, and segments for marketing and strategy teams.
  why_it_matters: It helps developers working on marketing or analytics tools enrich applications with deep consumer intelligence beyond basic demographics.
  mental_damage: Another reminder that 'audience insights' is just a fancy way to say we’re still guessing what people want, now with more social media APIs.
  tags:
    - audience-research
    - marketing-analytics
    - consumer-intelligence
  confidence: high
curation:
  status: excluded
  reason: Audiense Insights is a marketing and audience intelligence platform with no developer-facing AI tooling, agent behavior, or code-centric functionality relevant to software development workflows.
  evidence:
    - Platform focuses on analyzing social media activity, consumer signals, and psychographics for marketers, strategists, and data teams.
    - Core use cases include audience segmentation, campaign planning, and consumer enrichment — not coding, agent orchestration, or dev tooling.
    - No evidence of APIs, SDKs, agent integrations, or developer interfaces in the provided materials; product is positioned as a SaaS platform for non-technical analysts and business users.
