  status: excluded
  reason: Agile Luminary is a project management SaaS with AI features, not a developer-facing AI tool for coding, agents, workflows, or infrastructure; its primary identity is agile work management, not software development tooling.
  evidence:
    - Marketed as 'Enterprise agile project management, product backlog software' with AI-powered story creation and automated documentation
    - Features include Kanban boards, wiki/RAG search, sprint planning, and user management — all project management workflows
    - Positioned as a platform for agile teams, startup founders, and enterprise users to 'Plan better. Manage smarter, Ship faster.'
