    - backlog
    - rag
  confidence: high
curation:
  status: excluded
  reason: This is primarily an end-user enterprise SaaS project management platform, not a developer-facing tool, framework, or coding assistant.
  evidence:
    - Scraped site describes it as 'Enterprise agile project management, product backlog software' with pricing tiers for teams.
    - Features center on Kanban boards, sprint planning, and story creation rather than code editing or repo work.
    - MCP is listed only as a compatibility feature ('MCP server connectivity') rather than the product identity.
