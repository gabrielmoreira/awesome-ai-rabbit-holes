insights:
  summary: BrainSoup is a desktop application for creating and coordinating custom AI agents that automate tasks and workflows using natural language.
  why_it_matters: It lets developers and non-developers alike build multi-agent systems that integrate with local/remote LLMs, tools, and data while keeping control over privacy and execution.
  mental_damage: Now you can fire your intern and replace them with a team of AI agents that argue in chat rooms instead.
  tags:
    - multi-agent
    - workflow-automation
    - desktop-ai
    - local-llm
    - privacy-first
  confidence: high
curation:
  status: included
  reason: The core product is a workbench for creating, coordinating, and deploying multiple AI agents with shared workflows, which aligns with Agent Orchestration's focus on multi-agent coordination as the primary value.
  evidence:
    - Primary page describes 'custom AI agents' that 'seamlessly work together' in 'goal-oriented chat rooms' for complex projects
    - Explicitly supports multi-agent collaboration, tool integration (APIs, scripts, web browsing), and local/remote LLM backends
    - Positioned as a 'personal AI platform' for task automation and workflow transformation, not a coding assistant or IDE
