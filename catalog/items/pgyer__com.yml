insights:
  summary: Pgyer is a beta app distribution service for mobile developers to upload apps and generate download links and QR codes.
  why_it_matters: It simplifies internal testing and delivery by providing fast app distribution with QR code generation for iOS and Android.
  mental_damage: Yet another service to manage in your CI/CD pipeline just to avoid manually emailing APKs to testers.
  tags:
    - mobile
    - distribution
    - ci-cd
  confidence: high
curation:
  status: excluded
  reason: Pgyer is a mobile app distribution and testing service with no AI agent, coding assistant, or developer tooling integration relevant to software developers building or using AI-powered workflows.
  evidence:
    - Pgyer provides beta app distribution, UDID extraction, QR code generation, and CI/CD plugins like Fastlane and Jenkins.
    - The service focuses on mobile app uploads, test distribution, and enterprise services like bug tracking and compliance, not AI-driven development.
    - Listed in awesome-mcp-servers as an 'Official Server' but only for distribution, with no MCP server identity or AI tooling role.
