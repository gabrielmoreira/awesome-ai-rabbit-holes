insights:
  summary: Cosmopedia is a large-scale synthetic dataset and open pipeline for pretraining small language models using Mixtral-generated textbooks, stories, and instructional content.
  why_it_matters: It gives developers an open, reproducible way to pretrain capable small models without relying on closed Phi-style data or expensive human-labeled corpora.
  mental_damage: We have collectively decided that the best way to teach models to reason is to have slightly larger models hallucinate textbooks at industrial scale.
