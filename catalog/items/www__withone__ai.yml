insights:
  summary: One is an agent infrastructure platform and CLI that provides a unified interface, managed auth, and workflow runtime for connecting AI agents to 250+ platforms and 50,000+ pre-built tools.
  why_it_matters: It replaces per-platform OAuth wiring, API docs reading, and rate-limit handling with a single SDK and CLI that any LLM or agent framework can use to execute multi-step workflows across SaaS APIs.
  mental_damage: We have successfully abstracted 'integrating with your tools' into 'integrating with the tool that integrates with your tools,' and the credentials are now one CLI install away from sentience.
  tags:
    - agent-infrastructure
    - mcp
    - cli
    - workflow
    - integrations
  confidence: high
curation:
  status: included
  reason: The product is a runtime platform and control plane for deploying, monitoring, and coordinating agents across 250+ platforms with managed auth, scheduling, memory, and workflow execution, fitting the operated-platform definition of agent orchestration.
  evidence:
    - "Site describes 'One Platform: Six primitives. One SDK. The complete infrastructure layer for production agents' with deploy, monitor, and control features."
    - Includes a workflow runtime ('One Flow') for multi-step, resumable agent workflows with branching, loops, and parallel execution across APIs.
    - Listed in awesome-mcp-servers under Developer Tools, but the primary identity is the agent platform and CLI, not just an MCP server.
