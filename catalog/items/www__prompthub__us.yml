    - llmops
    - evaluations
    - team-collaboration
  confidence: high
curation:
  status: included
  reason: PromptHub’s core job is prompt versioning, testing, chaining, and deployment pipelines, which aligns directly with Prompt & Context Engineering’s PromptOps mandate rather than coding agents or extensions.
  evidence:
