insights:
  summary: skills.sh is a directory and installer for reusable AI agent skills that enhance agent behavior via single-command installation.
  why_it_matters: It lets developers quickly equip AI agents with specialized capabilities like code review or debugging without building them from scratch.
  mental_damage: Yet another registry to check before trusting that your agent won’t hallucinate a solution to a problem it was never taught.
  tags:
    - agent-skills
    - registry
    - cli
  confidence: high
