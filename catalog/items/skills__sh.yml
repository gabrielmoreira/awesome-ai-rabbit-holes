insights:
  summary: A directory and registry for discovering and installing reusable skill packs that extend AI agent capabilities via a single command.
  why_it_matters: Developers can rapidly enhance AI agents with procedural knowledge like debugging, design, or automation without writing custom prompts or code.
  mental_damage: Yet another skill marketplace promising to fix agent limitations, while we all wonder if we're just trading prompt engineering for skill hunting.
  tags:
    - skills
    - agent-extension
    - registry
  confidence: high
curation:
  status: included
  reason: skills.sh is a curated directory and installer for portable agent skill packs, matching the core definition of reusable content that modifies agent behavior rather than being a tool or agent itself.
  evidence:
    - The site describes itself as 'The Agent Skills Directory' and promotes installing skills with a single command like `npx skills add <owner/repo>`
    - It lists thousands of skill packs from providers like Vercel, Anthropic, and Microsoft, each scoped to specific agent enhancements (e.g., 'frontend-design', 'code-review', 'setup-matt-pocock-skills')
    - The product distributes installable content (skill packs) that users add to agents to change behavior, not executable tools the agent calls
