insights:
  summary: Jan is an open-source desktop chat application that allows users to run local AI models or connect to cloud models like GPT and Claude.
  why_it_matters: It gives developers a private, self-hosted alternative to commercial chat interfaces for experimenting with models locally.
  mental_damage: Another locally-hosted ChatGPT clone promising 'your AI, your rules' while quietly downloading 7GB Llama weights you’ll never quantize.
