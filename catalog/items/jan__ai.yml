insights:
  summary: Jan is an open-source desktop chat application that runs local AI models or connects to cloud models like GPT and Claude.
  why_it_matters: It lets developers experiment with and use various LLMs locally or via API without leaving a unified chat interface.
  mental_damage: Another chat UI in a sea of chat UIs, promising 'personal intelligence' while you juggle six different model backends just to get a decent answer.
  tags:
    - chat-ui
    - local-llm
    - desktop-app
    - model-switcher
  confidence: high
curation:
  status: excluded
  reason: Jan is a general-purpose LLM chat client, not a developer-focused tool; it does not perform coding tasks, integrate with development workflows, or provide agent-like capabilities for software development.
  evidence:
    - Jan markets itself as an open-source alternative to ChatGPT for running local or cloud models
    - The interface is a standard chat app with model selection, memory, and newsletter signups
    - No mention of code editing, terminal integration, IDE plugins, or agent-based coding workflows
