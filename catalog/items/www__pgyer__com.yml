insights:
  summary: Pgyer is a beta app distribution platform providing mobile developers with services for uploading, hosting, and distributing test builds via QR codes and APIs.
  why_it_matters: It streamlines the mobile CI/CD handoff by letting teams distribute iOS, Android, and HarmonyOS builds to testers without managing their own distribution infrastructure.
  mental_damage: Yet another reminder that your carefully engineered prompt stack still ultimately depends on a web page with a QR code and a Fastlane plugin.
  tags:
    - mobile-ci
    - app-distribution
    - beta-testing
    - devops
  confidence: high
curation:
  status: excluded
  reason: Pgyer is a general mobile app distribution and testing SaaS platform with no meaningful AI-native developer tooling angle, and its appearance in awesome-mcp-servers is misleading given the core product is not MCP infrastructure.
  evidence:
    - Scraped site describes Pgyer as a 'beta app distribution service' with Fastlane and Jenkins plugins, not an AI tool.
    - Listed in awesome-mcp-servers under 'Official Servers' but no MCP server implementation or protocol identity is present in the site content.
    - Product suite includes Tracup, CodeFever, and compliance testing, none of which relate to coding agents, MCP, or AI workflows.
