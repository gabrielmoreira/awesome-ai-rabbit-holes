insights:
  summary: Bwee is a native macOS GUI that wraps Claude Code, letting developers persist sessions and build custom desktop tools and UIs by chatting.
  why_it_matters: It removes the friction of ephemeral terminal sessions by giving Claude Code a persistent, local-first desktop interface with custom UI panels for repeated tasks.
  mental_damage: You bought a CLI agent and now you need a separate native Mac app to give it a GUI so it can build you custom GUIs to talk to itself.
  tags:
    - claude-code
    - macos-gui
    - session-manager
    - ui-builder
    - agent-wrapper
  confidence: high
curation:
  status: included
  reason: It belongs because it is a developer-facing integration that augments Claude Code with native UI, session persistence, and custom tool-building, rather than acting as the primary coding assistant itself.
  evidence:
