insights:
  summary: A Chinese-language technical book and course site covering the full LLM stack, from architecture and pretraining to prompting, RAG, and agent-based reasoning.
  why_it_matters: It provides a structured, practitioner-authored curriculum and reference for developers who need to understand how LLMs actually work before wiring them into tools.
  mental_damage: Yet another reminder that reading 300 pages on transformer internals is easier than admitting your prompt-to-app builder is just autocomplete with a Stripe bill.
