curation:
  status: excluded
  reason: The project is an educational textbook/survey focused on theoretical and architectural knowledge rather than a functional developer tool, agent, or piece of infrastructure.
  evidence:
    - The site serves as a Chinese version and expansion of the 'A Survey of Large Language Models' academic paper.
    - The content is structured as textbook chapters covering pre-training, fine-tuning, and alignment rather than providing a programmable or agentic interface.
