insights:
  summary: >-
    SonarQube is a multi-layered code verification and governance platform that integrates AI agents for security,
    quality, and remediation across CI/CD workflows.
  why_it_matters: >-
    It provides independent, auditable code verification that lets developers safely use AI coding agents by catching
    issues before they reach production.
  mental_damage: Finally, a way to feel guilty about AI-generated code at scale, with enterprise-grade audit trails.
  tags:
    - code-quality
    - security
    - ai-verification
    - devsecops
    - mcp
  confidence: medium
curation:
  status: included
  reason: >-
    SonarQube is primarily a code verification and governance platform that provides APIs, CLI, and SDKs for developers
    to integrate security and quality checks into their workflows, aligning with the Frameworks & SDKs category as a
    provider abstraction layer rather than a standalone coding agent or orchestrator.
  evidence:
    - Offers SonarQube CLI, IDE extensions, and MCP server for integrating code quality into developer workflows
    - Marketed as an 'independent AI code verification platform' providing multi-layered review of all code
    - Provides SDKs and plugins for major AI coding agents (Claude Code, Cursor, Copilot) to verify AI-generated code
    - jev winnow:e4b 0.32 below gate 0.50; proposed mcp / Dev & Code Tools; placement kept at ai-frameworks (unverified)
