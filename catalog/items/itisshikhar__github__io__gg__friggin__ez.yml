insights:
  summary: GG FRIGGIN EZ is a TypeSafe AI Jev-powered demo for real-time Indic language moderation in Twitch stream chat, comparing System 1 decisions against regex and OpenAI.
  why_it_matters: Shows developers a lightweight, low-latency alternative to LLMs for real-time content moderation using typed decision models.
  mental_damage: Another demo proving that sometimes you don't need a 13B parameter model to tell if 'frrrantic' is abuse — just a good decision head and a twitchy chat.
  tags:
    - decision-models
    - content-moderation
    - jev
    - twitch
  confidence: medium
curation:
  status: included
  reason: The product's core identity is the Jev System 1 decision model used for real-time moderation judgments, not a coding agent, app builder, or MCP server, and it appears in an awesome list for Jev-based projects.
  evidence:
