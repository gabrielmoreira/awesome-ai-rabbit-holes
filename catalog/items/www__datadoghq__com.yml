curation:
  status: excluded
  reason: While Datadog includes AI features like Bits AI and MCP servers, the core product is a general-purpose enterprise cloud monitoring and security SaaS, not a specialized AI developer tooling product.
  evidence:
    - Primary description positions it as a 'cloud monitoring as a service solution' for infrastructure and security, not a developer AI tool.
    - Appears in awesome-ai-coding-tools under 'DevOps and Infrastructure', which is a supporting category rather than a core tooling fit for this catalog.
    - The vast majority of the product surface (Security, Digital Experience, Service Management) is unrelated to coding agents or AI app building.
