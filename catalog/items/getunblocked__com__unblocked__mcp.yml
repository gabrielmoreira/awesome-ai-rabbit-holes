insights:
  summary: >-
    An MCP server that delivers synthesized organizational context from sources like GitHub, Slack, and Jira to AI
    agents.
  why_it_matters: >-
    It helps agents understand the intent and history behind code by bridging the gap between the codebase and the
    conversations or documentation surrounding it.
  mental_damage: >-
    Finally, an automated way to ensure your AI agent can hallucinate based on a three-year-old Slack thread just as
    easily as your codebase.
