curation:
  status: included
  reason: 平台的核心价值在于编排多智能体工作流、管理Agent生命周期和提供企业级控制平台，而非作为单一编码Agent或SDK供开发者直接编程使用。
  evidence:
    - 以Agent为核心的一站式企业级大模型服务平台，支持多智能体协同Agent、自主规划Agent、工作流Agent
    - 提供全链路可观测、高并发DAG执行引擎、官方预置高质量子Agent（如网页探索、代码编写、报告撰写）
    - 强调企业级服务、私有化部署、权限管控、审计合规等平台能力，而非开发者直接编程接口
