  reason: Devin is a standalone autonomous agent that performs coding tasks using a shell, editor, and browser in a sandbox, making it a primary coding agent rather than an extension or framework.
  evidence:
    - Devin can plan and execute complex engineering tasks requiring thousands of decisions
    - Devin is equipped with common developer tools including the shell, code editor, and browser within a sandboxed compute environment
