insights:
  summary: "Structure recovery reconstructs Markdown from plain text that lost its formatting by using two model queries: one to merge split lines and another to classify blocks into headings, paragraphs, lists, code, or callouts."
  why_it_matters: It lets developers recover usable Markdown from corrupted text inputs without relying on risky full-text regeneration that could alter meaning.
  mental_damage: Yet another demo of how we now pay models to undo the very formatting we stripped to feed them in the first place.
  tags:
    - markdown
    - text-processing
    - cookbook
  confidence: high
