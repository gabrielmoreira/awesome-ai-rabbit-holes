insights:
  summary: AntV is a data visualization team and open-source project offering chart libraries (G2, G6, L7, etc.) and AI-powered visualization tools like AVA and MCP servers for chart generation.
  why_it_matters: Provides developers with mature, grammar-based visualization frameworks and experimental AI integrations for turning data into interactive visuals.
  mental_damage: Yet another visualization library promising AI-powered insights while you still have to manually pick which of its eight chart series to use.
  tags:
    - visualization
    - charts
    - ai
  confidence: high
curation:
  status: excluded
  reason: AntV is primarily a data visualization library ecosystem with AI as an experimental add-on, not a developer-facing AI tool whose core function is coding, agent behavior, or workflow automation.
  evidence:
    - Repo description missing; README emphasizes chart libraries (G2, G6, L7, T8) and AI-powered intelligent visualization as a secondary capability.
    - Core offerings are visualization frameworks and chart libraries, not agents, app builders, or orchestration tools for developers.
    - AI features like AVA and mcp-server-chart are presented as sub-projects under the broader AntV visualization mission.
