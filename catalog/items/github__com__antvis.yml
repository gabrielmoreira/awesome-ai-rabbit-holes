    - javascript
  confidence: high
curation:
  status: excluded
  reason: While AntV includes AI features (AVA, GPT-Vis, mcp-server-chart), the organization itself is a general-purpose data visualization suite, which falls outside the catalog's focus on AI-specific developer tooling, agents, and infrastructure.
  evidence:
    - The README describes AntV as a 'data visualization' suite started in 2017, focusing on graphical grammar rather than AI-native tooling.
    - The GitHub organization is a collection of 121 repositories for chart libraries (G2, G6, L7), not a single AI product.
    - AI components (like mcp-server-chart) are sub-components of a larger traditional visualization project.
