insights:
  summary: AntV is a data visualization team and open-source project that provides charting libraries and AI-powered visualization tools for developers.
  why_it_matters: It offers reusable visualization frameworks and AI-enhanced charting components that developers can integrate into applications for data analysis and reporting.
  mental_damage: Another visualization library promising AI magic while developers still wrestle with axis labels and tooltip positioning.
  tags:
    - visualization
    - charts
    - ai-enhanced
  confidence: high
curation:
  status: included
  reason: AntV provides code-first visualization libraries (like G2, G6, AVA) that developers import and use as SDKs to build AI-powered data visualization features, fitting the Frameworks & SDKs category.
  evidence:
    - AntV maintains open-source repositories like G2 (12.6k stars), G6 (12.3k stars), and AVA (1.6k stars) as TypeScript/JavaScript libraries
    - README describes AntV as 'a visualization grammar' and 'framework' for developers to embed in JavaScript applications
    - Projects like AVA and mcp-server-chart are positioned as AI-native frameworks and MCP tools for agent-based visualization
