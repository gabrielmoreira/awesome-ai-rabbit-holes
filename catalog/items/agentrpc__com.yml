insights:
  summary: AgentRPC is a Model Context Protocol (MCP) server that exposes internal microservices and APIs as callable tools for AI agents.
  why_it_matters: It allows developers to bridge existing backend infrastructure with AI agents without writing custom adapters for every service.
  mental_damage: Another layer of indirection so your agents can confidently miscall your own APIs while sounding very sure of themselves.
