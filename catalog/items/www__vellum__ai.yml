insights:
  summary: Vellum is a personal AI assistant with persistent memory and task automation that runs locally or in the cloud to manage personal and business workflows.
  why_it_matters: It gives developers a private, extensible AI agent that can act across tools like email, calendar, and code, reducing context-switching overhead.
  mental_damage: Another 'always-on' AI companion promising to remember your life while quietly training the expectation that your assistant should anticipate your needs before you do.
  tags:
    - ai-assistant
    - personal-ai
    - task-automation
  confidence: high
curation:
  status: excluded
  reason: Vellum is a general-purpose personal AI assistant focused on life and business task automation, not developer-specific coding tasks or workflows.
  evidence:
    - README emphasizes managing groceries, guitar practice, flight prices, and date nights as core use cases
    - Scraped site describes it as 'a personal AI assistant for your busywork' with no mention of code editing, repo interaction, or development tooling
