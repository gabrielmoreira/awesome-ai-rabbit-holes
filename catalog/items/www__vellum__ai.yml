insights:
  summary: Vellum is a multi-platform personal AI assistant focused on long-term episodic, semantic, and procedural memory across web, desktop, CLI, and messaging integrations.
  why_it_matters: It introduces a developer-facing memory and identity scaffolding model (IDENTITY.md, SOUL.md, skills/*.ts) that can be self-hosted or run locally with configurable autonomy levels.
  mental_damage: Now you can finally offload your calendar, inbox, and existential dread to an assistant that remembers your preferences better than your actual teammates do.
  tags:
    - memory
    - personal-assistant
    - self-hosted
    - cli
    - multi-platform
  confidence: high
curation:
  status: excluded
  reason: Despite having CLI and local execution surface, the primary product is a personal productivity assistant for inbox, calendar, and life management rather than a developer tool for coding, infra, or AI workflows.
