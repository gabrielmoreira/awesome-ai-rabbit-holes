insights:
  summary: Cody is an AI coding assistant that integrates with IDEs and the web to provide context-aware chat, code completions, and edits using Sourcegraph's code search.
  why_it_matters: It helps developers understand, write, and fix code faster by leveraging deep codebase context from local and remote repositories.
  mental_damage: Another AI pair programmer that promises to read your whole codebase while you still spend half your time explaining where things are.
