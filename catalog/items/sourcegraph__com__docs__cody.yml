  summary: Cody is an AI coding assistant that uses Sourcegraph's search API to provide context-aware code completions, chat, and editing across IDEs and the web.
  why_it_matters: It helps developers understand, write, and fix code faster by pulling in relevant context from local and remote codebases via advanced search.
  mental_damage: Yet another AI pair programmer that promises to reduce context-switching while adding yet another sidebar to your IDE.
