curation:
  status: excluded
  reason: This is a general mobile commerce SaaS platform for managing in-app purchases and subscriptions, not a developer tool for coding, agent orchestration, or AI infrastructure.
  evidence:
    - The product is described as a service for 'managing subscriptions effortlessly across all platforms' and 'Advanced receipt validation'.
    - The AI feature is an 'AI assistant' for business insights on 'customer behavior, subscription patterns, and revenue trends', not a coding or dev-tooling assistant.
    - It appears in awesome-mcp-servers under 'Customer Data Platforms', but the product itself is a general SaaS, not an MCP-first tool.
