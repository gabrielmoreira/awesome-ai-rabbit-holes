insights:
  summary: Vibe Coding Profiler analyzes Git commit metadata to generate a shareable AI-assisted engineering persona based on coding patterns.
  why_it_matters: Helps developers reflect on their evolving AI-assisted workflows and share insights about their coding style with others.
  mental_damage: Turns your git history into a personality quiz, because nothing says 'engineering rigor' like a vibe-based archetype derived from commit timing.
