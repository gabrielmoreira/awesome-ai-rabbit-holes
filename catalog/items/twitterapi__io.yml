insights:
  summary: twitterapi.io is a third-party REST and WebSocket API providing real-time and historical access to X (Twitter) data for developers and AI agents.
  why_it_matters: It gives developers a pay-as-you-go, low-latency alternative to the official X API with no approval process, enabling immediate access to social data for apps, bots, and agent workflows.
  mental_damage: Another API wrapper promising 'real-time data for AI agents' while quietly rebuilding the same firehose access everyone else is scraping, now with better support and a MCP server sticker.
  tags:
    - api
    - social-data
    - mcp
    - developer-tools
  confidence: medium
curation:
  status: included
  reason: While twitterapi.io is primarily a social data API, its explicit marketing of a 'Native MCP server' as a core feature—positioned as a plug-and-play way to give live data to Claude, GPT, Cursor, or any MCP client—makes MCP the primary identity for catalog inclusion, as the protocol is not merely an adapter but a highlighted integration layer.
  evidence:
    - "Native MCP server: Plug into any LLM — Give live data to Claude, GPT, Cursor, or any MCP client — no glue code."
    - "Listed in awesome-mcp-list under 💬 Communication section with description: 'Build with the public social data API for developers and AI agents.'"
    - Product emphasizes real-time data, WebSocket support, and low-latency access (median response under 500ms) as core capabilities exposed via MCP.
