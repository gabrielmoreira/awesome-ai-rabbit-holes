insights:
  summary: >-
    Dart is a project management platform that enables teams to create, manage, and orchestrate AI agents alongside
    human workflows, with features like AI-generated tasks, agent collaboration, and integrations with tools like
    GitHub, Claude Code, and Slack.
  why_it_matters: >-
    It matters to developers by providing a centralized workspace where AI coding agents (e.g., Codex, Claude Code) can
    be directed, monitored, and coordinated on coding tasks within a shared team plan.
  mental_damage: >-
    It promises to eliminate the 'work' of project management by replacing human planning with AI agents that generate
    tasks and sprints — potentially automating away the very coordination it claims to support.
  tags:
    - project-management
    - ai-agents
    - team-collaboration
  confidence: high
curation:
  status: excluded
  reason: >-
    Dart is primarily a project management and team coordination platform that uses AI agents as features, not a
    developer-facing AI tool whose core identity is coding, framework, orchestration, or agent tooling; its value lies
    in workflow automation for teams, not in acting as a coding agent or extending one.
  evidence:
    - >-
      The platform enables users to 'create, manage, and orchestrate agents alongside your team' and connects 'every
      handoff and result to the work', positioning it as a team workspace, not a coding agent.
    - >-
      It features integrations with coding agents like Codex, Claude Code, and Cursor, but these are treated as
      connectable tools within Dart — meaning Dart orchestrates agents rather than being one.
    - >-
      Its core use cases span product, marketing, sales, HR, and operations, with AI applied to tasks like sprint
      planning, property filling, and subtask generation, not direct code editing or repo interaction as a primary
      function.
