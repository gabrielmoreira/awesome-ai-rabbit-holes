insights:
  summary: Duet is a platform for building and sharing AI agents that encapsulate a user's expertise, tools, and workflows for clients and teams to interact with via chat.
  why_it_matters: It lets domain experts turn their know-how into reusable, updatable AI agents without requiring clients to learn agent-building or manage infrastructure.
  mental_damage: Finally, a way to monetize your expertise by offloading repetitive client questions to an agent that still needs your constant updates to stay useful.
  tags:
    - ai-agents
    - agent-sharing
    - knowledge-transfer
  confidence: high
curation:
  status: excluded
  reason: Duet is a general-purpose AI agent platform for non-developer experts and clients, not a developer-facing tool for coding, workflow automation, or agent development; its core use case is sharing expertise via chat agents, not building or improving software.
  evidence:
    - Built for consultants and anyone with know-how to turn expertise into AI agents for clients and teams
    - Agents are taught via checklists, templates, and rules like briefing a new hire, not through coding or repo interaction
    - Primary value is sharing agents with clients who 'just talk to it' — no developer workflow, code editing, or tooling integration is central
