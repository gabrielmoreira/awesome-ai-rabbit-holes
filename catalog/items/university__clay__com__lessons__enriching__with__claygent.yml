  confidence: high
curation:
  status: excluded
  reason: Enriching with Claygent is a feature within the Clay GTM automation platform, not a standalone developer-facing tool or agent; it serves sales and marketing workflows rather than software development tasks.
  evidence:
    - The resource is a lesson from Clay University titled 'Enriching with Claygent' focused on using Claygent for company and people data enrichment in GTM automation.
    - Claygent is described as an AI web scraper for retrieving real-time, dynamic web context to solve the 'last mile data problem' in sales and marketing, such as checking if a company offers a free trial or what a founder said at a panel.
    - The source-list context shows it appears in 'awesome-ai-agents' under the 'Claygent' section, but this reflects its use as an AI agent for data enrichment, not developer tooling like coding, debugging, or workflow automation for software engineers.
