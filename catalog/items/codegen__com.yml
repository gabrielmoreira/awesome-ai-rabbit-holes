insights:
  summary: codegen.com is a developer directory and learning platform for AI coding tools, skills, and agent workflows, operated by the team behind the Codegen agent platform and now part of ClickUp.
  why_it_matters: It helps developers discover, compare, and learn to use AI coding agents like Claude Code, Cursor, and Windsurf through skill installations, agent recipes, and guided courses.
  mental_damage: Another curated list that pretends to simplify agent overload while quietly steering you toward the vendor’s own orchestration platform.
  tags:
    - directory
    - learning
    - ai-agents
  confidence: high
curation:
  status: excluded
  reason: codegen.com is primarily a curated directory, educational resource, and agent skill marketplace for third-party AI coding tools, not a standalone AI developer tool or agent itself, and thus belongs in curated lists rather than as a product to be evaluated for inclusion.
  evidence:
    - Described as 'The developer directory for Claude Code, Cursor, Windsurf, and every AI coding tool worth using' and 'Find tools. Build agents.'
