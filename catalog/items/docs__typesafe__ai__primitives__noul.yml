insights:
  summary: A decision-making primitive that evaluates yes/no questions and returns the probability of a positive answer.
  why_it_matters: It enables reliable, threshold-based logic and routing by replacing unpredictable text generation with structured probabilistic outputs.
  mental_damage: Finally, a way to turn the chaos of LLM reasoning into a single float that you can immediately regret thresholding at 0.7.
