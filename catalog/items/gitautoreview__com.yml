insights:
  summary: Git AutoReview is a VS Code extension that runs Claude, Gemini, and GPT in parallel to review pull requests and surfaces draft comments for human approval before publishing.
  why_it_matters: It lets developers catch more issues in PRs faster by using multiple AI models while retaining full control over what gets published.
  mental_damage: Finally, a tool that understands your fear of AI auto-committing embarrassing typos to your PR thread.
