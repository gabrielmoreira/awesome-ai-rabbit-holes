insights:
  summary: A System One question type for rating content against ordered, descriptive levels with probabilistic scores and confidence.
  why_it_matters: It enables developers to replace unpredictable LLM text outputs with precise, structured, and probabilistic data for tasks like triage, routing, and classification.
  mental_damage: Because natural language was just too ambiguous for our automated workflows, so now we need a 0.43 probability distribution to describe our bug reports.
