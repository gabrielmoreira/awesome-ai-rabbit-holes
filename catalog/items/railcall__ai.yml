insights:
  summary: RailCall is a local-first AI workflow engine that runs agents on user data with dry-run execution, human approval gates, and tamper-evident receipts.
  why_it_matters: It lets developers safely run AI agents on sensitive data by ensuring no writes occur without approval and providing cryptographic proof of what ran.
  mental_damage: Finally, a tool that treats your trust issues as a feature, not a bug to be patched with more SOC 2 theater.
  tags:
    - local-ai
    - governance
    - mcp
    - workflows
  confidence: high
curation:
  status: included
  reason: RailCall acts as an MCP server and local execution layer that augments AI agents (like Claude or Cursor) with secure, approval-gated actions and receipt-backed workflows, making it an extension rather than a standalone coding assistant.
  evidence:
    - Registers as a universal MCP server for AI agents to call over stdio for 'doing' while the agent handles 'thinking'
    - Provides local dry-run execution, human approval gates, and per-flow Ed25519-signed receipts for auditability
    - Designed to integrate with n8n, Zapier, Salesforce, GitHub, etc., as a governed overlay for sensitive data workflows
