insights:
  summary: Checkmarx One is an AI-powered application security platform that uses hybrid scanning and agentic AI to detect and remediate vulnerabilities across the SDLC.
  why_it_matters: It helps developers secure AI-generated and traditional code by providing agent-assisted triage, remediation, and risk prioritization directly in development workflows.
  mental_damage: Another security tool that promises to shift left but adds yet another AI agent to your IDE that you’ll need to triage.
  tags:
    - appsec
    - ai-security
    - devsecops
    - mcp
    - agents
  confidence: high
curation:
  status: included
  reason: Checkmarx One is primarily a security platform that integrates AI agents and MCP tooling into developer workflows via IDE and CI/CD hooks, making it an extension to coding agents and editors rather than a standalone coding agent or framework.
  evidence:
    - Checkmarx provides Developer Assist, Triage Assist, and Remediation Assist agents that operate in the IDE and PR workflows to surface fix proposals and prioritize risks
    - It offers a Checkmarx MCP Server and MCP scanning capabilities to expose security data via the Model Context Protocol for agent consumption
    - It is positioned as a platform that secures code creation, CI/CD, AI supply chain, and runtime — with MCP, IDE, and PR hooks that enforce security at every agentic control point
