insights:
  summary: A video game database API providing metadata, reviews, and semantic search for 775,000+ titles across 70+ platforms.
  why_it_matters: >-
    Provides developers with structured gaming data, sentiment analysis via unique scoring, and MCP support for LLM
    integration.
