curation:
  status: included
  reason: The product's primary identity is MCP infrastructure for serving game data to AI agents, making it a clear fit for the MCP ecosystem category rather than a generic API or AI tool.
  evidence:
    - "Explicit MCP section: 'MCP for the AI powered era' and 'Use the MCP to provide your chatbot with relevant game data'"
    - "Marketing emphasizes MCP as a core feature: 'Model Context Protocol (MCP) is a new way to connect Game Brain data with any chatbot'"
