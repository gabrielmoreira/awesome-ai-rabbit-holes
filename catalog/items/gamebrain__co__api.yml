curation:
  status: excluded
  reason: >-
    The product is a general-purpose content/data API rather than a developer-focused AI infrastructure or orchestration
    tool.
  evidence:
    - Scraped site describes GameBrain as 'one of the largest video game database and game discovery service' sharing data with the world.
    - Primary use cases focus on searching, suggesting, and retrieving game details for end-user applications, not developer tooling workflows.
    - MCP is presented as a compatibility feature ('MCP for the AI powered era') to connect data with chatbots, not as the product's core identity.
