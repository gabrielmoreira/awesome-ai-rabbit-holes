insights:
  summary: Rett fra Bonden is a Norwegian local food directory enabling users to search for farm-produced groceries, meat, dairy, and other products via map-based filters and sales channels.
  why_it_matters: It matters to developers as an example of a niche domain exposing real-time data to AI agents via A2A and MCP, demonstrating how vertical databases can become AI-accessible knowledge sources.
  mental_damage: Another vertical SaaS slapping on 'AI-ready' as a feature while pretending local food discovery needs agent-to-agent protocol mediation.
  tags:
    - local-food
    - agent-to-agent
    - mcp
    - norway
    - database
  confidence: high
curation:
  status: excluded
  reason: The core product is a local food producer directory with MCP and A2A as optional integrations, not an AI developer tool; its primary identity serves consumers and producers, not developers building or augmenting AI workflows.
  evidence:
    - "Site title and description: 'Rett fra Bonden — Finn lokalprodusert mat i Norge' and 'Søk blant 1643 lokale matprodusenter i Norge'"
    - "Primary user flow: search for food, explore producers, buy directly — no mention of coding, agent building, or developer tooling"
    - MCP and AI agent features are presented as optional enhancements for producers and consumers, not the core product
