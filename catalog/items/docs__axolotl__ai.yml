insights:
  summary: Axolotl is an open-source CLI and configuration framework for fine-tuning, post-training, and evaluating large language models across multiple GPUs and hardware setups.
  why_it_matters: It gives developers a single YAML-driven pipeline to fine-tune everything from LLaMA to multimodal models with built-in support for LoRA, RLHF, and distributed training optimizations.
  mental_damage: You can now perfectly fine-tune a 70B model to write like your favorite obscure blogger, provided you first solve the actual puzzle of configuring NCCL, Docker, and your GPU's will to live.
  tags:
    - fine-tuning
    - llm-training
    - cli
    - multimodal
    - distributed-training
  confidence: high
curation:
  status: included
  reason: Axolotl is a code-first framework and CLI tool for building fine-tuning pipelines, fitting squarely into AI Frameworks and SDKs rather than a hosted app builder or coding agent.
  evidence:
    - README describes Axolotl as a 'free and open-source tool designed to streamline post-training and fine-tuning' using YAML configs and a CLI (axolotl train).
    - Supported workflows include LoRA, QLoRA, GRPO, and multi-GPU training via FSDP/DeepSpeed, targeting developers building training pipelines in code.
    - Listed under '微调 Fine-Tuning' in awesome-LLM-resources, confirming its niche as a developer tool for model post-training.
