    - Documentation focuses on training methods (LoRA, QLoRA, RLHF, GRPO), dataset handling, and multi-GPU optimizations rather than coding assistance or agent workflows.
    - Listed in awesome-LLM-resources under the '微调 Fine-Tuning' section, confirming its identity as a model-training resource rather than a developer AI tool.
