insights:
  summary: Riff is an enterprise SaaS platform that builds and runs AI agents on top of ERPs like SAP, Oracle, and Microsoft Dynamics to automate procurement and operations workflows.
  why_it_matters: It allows developers to extend ERP automation with custom TypeScript tools and APIs, bridging the gap between pre-built agent suites and specific business logic.
  mental_damage: We’ve successfully automated the procurement department, meaning the only thing left for the human developer to debug is why the AI teammate is ignoring the supplier's second email.
  tags:
    - agents
    - automation
    - enterprise
    - erp
    - typescript
  confidence: high
curation:
  status: excluded
  reason: While technically impressive, this is an enterprise operations platform for ERP automation, not a developer tool for writing code, building apps, or managing dev infrastructure.
  evidence:
    - The primary pitch is 'Agents that run on your ERP' targeting procurement, planning, and finance teams rather than software developers.
    - Developers are mentioned only as extending the platform with TypeScript tools, acting as a secondary integration point rather than the primary user.
    - The awesome-ai-coding-tools list categorized it under 'App Builders,' but its focus on ERP workflows (Infor, SAP) doesn't fit the catalog's scope of coding agents or dev tooling.
