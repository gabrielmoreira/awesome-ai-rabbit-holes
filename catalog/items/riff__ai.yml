insights:
  summary: Riff is an enterprise agent-building platform that connects to ERPs like SAP, Oracle, and Infor to automate business operations such as procurement and invoicing via pre-built or custom AI agents.
  why_it_matters: It offers a visual canvas and TypeScript SDK for developers to build domain-specific agents that read and write to live ERP systems with audit logs and permissioning.
  mental_damage: "Just what the modern developer needs: another platform to debug TypeScript agents that send emails to suppliers while promising to be 'enterprise ready' in eleven days."
  tags:
