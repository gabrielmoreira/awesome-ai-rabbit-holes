insights:
  summary: Riff is a platform for building and deploying AI agents in industrial operations, focused on order handling, procurement, logistics, production planning, and aftermarket service.
  why_it_matters: It enables developers to operationalize AI agents in complex, real-world industrial workflows with measurable business outcomes.
  mental_damage: Another 'AI for industry' platform that promises agents will finally understand your ERP — until you realize they still need humans to fix the exceptions.
  tags:
    - industrial-ai
    - ai-agents
    - enterprise-platform
  confidence: high
curation:
  status: excluded
  reason: Riff is an enterprise platform for deploying AI agents in industrial operations, not a developer-facing tool for coding, workflow orchestration, or app building; its primary users are business and operations teams, not software developers building or extending AI systems.
  evidence:
    - Riff positions itself as a platform for AI agents that 'understand your operations, act across your systems and work alongside your people' in industrial settings like order handling, procurement, and production planning.
    - It emphasizes business outcomes, domain expertise, and forward-deployed engineering rather than developer tools, SDKs, or coding workflows.
    - It appears in the awesome-ai-coding-tools list under 'App Builders', but its core identity is an enterprise AI platform, not a tool that turns prompts into deployable apps or scaffolds for developers.
