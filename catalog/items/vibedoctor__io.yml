insights:
  summary: A security, performance, and code quality scanner designed to audit applications built by AI agents.
  why_it_matters: It provides a diagnostic safety net that catches common agent-driven errors—like hallucinated imports and exposed secrets—before they reach production.
  mental_damage: It's a digital second opinion to ensure your agent's 'vibe' hasn't accidentally compromised your entire production environment.
  tags:
    - security
    - mcp
    - code-quality
    - agent-tooling
  confidence: high
curation:
  status: included
  reason: VibeDoctor acts as a specialized security and quality-assurance add-on that integrates into existing coding agents via MCP to verify agent-generated code.
  evidence:
    - Provides 149+ automated checks for secrets, auth, dependencies, and performance
    - Integrates with Claude Code, Cursor, and Windsurf via MCP to deliver findings directly in chat
    - Specifically targets AI-agent failure modes like hallucinated package imports and dead code
