insights:
  summary: VibeDoctor is a SaaS tool that scans vibe-coded apps for security, performance, and code quality issues with 149+ automated checks and provides visual code maps and fix prescriptions.
  why_it_matters: It gives solo devs and small teams using AI coding tools a fast, read-only second opinion on security holes, performance issues, and broken patterns before shipping.
  mental_damage: Finally, a way to find out if your AI-generated codebase is a dumpster fire before your users do.
  tags:
    - code-review
    - security-scanning
    - ai-generated-code
    - static-analysis
    - mcp-integration
  confidence: high
curation:
  status: included
  reason: The core job is measuring, scoring, and reporting on code quality and security vulnerabilities (evals/safety) rather than acting as a coding agent or a pure extension.
  evidence:
    - Runs 129+ checks across 15 areas including CVEs, secrets, and code smells using tools like SonarQube and Trivy.
    - Provides 'AI diagnose' confidence scores and regression tracking between code versions.
    - Listed in awesome-ai-coding-tools under 'Code Review and Refactoring'.
