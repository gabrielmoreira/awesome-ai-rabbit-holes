insights:
  summary: A security and code-quality scanner that runs enterprise tools like SonarQube, Trivy, and Gitleaks against AI-generated codebases and live URLs, offering fix prompts for Cursor and other assistants.
  why_it_matters: It closes the gap between vibe-coded prototypes and production readiness by catching hallucinations, secrets, and CVEs that the original generating AI typically misses.
  mental_damage: We have entered an era where we need a second AI to audit the code written by the first AI, just to ensure the first AI didn't invent a dependency that will steal our API keys.
  tags:
    - security
    - code-review
    - vibe-coding
    - scanner
    - mcp
  confidence: high
curation:
  status: included
  reason: The core job is measuring, scoring, and reporting on code quality and security vulnerabilities (evals/safety) rather than acting as a coding agent or a pure extension.
  evidence:
    - Runs 129+ checks across 15 areas including CVEs, secrets, and code smells using tools like SonarQube and Trivy.
    - Provides 'AI diagnose' confidence scores and regression tracking between code versions.
    - Listed in awesome-ai-coding-tools under 'Code Review and Refactoring'.
