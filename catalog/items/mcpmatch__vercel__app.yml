  summary: A capability matcher that uses the Jev decision model to map natural language goals to specific MCP server capabilities.
  why_it_matters: It provides an intelligent routing layer to help developers discover and select the correct tools within the expanding MCP ecosystem.
  mental_damage: Because selecting the right tool is too much cognitive load, we now need a decision model to tell us which tool we were supposed to use.
