insights:
  summary: BrainGrid is an AI app builder that creates a detailed spec from user input, gets sign-off, then builds and verifies the app using coding agents like Claude Code or Cursor via MCP or CLI.
  why_it_matters: It reduces rework by enforcing a plan-first workflow where AI-generated apps are verified against acceptance criteria before delivery.
  mental_damage: Finally, an AI tool that makes you write a spec before it builds something that breaks — because even agents need paperwork.
  tags:
    - app-builder
    - spec-driven
    - mcp
    - verification
  confidence: high
curation:
  status: included
  reason: The product's core identity is generating specs, architecture context, and tasks to drive implementation, fitting the spec-first loop definition better than a generic coding agent.
  evidence:
    - Scraped site describes it as 'The AI Product Planner' that writes specs and tasks for coding agents.
    - "Explicit workflow: 'Describe needs -> Clarify with questions -> Specs AI coding tools will love -> Break into tasks'."
    - Lists compatibility with Claude Code, Cursor, and others via MCP, CLI, or copy-paste, confirming it is not the agent itself.
