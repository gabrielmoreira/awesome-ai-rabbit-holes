insights:
  summary: Amp is a frontier coding agent that operates in the terminal, web, and mobile to perform coding tasks using leading AI models.
  why_it_matters: It lets developers delegate coding work to an agent that persists across devices and continues running even when the local machine is off.
  mental_damage: Yet another agent promising to make you obsolete while you still have to pay for the subscription to feel productive.
  tags:
    - coding-agent
    - terminal
    - ai
  confidence: high
curation:
  status: included
  reason: Amp is positioned as a primary coding agent that performs autonomous coding tasks across terminal, web, and mobile environments, fitting the coding-agents category rather than being an extension or orchestration layer.
  evidence:
    - Scraped site describes Amp as 'a frontier coding agent that lets you wield the full power of leading models' and emphasizes agents that run in terminals, on the web, and on phones.
    - Source-list inclusion in awesome-ai-coding-tools under 'Code Editors and Assistants' and awesome-cli-coding-agents under 'Terminal-native coding agents > Closed Source'.
    - README highlights agent persistence via 'orbs' (remote machines), multi-agent spawning, scheduling, and cross-device continuity — core behaviors of a coding agent, not a host extension.
