insights:
  summary: Amp is a frontier coding agent that enables developers to use leading AI models for coding tasks across web, terminal, and mobile platforms.
  why_it_matters: It provides a unified, agentic coding experience that works across devices and persists work in remote orbs, reducing context-switching friction.
  mental_damage: Yet another agent promising to free you from your old ways — as if the real bottleneck was ever the tool, not the spec.
  tags:
    - coding-agent
    - ai-agent
    - terminal
    - cross-platform
  confidence: medium
curation:
  status: included
  reason: Amp positions itself as a primary coding agent that performs autonomous coding tasks across terminals, IDEs, and browsers, with no indication it serves mainly as an extension to another agent or as an app builder.
  evidence:
    - Source-list placement in 'awesome-ai-coding-tools' under 'Code Editors and Assistants' and 'awesome-cli-coding-agents' under 'Terminal-native coding agents > Closed Source'
    - Scraped site describes Amp as 'a frontier coding agent that lets you wield the full power of leading models' and emphasizes use 'on the web, in your terminal, and on your phone'
    - Features like multi-agent spawning, scheduling, and Slack integration position it as an autonomous agent rather than a plugin or scaffold generator
