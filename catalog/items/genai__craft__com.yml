insights:
  summary: GenAI Craft is a Japanese indie workshop building and publishing self-made AI gadgets, apps, and local LLMs such as the '言箱' (AI PC) and FeelDance video app.
  why_it_matters: It demonstrates end-to-end local AI product development—from hardware to app store—offering a reference for developers integrating on-device models into real-world tools.
  mental_damage: Another developer realizing they could’ve spent the weekend fine-tuning a dance anime model instead of yet another React form.
