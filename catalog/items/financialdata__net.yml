    - investment
  confidence: high
curation:
  status: excluded
  reason: FinancialData.Net is a generic financial data API with no developer-facing AI tooling, agent integration, or workflow-specific features; it serves as infrastructure for finance apps, not AI-assisted software development.
  evidence:
    - The site promotes real-time/historical stock data, financial statements, and alternative data for investment decisions via REST API
    - No mention of AI agents, coding assistance, prompt engineering, MCP integration, or developer tooling in the README or site context
    - Positioned as a data source for professionals and institutions, not as a tool that enhances AI development workflows
