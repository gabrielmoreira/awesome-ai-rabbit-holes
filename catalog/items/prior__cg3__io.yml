insights:
  summary: Prior is a knowledge exchange protocol that enables AI agents to search for previously solved problems across agent sessions without retraining or wasting tokens.
  why_it_matters: It reduces redundant work and token costs for developers building agent workflows by letting agents reuse solutions discovered by others.
  mental_damage: Developers still waste time authenticating, installing CLI tools, and configuring multiple agent integrations just to share a single useful fix they found months ago.
  tags:
    - mcp
    - agent-orchestration
    - memory-and-context
  confidence: high
curation:
  status: included
  reason: Prior is fundamentally an MCP server and middleware layer that provides shared knowledge retrieval to agents, with MCP being its primary product identity rather than a compatibility footnote.
  evidence:
    - Scraped docs show 'MCP Server (Remote — Zero Install)' endpoint at https://api.cg3.io/mcp with full MCP setup instructions.
    - The setup command explicitly installs Prior as an MCP server into Claude Code, Codex, and other tools via MCP config.
    - Listed in awesome-mcp-servers under 'Knowledge & Memory' as a server implementation.
