insights:
  summary: >-
    Airkit.ai is a Salesforce-branded platform for building autonomous AI agents for employee and customer support,
    deeply integrated with the Salesforce ecosystem.
  why_it_matters: >-
    It lets developers and admins deploy AI agents within Salesforce without leaving the CRM, reducing context-switching
    for service, sales, and marketing workflows.
  mental_damage: >-
    Another 'AI agent' platform that requires you to buy into a walled garden just to get basic LLM functionality
    wrapped in enterprise sales decks.
  tags:
    - salesforce
    - ai-agents
    - low-code
  confidence: high
curation:
  status: excluded
  reason: >-
    Airkit.ai is a SaaS platform for enterprise AI agents tied to Salesforce, not a developer-facing tool for coding,
    workflow automation, or local AI work; it lacks a primary identity as a coding agent, framework, or orchestrator for
    developers.
  evidence:
    - >-
      Seen in awesome-ai-agents under the purpose 'A list of AI autonomous agents' with the description 'Build and
      customize autonomous AI agents to support your employees and customers 24/7, including full integration with the
      Salesforce ecosystem.'
    - >-
      The scraped site context positions Agentforce as a Salesforce product line for CRM-integrated AI agents across
      sales, service, marketing, and commerce clouds — not a tool developers import, extend, or run locally.
    - >-
      No evidence of CLI, SDK, framework, extension, or local runtime; the product is a hosted platform whose value is
      in Salesforce integration, not developer tooling.
