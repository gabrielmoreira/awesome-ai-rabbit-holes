insights:
  summary: A blog post arguing that Jev's probabilities cannot be calibrated on new data distributions and should be treated as scores requiring recalibration.
  why_it_matters: Warns developers using Jev for classification to validate probability calibration on their own data before relying on thresholds or expected costs.
  mental_damage: Another reminder that trusting model probabilities out of the box is how you silently ship miscalibrated risk into production.
