insights:
  summary: Q, ChatGPT for Slack is a Slack app that lets users interact with a GPT-powered assistant to read files, summarize content, and generate text within Slack channels.
  why_it_matters: It brings LLM-powered assistance directly into team communication workflows, reducing context switching for quick tasks like drafting or research.
  mental_damage: Yet another way to accidentally leak internal docs to an AI while trying to look productive in a meeting.
