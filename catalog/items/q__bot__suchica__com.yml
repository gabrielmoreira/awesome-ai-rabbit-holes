curation:
  status: excluded
  reason: This is a general-purpose team chat assistant for Slack focused on business content, emails, and brainstorming, not a developer-facing coding tool, IDE, extension, or infrastructure component.
  evidence:
    - The site describes it as 'ChatGPT for your Slack' with use cases like emails, translations, tweet/blog content creation, and copywriting.
