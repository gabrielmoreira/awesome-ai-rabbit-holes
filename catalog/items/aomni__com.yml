insights:
  summary: Duet is a hosted platform that turns consultants' expertise into shareable AI agents with dedicated workspaces, persistent memory, and tool access for client and team use.
  why_it_matters: It lets knowledge workers package their know-how into reusable AI agents that stay in sync across clients without managing infrastructure.
  mental_damage: Finally, a way to scale your consulting gig without cloning yourself—just hope clients don’t ask the agent for a raise.
