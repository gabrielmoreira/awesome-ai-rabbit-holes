        than a single coding agent.
      decision_evidence:
        - >-
          Duet gives each client a workspace that holds your agents, their memory and skill files, the apps they build,
          and an always-on machine to run them.
        - You look after the agent. Duet looks after everything under it.
        - >-
          One workspace, everyone in it: Files and shared memory every agent reads and writes, with teammates in the
          same sessions.
