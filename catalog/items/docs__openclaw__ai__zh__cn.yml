insights:
  summary: OpenClaw is a self-hosted multi-channel AI agent gateway that connects messaging platforms to AI coding agents via channel plugins.
  why_it_matters: It lets developers run their own AI agent infrastructure locally while maintaining full data control and avoiding hosted services.
  mental_damage: Another self-hosted gateway that promises 'bring your own channels' while quietly binding you to yet another YAML config and plugin ecosystem.
  tags:
    - self-hosted
    - gateway
    - messaging
    - ai-agent
    - multi-channel
  confidence: medium
curation:
  status: included
  reason: OpenClaw is primarily a gateway integration layer that enables AI coding agents to operate across messaging platforms, making it an extension to agent workflows rather than a standalone coding agent or orchestration platform.
  evidence:
    - Describes itself as a 'Gateway 网关' that connects chat apps to AI coding agents
    - Core functionality centers on channel plugins for Discord, WhatsApp, Telegram, etc., to relay messages to and from agents
    - Positioned as a bridge between messaging apps and AI agents, not as an agent that writes or edits code directly
placement:
