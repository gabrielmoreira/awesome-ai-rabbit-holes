insights:
  summary: OpenClaw is a self-hosted multi-channel AI agent gateway that connects chat apps to coding agents.
  why_it_matters: It lets developers run their own AI coding assistant infrastructure on any OS while keeping data under their control.
  mental_damage: Yet another layer to manage between your chat app and the AI that writes your code, just to feel like you own the stack.
  tags:
    - ai-agent
    - self-hosted
    - gateway
  confidence: medium
curation:
  status: included
  reason: It acts as a host integration layer that augments existing messaging platforms with agentic capabilities rather than being the primary coding assistant itself.
  evidence:
    - README describes it as a 'Gateway' connecting messaging channels to AI coding agents
    - Primary value is routing messages from Discord, Slack, etc., to an agent
    - Provides mobile nodes for iOS/Android to interface with the gateway
