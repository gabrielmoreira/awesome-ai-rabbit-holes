insights:
  summary: A self-hosted AI agent gateway that connects messaging channels like Discord, Slack, and WhatsApp to AI coding agents.
  why_it_matters: It enables developers to interact with their coding agents through their existing communication tools, bridging the gap between chat apps and development workflows.
  mental_damage: Because having your coding agent respond to a WhatsApp message is exactly how you accidentally deploy buggy code from a coffee shop.
  tags:
    - ai-agent
    - gateway
    - messaging-integration
    - self-hosted
    - automation
  confidence: high
curation:
  status: included
  reason: It acts as a host integration layer that augments existing messaging platforms with agentic capabilities rather than being the primary coding assistant itself.
  evidence:
    - README describes it as a 'Gateway' connecting messaging channels to AI coding agents
    - Primary value is routing messages from Discord, Slack, etc., to an agent
    - Provides mobile nodes for iOS/Android to interface with the gateway
