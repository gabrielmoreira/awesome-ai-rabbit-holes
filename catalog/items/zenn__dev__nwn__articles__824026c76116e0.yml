insights:
  summary: An article discussing TypeSafe's Jev, a decision model that returns calibrated probabilities instead of generating text, with demonstrations of its speed and accuracy in JSON output and game-playing tasks like DOOM and Mario.
  why_it_matters: It highlights an alternative to LLMs for deterministic, high-speed decision tasks where calibrated probability outputs are more reliable than text generation.
  mental_damage: Another reminder that the AI tooling landscape keeps inventing new model types just to avoid admitting we're still bad at prompting.
  tags:
    - decision-model
    - jev
    - typesafe
    - calibrated-probability
  confidence: high
curation:
  status: included
  reason: The article centers on Jev as a decision model that outputs probabilities via logit comparison rather than text generation, fitting the core identity of decision-models, especially given its use in structured tasks like JSON output and game control.
  evidence:
    - TypeSafeのJevは、文章を生成する代わりに、ソフトウェアがそのまま使える判断と確率を高速に返すモデルです
    - Jevを使って並列に推論することで大幅に高速化したとのことです。これによりJSON出力と比較して、77倍の高速化することができました
    - 開発元によると、既存LLMではプロンプト内の選択肢の順序バイアス（Position Bias）、トークナイザの切り出し方、モデルの過信（Overconfidence）などの影響を強く受け、現実世界の確実性と一致する「正しい確率（Calibrated Probability）」にはなっていないとのことです。それに対しJevでは、単に数値を出すことではなく、その数値が確率論的・統計的に適切に校正（Calibration）された信頼できる推定量であることというのが大きなメリットであると開発元は主張しています
