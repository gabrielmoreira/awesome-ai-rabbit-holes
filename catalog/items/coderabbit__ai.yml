insights:
  summary: An AI-first pull request reviewer that provides context-aware feedback, line-by-line code suggestions, and real-time chat across PRs, IDEs, and CLI environments.
  why_it_matters: It automates the heavy lifting of code reviews by catching edge cases, generating tests and docstrings, and enforcing custom coding guidelines via a configurable YAML workflow.
  mental_damage: We've successfully automated the part of code review where a senior engineer sighs and explains your off-by-one error, so now you can feel judged by an AI that learned your style guide instead.
