insights:
  summary: CodeRabbit is an AI-powered pull request review agent that automatically reviews, prioritizes, and secures code changes.
  why_it_matters: It reduces manual review burden by providing instant AI feedback on PRs, helping teams ship code faster with fewer surprises.
  mental_damage: Yet another bot commenting on your PRs, because humans clearly can't keep up with the AI-generated PR flood they unleashed.
