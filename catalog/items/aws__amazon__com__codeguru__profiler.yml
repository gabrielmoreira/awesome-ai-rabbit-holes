  reason: Amazon CodeGuru Profiler is a performance profiling and optimization tool focused on runtime cost analysis, not AI-driven coding tasks, agent behavior, or developer workflow augmentation; it lacks the core identity of an AI coding assistant, extension, or tool that acts on code via prompts or automation.
