insights:
  summary: A Python toolkit and suite of small multimodal models designed for direct, probabilistic decision-making via choice, scoring, or boolean outputs.
  why_it_matters: It enables developers to implement low-latency routing, triage, and verification by replacing heavy LLMs with specialized, local-friendly 'System 1' models.
  mental_damage: Because why use a reasoning model when you can just get a probability distribution of your own confusion?
  tags:
    - decision-models
    - multimodal
    - system-1
    - small-models
    - python
  confidence: high
