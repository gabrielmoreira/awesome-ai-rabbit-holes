  status: included
  reason: The product's core identity is a decision model that provides typed, probabilistic answers (choice, score, noul) rather than generative text.
  evidence:
    - Builds small multimodal models for direct decisions like choosing, judging, or scoring.
    - Returns probabilities in a single forward pass for multiple questions.
    - Includes a Python toolkit for training, inference, and evaluation.
