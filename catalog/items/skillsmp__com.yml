insights:
  summary: >-
    SkillsMP is a searchable marketplace for 1.7M+ agent skills in SKILL.md format compatible with Claude Code, Codex
    CLI, and ChatGPT.
  why_it_matters: >-
    It gives developers a centralized registry to discover, evaluate, and install reusable agent behaviors without
    writing custom prompts or skills from scratch.
  mental_damage: >-
    Another directory where you spend more time browsing skills than actually using them, hoping one finally understands
    your weird repo.
