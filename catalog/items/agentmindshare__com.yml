insights:
  summary: Agent Mindshare is a hosted SaaS platform that monitors how brands appear across consumer AI agents and search services such as ChatGPT, Claude, Gemini, and Perplexity, offering sentiment analysis, competitor tracking, and periodic reporting.
  why_it_matters: It matters to marketers tracking 'AI mindshare,' but it is not developer tooling and does not change software development workflows.
  mental_damage: The product ships a remote MCP server so Claude Code can perform 'vibe SEO/geo' research, ensuring brand managers can now panic about LLM summarization in the same terminal where developers are trying to ship code.
  tags:
    - brand-monitoring
    - ai-search
    - sentiment-analysis
    - saas
    - mcp-integration
  confidence: high
curation:
  status: excluded
  reason: It is a brand-monitoring and marketing-analytics SaaS for agencies and brand managers, not a developer-facing AI tool, framework, or infrastructure product; MCP support is an accessory feature, not the product identity.
  evidence:
    - Scraped site positions the product as an 'AI Agent Visibility Platform' for tracking brand perception across ChatGPT, Claude, Gemini, and Perplexity.
    - Core offering is marketing analytics with agency workflows, location targeting, and credit-based pricing rather than code generation, agent orchestration, or dev workflows.
    - MCP integration is listed as an 'Advanced' add-on for 'your favorite AI marketing agents,' not as MCP-first developer tooling.
