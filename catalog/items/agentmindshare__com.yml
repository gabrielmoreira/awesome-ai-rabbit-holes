insights:
  summary: Agent Mindshare is a brand monitoring platform that tracks how AI agents like ChatGPT, Claude, Gemini, and Perplexity mention a company in their responses.
  why_it_matters: It helps developers and marketers monitor AI-generated brand visibility, a growing concern as LLMs influence public perception and discovery.
  mental_damage: Finally, a way to feel anxious about what the robots are saying about you before your boss does.
  tags:
    - ai-monitoring
    - brand-tracking
    - llm-visibility
  confidence: high
curation:
  status: excluded
  reason: Agent Mindshare is a marketing and brand analytics tool focused on AI-generated content monitoring, not a developer-facing AI tool for coding, workflows, or infrastructure.
  evidence:
    - Scraped site context describes it as a platform to 'monitor and track how your brand appears across AI agents and LLMs' with features like sentiment analysis, geographic targeting, and BigQuery export.
    - Source-list context shows it appears in 'awesome-mcp-servers' under 'Official Servers' but the tool itself is not an MCP server — it only mentions MCP integration as a compatibility feature.
    - The product has merged into cogny.com and no longer accepts new sign-ups, indicating it is sunsetted and not actively maintained as a standalone tool.
