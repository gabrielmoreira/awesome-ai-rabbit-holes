curation:
  status: excluded
  reason: SubDownload is a media summarization and discovery tool focused on consuming external content, not a developer-facing AI tool for coding, workflow automation, or software creation.
  evidence:
    - The tool enables users to search community-shared YouTube summaries or generate AI summaries from pasted video links.
    - Its core features center on knowledge consumption — search, summarization, timestamped reading, and community discussion — not code generation, editing, or agent orchestration.
    - While it offers MCP server access and agent skills, these are compatibility features, not the product's primary identity; the main value remains media summarization for researchers, curators, and creators.
