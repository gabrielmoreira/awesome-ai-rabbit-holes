insights:
  summary: Semgrep is an application security platform that combines static analysis with AI reasoning to scan code for security issues, manage supply chain risks, and detect hardcoded secrets.
  why_it_matters: It integrates directly into developer workflows—including PRs, IDEs, and AI coding tools via MCP—to automate security triage and provide remediation guidance without breaking build velocity.
  mental_damage: You can now offload the existential dread of 'is this AI-generated code secure' to an AI that was trained to tell you exactly where the AI you just used introduced a vulnerability.
  tags:
    - security
    - sast
    - ai-assisted
    - mcp
    - code-scanning
  confidence: high
curation:
  status: included
  reason: Semgrep is a broad AppSec platform that integrates with AI coding tools via MCP and provides security feedback in IDEs and PRs, making it an integration that augments the development workflow rather than a primary coding agent.
  evidence:
