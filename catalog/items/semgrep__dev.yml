insights:
  summary: Semgrep is an application security platform that scans source code for vulnerabilities using AI-assisted SAST, SCA, secrets detection, and malware protection.
  why_it_matters: It helps developers catch and fix security issues early in the development workflow, reducing false positives and accelerating secure code delivery.
  mental_damage: Another security tool promising to make AppSec 'magical' while developers just want to ship code without becoming part-time vulnerability janitors.
  tags:
    - security
    - sast
    - devsecops
    - ai-assisted
  confidence: high
curation:
  status: included
  reason: Semgrep is primarily a security scanning tool that integrates into developer workflows (CLI, CI/CD, IDEs) to augment coding agents and editors with security capabilities, not a standalone coding agent or framework.
  evidence:
    - Described as an 'extensible developer-friendly application security platform' that scans source code for SAST, SCA, and secrets detection with AI assistance
    - Integrates with CLI, CI/CD, IDEs (VS Code, JetBrains), PR checks, and provides remediation guidance directly in PRs and IDEs
    - Listed in awesome-ai-coding-tools under 'Code Review and Refactoring' and awesome-mcp-servers under 'Official Servers' as a security tool with AI-assisted features
