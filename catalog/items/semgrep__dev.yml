insights:
  summary: Semgrep is an application security platform that uses AI-assisted static analysis to scan source code for vulnerabilities, secrets, and malware.
  why_it_matters: It helps developers catch security issues early in PRs and IDEs with high-precision findings that reduce false positives and security backlog.
  mental_damage: Yet another security tool that promises 'zero false positives' while adding another checkbox to your CI pipeline.
  tags:
    - security
    - sast
    - ai-assisted
  confidence: high
curation:
  status: included
  reason: Semgrep is primarily a security scanning tool that integrates into developer workflows (IDE, CI, PRs) to provide AI-assisted vulnerability detection, making it an extension/addon rather than a coding agent or framework.
  evidence:
    - Appears in awesome-ai-coding-tools under 'Code Review and Refactoring' as an extensible developer-friendly application security platform
    - Described as providing AI-assisted SAST, SCA, and Secrets Detection that works in CLI, CI/CD, IDEs, and PR checks
    - Core value is scanning and fixing issues in code via integrations, not autonomous coding or app generation
