insights:
  summary: Agentprobe tests whether seller URLs support agentic commerce by probing for llms.txt, OpenAPI, ai-plugin.json, MCP, and commerce APIs.
  why_it_matters: Helps developers verify if their e-commerce sites are accessible to AI agents for autonomous purchasing workflows.
  mental_damage: Another litmus test for the growing anxiety that your store might be invisible to the very agents you're trying to serve.
