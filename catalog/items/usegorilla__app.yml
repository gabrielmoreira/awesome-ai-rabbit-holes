insights:
  summary: >-
    Gorilla is a web service that scans public social media platforms for posts matching a user-provided product idea
    and ranks them by buying intent.
  why_it_matters: >-
    It helps developers validate demand for product ideas by surfacing real user signals across Reddit, X, YouTube,
    TikTok, LinkedIn, and Threads.
  mental_damage: Finally, a tool that turns founder anxiety into a $5 CSV file of strangers vaguely interested in your niche.
  tags:
    - market-research
    - idea-validation
    - lead-gen
    - saas-tools
  confidence: high
curation:
  status: excluded
  reason: >-
    Gorilla is a market research and lead generation tool for validating product ideas via social listening; it does not
    assist with coding, agent workflows, app building, or any developer-facing AI-tooling function central to the
    catalog’s scope.
  evidence:
    - >-
      Scraped site context: 'Drop in your idea. Gorilla scans Reddit, X, YouTube, TikTok, LinkedIn and Threads for real
      demand — and rank every post by how close they are to buying what you're building.'
    - >-
      Use cases section: Lists lead generation for startups, Reddit monitoring, voice of customer — all marketing/sales
      functions, not developer tooling.
    - >-
      Pricing: $5 per run, one-off payment — positioned as a disposable insight tool for founders/marketers, not a dev
      workflow component.
