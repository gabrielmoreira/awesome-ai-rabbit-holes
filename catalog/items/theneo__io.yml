insights:
  summary: Theneo.io is a developer portal platform for creating, hosting, and collaborating on API documentation with real-time co-editing, AI-powered Ask Bot, changelogs, and MCP server capabilities.
  why_it_matters: It reduces documentation drift by keeping API specs, guides, and changelogs in sync with code through collaborative editing and automated updates.
  mental_damage: Another tool promising to fix the eternal 'who forgot to update the docs?' problem, now with AI and MCP hype.
  tags:
    - api-docs
    - developer-portal
    - collaboration
    - mcp
  confidence: high
curation:
  status: excluded
  reason: Theneo is primarily an API documentation and developer portal SaaS platform, not a developer-facing AI coding tool, agent, framework, or infrastructure product.
  evidence:
    - Theneo helps humans and AI agents ship API docs together—with private developer portals, real-time co-editing, changelogs, MCP, llms.txt, and Ask AI.
    - Core features center on API reference, user guides, changelog, developer portal, and enterprise Swagger editor—documentation workflows, not code generation or editing.
    - Positioned as a platform for engineers, writers, PMs, and agents to collaborate on docs, not as a coding assistant, SDK, or agent orchestration tool.
