insights:
  summary: Theneo is a developer portal platform for collaborative API documentation with real-time co-editing, AI assistance, and MCP integration.
  why_it_matters: It reduces documentation drift by syncing API references, guides, and changelogs across engineering, writing, and product teams in a single source of truth.
  mental_damage: Another tool promising to end the ‘who forgot to update the docs?’ blame cycle, while quietly adding yet another tab to your enterprise SaaS stack.
  tags:
    - api-docs
    - developer-portal
    - collaboration
    - mcp
    - llms-txt
  confidence: high
curation:
  status: excluded
  reason: Theneo is primarily a collaborative API documentation and developer portal platform, not a developer-facing AI tool for coding, agents, or workflow automation; its AI features are ancillary to core documentation management.
  evidence:
    - Source-list context describes it as helping 'humans and AI agents ship API docs together' with features like private developer portals, real-time co-editing, changelogs, MCP, llms.txt, and Ask AI
    - Scraped site excerpt emphasizes 'all-in-one developer portal for API references, guides, changelogs, and private customer portals' and positions AI as a co-pilot for documentation, not code
    - No evidence of Theneo acting as a coding agent, framework, app builder, or orchestration tool; its core identity is documentation SaaS with AI-assisted editing
