  reason: Jev is a hosted decision model that returns structured, typed answers with calibrated confidence, making it a canonical example of the decision-models category.
  evidence:
    - Returns Choice, Score, and Noul types with probabilities and confidence instead of generating text
    - Designed for judgment calls like routing support tickets, where output must be a fixed schema (e.g., billing/technical/sales)
