  summary: awesome-jev-zh is a curated directory of projects built on Jev (TypeSafe System One), a decision model that returns typed answers with probabilities instead of generating text.
  why_it_matters: It helps developers discover tools that leverage Jev for deterministic, low-latency judgment tasks like routing, scoring, and guardrails without text generation overhead.
