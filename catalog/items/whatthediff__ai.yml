insights:
  summary: What-the-Diff is an AI-powered GitHub and GitLab app that generates plain English pull request descriptions and summaries.
  why_it_matters: It automates tedious PR documentation, making code reviews more accessible to non-technical stakeholders and reducing context-switching for developers.
  mental_damage: Another AI middleman translating diffs into excuses for not reading the actual code.
  tags:
    - pr-automation
    - code-review
    - ai-assistant
  confidence: high
curation:
  status: included
  reason: What-the-Diff acts as an autonomous coding agent focused on reviewing and documenting pull requests, making it a dedicated PR review bot rather than a general-purpose extension or framework.
  evidence:
    - "Scraped site: 'What The Diff automatically writes pull request descriptions, sends out summarized notifications to keep non-technical stakeholders in the loop, and helps you to refactor minor issues during the review.'"
    - "Source-list context: listed in awesome-ai-coding-tools under 'Code Review and Refactoring' as 'The AI powered GitHub and Gitlab app that explains the changes within your pull requests in plain english'."
    - "README excerpt: 'What-the-Diff is an AI-powered app that reviews the diff of your pull requests and writes a descriptive comment about the changes in plain english.'"
