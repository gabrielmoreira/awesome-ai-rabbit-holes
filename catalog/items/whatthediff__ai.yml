insights:
  summary: An AI-powered GitHub and GitLab app that generates plain-English explanations of pull request diffs and automates PR descriptions, summaries, and changelogs.
  why_it_matters: It reduces the manual overhead of writing PR descriptions and keeps non-technical stakeholders informed with automated, human-readable summaries of code changes.
  mental_damage: Finally, a way to stop writing PR descriptions that no one reads anyway.
