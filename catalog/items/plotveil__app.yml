insights:
  summary: PlotVeil is a Chrome extension that blocks YouTube comment spoilers using the Jev decision model to judge and reveal comments on demand.
  why_it_matters: It lets developers avoid spoilers while watching technical videos or entertainment, preserving surprise without missing community discussion.
  mental_damage: Another layer of AI-mediated censorship so you can finally enjoy that frame-by-frame breakdown without someone ruining the twist in the first reply.
  tags:
    - chrome-extension
    - decision-model
    - content-filtering
  confidence: high
curation:
  status: included
  reason: PlotVeil's core identity is the Jev decision model judging spoiler risk via typed questions and probabilities, making it a decision-model tool despite being a browser extension.
  evidence:
    - Uses Jev (TypeSafe System One) to return calibrated probabilities (noul) on whether comments contain spoilers
    - No text generation; judgments are pure probability outputs from structured state and typed questions
    - Listed in awesome-jev under 'Browser & computer use' as a Jev-built spoiler blocker for YouTube comments
