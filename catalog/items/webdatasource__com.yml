insights:
  summary: Web Data Source is a pluggable web crawler with an MCP server that exposes tools for job management, traversal scheduling, and retrieval-augmented workflows.
  why_it_matters: It lets Agentic AI systems ingest and query live or intranet web data through standardized MCP tooling, reducing custom integration effort.
  mental_damage: Another MCP server promising to be the 'pluggable' layer your agent never knew it needed — until you realize you now have to manage crawl schedules, tenant deletion, and chunked fetching just to get a summary of a blog post.
  tags:
    - mcp
    - web-crawler
    - agent-tool
  confidence: medium
curation:
  status: included
  reason: The product's primary identity is an MCP server exposing 21 tools and 7 prompts for web crawling, job scheduling, and retrieval workflows, making MCP its core protocol identity rather than a side feature.
  evidence:
    - The WDS API Server exposes a Model Context Protocol endpoint with 21 registered tools for job, download, traversal, scheduling, tenant, and retrieval workflows
    - It provides seven registered MCP prompts (assess, scrape, resume, sliced-resume, index, reindex, query) that compose tools into common tasks
    - Documentation emphasizes deploying the WDS API Server and connecting MCP clients to its HTTP endpoint as the primary usage pattern
