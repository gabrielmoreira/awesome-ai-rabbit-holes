insights:
  summary: A cookbook demonstrating how to use TypeSafe's decision-model API to implement line-level semantic search with existence checking via Choice and Noul questions.
  why_it_matters: Shows developers how to build verifiable semantic search that can detect when a document contains no answer, reducing hallucinations in RAG-style workflows.
  mental_damage: Another reminder that 'just ask the model' isn't enough when you need to know whether the answer actually exists in your source material.
