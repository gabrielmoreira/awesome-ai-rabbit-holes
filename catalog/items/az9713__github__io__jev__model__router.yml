insights:
  summary: Jev Model Router is a JavaScript HTTP server and frontend that routes user messages to different AI model tiers via the TypeSafe Jev decision model based on cost and capability.
  why_it_matters: It demonstrates how developers can build cost-aware model routing layers using decision models to optimize AI usage and spending.
  mental_damage: Another reminder that every AI app now needs a PhD in model economics just to say 'hello' without bankrupting the free tier.
  tags:
    - model-routing
    - decision-models
    - jev
    - ai-gateway
    - cost-optimization
  confidence: high
curation:
  status: included
  reason: The project's core function is using the Jev decision model to route messages to appropriate model tiers, making judgment its primary identity rather than coding assistance or app generation.
  evidence:
    - The router sends Choice questions to Jev to select model tiers based on rubrics like 'cheapest that can answer well'
    - Jev returns tier selections with probabilities and confidence, which the router uses to pick reply models like gpt-5-nano or claude-sonnet-5
    - Listed in awesome-jev under 'Agent tooling' section as a project built on Jev
