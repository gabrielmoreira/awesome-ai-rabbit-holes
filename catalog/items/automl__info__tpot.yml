insights:
  summary: >-
    TPOT is an open-source AutoML tool that automates the construction of machine learning pipelines using genetic
    programming and scikit-learn.
  why_it_matters: >-
    It helps data scientists and ML practitioners automate repetitive model selection and pipeline tuning tasks,
    reducing manual experimentation time.
  mental_damage: >-
    Another tool promising to replace your ML intuition with a black-box genetic algorithm you can’t debug or explain to
    stakeholders.
  tags:
