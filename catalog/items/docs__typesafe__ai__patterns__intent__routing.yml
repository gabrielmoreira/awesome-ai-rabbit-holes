insights:
  summary: Intent routing is a pattern for classifying incoming requests and routing them to deterministic logic, specialist LLMs, or human handlers.
  why_it_matters: It helps developers reduce LLM costs by routing simple requests to cheaper handlers and reserving expensive models for complex cases.
  mental_damage: Yet another pattern to memorize before you can decide whether your chatbot needs a Jev or just a thesaurus.
