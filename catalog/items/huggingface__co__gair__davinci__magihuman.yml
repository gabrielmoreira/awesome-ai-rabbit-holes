  reason: daVinci-MagiHuman is a foundational multimodal generative model, not a developer-facing tool, agent, framework, or workflow product; it provides model weights for audio-video synthesis but does not assist with coding, app building, or AI development workflows.
  evidence:
    - The model generates audio-video from text and image inputs using a single-stream Transformer architecture.
