curation:
  status: included
  reason: AI SDK is a code-first TypeScript library developers import to build AI applications, making it a framework/SDK rather than an agent, orchestrator, or app builder.
  evidence:
    - Described as a 'unified TypeScript SDK for building AI apps' in source-list context and scraped site.
    - Provides framework-agnostic hooks and core APIs for text generation, tool calls, and agent building.
