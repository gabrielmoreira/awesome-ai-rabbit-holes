insights:
  summary: GitGuardian is a secrets detection and non-human identity governance platform designed to scan code, repositories, and CI/CD pipelines for hardcoded credentials and API keys.
  why_it_matters: It provides a CLI (ggshield) and IDE integrations that allow developers to catch secret sprawl and secure the software supply chain before deployment.
  mental_damage: Just when you thought the AI agents were going to write all the code, you now need an enterprise platform to manage the thousand non-human identities those agents created to do it.
  tags:
    - security
    - secrets-detection
    - sdlc
    - nhis
    - cli
  confidence: high
curation:
  status: excluded
  reason: While it offers a CLI and developer integrations, GitGuardian is fundamentally a security and governance SaaS platform for secrets/NHI management, not a direct AI coding tool, agent, or developer infrastructure product.
  evidence:
    - Scraped site context describes it as a 'Secrets Security and NHI Governance' platform, not an AI coding assistant.
    - Listed in awesome-ai-coding-tools under the 'Security' section specifically for detecting secrets, not for code generation or editing.
    - The core workflow is governance, compliance, and incident remediation rather than AI-driven development.
