insights:
  summary: SemanticSpace is a web tool that maps words or phrases onto a 2D semantic map using typed judgments from the Jev decision model based on two user-defined concept axes.
  why_it_matters: It lets developers explore and visualize how language models associate concepts, useful for prompt design or understanding model biases.
  mental_damage: Another fun toy that reveals how little we actually know about what these models are thinking.
  tags:
    - decision-model
    - embedding
    - visualization
  confidence: high
curation:
  status: included
  reason: The product's core identity is the Jev decision model providing typed judgments; it is not a coding agent, app builder, or general infrastructure.
  evidence:
    - Scraped site describes Jev as an AI model from TypeSafe AI that judges where phrases fall on user-defined concept axes from 0 to 100.
    - The tool reads phrases and returns scores on two axes, reflecting the model's opinion, not generating text or performing coding tasks.
    - Source-list context links to semanticspace.dev under 'Adaptive & Realtime UI' in awesome-jev, indicating association with Jev-based tools.
