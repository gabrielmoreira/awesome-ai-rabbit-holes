# Scope examples — used by the pipeline as an enforced checklist for the
# positive examples in `in_scope`, and as human guidance for what belongs in
# this catalog and what should usually stay out of scope.
#
# `config/sources/inbox.yml` remains the actual discovery queue that
# `npm run catalog -- update` processes into catalog items.
#
# Guiding idea
# ────────────
# This catalog is not meant to become a generic AI directory.
#
# It focuses on practical AI tools, agents, workflows, and infrastructure
# that help software developers become more productive.
#
# Likely IN scope
#   developer tooling, coding agents, CLI agents, agent orchestration,
#   MCP tooling, agent skills, AI IDEs, local AI runtimes, browser /
#   computer-use agents, workflow automation, evaluation harnesses,
#   sandboxing, DevOps for agents, memory systems, RAG for developer
#   workflows, practical agent-based software development.
#
# Likely OUT of scope (or lower priority)
#   general AI education, model training, machine learning theory,
#   deep learning, computer vision, NLP research, diffusion models,
#   reinforcement learning, generic ChatGPT prompt collections, broad
#   AI news, generic AI resource lists without a clear connection to
#   developer productivity or agent tooling.
#
# Working categories (NOT a fixed taxonomy — only hints for classifiers)
#   Coding Agents
#   Agent Orchestrators
#   Parallel Agent Runners
#   Personal AI Assistants
#   Autonomous Loop Runners
#   Spec-Driven Development
#   Prompting and Context Engineering
#   Agent Skills and Extensions
#   MCP Servers and Tooling
#   Browser and Computer Use Agents
#   Local AI and Model Runtimes
#   AI IDEs and Editors
#   Workflow Automation
#   Evaluations and Benchmarks
#   Memory, RAG and Knowledge Bases
#   DevOps for Agents
#   Security and Sandboxing
#   UI for Agents
#   Research Papers
#   Newsletters and Feeds

