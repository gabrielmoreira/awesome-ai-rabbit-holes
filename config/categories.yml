- id: coding-agents
  name: Coding Agents
  slug: coding-agents
  description: >
    AI coding assistants, autonomous programming agents, and review/test agents
    that help a developer work directly on source code.
  prompt_instruction: >
    The primary product is a developer-facing coding assistant or coding agent
    that directly plans, writes, edits, reviews, tests, or debugs code inside a
    repo, IDE, CLI, desktop, or PR workflow. Do not use this for products that
    mainly turbocharge another assistant, editor, or agent with memory, skills,
    tasking, or QA layers; those are extensions, not the main assistant.
  sections:
    - Terminal & CLI Agents
    - IDE-Native Assistants
    - Browser/Desktop/Computer-Use Agents
    - Review, Testing & Repair Agents

- id: ai-dev-extensions
  name: AI Developer Extensions
  slug: ai-dev-extensions
  description: >
    Memory layers, testing add-ons, UI/workflow boosters, and host-side
    integrations that extend another AI developer tool rather than being the
    primary assistant themselves.
  prompt_instruction: >
    The product mainly augments another coding assistant, editor, or agent with
    memory, testing, UI, workflow automation, or host integration behavior. If
    the primary artifact is a reusable skills/rules pack or a skills
    directory/registry, prefer the dedicated skills category instead.
  sections:
    - Memory & Context Add-ons
    - Testing & QA Add-ons
    - IDE / UI / Workflow Add-ons
    - Host Integrations & Automation

- id: skills
  name: AI Developer Skills
  slug: skills
  description: >
    Reusable skill packs, rules packs, command packs, and skill directories for
    AI developer tools.
  prompt_instruction: >
    The primary artifact is the reusable skill content itself: a skill pack,
    rules bundle, slash-command pack, or a directory/registry of such skills for
    Claude Code, Cursor, Cline, Roo, OpenCode, or similar hosts. Use this when
    the distribution unit is the skills layer itself rather than a broader
    extension product.
  sections:
    - Skill Packs & Libraries
    - Rules, Commands & Prompts
    - Skill Registries & Directories
    - Domain & Workflow Skill Packs

- id: app-builders
  name: AI App Builders
  slug: ai-app-builders
  description: >
    Builder-style AI products that generate, assemble, or deploy whole apps,
    sites, internal tools, or local project scaffolds from prompts.
  prompt_instruction: >
    The primary surface is an app/site/project builder rather than a repo-editing
    assistant: hosted prompt-to-app or prompt-to-site products, internal tool
    builders, or local/code-scaffolding generators that mainly create a new
    project from prompts. Do not use this for a repo/IDE assistant that helps a
    developer edit an existing codebase.
  sections:
    - Prompt-to-App Builders
    - Prompt-to-Site Builders
    - Internal Tools & Dashboards
    - Local / Code-Scaffolding Builders

- id: ai-ides-editors
  name: AI IDEs and Editors
  slug: ai-ides-editors
  description: >
    Editors and IDEs built around AI assistance.
  prompt_instruction: >
    The primary product surface is an AI-native editor or IDE. Prefer this when
    the product is the development environment itself, not a plugin, rules pack,
    or backend framework.
  sections:
    - Full IDEs & Editors
    - Remote / Hosted Editor Surfaces

- id: agent-orchestration
  name: Agent Orchestration
  slug: agent-orchestration
  description: >
    User-facing platforms and operational tooling for coordinating multiple AI
    agents.
  prompt_instruction: >
    End-user platforms, control planes, workbenches, or workforce systems for
    coordinating multiple agents, tasks, or agent runtimes. Do not use this for
    a code-first SDK/framework that developers import into their own code.
  sections:
    - Control Planes & Workforce Platforms
    - Workbenches & Collaboration Surfaces
    - Multi-Agent Runtime Platforms
    - Vertical Orchestration Platforms

- id: ai-frameworks
  name: AI Frameworks and SDKs
  slug: ai-frameworks
  description: >
    Frameworks, SDKs, and code-first building blocks for embedding AI behavior
    into software.
  prompt_instruction: >
    The product is mainly a framework, SDK, library, or importable code-first
    building block. Even if the README uses orchestration language, keep it here
    when developers primarily build with it in code rather than operate it as a
    control plane.
  sections:
    - Agent Frameworks
    - Workflow / Graph Engines
    - Memory / Retrieval Infrastructure
    - Provider / Model Abstractions

- id: spec-driven-development
  name: Spec-Driven Development
  slug: spec-driven-development
  description: >
    Environments and tooling where specifications are the primary artifact that
    drives planning, generation, validation, or repair.
  prompt_instruction: >
    The center of gravity is a spec-first loop: brainstorm/spec, plan, execute,
    validate, repair, or govern from specifications. Do not use this for a
    generic coding assistant that merely happens to accept prompts.
  sections:
    - Spec-First Environments
    - Planning / Task Decomposition
    - Execution Loops & Repair
    - Governance / Validation

- id: context-engineering
  name: Prompting and Context Engineering
  slug: prompting-context-engineering
  description: >
    Prompt design, retrieval, memory, compression, and context-shaping systems
    for making models see the right information while everyone quietly begs for
    more tokens.
  prompt_instruction: >
    Prompt systems, retrieval, fresh-doc lookup, context packing, memory,
    compression, distillation, and prompt-management infrastructure. Do not use
    this for assistant-specific add-ons whose primary job is to extend one host
    tool; those belong in AI Developer Extensions and Skills.
  sections:
    - Prompt Assets & Templating
    - Context Retrieval & Fresh Docs
    - Memory / Compression / Distillation
    - PromptOps / Prompt Management

- id: mcp
  name: MCP Servers and Tooling
  slug: mcp
  description: >
    Model Context Protocol servers, clients, registries, and tooling.
  prompt_instruction: >
    The product itself is MCP infrastructure: a server, client, registry,
    inspector, middleware layer, or MCP-focused toolkit. Merely integrating with
    MCP or being listed in an MCP awesome list is not enough.
  sections:
    - Registries & Discovery
    - Clients / Inspectors / Dev Tools
    - Generic Servers & Middleware
    - Domain Servers

- id: local-ai
  name: Local AI
  slug: local-ai
  description: >
    Run AI models on your own hardware.
  prompt_instruction: >
    Local runtimes, model serving stacks, on-device inference, desktop local-AI
    interfaces, or developer tooling centered on private/local execution rather
    than hosted SaaS.
  sections:
    - Local Runtimes
    - Local Serving / APIs
    - Desktop Chat / Interfaces

- id: evals
  name: Evaluations and Benchmarks
  slug: evals
  description: >
    Frameworks, benchmarks, and operational tooling for measuring model, prompt,
    or agent behavior.
  prompt_instruction: >
    Benchmarks, eval harnesses, prompt-regression systems, LLM observability, or
    evaluation platforms that measure quality rather than acting as the primary
    assistant themselves.
  sections:
    - Agent Benchmarks
    - Prompt Regression & Experimentation
    - Observability / Tracing / EvalOps
    - Safety / Fairness / Data Quality

- id: awesome-awesomes
  name: Awesome Awesomes
  slug: awesome-awesomes
  description: >
    Awesome lists, meta-lists, indexes, maps, and other attempts to organize AI
    tooling rather than be the tool itself.
  prompt_instruction: >
    Curated lists, directories, maps, and indexes rather than a standalone tool
    or product experience.
  sections:
    - Directories & Maps

- id: newsletters-and-feeds
  name: Newsletters and Feeds
  slug: newsletters-and-feeds
  description: >
    Newsletters, podcasts, and feeds for staying current with AI.
  prompt_instruction: >
    Publications, newsletters, podcasts, or feeds whose main value is ongoing
    discovery, commentary, or analysis rather than direct tooling.
  sections:
    - Newsletters & Feeds
