- id: coding-agents
  name: Coding Agents
  slug: coding-agents
  description: >
    Assistants that directly plan, write, review, test, or debug code.
  prompt_instruction: >
    The primary product is a developer-facing coding assistant or coding agent
    that directly plans, writes, edits, reviews, tests, or debugs code inside a
    repo, IDE, CLI, desktop, or PR workflow. Do not use this for tools that
    mainly extend another assistant/editor/agent with memory, debugger access,
    git attribution, Figma/browser control, tasking, or lightweight review/
    explanation layers; those are extensions, not the main assistant.
  sections:
    - Terminal & CLI Agents
    - IDE-Native Assistants
    - Browser/Desktop/Computer-Use Agents
    - Review, Testing & Repair Agents

- id: ai-dev-extensions
  name: Developer Extensions
  slug: ai-dev-extensions
  description: >
    Add-ons and host integrations that extend another coding tool rather than
    being the primary assistant.
  prompt_instruction: >
    The product mainly augments another coding assistant, editor, or agent with
    memory, testing, UI, workflow automation, or host integration behavior. Use
    this for debugger bridges, git/Figma/browser integrations, and lightweight
    IDE explain/review plugins that extend another assistant rather than acting
    as the primary assistant themselves. If the core novelty is a standalone
    memory/retrieval/compression system, prefer Context Engineering instead. If
    the primary artifact is a reusable skills/rules pack or a skills directory/
    registry, prefer the dedicated skills category instead.
  sections:
    - Memory & Context Add-ons
    - Testing & QA Add-ons
    - IDE / UI / Workflow Add-ons
    - Host Integrations & Automation

- id: skills
  name: Developer Skills
  slug: skills
  description: >
    Reusable skill packs, rules, commands, and skill directories for coding
    tools.
  prompt_instruction: >
    The primary artifact is the reusable skill content itself: a skill pack,
    rules bundle, slash-command pack, or a directory/registry of such skills for
    Claude Code, Cursor, Cline, Roo, OpenCode, or similar hosts. Use this when
    the distribution unit is the skills layer itself rather than a broader
    extension product.
  sections:
    - Skill Packs & Libraries
    - Rules, Commands & Prompts
    - Skill Registries & Directories
    - Domain & Workflow Skill Packs

- id: app-builders
  name: App Builders
  slug: ai-app-builders
  description: >
    Products that generate, assemble, or deploy apps, sites, internal tools, or
    project scaffolds from prompts.
  prompt_instruction: >
    The primary surface is an app/site/project builder rather than a repo-editing
    assistant: hosted prompt-to-app or prompt-to-site products, internal tool
    builders, or local/code-scaffolding generators that mainly create a new
    project from prompts. Do not use this for a repo/IDE assistant that helps a
    developer edit an existing codebase.
  sections:
    - Prompt-to-App Builders
    - Prompt-to-Site Builders
    - Internal Tools & Dashboards
    - Local / Code-Scaffolding Builders

- id: ai-ides-editors
  name: IDEs & Editors
  slug: ai-ides-editors
  description: >
    Development environments built around coding assistance.
  prompt_instruction: >
    The primary product surface is an AI-native editor or IDE. Prefer this when
    the product is the development environment itself, not a plugin, rules pack,
    or backend framework.
  sections:
    - Full IDEs & Editors
    - Remote / Hosted Editor Surfaces

- id: agent-orchestration
  name: Agent Orchestration
  slug: agent-orchestration
  description: >
    Tools and platforms for coordinating multiple agents.
  prompt_instruction: >
    End-user platforms, control planes, workbenches, or runtime systems for
    coordinating multiple agents, tasks, or agent runtimes. Use this when
    multi-agent coordination is the main value, even if the tool also installs
    skills/configs into existing assistants; thin host add-ons still belong in
    Developer Extensions or Skills.
  sections:
    - Control Planes & Workforce Platforms
    - Workbenches & Collaboration Surfaces
    - Multi-Agent Runtime Platforms
    - Vertical Orchestration Platforms

- id: ai-frameworks
  name: Frameworks & SDKs
  slug: ai-frameworks
  description: >
    Code-first building blocks for embedding models, agents, or AI workflows
    into software.
  prompt_instruction: >
    The product is mainly a framework, SDK, library, provider CLI, or code-first
    building block. Even if the README uses orchestration language, keep it here
    when developers primarily build with it in code, scripts, or provider APIs
    rather than operate it as a control plane or rely on it as a primary coding
    assistant.
  sections:
    - Agent Frameworks
    - Workflow / Graph Engines
    - Memory / Retrieval Infrastructure
    - Provider / Model Abstractions

- id: spec-driven-development
  name: Spec-Driven Development
  slug: spec-driven-development
  description: >
    Tooling where specifications are the primary artifact for planning,
    validation, repair, or governance.
  prompt_instruction: >
    The center of gravity is a spec-first loop: brainstorm/spec, plan, execute,
    validate, repair, or govern from specifications. Do not use this for a
    generic coding assistant that merely happens to accept prompts.
  sections:
    - Spec-First Environments
    - Planning / Task Decomposition
    - Execution Loops & Repair
    - Governance / Validation

- id: context-engineering
  name: Context Engineering
  slug: prompting-context-engineering
  description: >
    Memory, retrieval, compression, and prompt-shaping systems for getting the
    right context in front of a model.
  prompt_instruction: >
    Prompt systems, retrieval, fresh-doc lookup, context packing, memory,
    compression, distillation, and prompt-management infrastructure. Prefer this
    when the core novelty is the context/memory/retrieval system itself, even if
    it first ships as a Claude Code/Cursor add-on. Use Developer Extensions
    for thinner host-specific boosters whose substance is mainly the integration
    layer.
  sections:
    - Prompt Assets & Templating
    - Context Retrieval & Fresh Docs
    - Memory / Compression / Distillation
    - PromptOps / Prompt Management

- id: mcp
  name: MCP Servers & Tooling
  slug: mcp
  description: >
    Servers, clients, registries, and tooling for the Model Context Protocol.
  prompt_instruction: >
    The product itself is MCP infrastructure: a server, client, registry,
    inspector, middleware layer, or MCP-focused toolkit. Merely integrating with
    MCP or being listed in an MCP awesome list is not enough.
  sections:
    - Registries & Discovery
    - Clients / Inspectors / Dev Tools
    - Generic Servers & Middleware
    - Domain Servers

- id: local-ai
  name: Local AI
  slug: local-ai
  description: >
    Local runtimes, desktop apps, and tooling for running AI on your own
    hardware.
  prompt_instruction: >
    Local runtimes, model serving stacks, on-device inference, desktop local-AI
    interfaces, or developer tooling centered on private/local execution rather
    than hosted SaaS.
  sections:
    - Local Runtimes
    - Local Serving / APIs
    - Desktop Chat / Interfaces

- id: evals
  name: Evals & Benchmarks
  slug: evals
  description: >
    Frameworks and tooling for measuring model, prompt, or agent behavior.
  prompt_instruction: >
    Benchmarks, eval harnesses, prompt-regression systems, LLM observability, or
    evaluation platforms that measure quality rather than acting as the primary
    assistant themselves.
  sections:
    - Agent Benchmarks
    - Prompt Regression & Experimentation
    - Observability / Tracing / EvalOps
    - Safety / Fairness / Data Quality

- id: awesome-awesomes
  name: Directories & Awesomes
  slug: awesome-awesomes
  description: >
    Lists, maps, directories, and indexes for navigating AI tooling.
  prompt_instruction: >
    Curated lists, directories, maps, and indexes rather than a standalone tool
    or product experience.
  sections:
    - Directories & Maps

- id: newsletters-and-feeds
  name: Newsletters & Feeds
  slug: newsletters-and-feeds
  description: >
    Newsletters, podcasts, and feeds for staying current with AI.
  prompt_instruction: >
    Publications, newsletters, podcasts, or feeds whose main value is ongoing
    discovery, commentary, or analysis rather than direct tooling.
  sections:
    - Newsletters & Feeds
