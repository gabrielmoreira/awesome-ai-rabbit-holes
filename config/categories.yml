- id: coding-agents
  name: Coding Agents
  slug: coding-agents
  description: >
    Agents that directly act on code: planning, writing, editing, reviewing,
    testing, and repairing across a terminal, IDE, browser, or operating system.
  prompt:
    instructions: >
      The product is a developer-facing agent whose primary identity is
      performing coding tasks autonomously or interactively. It reads
      codebases, writes or edits files, runs commands, reviews diffs, or
      controls a browser or desktop on the developer's behalf. The coding
      task is the product's reason to exist — not a feature inside a broader
      orchestration platform, framework, or IDE product.
    use_when:
      - The tool autonomously plans and executes coding tasks across a repo, terminal, or IDE.
      - The developer delegates writing, editing, reviewing, or testing code to it directly.
      - It operates as a primary coding surface via CLI, IDE sidebar, browser/computer-use, or PR review bot.
      - Spec-driven or plan-then-execute workflows where code is the output also fit here.
      - Autonomous multi-agent coding pipelines whose final product is working code.
    do_not_use_when:
      - The primary product is an IDE or editor as a whole environment rather than the agent inside it.
      - The product coordinates multiple agents in a control plane or workforce platform rather than coding itself.
      - It is a framework or SDK developers program against, not an agent users direct.
      - The primary artifact is a reusable skill pack, rules file, or extension add-on rather than an autonomous coder.
      - The product generates brand-new apps from prompts without acting on an existing codebase.
    canonical_positives:
      - Claude Code
      - OpenCode
      - Gemini CLI
      - Cline
      - Aider
    common_false_positives:
      - Cursor (the IDE product itself, not a coding agent)
      - LangChain (framework developers program against)
      - Dify (multi-agent orchestration platform, not a coding agent)
      - claude-task-master (workflow extension for an existing agent)
      - AutoGen (code-first multi-agent framework, not the agent itself)
      - Claude (Anthropic's model family/product page — the provider, not an agent; the agent is Claude Code)
    section_hints:
      Terminal & CLI Agents: "CLI or terminal invocation is the primary interface; the agent runs in a shell to perform coding tasks, not inside a GUI."
      IDE-Native & Editor Agents: "The editor or IDE is the product surface — either an AI-first editor like Cursor or Windsurf, or an agent embedded inside a specific IDE like Cline in VS Code."
      Browser & Computer-Use Agents: "Controls a browser, desktop, or operating system to execute coding or computing tasks via GUI automation or computer-use."
      Review, Testing & Repair: "Primary job is reviewing PRs, finding bugs, running tests, or auto-repairing failures — not general code generation."
      Spec-First & Plan-Execute: "Developer writes specs, requirements, or structured plans first; the agent converts them into working code through a structured execution loop."
      Autonomous & Multi-Agent Coding: "Spawns or coordinates multiple sub-agents to decompose and autonomously complete a complex coding task; the end product is working code."
  sections:
    - Terminal & CLI Agents
    - IDE-Native & Editor Agents
    - Browser & Computer-Use Agents
    - Review, Testing & Repair
    - Spec-First & Plan-Execute
    - Autonomous & Multi-Agent Coding

- id: app-builders
  name: App Builders
  slug: ai-app-builders
  description: >
    Products that generate complete apps, websites, dashboards, or scaffolds
    from prompts — the user starts from zero and receives a deployable artifact.
  prompt:
    instructions: >
      The core user experience is describing what they want and receiving a
      working app, site, internal tool, or project scaffold as the output.
      The product creates new things from natural language rather than
      assisting a developer editing an existing codebase. The output is
      something deployable — a live site, a running app, a template project —
      not a code edit or a diff inside an existing repo.
    use_when:
      - The main loop is prompt-to-app, prompt-to-site, or prompt-to-dashboard.
      - The user starts from a blank slate, not from an existing codebase.
      - "The output is a deployable artifact: a running app, a published site, or a project scaffold."
      - No-code or low-code generation from natural language is the primary interface.
      - Visual screenshot-to-code or design-to-code generation where the result is a new app.
    do_not_use_when:
      - The product mainly edits or assists inside an existing codebase.
      - It is a generic low-code or no-code platform where AI is optional or a minor feature.
      - The primary output is infrastructure, pipelines, or APIs rather than an end-user app.
      - It is a coding agent that happens to scaffold projects as one of many tasks.
      - Internal tools are only a section of a much larger platform product.
    canonical_positives:
      - bolt.new
      - v0 by Vercel
      - base44
      - Screenshot-to-Code
      - dyad
    common_false_positives:
      - Cursor (coding assistant, not an app generator)
      - Claude Code (coding agent that edits repos)
      - n8n (workflow automation without a prompt-to-app identity)
      - Retool (low-code platform, not prompt-first)
      - LangGraph (workflow engine framework)
    section_hints:
      Full App Builders: "User describes what they want and receives a complete, running full-stack web application. Starts from zero, output is deployable."
      Site & Landing Page Builders: "Generates complete websites, landing pages, or static sites from text prompts. Output is a published or ready-to-publish site."
      Internal Tools & Dashboards: "Generates internal data tools, admin panels, BI dashboards, or GenBI interfaces — not public-facing apps."
      Scaffolding & Boilerplate: "Generates starter project structure, code templates, or boilerplate repos. Output is a project skeleton, not a running app."
  sections:
    - Full App Builders
    - Site & Landing Page Builders
    - Internal Tools & Dashboards
    - Scaffolding & Boilerplate

- id: extensions-and-addons
  name: Extensions & Add-ons
  slug: extensions-and-addons
  description: >
    Plugins, integrations, and tools that extend a coding agent, editor, or
    development workflow rather than standing alone as a primary product.
  prompt:
    instructions: >
      The product augments an existing coding assistant, agent runtime, or
      IDE — it is not the primary assistant itself. The main value is adding
      a specific capability (debug control, task management, security
      scanning, workflow automation, API integration) to a host tool the
      developer already uses. The integration layer or add-on identity is
      the product's reason to exist, not a side feature of something larger.
    use_when:
      - The product installs into, wraps around, or extends another coding agent or editor.
      - It adds a specific capability to Claude Code, Cursor, VS Code, Cline, or a similar host.
      - The integration layer, plugin, or companion tool identity is the primary surface.
      - It provides workflow automation, task management, or tooling specifically for use inside coding agents.
      - Security, testing, or code quality tooling that plugs into the coding workflow.
    do_not_use_when:
      - It is a standalone coding agent or full IDE that operates without a host.
      - The primary artifact is a reusable skill or rules pack installed as content rather than a tool.
      - The core novelty is memory or retrieval infrastructure rather than the host integration itself.
      - It is a broad SaaS platform that happens to offer an integration as a minor feature.
      - It is an MCP server whose product identity is being MCP infrastructure, not a coding add-on.
      - The product manages multiple concurrent coding agent sessions, worktrees, or agent processes — that is agent-orchestration.
    canonical_positives:
      - claude-debugs-for-you
      - figma-use
      - Claudia
      - claude-task-master
      - Bwee
      - IndieStack (dependency guardrail for coding agents)
      - InfraBroker (ephemeral credential broker for agents)
    common_false_positives:
      - Claude Code (the primary agent, not an extension)
      - FastMCP (MCP SDK — its identity is MCP infrastructure)
      - Cline (standalone IDE-hosted coding agent)
      - mem0 (memory system, not a host integration add-on)
      - promptfoo (eval platform, not a coding workflow add-on)
      - Dolt (versioned SQL database — not an AI tool)
    section_hints:
      IDE & Editor Add-ons: "Installs as a plugin or extension inside VS Code, JetBrains, or another existing editor. The host editor is the primary surface."
      Claude Code & Agent Tools: "Specifically extends Claude Code, Codex CLI, or a similar agentic coding tool with task management, session control, routing, or workflow features."
      Testing & Code Quality: "Adds automated testing, code quality checks, linting, or coverage analysis to the coding pipeline. Not a standalone QA platform."
      Security & DevSecOps: "Adds security scanning, vulnerability detection, SAST/DAST, or compliance checking to the development or CI workflow."
      API & Service Integrations: "Connects a specific external service (Figma, Git, Slack, databases, APIs) to a coding agent or development workflow."
  sections:
    - IDE & Editor Add-ons
    - Claude Code & Agent Tools
    - Testing & Code Quality
    - Security & DevSecOps
    - API & Service Integrations

- id: mcp
  name: MCP Ecosystem
  slug: mcp
  description: >
    Servers, clients, registries, and infrastructure for the Model Context
    Protocol — the standard that lets AI agents talk to tools and data sources
    through a shared interface.
  prompt:
    instructions: >
      MCP must be the product's primary identity. This includes servers that
      expose tools, data, or capabilities over MCP; clients or runtimes that
      consume MCP servers; registries and discovery services for the MCP
      ecosystem; and developer tooling (inspectors, SDKs, middleware) whose
      main purpose is building or operating MCP infrastructure. A product
      that merely ships an MCP adapter alongside a broader product identity
      does not belong here — MCP has to be what it IS, not something it also does.
    use_when:
      - The product is an MCP server exposing tools, data, or domain capabilities over the protocol.
      - The product is an MCP client, runtime, inspector, or registry.
      - MCP is the protocol identity of the product, not a compatibility footnote.
      - The product is middleware, SDK, or developer tooling specifically for building or testing MCP infrastructure.
    do_not_use_when:
      - MCP is only one of several protocols the product supports alongside a stronger product identity.
      - The product is a coding agent or extension that happens to consume MCP servers as a client.
      - The underlying identity is a framework, orchestration platform, or SaaS product with an MCP adapter.
      - It is a generic API gateway or proxy that added MCP support as a feature.
      - "Priority rule: an MCP server that provides memory, retrieval, or context capabilities belongs here — the MCP protocol identity wins over the capability domain."
    canonical_positives:
      - modelcontextprotocol/servers
      - playwright-mcp
      - github-mcp-server
      - FastMCP
      - mcp-get
      - mcp-bridge (middleware exposing MCP tools through an OpenAI-compatible API)
      - Lunar.dev (API gateway and MCP aggregator middleware)
    common_false_positives:
      - LangChain (framework with MCP support, identity is the framework)
      - Claude Code (coding agent that uses MCP as a client)
      - n8n (workflow automation platform with an MCP node)
      - Dify (orchestration platform with MCP integration)
      - claude-task-master (coding workflow extension that happens to use MCP)
      - Higress (AI-native API gateway — gateway identity, not MCP-first)
      - Tunnel tools, smart-home bridges, CMSs, or chart libraries that merely ship an MCP server (MCP is incidental, not the identity)
    section_hints:
      Dev & Code Tools: "MCP server exposing developer tools: GitHub repos, git operations, code execution, debugging, CI/CD, DevOps, or security scanning for code."
      Finance, Crypto & DeFi: "MCP server for financial data, stock prices, crypto market data, blockchain queries, DeFi protocols, trading bots, or payment APIs."
      Data & Databases: "MCP server providing SQL queries, NoSQL access, analytics, data pipelines, spreadsheets, or database schema inspection."
      Cloud & API Integration: "MCP server bridging cloud provider APIs (AWS, GCP, Azure), REST endpoints, GraphQL, webhooks, or generic HTTP APIs."
      AI & Model Services: "MCP server for AI model inference, embeddings, vector search, image generation, or AI provider API access."
      Browser & Web Automation: "MCP server that controls a browser, scrapes web pages, extracts structured content from URLs, or provides web interaction."
      Communication, Files & Productivity: "MCP server for email, messaging (Slack, Discord, Telegram), calendar, file storage (Drive, S3), documents (Notion, Confluence), or project management."
      Middleware & Generic: "General-purpose MCP utility, multi-domain server, proxy, or infrastructure middleware. MCP servers providing memory or retrieval also go here (MCP identity wins)."
      Registries & Discovery: "Operational directory or API for finding, listing, and discovering MCP servers. Not a static curated list — this is a searchable registry."
      Clients & Inspector Tools: "MCP client, inspector, debugger, proxy-for-testing, or SDK for building MCP servers. Developer tooling for the MCP protocol itself."
  sections:
    - Dev & Code Tools
    - Finance, Crypto & DeFi
    - Data & Databases
    - Cloud & API Integration
    - AI & Model Services
    - Browser & Web Automation
    - Communication, Files & Productivity
    - Middleware & Generic
    - Registries & Discovery
    - Clients & Inspector Tools

- id: agent-orchestration
  name: Agent Orchestration
  slug: agent-orchestration
  description: >
    Platforms and runtimes for coordinating multiple agents: designing
    workflows, routing tasks between specialists, and deploying autonomous
    agent teams.
  prompt:
    instructions: >
      The product's main value is managing the space between agents: routing
      work, coordinating tasks across multiple agents, managing shared state,
      or operating a workforce of autonomous agents. This is distinct from a
      single coding agent (one agent doing coding tasks) and from a
      code-first framework (a library you program against). The key signal is
      that the product manages relationships between multiple agents — whether
      through a visual builder, a hosted platform, a runtime harness, or an
      enterprise control plane.
    use_when:
      - The product coordinates multiple agents working on shared goals or decomposed tasks.
      - It is a visual builder, hosted platform, or runtime for designing multi-agent workflows.
      - Workflow design, agent routing, agent spawning, or agent lifecycle management is the main job.
      - It provides a workbench, control plane, or platform where agent teams operate.
      - Autonomous workforce-as-a-service where teams of agents complete complex business tasks.
      - A desktop app, CLI, or terminal UI whose main job is managing multiple concurrent coding agent sessions or worktrees simultaneously.
    do_not_use_when:
      - It is a single coding assistant that operates autonomously on one task at a time.
      - It is a code-first SDK or framework imported and programmed against to build multi-agent systems.
      - The multi-agent capability is secondary to a broader IDE, app builder, or LLM provider identity.
      - It is a local runtime or desktop chat app for conversing with a single model.
    canonical_positives:
      - Dify
      - LangFlow
      - AutoGPT (hosted platform)
      - Flowise
      - ChatDev
      - AgentRPC (universal RPC layer for agents)
      - agent-mq (message queue for inter-agent communication)
    common_false_positives:
      - CrewAI (code-first Python framework — belongs in ai-frameworks)
      - AutoGen (code-first SDK — belongs in ai-frameworks)
      - MetaGPT (code-first framework — belongs in ai-frameworks)
      - Claude Code (single-agent coding assistant)
      - MaxKB (RAG + agent builder, stronger workbench identity but leans orchestration)
      - Kestra (general-purpose workflow orchestrator without AI/agent identity)
      - SkyPilot (AI compute orchestration — MLOps infrastructure, not agent orchestration)
    section_hints:
      Hosted Agent Platforms: "SaaS platform where users deploy, configure, and run AI agents. The service operates the agents; users don't host it themselves. AutoGPT, Blobr, workforce-as-a-service."
      Visual Builders & Workbenches: "Drag-and-drop visual interface for composing multi-agent workflows. Users design agent pipelines graphically. Dify, LangFlow, Flowise, n8n with agents."
      Agent Runtimes & Harnesses: "Self-hosted runtime, execution harness, or CLI/desktop tool for running multiple agent processes concurrently. Also: desktop apps for managing multiple coding agent sessions or worktrees."
      Domain & Enterprise Platforms: "Orchestration platform purpose-built for one specific industry or enterprise function (DevOps, healthcare, legal, finance). Narrow domain, not general-purpose."
  sections:
    - Hosted Agent Platforms
    - Visual Builders & Workbenches
    - Agent Runtimes & Harnesses
    - Domain & Enterprise Platforms

- id: ai-frameworks
  name: Frameworks & SDKs
  slug: ai-frameworks
  description: >
    Code-first libraries, SDKs, and engines that developers import and
    program against to build AI-powered applications and agent systems.
  prompt:
    instructions: >
      Developers use the product as a programming library or SDK: they
      import it, write code against its API, and ship their own application
      on top of it. The product is the building material, not the finished
      product or operated service. The key signal is that you write code to
      use it — you do not point a browser at it or operate it as a
      platform. This includes LLM abstraction layers, agent frameworks,
      workflow engines, retrieval libraries, and provider SDKs.
    use_when:
      - Developers import or install it as a library, SDK, or engine in their code.
      - It provides abstractions for LLM calls, agent loops, tool use, memory, or retrieval.
      - Developers build their own applications on top of it in code.
      - It is a workflow engine, graph engine, or provider abstraction used in source code.
      - Multi-agent coordination that happens in code via classes and functions rather than via a platform UI.
    do_not_use_when:
      - It is an operated platform, visual builder, or control plane you run rather than import.
      - It is a standalone agent users interact with directly via a prompt interface.
      - It is a local desktop application or self-hosted chat UI.
      - It is a raw model weight repo or checkpoint without a meaningful SDK or API surface.
      - It is a provider's inference API or model offering rather than a developer-facing SDK.
    canonical_positives:
      - LangChain
      - AutoGen
      - CrewAI
      - LlamaIndex
      - PydanticAI
      - Claude (Anthropic model family — the provider API itself, not an agent or framework)
    common_false_positives:
      - Dify (operated orchestration platform)
      - LangFlow (visual builder, not the code library)
      - Ollama (local model runtime, not imported as a code library)
      - FastMCP (MCP infrastructure SDK — identity is MCP, not a general agent framework)
      - OpenAI API (model provider, not a framework SDK)
      - Liveblocks (realtime collaboration infrastructure — not an AI tool)
    section_hints:
      LLM & Agent SDKs: "Single-agent or general-purpose SDK — developers import it and build LLM-powered apps against it. LangChain, LlamaIndex, PydanticAI, Vercel AI SDK."
      Multi-Agent Systems: "Code-first framework specifically for building multi-agent coordination — developers write agent interaction logic against its API. CrewAI, AutoGen, MetaGPT."
      Provider & Model Abstractions: "SDK or abstraction layer for accessing AI model providers; unified interface across LLMs; or a specific model provider's developer SDK. LiteLLM, Vercel AI SDK."
      Workflow & Graph Engines: "Code-first graph or state machine engine for building stateful multi-step AI pipelines. Developers define nodes and transitions in code. LangGraph, Temporal for AI."
      Memory & Retrieval Infrastructure: "Code-first vector store client, embedding pipeline, or RAG component imported as a library building block. NOT a standalone memory product — a developer tool."
  sections:
    - LLM & Agent SDKs
    - Multi-Agent Systems
    - Provider & Model Abstractions
    - Workflow & Graph Engines
    - Memory & Retrieval Infrastructure

- id: evals
  name: Evals & Benchmarks
  slug: evals
  description: >
    Frameworks, platforms, and tooling for measuring, tracing, comparing,
    and improving model, prompt, and agent behavior.
  prompt:
    instructions: >
      The product's primary job is measuring quality or behavior: running
      evaluations, recording traces, comparing model outputs, benchmarking
      agents, detecting regressions, or assessing safety. The product
      measures AI systems rather than being one. The key signal is that
      scoring, grading, tracing, or comparison is the product's reason to
      exist, not a side feature of an orchestration platform or coding tool.
    use_when:
      - The core product job is evaluation, benchmarking, tracing, or observability of AI behavior.
      - It grades model outputs, scores agent runs, or detects prompt regressions.
      - LLMOps, experiment tracking, or AI monitoring is the primary product identity.
      - Safety evaluation, red-teaming, hallucination detection, or bias assessment is the focus.
      - Human-in-the-loop comparison and voting on model outputs (chatbot arenas).
    do_not_use_when:
      - Observability or monitoring is only a side feature of a broader orchestration or app platform.
      - The product is a coding agent that internally measures its own outputs as a built-in feature.
      - It is mainly ML training, data infrastructure, or model fine-tuning.
      - It is primarily a prompt management or retrieval tool.
    canonical_positives:
      - DeepEval
      - RAGAS
      - lm-evaluation-harness
      - Opik
      - promptfoo
    common_false_positives:
      - Dify (orchestration platform — evals is one feature inside it)
      - LangSmith (LangChain observability — valid evals entry but leans LLMOps)
      - PromptLayer (prompt management — belongs in memory-and-context)
      - MLflow (general ML tracking — not AI-eval specific)
      - Agenta (workbench for building and deploying agents with eval features — agent-orchestration identity is stronger)
    section_hints:
      Agent & LLM Benchmarks: "Runs standardized benchmark suites or arena-style head-to-head comparisons to measure and rank model or agent capability."
      Observability & Tracing: "Records traces, spans, and logs of LLM/agent runs; monitors quality over time in production; LLMOps dashboards. Langfuse, Opik."
      Prompt Regression & Testing: "Detects regressions when prompts or models change; automates evaluation of prompt quality; CI for prompts. promptfoo, DeepEval."
      Safety, Fairness & Red-teaming: "Measures safety properties: hallucination rates, bias, toxicity, adversarial robustness, or fairness across groups."
  sections:
    - Agent & LLM Benchmarks
    - Observability & Tracing
    - Prompt Regression & Testing
    - Safety, Fairness & Red-teaming

- id: local-ai
  name: Local & Self-hosted AI
  slug: local-ai
  description: >
    Runtimes, serving stacks, desktop apps, and tooling for running AI
    models on your own hardware or self-hosted infrastructure.
  prompt:
    instructions: >
      Local or private execution is the product's primary reason to exist.
      Whether an inference engine, OpenAI-compatible API server, desktop
      chat app, or fine-tuning toolkit — the defining feature is that the
      model runs on hardware the developer controls, not in a third-party
      cloud. Users choose these products because of privacy, offline use,
      hardware ownership, or inference cost. A hosted product that
      optionally supports local models is not local-ai.
    use_when:
      - The product runs AI models locally or on self-hosted infrastructure as its primary identity.
      - Private inference, offline use, or hardware ownership is central to the product value.
      - It is a local inference engine, OpenAI-compatible API server, desktop chat UI, or fine-tuning tool.
      - Self-hosted deployment is a first-class design goal, not an afterthought or enterprise add-on.
    do_not_use_when:
      - It is primarily a hosted SaaS product with an optional self-hosted tier.
      - It is a code-first framework that happens to support local model backends.
      - It is a coding agent whose identity is the coding task, not the local execution.
      - It is a raw model checkpoint or weight repo without a runtime, serving, or app identity.
    canonical_positives:
      - Ollama
      - llama.cpp
      - LM Studio
      - vLLM
      - open-webui
    common_false_positives:
      - LangChain (framework that supports local models but identity is the framework)
      - Cursor (IDE — runs cloud models, local is not the identity)
      - PrivateGPT (strong local identity but RAG platform — valid local-ai entry)
      - whisper (model repo without a strong runtime or app identity)
      - LocalAI (valid — self-hosted OpenAI-compatible API server)
    section_hints:
      Inference Engines: "Core runtime that executes LLM inference directly on local CPU/GPU. The execution layer itself. llama.cpp, petals, vLLM in self-hosted mode."
      Local API Servers: "Exposes local model inference as an OpenAI-compatible HTTP endpoint. Developers point their apps at it. Ollama serve, LocalAI, LMDeploy."
      Desktop Chat & UIs: "Graphical or web UI for chatting with locally-running models. The user-facing interface layer. Open WebUI, LM Studio, Enchanted, AnythingLLM."
      Fine-tuning & Training: "Adapts, fine-tunes, or trains model weights on local hardware. The training/fine-tuning toolchain. unsloth, Axolotl, MLX Finetune."
  sections:
    - Inference Engines
    - Local API Servers
    - Desktop Chat & UIs
    - Fine-tuning & Training

- id: memory-and-context
  name: Memory & Context
  slug: memory-and-context
  description: >
    Systems that improve what goes into the model: persistent agent memory,
    retrieval and RAG pipelines, context compression, and prompt management.
  prompt:
    instructions: >
      The product's core novelty is improving the information that reaches
      the model: persisting memory across sessions, retrieving relevant
      documents or code, compressing context to fit token budgets, managing
      prompt templates, or indexing knowledge for agents. The memory or
      context system itself is the product's reason to exist — not a
      built-in feature of an agent, not a retrieval section inside a
      framework SDK, and not a thin wrapper around an existing tool.
    use_when:
      - The product stores, retrieves, or compresses information specifically for AI agent sessions.
      - Persistent agent memory, RAG pipelines, or knowledge graph retrieval is the core offering.
      - It reduces, summarizes, or distills context to help models reason over large inputs.
      - Prompt template management, versioning, or prompt asset distribution is the main product job.
      - Indexing codebases, docs, or knowledge bases for agents to query at runtime.
    do_not_use_when:
      - Memory or retrieval is a built-in feature of a coding agent or orchestration platform.
      - It is a vector database or data infrastructure product without a strong agent-context identity.
      - It is a skill pack or rules bundle (those go in skills).
      - The core identity is an extension or plugin for a specific host tool.
      - It is a prompt engineering guide or educational resource rather than a working system.
      - It is an MCP server providing memory capabilities — MCP protocol identity wins; use the mcp category instead.
    canonical_positives:
      - mem0
      - claude-engram
      - context7
      - gitingest
      - ai-distiller
      - Neotoma (deterministic state layer for agents — cross-session memory)
    common_false_positives:
      - LlamaIndex (framework — identity is the SDK, retrieval is one module)
      - Pinecone (vector database infrastructure, not a developer-facing context tool)
      - claude-task-master (task management extension for agents)
      - AgentMark (eval/prompt platform — leans evals)
      - DeepLake (multimodal data lake — framework retrieval infrastructure)
      - Dolt (versioned SQL database — data infrastructure, not agent context)
    section_hints:
      Persistent Memory & Knowledge: "Stores and retrieves agent memories, learned facts, or knowledge across sessions. NOT primarily an MCP server — the memory system itself is the product. mem0, claude-engram."
      Context & Session Management: "Manages context continuity between agent sessions, across worktrees, or in agent handoffs. Session intelligence and context packaging."
      Compression & Token Optimization: "Reduces, summarizes, or distills large context windows into token-efficient representations. The compression or distillation is the core product value."
      Retrieval & Fresh Docs: "Retrieves current documentation, codebase context, or domain knowledge for agents at query time. NOT primarily an MCP server. context7, gitingest, Exa."
      Prompt Engineering & Management: "Platform for versioning, testing, distributing, and managing prompt templates. Prompt asset management, prompt libraries, prompt version control."
  sections:
    - Persistent Memory & Knowledge
    - Context & Session Management
    - Compression & Token Optimization
    - Retrieval & Fresh Docs
    - Prompt Engineering & Management

- id: skills
  name: Agent Skills
  slug: skills
  description: >
    Reusable skill packs, rules bundles, slash-command sets, and directories
    that install into a coding agent or assistant to extend its behavior.
  prompt:
    instructions: >
      The product distributes portable, reusable content — rules files,
      slash-command packs, prompt instruction sets, or skill definitions —
      that users install into their coding assistant or agent. The content
      itself is the product, not the tool that runs it. Registries and
      directories for finding and distributing such packs also belong here.
      The key question: is the deliverable a piece of installable content
      that changes how an agent behaves, or is it a tool the agent calls?
    use_when:
      - The primary artifact is a skill pack, rules bundle, slash-command set, or prompt instruction file.
      - Users install it into Claude Code, Cursor, Cline, or another agent to change its behavior.
      - It is a registry or directory specifically for discovering and distributing skill packs.
      - The value is portable content that travels to the agent, not executable code the agent invokes.
    do_not_use_when:
      - The product is a broader platform or agent that ships built-in skills as one feature.
      - The spec-first or plan-execute workflow is the main novelty, not the reusable rule content.
      - It is a host integration or MCP server that provides executable tools rather than installable rules.
      - It is a standalone coding agent whose identity is executing tasks, not distributing skill content.
    canonical_positives:
      - anthropics/skills
      - vercel-labs/skills
      - mattpocock/skills
      - awesome-claude-skills
      - agentskill.sh
    common_false_positives:
      - Claude Code Tools (tool extension that provides executables, not a skill content pack)
      - claude-task-master (workflow management extension, not installable skill content)
      - FastMCP (MCP SDK — skill packs are content, not MCP infrastructure)
      - Claudia (Claude Code GUI extension, not a skill pack)
      - mcp-get (MCP registry — MCP identity is stronger)
    section_hints:
      Skill Packs & Libraries: "A collection of reusable rules files, slash commands, or prompt instruction packs that users INSTALL into their coding agent. The content pack is the product."
      Registries & Directories: "A marketplace, registry, or directory for discovering and installing agent skill packs. agentskill.sh, skills.sh, cursorlist.com."
  sections:
    - Skill Packs & Libraries
    - Registries & Directories

- id: awesome-awesomes
