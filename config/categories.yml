- id: coding-agents
  name: Coding Agents
  slug: coding-agents
  description: >
    AI coding assistants, autonomous programming agents, and tools that help a
    developer work directly on source code.
  prompt_instruction: >
    User-facing coding assistants or autonomous coding agents that directly
    write, edit, review, plan, or debug code for the developer inside a repo,
    IDE, CLI, or code review workflow; do not use this for browser-first app
    builders that mainly generate complete products from prompts.

- id: app-builders
  name: AI App Builders
  slug: ai-app-builders
  description: >
    Browser-first AI products that generate, assemble, or deploy whole apps,
    sites, and internal tools from prompts, often with low-code or no-code
    surfaces.
  prompt_instruction: >
    Hosted app-building or website-building products such as Lovable, Bolt,
    v0, Replit Agent, 10Web, or similar prompt-to-app SaaS tools; keep these
    separate from coding agents, IDEs, and code-first frameworks.

- id: ai-ides-editors
  name: AI IDEs and Editors
  slug: ai-ides-editors
  description: >
    Editors and IDEs built around AI assistance. Every six months, a new one
    redefines the craft.
  prompt_instruction: >
    IDEs and editors whose primary product surface is an AI-native development
    environment rather than a library or backend framework.

- id: agent-orchestration
  name: Agent Orchestration
  slug: agent-orchestration
  description: >
    User-facing platforms and operational tooling for coordinating multiple AI
    agents.
  prompt_instruction: >
    End-user platforms, control planes, and operational tools for running,
    coordinating, or supervising multiple agents; do not use this for SDKs or
    code-first frameworks.

- id: ai-frameworks
  name: AI Frameworks and SDKs
  slug: ai-frameworks
  description: >
    Frameworks, SDKs, and code-first building blocks for embedding AI behavior
    into software.
  prompt_instruction: >
    Frameworks, SDKs, libraries, and code-first infrastructure that developers
    import or build on in code; keep these separate from end-user coding agents
    and orchestration products.

- id: spec-driven-development
  name: Spec-Driven Development
  slug: spec-driven-development
  description: >
    Methodologies where specifications drive code generation and AI behavior.
    Write the spec, let the machine panic responsibly.
  prompt_instruction: >
    Tools and methods where specifications are the primary artifact that drives
    generation, validation, or implementation behavior.

- id: context-engineering
  name: Prompting and Context Engineering
  slug: prompting-context-engineering
  description: >
    Prompt design, context window strategies, and the art of making LLMs
    do what you actually meant. This is also where we pretend to calmly
    design information flow while secretly whispering "give me tokens, my
    precious tokens" at every model window, cache layer, summary, and
    retrieval trick we can find.
  prompt_instruction: >
    Prompting, retrieval, memory, context packing, and RAG-style techniques for
    controlling what models see and how they reason over context.

- id: mcp
  name: MCP Servers and Tooling
  slug: mcp
  description: >
    Model Context Protocol servers, clients, and tooling for giving AI agents
    access to the world without handing them the keys.
  prompt_instruction: >
    Model Context Protocol servers, clients, registries, and tooling; do not
    collapse MCP infrastructure into generic coding agents.

- id: local-ai
  name: Local AI
  slug: local-ai
  description: >
    Run AI models on your own hardware. For when the cloud feels too watched,
    too expensive, or just too far away.
  prompt_instruction: >
    Local model runtimes, local serving, and on-device or private AI execution.

- id: evals
  name: Evaluations and Benchmarks
  slug: evals
  description: >
    Frameworks and benchmarks for measuring AI performance. Because "it felt
    right" is not a metric.
  prompt_instruction: >
    Benchmarks, harnesses, and evaluation infrastructure for measuring model or
    agent behavior.

- id: awesome-awesomes
  name: Awesome Awesomes
  slug: awesome-awesomes
  description: >
    Awesome lists, meta-lists, indexes, maps, and other heroic attempts to
    organize the AI chaos before becoming part of the AI chaos themselves.
  prompt_instruction: >
    Curated lists, maps, directories, and indexes rather than individual tools.

- id: newsletters-and-feeds
  name: Newsletters and Feeds
  slug: newsletters-and-feeds
  description: >
    Newsletters, podcasts, and feeds for staying current with AI. Or for
    feeling guilty about the 47 unread issues in your inbox.
  prompt_instruction: >
    Publications and feeds whose main value is ongoing discovery, analysis, or
    news rather than direct tooling.
