name: sync-catalog

on:
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_MODEL: gpt-4o
      CATALOG_FAIL_ON_PROCESSING_ERRORS: "1"
      MISE_TASK_OUTPUT: prefix
      CATALOG_MAX_SOURCE_LIST_NEW_ITEMS: "250"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}


      - name: Restore catalog cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-catalog-cache-v3-${{ hashFiles('sources/**/*.yml', 'scripts/**/*.ts', 'catalog/categories.yml', 'package-lock.json', '.mise.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-catalog-cache-v3-${{ hashFiles('sources/**/*.yml', 'scripts/**/*.ts', 'catalog/categories.yml', 'package-lock.json', '.mise.toml') }}-
            ${{ runner.os }}-catalog-cache-v3-

      - name: Install project dependencies
        run: mise run catalog:deps

      - name: Verify Copilot token is configured
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "::error::Missing COPILOT_GITHUB_TOKEN secret. Create a fine-grained PAT with the 'Copilot Requests' permission and store it as an Actions secret named COPILOT_GITHUB_TOKEN."
            exit 1
          fi

      - name: Sync catalog metadata and generated output
        run: mise run catalog:sync

      - name: Validate catalog
        run: mise run catalog:validate

      - name: Run tests
        run: mise run catalog:test

      - name: Detect generated changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- README.md docs/rabbit-holes site/catalog.json catalog/items)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git author
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push generated updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          max_attempts=2
          attempt=1

          while [ "${attempt}" -le "${max_attempts}" ]; do
            git add -A README.md docs/rabbit-holes site/catalog.json catalog/items
            if git diff --cached --quiet; then
              echo "Catalog already up to date after rebasing."
              exit 0
            fi

            git commit -m "chore: sync catalog"

            if git push origin HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi

            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Failed to push generated updates after ${max_attempts} attempts."
              exit 1
            fi

            git reset --mixed HEAD~1
            git fetch origin "${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            mise run catalog:sync
            mise run catalog:validate
            mise run catalog:test

            attempt=$((attempt + 1))
          done

      - name: Report no-op run
        if: steps.changes.outputs.changed != 'true'
        run: echo "Catalog already up to date."