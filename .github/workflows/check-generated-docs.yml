# Verify that generated docs (README, rabbit-hole pages, site/catalog.json,
# catalog/items/**) are up to date with sources/ on the main branch.
#
# Runs the full update + validate flow. If anything would change, the workflow
# fails so a human can run `npm run catalog -- update` locally and commit.
name: check-generated-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Update catalog (regenerate README, rabbit-hole pages, site/catalog.json)
        run: npm run catalog -- update

      - name: Validate catalog
        run: npm run catalog -- validate

      - name: Fail if generated docs are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated docs are stale. Run 'npm run catalog -- update' locally and commit the changes."
            echo "Files that would change:"
            git status --short
            echo ""
            echo "Diff:"
            git --no-pager diff
            exit 1
          fi
          echo "Generated docs are up to date."
