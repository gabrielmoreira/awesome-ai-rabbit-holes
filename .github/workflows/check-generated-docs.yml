name: catalog-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: pi-free
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PI_FREE_ONLY: ${{ secrets.PI_FREE_ONLY }}
      OPENROUTER_SHOW_PAID: ${{ secrets.OPENROUTER_SHOW_PAID }}
      NVIDIA_SHOW_PAID: ${{ secrets.NVIDIA_SHOW_PAID }}
      CLOUDFLARE_SHOW_PAID: ${{ secrets.CLOUDFLARE_SHOW_PAID }}
      OLLAMA_SHOW_PAID: ${{ secrets.OLLAMA_SHOW_PAID }}
      CATALOG_FAIL_ON_PROCESSING_ERRORS: "1"
      MISE_TASK_OUTPUT: prefix
      CATALOG_MAX_SOURCE_LIST_NEW_ITEMS: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore catalog cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-catalog-cache-v3-${{ hashFiles('sources/**/*.yml', 'scripts/**/*.ts', 'catalog/categories.yml', 'package-lock.json', '.mise.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-catalog-cache-v3-${{ hashFiles('sources/**/*.yml', 'scripts/**/*.ts', 'catalog/categories.yml', 'package-lock.json', '.mise.toml') }}-
            ${{ runner.os }}-catalog-cache-v3-

      - name: Install project dependencies
        run: mise run catalog:deps

      - name: Verify pi-free environment is configured
        run: |
          missing=0
          for name in OPENROUTER_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NVIDIA_API_KEY OLLAMA_API_KEY MISTRAL_API_KEY PI_FREE_ONLY OPENROUTER_SHOW_PAID NVIDIA_SHOW_PAID CLOUDFLARE_SHOW_PAID OLLAMA_SHOW_PAID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing ${name} in the GitHub environment 'pi-free'."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run tests
        run: mise run catalog:test

      - name: Run bounded catalog update smoke test
        run: mise run catalog:update

      - name: Validate catalog
        run: mise run catalog:validate

      - name: Report bounded update result
        run: |
          if [ -n "$(git status --porcelain -- README.md docs/rabbit-holes site/catalog.json catalog/items)" ]; then
            echo "Bounded smoke run produced catalog changes, which is expected while backlog remains."
            git status --short -- README.md docs/rabbit-holes site/catalog.json catalog/items
          else
            echo "Bounded smoke run left the generated tree clean."
          fi