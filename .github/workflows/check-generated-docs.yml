# Verify that generated docs (README, rabbit-hole pages, site/catalog.json,
# catalog/items/**) are up to date with sources/ on the main branch.
#
## Runs the full update + validate flow with GitHub Copilot CLI enabled for
## the insight-generation step. If anything would change, the workflow fails so
## a human can run `npm run catalog -- update` locally and commit.

name: check-generated-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_MODEL: gpt-5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: "npm"

      - name: Restore catalog cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-catalog-cache-v2-${{ hashFiles('sources/**/*.yml', 'scripts/**/*.ts', 'catalog/categories.yml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-catalog-cache-v2-

      - name: Install dependencies
        run: npm ci

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify Copilot token is configured
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "::error::Missing COPILOT_GITHUB_TOKEN secret. Create a fine-grained PAT with the 'Copilot Requests' permission and store it as an Actions secret named COPILOT_GITHUB_TOKEN."
            exit 1
          fi


      - name: Run tests
        run: npm test

      - name: Update catalog (regenerate README, rabbit-hole pages, site/catalog.json)
        run: npm run catalog -- update

      - name: Validate catalog
        run: npm run catalog -- validate

      - name: Fail if generated docs are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated docs are stale. Run 'npm run catalog -- update' locally and commit the changes."
            echo "Files that would change:"
            git status --short
            echo ""
            echo "Diff:"
            git --no-pager diff
            exit 1
          fi
          echo "Generated docs are up to date."
