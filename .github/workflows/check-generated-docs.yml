name: generated-output-drift

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-output:
    runs-on: ubuntu-latest
    env:
      MISE_TASK_OUTPUT: prefix
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject direct catalog item edits
        if: github.event_name == 'pull_request'
        run: |
          direct_item_changes="$(git diff --name-only --no-renames '${{ github.event.pull_request.base.sha }}'...HEAD -- ':(glob)catalog/items/**/*.yml')"
          if [ -n "$direct_item_changes" ]; then
            echo "::error::catalog/items/**/*.yml is automation-owned. Submit tools through config/sources.yml; do not edit generated catalog item files directly."
            echo "$direct_item_changes"
            exit 1
          fi
          echo "No direct catalog item edits detected."

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project dependencies
        run: mise run catalog:deps

      - name: Render generated catalog output
        run: mise run catalog:render

      - name: Fail on generated output drift
        run: |
          generated_changes="$(git status --porcelain -- README.md docs/rabbit-holes catalog/catalog.json)"
          if [ -n "$generated_changes" ]; then
            echo "::error::Generated catalog output is stale or was edited directly. Submit tools through config/sources.yml; do not edit README.md, docs/rabbit-holes/*.md, or catalog/catalog.json by hand."
            echo "$generated_changes"
            echo "Run 'mise run catalog:render' and commit the resulting generated output when changing the rendering pipeline."
            exit 1
          fi
          echo "Generated catalog output matches the deterministic render."
